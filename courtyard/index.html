<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5ef"><meta name="description" content="联机建造、像素绘画与朋友。">
<title>庭院 · 地牢来信</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=0.4.0">
<script src="./vendor/colyseus.js" defer></script><script type="module" src="./app.js?v=0.4.0"></script>
</head>
<body>
<div class="page-shell">
<header class="topbar"><a class="brand" href="../index.html">✉ <span>地牢来信</span></a><nav><a href="../games/index.html">游戏</a><button id="helpButton" class="icon-button" aria-label="操作帮助" title="操作帮助">?</button></nav></header>
<main class="play-layout">
<div class="main-column">
<section class="world-card" aria-label="联机庭院">
<div class="world-toolbar"><div class="world-title"><span id="worldDot" class="live-dot"></span><strong id="spaceTitle">大厅</strong><span id="spaceBadge" class="world-label"></span></div><div class="world-actions"><span id="worldCount" class="world-count"></span><button id="roomsButton" class="text-button" disabled>房间</button><button id="homeButton" class="text-button" disabled>回广场</button><button id="mapButton" class="icon-button" aria-label="缩略地图" aria-pressed="true" title="缩略地图">⌖</button></div></div>
<div class="arena" id="arena">
<canvas id="world" width="960" height="640" tabindex="0" aria-label="庭院地图。WASD 或方向键移动，E 互动；选择建筑工具后可点击或拖动施工。"></canvas>
<canvas id="parkourWorld" width="960" height="640" tabindex="0" aria-label="跑酷练习" hidden></canvas>
<div id="practiceHud" class="practice-hud" hidden><div><strong id="practiceStage">起步</strong><span id="practiceStats"></span></div><div><label class="sr-only" for="practiceCheckpoint">选择练习段落</label><select id="practiceCheckpoint"><option value="0">起步</option><option value="1">蹬墙</option><option value="2">冲刺</option><option value="3">连跳</option></select><button id="practiceRestart" type="button">重来</button><button id="practiceBack" type="button">回大厅</button></div></div>
<canvas id="minimap" width="144" height="108" aria-label="地图位置"></canvas>
<span id="areaLabel" class="sr-only">大厅</span>
<div class="login-overlay" id="loginOverlay"><form id="enterForm" class="login-card"><h1>进入庭院</h1><label class="sr-only" for="nickname">你的用户名</label><input id="nickname" maxlength="12" placeholder="用户名" autocomplete="nickname" required><button id="enterButton" class="primary-button" type="submit" disabled>进入</button><p id="formMessage" class="form-message" role="status"></p></form></div>
<div class="connection-shade" id="connectionShade" hidden><span class="spinner"></span><strong>重连中…</strong></div>
<div class="touch-controls" id="touchControls" hidden><div class="joystick" id="joystick" role="group" aria-label="移动摇杆"><div id="joystickKnob" class="joystick-knob"></div></div><div class="practice-touch"><button id="practiceDash" class="wave-control" aria-label="冲刺" hidden>冲</button><button id="practiceJump" class="wave-control" aria-label="跳跃" hidden>跳</button></div><button id="touchWave" class="wave-control" aria-label="打招呼">嗨</button></div>
<button id="interactButton" class="interact-button" hidden><kbd>E</kbd> <span></span></button>
</div>
<div class="toolbelt" id="toolbelt"><div class="tool-group" role="group" aria-label="庭院工具"><button data-tool="walk" class="tool active" aria-pressed="true" disabled>走动</button><button data-tool="place" class="tool" aria-pressed="false" disabled>放置</button><button data-tool="remove" class="tool" aria-pressed="false" disabled>拆除</button></div><button id="materialButton" class="material-button" disabled><canvas id="selectedTexture" width="16" height="16"></canvas><span id="selectedMaterial">奶油石砖</span><span>⌄</span></button><label class="kind-label"><span class="sr-only">方块类型</span><select id="blockKind" disabled><option value="wall">墙块</option><option value="floor">地砖</option></select></label><button id="paintButton" class="secondary-button" disabled>画方块</button></div>
<div class="world-footer"><span id="toolHint">WASD 移动 · E 互动</span><span id="saveState" aria-live="polite"></span><output id="coordinates" aria-label="我的位置"></output></div>
</section>
</div>
<aside class="side-panel">
<section id="roomCard" class="side-card" hidden><h2 id="roomTitle"></h2><p id="roomDescription" class="muted"></p><div class="room-code"><span>房间码</span> <strong id="roomCode"></strong></div><div class="party-actions"><button id="readyButton" class="secondary-button">准备</button><button id="startButton" class="primary-button" disabled>开始</button></div><button id="inviteButton" class="text-button">复制邀请</button><button id="returnButton" class="text-button">返回大厅</button></section>
<section class="chat-card" aria-label="文字聊天"><div class="chat-heading"><h2 id="chatTitle">聊天</h2><button id="chatToggle" class="text-button" aria-expanded="true" aria-label="收起聊天">−</button></div><div id="chatBody"><div id="chatMessages" class="chat-messages" role="log" aria-live="polite" aria-label="聊天消息"></div><form id="chatForm"><label class="sr-only" for="chatInput">聊天内容</label><input id="chatInput" maxlength="120" placeholder="说点什么…" autocomplete="off" disabled><button id="sendChat" type="submit" disabled>发送</button></form></div></section>
<details id="peopleCard" class="side-card" hidden open><summary class="roster-heading"><span>玩家</span><span id="rosterCount">0 / 50</span></summary><ul id="playerList" class="player-list"></ul><div class="people-actions"><button id="waveButton" class="text-button">打招呼</button><button id="leaveButton" class="text-button">退出</button></div></details>
<details class="network-card"><summary><span id="connectionStatus" class="status-pill" data-state="checking">检查中</span><strong id="latency">—<small> ms</small></strong></summary><div class="network-metrics"><span>重连 <strong id="reconnects">0<small> 次</small></strong></span></div><p id="networkHint" class="muted"></p><div class="network-actions"><button id="retryButton" class="text-button">重试</button><button id="diagnosticsButton" class="text-button">复制诊断</button></div></details>
</aside>
</main>
</div>
<dialog id="spacesDialog" class="modal"><div class="modal-heading"><h2 id="facilityTitle">跑酷</h2><button class="close-button" data-close aria-label="关闭">×</button></div><div class="room-tabs"><button data-facility="parkour" class="secondary-button">跑酷</button><button data-facility="dungeon" class="secondary-button">地牢</button></div><p id="facilityDescription" class="muted"></p><button id="practiceEntry" class="practice-entry secondary-button" type="button">练习 <small>单人 · 试试手感</small></button><div id="roomList" class="room-list"></div><form id="createSpaceForm" class="create-space"><label class="sr-only" for="spaceName">房间名称</label><div><input id="spaceName" maxlength="18" placeholder="房间名称"><button id="createSpaceButton" class="primary-button" type="submit">创建</button></div></form><p id="spaceMessage" class="form-message" role="status"></p></dialog>
<dialog id="libraryDialog" class="modal"><div class="modal-heading"><h2>材料</h2><button class="close-button" data-close aria-label="关闭">×</button></div><div id="materialGrid" class="material-grid"></div><button id="newMaterialButton" class="primary-button">画新材料</button></dialog>
<dialog id="paintDialog" class="modal paint-modal"><div class="modal-heading"><h2>画方块</h2><button class="close-button" data-close aria-label="关闭">×</button></div><div class="paint-layout"><div><canvas id="pixelCanvas" width="320" height="320" aria-label="16乘16像素绘画板，拖动绘画" tabindex="0"></canvas><div class="paint-actions"><button id="undoPaint" type="button">撤销</button><button id="clearPaint" type="button">清空</button><button id="fillPaint" type="button" aria-pressed="false">填色</button><button id="erasePaint" type="button" aria-pressed="false">橡皮</button><button id="pickPaint" type="button" aria-pressed="false">吸色</button></div></div><div><div class="color-picker"><label class="sr-only" for="paintColor">任意颜色</label><input id="paintColor" type="color" value="#c16d58"><label class="sr-only" for="paintHex">颜色色号</label><input id="paintHex" maxlength="7" value="#C16D58" spellcheck="false" autocomplete="off"></div><div id="paintPalette" class="paint-palette" aria-label="常用颜色"></div><label class="sr-only" for="materialName">材料名称</label><input id="materialName" maxlength="12" placeholder="材料名称"><div class="texture-preview"><canvas id="paintPreview" width="16" height="16"></canvas><button id="saveMaterial" class="primary-button">保存</button></div><p id="paintMessage" class="form-message" role="status"></p></div></div></dialog>
<dialog id="helpDialog" class="modal help-modal"><div class="modal-heading"><h2>操作</h2><button class="close-button" data-close aria-label="关闭">×</button></div><p>WASD / 方向键移动，E 互动，Enter 聊天。</p><p>整张地图都能建造。选择材料后点击或拖动放置，右键拆除。</p><p>墙块挡路，地砖可走。被困时点“回广场”。</p><p>跑酷练习：Space / Z 跳跃，方向 + Shift / X 冲刺，R 从检查点重试。</p><p>2～4 人对局与地图编辑待开放。</p></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <radialGradient id="bg" cx="62%" cy="52%" r="78%">
      <stop offset="0" stop-color="#0b2230"/>
      <stop offset="0.55" stop-color="#050c15"/>
      <stop offset="1" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </radialGradient>
    <radialGradient id="playerGlow">
      <stop offset="0" stop-color="#eaffff" stop-opacity=".95"/>
      <stop offset=".24" stop-color="#7df8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7df8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#fff1c9" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#ffcf7a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="enemyGlow">
      <stop offset="0" stop-color="#ff8a9c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ff5f78" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-small" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>

  <!-- faint floor constellation -->
  <g fill="#6ff7ff" opacity=".15">
    <circle cx="760" cy="240" r="1.7"/><circle cx="835" cy="205" r="1.3"/><circle cx="910" cy="250" r="1.6"/>
    <circle cx="990" cy="215" r="1.2"/><circle cx="1060" cy="270" r="1.7"/><circle cx="1120" cy="355" r="1.3"/>
    <circle cx="705" cy="330" r="1.2"/><circle cx="740" cy="505" r="1.6"/><circle cx="820" cy="560" r="1.2"/>
    <circle cx="935" cy="590" r="1.7"/><circle cx="1040" cy="545" r="1.3"/><circle cx="1115" cy="470" r="1.6"/>
    <circle cx="875" cy="335" r="1.2"/><circle cx="770" cy="405" r="1.2"/><circle cx="975" cy="390" r="1.5"/>
    <circle cx="1010" cy="635" r="1.2"/><circle cx="865" cy="680" r="1.6"/><circle cx="700" cy="625" r="1.2"/>
    <circle cx="640" cy="470" r="1.3"/><circle cx="660" cy="540" r="1.2"/><circle cx="1145" cy="585" r="1.2"/>
  </g>

  <!-- sonar waves -->
  <g fill="none" stroke="#6ff7ff">
    <circle cx="735" cy="455" r="92" stroke-width="2" opacity=".65" filter="url(#glow-small)"/>
    <circle cx="735" cy="455" r="178" stroke-width="2.4" opacity=".4" filter="url(#glow-small)"/>
    <circle cx="735" cy="455" r="272" stroke-width="2.8" opacity=".23"/>
    <circle cx="735" cy="455" r="370" stroke-width="3.2" opacity=".12"/>
    <circle cx="735" cy="455" r="470" stroke-width="3.6" opacity=".07"/>
  </g>

  <!-- revealed wall lines -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#6ff7ff" stroke-width="3.2" opacity=".82" filter="url(#glow-small)">
      <path d="M620 205 H1082 V300"/>
      <path d="M610 205 V360 H700"/>
      <path d="M1082 300 V430 H1170"/>
      <path d="M858 300 V392 H980 V470"/>
      <path d="M640 520 H820 V675 H1085"/>
      <path d="M640 520 V620 H700"/>
      <path d="M980 470 V575 H1170"/>
      <path d="M720 300 H820 V392"/>
    </g>
    <g stroke="#6ff7ff" stroke-width="1.6" opacity=".26">
      <path d="M560 150 H1140 V250"/>
      <path d="M540 150 V600 H620"/>
      <path d="M1180 250 V600"/>
      <path d="M700 650 H1120 V730 H620"/>
      <path d="M760 110 V180"/>
      <path d="M1190 360 H1230"/>
      <path d="M500 470 H560"/>
    </g>
    <g stroke="#a99bff" stroke-width="3" opacity=".62" filter="url(#glow-small)">
      <path d="M900 520 H1020 V575"/>
      <path d="M760 575 H860"/>
    </g>
  </g>

  <!-- player -->
  <g>
    <circle cx="735" cy="455" r="82" fill="url(#playerGlow)"/>
    <circle cx="735" cy="455" r="12" fill="#eaffff"/>
    <circle cx="735" cy="455" r="21" fill="none" stroke="#6ff7ff" stroke-width="2.2" opacity=".8" filter="url(#glow-small)"/>
    <circle cx="735" cy="455" r="33" fill="none" stroke="#6ff7ff" stroke-width="1.4" opacity=".3"/>
    <path d="M760 455 L744 444 L744 466 Z" fill="#6ff7ff" opacity=".95"/>
  </g>

  <!-- core -->
  <g>
    <circle cx="1035" cy="635" r="54" fill="url(#coreGlow)"/>
    <g transform="translate(1035 635) rotate(45)">
      <rect x="-12" y="-12" width="24" height="24" fill="#ffcf7a" opacity=".95"/>
      <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#fff1c9" stroke-width="1.5" opacity=".8"/>
    </g>
    <circle cx="1035" cy="635" r="40" fill="none" stroke="#ffcf7a" stroke-width="1.4" opacity=".22"/>
  </g>

  <!-- enemies -->
  <g>
    <circle cx="1065" cy="345" r="56" fill="url(#enemyGlow)"/>
    <g transform="translate(1065 345) rotate(28)">
      <path d="M16 0 L-12 14 L-7 0 L-12 -14 Z" fill="#ff5f78" filter="url(#glow-small)"/>
      <circle cx="0" cy="0" r="3.4" fill="#ffe3e8"/>
    </g>
    <circle cx="1065" cy="345" r="27" fill="none" stroke="#ff5f78" stroke-width="1.5" opacity=".4"/>
    <circle cx="1065" cy="345" r="44" fill="none" stroke="#ff5f78" stroke-width="1.2" opacity=".18"/>
  </g>
  <g opacity=".62">
    <g transform="translate(600 635) rotate(-12)">
      <path d="M13 0 L-9 11 L-5 0 L-9 -11 Z" fill="#ff5f78"/>
      <circle cx="0" cy="0" r="2.6" fill="#ffe3e8"/>
    </g>
    <circle cx="600" cy="635" r="22" fill="none" stroke="#ff5f78" stroke-width="1.2" opacity=".24"/>
  </g>

  <!-- title -->
  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
    <text x="82" y="112" fill="#6ff7ff" opacity=".52" font-size="15" letter-spacing="9">YUNWEN · SONAR STEALTH</text>
    <text x="72" y="292" fill="#eaffff" font-size="154" font-weight="700" letter-spacing="18" filter="url(#glow)">回声</text>
    <text x="86" y="352" fill="#6ff7ff" opacity=".7" font-size="17" letter-spacing="16">E C H O</text>
    <path d="M86 386 H500" stroke="#6ff7ff" stroke-width="1" opacity=".3"/>
    <text x="86" y="430" fill="#9fc6d0" font-size="23" letter-spacing="4">声呐潜行 · 看得见，就会被听见。</text>
    <text x="86" y="468" fill="#56717b" font-size="14" letter-spacing="3">9 个关卡 + 程序生成的无尽深渊</text>
  </g>

  <rect width="1280" height="800" fill="url(#vignette)"/>
</svg>

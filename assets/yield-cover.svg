<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">让位</title>
  <desc id="desc">纸面棋盘上，圆形棋子与红色菱形敌人交换位置。</desc>
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".7" fill="#242821" opacity=".08"/>
    </pattern>
    <pattern id="cells" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="58" height="58" rx="2" fill="#f2efe5"/>
    </pattern>
    <pattern id="void" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#20251f"/>
      <rect width="3" height="12" fill="#343a31"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="#e9e6dc"/>
  <rect width="1280" height="800" fill="url(#grain)"/>
  <rect x="64" y="64" width="1152" height="672" fill="none" stroke="#242821" stroke-opacity=".16"/>
  <text x="110" y="152" fill="#c94f3d" font-family="Consolas,monospace" font-size="16" font-weight="700" letter-spacing="5">A POSITION PUZZLE</text>
  <text x="103" y="344" fill="#242821" font-family="Songti SC,SimSun,serif" font-size="154" letter-spacing="20">让位</text>
  <text x="112" y="404" fill="#242821" font-family="Songti SC,SimSun,serif" font-size="28" letter-spacing="4">别躲。跟它换个位置。</text>
  <line x1="112" y1="472" x2="533" y2="472" stroke="#242821" stroke-opacity=".18"/>
  <text x="112" y="518" fill="#73766c" font-family="Consolas,monospace" font-size="15" letter-spacing="2">SWAP. ANTICIPATE. LEAVE.</text>
  <text x="112" y="656" fill="#73766c" font-family="Microsoft YaHei,sans-serif" font-size="16" letter-spacing="3">原创回合制解谜 · 八局</text>

  <rect x="692" y="118" width="496" height="496" rx="5" fill="#282d26"/>
  <rect x="708" y="134" width="448" height="448" fill="url(#cells)"/>
  <rect x="708" y="134" width="58" height="58" rx="2" fill="#343a31"/>
  <rect x="772" y="134" width="58" height="58" rx="2" fill="#343a31"/>
  <rect x="1098" y="518" width="58" height="58" rx="2" fill="#343a31"/>
  <rect x="900" y="326" width="58" height="58" rx="2" fill="url(#void)"/>
  <rect x="964" y="454" width="58" height="58" rx="2" fill="#e5e7dc"/>
  <rect x="979" y="469" width="28" height="28" fill="none" stroke="#356b55" stroke-width="4"/>
  <rect x="987" y="477" width="12" height="12" fill="#356b55"/>
  <rect x="1094" y="186" width="26" height="26" fill="#d7b567" stroke="#8a6b32" stroke-width="2" transform="rotate(45 1107 199)"/>
  <rect x="818" y="442" width="26" height="26" fill="#d7b567" stroke="#8a6b32" stroke-width="2" transform="rotate(45 831 455)"/>

  <path d="M 865 360 C 930 208, 1020 207, 1061 285" fill="none" stroke="#c94f3d" stroke-width="4" stroke-dasharray="8 10"/>
  <path d="M1050 273 L1065 289 L1045 292" fill="none" stroke="#c94f3d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1051 318 C 1001 426, 922 439, 872 390" fill="none" stroke="#242821" stroke-opacity=".45" stroke-width="3" stroke-dasharray="6 10"/>
  <circle cx="837" cy="369" r="27" fill="#f7f4eb" stroke="#242821" stroke-width="6"/>
  <circle cx="837" cy="369" r="6" fill="#242821"/>
  <rect x="1057" y="267" width="48" height="48" rx="3" fill="#c94f3d" stroke="#9e382c" stroke-width="3" transform="rotate(45 1081 291)"/>
  <text x="1081" y="298" text-anchor="middle" fill="#fff8ed" font-family="Consolas,monospace" font-size="18" font-weight="700">1</text>
  <circle cx="946" cy="405" r="7" fill="#c94f3d"/>
  <circle cx="946" cy="405" r="14" fill="none" stroke="#c94f3d" stroke-opacity=".2" stroke-width="4"/>
  <line x1="692" y1="654" x2="1188" y2="654" stroke="#242821" stroke-opacity=".18"/>
  <text x="692" y="684" fill="#73766c" font-family="Consolas,monospace" font-size="13" letter-spacing="3">GIVE A POSITION, TAKE A TURN.</text>
</svg>

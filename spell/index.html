<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="description" content="qoder言 —— 在地图上拼单词探索世界。四六级单词肉鸽。">
<title>qoder言</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0e14;--panel:#111820;--panel2:#182030;--line:#1e2d3d;
  --text:#e0e8f0;--muted:#6b7d8f;--accent:#7ec8e3;--gold:#fbbf24;
  --red:#ef4444;--green:#22c55e;--purple:#a78bfa;
  --font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Consolas","Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;
  display:flex;flex-direction:column;align-items:center}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:inherit}

.wrap{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.screen.on{display:flex}

.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .3s}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}
h1{font-size:28px;font-weight:700}h2{font-size:18px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;margin:6px 0;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:left;transition:all .15s}
.btn:active{transform:scale(.98);background:var(--panel2)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn.purple{background:var(--purple);color:#000;border-color:var(--purple)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-right:4px}
.tag.new{background:#1e3a5f;color:#93c5fd}
.tag.review{background:#713f12;color:#fde68a}

#title{justify-content:center;align-items:center;text-align:center}
#title h1{font-size:36px;margin-bottom:4px}
#title .sub{color:var(--muted);margin-bottom:32px}
#title .sub b{color:var(--accent)}
#titleBtns{width:100%;max-width:320px}

.map-header{padding:8px 0;border-bottom:1px solid var(--line);flex-shrink:0}
.map-grid{display:grid;gap:2px;margin:8px auto;grid-template-columns:repeat(8,1fr);width:min(100%,360px);aspect-ratio:1}
.tile{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;transition:all .15s;border:2px solid transparent;user-select:none}
.tile:active{transform:scale(.9)}
.tile.player{border-color:var(--gold);box-shadow:0 0 8px rgba(251,191,36,.5)}
.tile.adjacent{border-color:rgba(126,200,227,.5)}
.tile.goal{background:var(--gold)!important;color:#000;font-weight:700}
.tile-water{background:#1e3a5f}.tile-forest{background:#14532d}
.tile-mountain{background:#44403c}.tile-desert{background:#78350f}
.tile-swamp{background:#365314}.tile-plains{background:#1e293b}
.tile-discovery{background:#4a1d6e}

.challenge{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.challenge .terrain-icon{font-size:48px;margin-bottom:12px}
.challenge .prompt{font-size:18px;font-weight:600;color:var(--gold);margin-bottom:4px}
.challenge .hint{font-family:var(--mono);font-size:14px;color:var(--muted);letter-spacing:.2em;margin-bottom:8px}
.challenge .root-hint{font-size:12px;color:var(--purple);margin-bottom:8px;font-family:var(--mono)}
.challenge .confuse-warn{font-size:12px;color:var(--red);margin-bottom:8px}
#challengeInput{width:100%;max-width:320px;padding:14px;font-family:var(--mono);font-size:20px;
  text-align:center;background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:10px;outline:none;letter-spacing:.05em}
#challengeInput:focus{border-color:var(--accent)}
#challengeInput.ok{border-color:var(--green);color:var(--green)}
#challengeInput.no{border-color:var(--red);color:var(--red)}
.flash{text-align:center;font-weight:600;min-height:20px;margin-top:8px;font-size:14px}
.flash.ok{color:var(--green)}.flash.no{color:var(--red)}.flash.info{color:var(--accent)}
.flash-detail{text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.challenge-actions{flex-shrink:0;padding:8px 0;display:flex;gap:8px}
.challenge-actions .btn{flex:1}

.learn-screen{justify-content:center;align-items:center;text-align:center}
.learn-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:16px 0;width:100%;max-width:340px}
.learn-word{font-size:28px;font-weight:700;color:var(--accent);font-family:var(--mono);margin-bottom:4px}
.learn-phonetic{font-size:14px;color:var(--muted);font-family:var(--mono);margin-bottom:12px}
.learn-meaning{font-size:16px;color:var(--gold);margin-bottom:8px}
.learn-root{font-size:13px;color:var(--purple);margin-bottom:8px;font-family:var(--mono);
  background:rgba(167,139,250,.1);padding:6px 12px;border-radius:8px;display:inline-block}
.learn-btn{margin-top:8px}

.event-screen{justify-content:center;align-items:center;text-align:center}
.event-screen .icon{font-size:48px;margin-bottom:16px}

.over-screen{justify-content:center;align-items:center;text-align:center}
.over-screen .big{font-size:24px;font-weight:700;margin-bottom:8px}
.over-screen .sub{color:var(--muted);margin-bottom:24px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;text-align:center}
.stats-grid .stat{background:var(--panel);border-radius:10px;padding:12px}
.stats-grid .stat .val{font-size:24px;font-weight:700;color:var(--accent)}
.stats-grid .stat .label{font-size:11px;color:var(--muted);margin-top:2px}

footer{color:var(--muted);font-size:10px;text-align:center;padding:6px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">

  <section class="screen on" id="title">
    <h1>qoder言</h1>
    <p class="sub">在地图上拼单词，探索未知世界。<b>地形不同，词汇不同。</b></p>
    <div id="titleBtns"></div>
    <p class="small muted" id="titleProgress" style="margin-top:16px"></p>
  </section>

  <section class="screen" id="map">
    <div class="map-header">
      <div class="row">
        <span style="font-weight:600">探索</span>
        <span class="small muted" id="mapInfo"></span>
      </div>
      <div class="row small" style="margin-top:4px">
        <span>⚡ <span id="energyText">25/25</span></span>
        <span style="margin-left:auto">✧ <span id="goldText">0</span></span>
      </div>
      <div class="bar" style="margin-top:4px"><i id="energyBar" style="background:var(--gold)"></i></div>
    </div>
    <div class="map-grid" id="mapGrid"></div>
  </section>

  <section class="screen learn-screen" id="learn">
    <div style="font-size:48px;margin-bottom:8px" id="learnIcon">📖</div>
    <h2 id="learnTitle">发现新词</h2>
    <p class="small muted" id="learnSub">记住这个词，待会要用</p>
    <div class="learn-card">
      <div class="learn-word" id="learnWord"></div>
      <div class="learn-phonetic" id="learnPhonetic"></div>
      <div class="learn-meaning" id="learnMeaning"></div>
      <div class="learn-root" id="learnRoot" style="display:none"></div>
      <button class="btn primary learn-btn" id="learnListenBtn">🔊 听发音</button>
    </div>
    <div style="width:100%;max-width:340px">
      <button class="btn purple" id="learnOkBtn"><span class="t">记住了，继续</span></button>
    </div>
  </section>

  <section class="screen" id="challenge">
    <div class="challenge">
      <div class="terrain-icon" id="challengeIcon">🌊</div>
      <div class="prompt" id="challengePrompt">水域</div>
      <div class="small muted" id="challengeCn" style="margin-bottom:4px"></div>
      <div class="root-hint" id="challengeRoot" style="display:none"></div>
      <div class="confuse-warn" id="challengeConfuse" style="display:none"></div>
      <div class="hint" id="challengeHint">_ _ _ _</div>
      <input id="challengeInput" type="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="拼写单词...">
      <div class="flash" id="challengeFlash"></div>
      <div class="flash-detail" id="challengeDetail"></div>
    </div>
    <div class="challenge-actions">
      <button class="btn primary" id="submitBtn"><span class="t">确认（回车）</span></button>
      <button class="btn" id="skipBtn"><span class="t">绕路</span></button>
    </div>
  </section>

  <section class="screen event-screen" id="event">
    <div class="icon" id="eventIcon">🎁</div>
    <h2 id="eventTitle"></h2>
    <p class="muted" id="eventDesc" style="margin:8px 0 24px"></p>
    <div id="eventChoices" style="width:100%;max-width:360px"></div>
  </section>

  <section class="screen over-screen" id="over">
    <div class="big" id="overTitle"></div>
    <p class="sub" id="overSub"></p>
    <div class="stats-grid" id="overStats"></div>
    <div id="overBtns" style="width:100%;max-width:360px"></div>
  </section>

</div>
<footer>词库 <a href="https://github.com/skywind3000/ECDICT" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">ECDICT</a>（MIT）· qoder言</footer>
<script src="../vocab/words.js"></script>
<script src="./game.js"></script>
</body>
</html>

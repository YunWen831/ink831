<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100e">
<title>别被看见</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#12100e;
    font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:#f5f5f4;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none; overscroll-behavior:none; }
  @supports (height:100dvh) { html,body { height:100dvh; } }  /* 躲开手机地址栏 */
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  .screen { position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px; z-index:10;
    overflow-y:auto; }
  .screen.on { display:flex; }
  .screen.dim { background:rgba(18,16,14,.93); backdrop-filter:blur(4px); }

  h1 { font-size:clamp(26px,6.4vw,48px); letter-spacing:.18em; font-weight:700; }
  h1 small { display:block; font-size:.3em; letter-spacing:.34em; opacity:.45; margin-top:10px; font-weight:400; }
  h2 { font-size:clamp(17px,4.2vw,24px); font-weight:600; letter-spacing:.06em; }

  /* 选情景 / 选角色 的卡片 */
  .picks { display:flex; gap:clamp(10px,2.2vw,18px); flex-wrap:wrap; justify-content:center;
    max-width:min(94vw,880px); }
  .pick { width:clamp(150px,29vw,232px); background:#1f1c19; border:2px solid #33302c;
    border-radius:16px; padding:16px 14px 14px; cursor:pointer; text-align:left;
    transition:.15s; display:flex; flex-direction:column; gap:9px; }
  .pick:hover, .pick:active { border-color:#c2703a; transform:translateY(-4px); }
  .pick .top { display:flex; align-items:center; gap:10px; }
  .pick .av { width:clamp(42px,11vw,58px); height:clamp(42px,11vw,58px); flex:0 0 auto;
    border-radius:50%; overflow:hidden; border:2px solid #44403c; background:#292524;
    display:flex; align-items:center; justify-content:center; font-size:clamp(20px,5vw,28px); }
  .pick .av img { width:100%; height:100%; object-fit:cover; }
  .pick .nm { font-size:clamp(14px,3.6vw,17px); font-weight:600; }
  .pick .tm { font-size:clamp(10px,2.6vw,12px); opacity:.45; letter-spacing:.08em; margin-top:3px;
    font-variant-numeric:tabular-nums; }
  .pick .ds { font-size:clamp(11px,2.8vw,13px); opacity:.58; line-height:1.55; }
  .pick .fin { font-size:clamp(10px,2.6vw,12px); color:#7c9c6b; letter-spacing:.04em; }

  .btn { padding:13px 34px; border:2px solid #57534e; border-radius:12px; background:#1f1c19;
    color:#f5f5f4; font-size:clamp(14px,3.6vw,17px); cursor:pointer; font-family:inherit;
    transition:.15s; letter-spacing:.05em; }
  .btn:hover, .btn:active { background:#c2703a; border-color:#c2703a; color:#fff; }
  .btn.pri { background:#c2703a; border-color:#c2703a; }
  .btn.sm { padding:9px 20px; font-size:clamp(12px,3vw,14px); }

  .tip { font-size:clamp(11px,3vw,14px); opacity:.45; text-align:center; line-height:1.9; max-width:600px; }
  .tip b { color:#e8a33d; font-weight:600; }
  .kbd { display:inline-block; padding:1px 7px; border:1px solid #57534e; border-radius:5px;
    font-size:.85em; opacity:.85; margin:0 2px; }
  .row2 { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  /* ---------- HUD ---------- */
  #hud { position:absolute; top:0; left:0; right:0; z-index:5;
    display:none; pointer-events:none;
    /* 躲开刘海里和底部横条 */
    padding: calc(10px + env(safe-area-inset-top, 0px))
             calc(14px + env(safe-area-inset-right, 0px))
             10px
             calc(14px + env(safe-area-inset-left, 0px)); }
  #hud.on { display:block; }
  #hud .bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #clock { font-size:clamp(16px,4.4vw,23px); font-weight:700; letter-spacing:.05em;
    font-variant-numeric:tabular-nums; }
  #clock.warn { color:#e8a33d; }
  #clock.final { color:#e05252; animation:blink .7s infinite; }
  @keyframes blink { 50% { opacity:.35 } }
  #hearts { font-size:clamp(13px,3.6vw,18px); letter-spacing:.14em; margin-left:auto; }
  #hearts .gone { opacity:.22; }

  /* 检测条 —— 这游戏真正的血条 */
  #detwrap { margin-top:8px; display:flex; align-items:center; gap:8px;
    width:min(70vw,320px); }
  #detwrap .eye { font-size:clamp(12px,3.2vw,15px); opacity:.5; flex:0 0 auto;
    transition:.15s; }
  #detwrap.seen .eye { opacity:1; }
  #det { flex:1 1 auto; height:9px; background:#292524; border-radius:5px; overflow:hidden; }
  #detbar { height:100%; width:0; background:linear-gradient(90deg,#7c9c6b,#e8a33d);
    transition:width .08s linear; }
  #detwrap.seen #detbar { background:linear-gradient(90deg,#e8a33d,#e05252); }

  #goal { margin-top:9px; font-size:clamp(11px,3.1vw,15px); letter-spacing:.04em;
    color:#e8a33d; }
  #goal .do { color:#7c9c6b; }
  #carry { margin-top:5px; font-size:clamp(10px,2.9vw,13px); color:#9cc4e4; }

  #stick { position:absolute; z-index:6; display:none; }
  #stick.on { display:block; }

  /* 右下角的动作键：角色技 / 嚼 */
  #act { position:absolute; z-index:7; display:none;
    right: calc(20px + env(safe-area-inset-right, 0px));
    bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    width:clamp(76px,21vw,100px); height:clamp(76px,21vw,100px); border-radius:50%;
    border:3px solid #7c9c6b; background:rgba(31,28,25,.78); color:#cfe0c4;
    font-family:inherit; font-size:clamp(12px,3.2vw,15px); font-weight:600;
    line-height:1.3; letter-spacing:.06em; cursor:pointer; touch-action:none;
    -webkit-user-select:none; user-select:none; padding:0; }
  #act.on { display:block; }
  #act.cool { border-color:#44403c; color:#6b6560; background:rgba(31,28,25,.55); }
  #act.hot { border-color:#e05252; color:#f0b0b0; }
  #act:active { transform:scale(.93); }

  /* NPC 的语音条 */
  #say { position:absolute; left:50%; top:24%; transform:translateX(-50%); z-index:9;
    max-width:min(88vw,620px); text-align:center; padding:11px 20px;
    background:#3a1a1a; border:1px solid #8b2f2f; border-left:5px solid #e05252;
    border-radius:12px; font-size:clamp(13px,3.5vw,17px); line-height:1.6;
    opacity:0; transition:opacity .3s; pointer-events:none; }
  #say.on { opacity:1; }
  #say b { color:#e05252; letter-spacing:.1em; margin-right:9px; }
  #say.calm { background:#22303a; border-color:#3d6a8b; border-left-color:#6fa8cc; }
  #say.calm b { color:#9cc4e4; }

  .toast { position:absolute; left:50%; top:40%; transform:translateX(-50%); z-index:8;
    font-size:clamp(14px,4vw,20px); font-weight:600; text-align:center; padding:11px 24px;
    background:rgba(31,28,25,.94); border:1px solid #57534e; border-radius:12px;
    white-space:nowrap; opacity:0; transition:opacity .35s; pointer-events:none; }
  .toast.on { opacity:1; }
  .toast.bad { border-color:#8b2f2f; color:#f0b0b0; }

  /* 被抓那一下的红闪 */
  #flash { position:absolute; inset:0; z-index:8; background:#c0392b;
    opacity:0; pointer-events:none; transition:opacity .25s; }
  #flash.on { opacity:.42; }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="flash"></div>

<div id="hud">
  <div class="bar">
    <div id="clock">7:23</div>
    <div id="hearts"></div>
  </div>
  <div id="detwrap"><span class="eye">👁</span><div id="det"><div id="detbar"></div></div></div>
  <div id="goal"></div>
  <div id="carry"></div>
</div>

<div id="stick"><div id="knob"></div></div>
<button id="act" type="button"></button>
<div class="toast" id="toast"></div>
<div id="say"><b>lg7</b><span id="sayTxt"></span></div>

<div class="screen on" id="scTitle">
  <h1>别被看见<small>校园潜行</small></h1>
  <div class="tip">
    <span class="kbd">WASD</span><span class="kbd">↑↓←→</span> 移动　·　手机左下摇杆<br>
    被手电照到 <b>眼睛条</b> 会涨，涨满就被抓。躲到桌子、花坛后面就照不到了。<br>
    <span class="kbd">空格</span> 是角色技，右边那个圆键也一样。
  </div>
  <button class="btn pri" id="btnStart">开始</button>
</div>

<div class="screen" id="scPick">
  <h2 id="pickTitle">挑一个情景</h2>
  <div class="picks" id="pickList"></div>
  <button class="btn sm" id="btnBack">返回</button>
</div>

<div class="screen dim" id="scEnd">
  <h1 id="endTitle">放学</h1>
  <div class="tip" id="endStat"></div>
  <div class="row2">
    <button class="btn pri" id="btnAgain">再来一次</button>
    <button class="btn" id="btnSwap">换个情景</button>
  </div>
</div>

<script>

/* ==================================================================

   情景只描述「地图长什么样、你要干什么、死线是什么、谁在巡逻」。
   想加新情景：往 SCENES 里再写一条，别的都不用动。
   ================================================================== */

  floor:'#1a1714', floor2:'#1f1c19',

   三档，按优先级：
   1. img/ 里有真人照片  → 用照片（只有本地有，img/ 被 .gitignore 排除，永远推不上去）
   2. 没有照片           → 用手画的 SVG 画像（公开版走这条）
   3. 画像也没加载出来   → 退回 emoji（兜底，不会白屏）

   ============================================ */
function svgo(inner){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
    '<defs><clipPath id="k"><circle cx="50" cy="50" r="50"/></clipPath></defs>' +
    '<g clip-path="url(#k)">' + inner + '</g></svg>';
}

var AVATARS = {

/* 巡逻的人怎么走：
   path 是一串路点，走到一个点就停 wait 秒；sweep 是停下来时左右扫视的幅度（弧度）。
   half/range 是视线锥的半角和长度。 */
function actor(o){
  /* 出发时先朝着下一个路点站好 —— 不然第一次停下扫视会从一个莫名其妙的角度开始 */
  var nxt = o.path[1] || o.path[0];
  var a0 = Math.atan2(nxt.y - o.path[0].y, nxt.x - o.path[0].x) || 0;
  return {
    id:o.id, face:o.face, name:o.name, x:o.path[0].x, y:o.path[0].y,
    ang:a0, spd:o.spd, half:o.half, range:o.range, color:o.color || C.amber,
    path:o.path, i:0, wait:0, sweep:o.sweep||0, base:a0, t:Math.random()*6,
    watching:true, mode:o.mode||'patrol', phase:null, timer:0, state:null,
    gone:false, r:16
  };
}
function pt(x,y,wait,sweep){ return { x:x, y:y, wait:wait||0, sweep:sweep||0 }; }

var W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* ==================== 头像加载 ====================
   手画的 SVG 光栅化一次，之后当普通图片用。
   没加载出来就退回 emoji，不会白屏。
   ============================================ */
var IMGS = {}, PHOTO = {};
function svgURI(s){ return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
function faceOf(id){ return PHOTO[id] || IMGS[id]; }

(function loadArt(){
  var emojiOnly = /[?&]emoji\b/.test(location.search);
  Object.keys(AVATARS).forEach(function(k){
    var im = new Image();
    im.onload = function(){ IMGS[k] = im; };
    im.src = svgURI(AVATARS[k]);
  });
  /* 本地有真人照片就用照片（img/ 被 .gitignore 排除，永远推不上去） */
  var photos = { shui:'img/shuige.jpg', logic:'img/logic.jpg', laoli:'img/laoli.png' };
  if (emojiOnly) return;
  Object.keys(photos).forEach(function(k){
    var im = new Image();
    im.onload = function(){ if (im.naturalWidth) PHOTO[k] = im; };
    im.src = photos[k];
  });
})();

/* 把方形图标也光栅化一份（水杯、饼干用画的，不占多少代码） */
function svgIcon(inner){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' + inner + '</svg>';
}

/* ==================== 输入 ==================== */
var keys = {};
window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0) e.preventDefault();
  if (k === ' ' && G.scene === 'play') pressAct();
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

var stick = { active:false, id:null, bx:0, by:0, dx:0, dy:0, r:58 };
var stickEl = document.getElementById('stick'), knobEl = document.getElementById('knob');
var kb = { x:0, y:0 };

function stickStart(x,y,id){
  stick.active=true; stick.id=id; stick.bx=x; stick.by=y; stick.dx=0; stick.dy=0;
  stickEl.classList.add('on');
  stickEl.style.left=(x-stick.r)+'px'; stickEl.style.top=(y-stick.r)+'px';
  stickEl.style.width=(stick.r*2)+'px'; stickEl.style.height=(stick.r*2)+'px';
  stickEl.style.borderRadius='50%';
  stickEl.style.background='rgba(120,113,108,.28)';
  stickEl.style.border='2px solid rgba(168,162,158,.4)';
  knobEl.style.width='52px'; knobEl.style.height='52px'; knobEl.style.borderRadius='50%';
  knobEl.style.background='rgba(194,112,58,.85)';
  knobEl.style.position='absolute'; knobEl.style.left='50%'; knobEl.style.top='50%';
  moveKnob(0,0);
}
function moveKnob(dx,dy){
  knobEl.style.transform='translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
}
function stickMove(x,y){
  var dx=x-stick.bx, dy=y-stick.by, d=Math.hypot(dx,dy);
  if(d>stick.r){ dx=dx/d*stick.r; dy=dy/d*stick.r; }
  stick.dx=dx/stick.r; stick.dy=dy/stick.r; moveKnob(dx,dy);
}
function stickEnd(){
  stick.active=false; stick.id=null; stick.dx=0; stick.dy=0;
  stickEl.classList.remove('on');
}

cv.addEventListener('touchstart', function(e){
  if (G.scene !== 'play') return;
  if (G.sc && G.sc.noMove) return;          // 偷吃那关人物不动，别弹摇杆出来
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if (!stick.active && t.clientX < W*0.5){ stickStart(t.clientX, t.clientY, t.identifier); }
  }
}, {passive:false});
cv.addEventListener('touchmove', function(e){
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if (stick.active && t.identifier===stick.id) stickMove(t.clientX, t.clientY);
  }
}, {passive:false});
function touchDone(e){
  for (var i=0;i<e.changedTouches.length;i++){
    if (e.changedTouches[i].identifier===stick.id) stickEnd();
  }
}
cv.addEventListener('touchend', touchDone);
cv.addEventListener('touchcancel', touchDone);

/* 右下角那个圆键：按住才算数（嚼东西要一直按着） */
var actEl = document.getElementById('act');
var actHeld = false;
/* 按住就算按着：偷吃那关要一直按住才嚼，别的关按一下放技能 */
function actDown(e){
  e.preventDefault(); e.stopPropagation();
  if (G.scene !== 'play' || G.phase !== 'play') return;
  actHeld = true;
  if (!G.sc.noMove) pressAct();
}
function actUp(e){ if (e) e.preventDefault(); actHeld = false; }
actEl.addEventListener('touchstart', actDown, {passive:false});
actEl.addEventListener('touchend', actUp);
actEl.addEventListener('touchcancel', actUp);
actEl.addEventListener('mousedown', actDown);
window.addEventListener('mouseup', actUp);

/* ==================== 时间 ==================== */
function clockText(sec){
  var s = G.sc, span = s.clock[1]-s.clock[0];
  var m = s.clock[0] + Math.round(sec/s.dur*span);
  return Math.floor(m/60) + ':' + ('0'+(m%60)).slice(-2);
}
function beatSec(atMin){
  var s = G.sc;
  return (atMin - s.clock[0]) / (s.clock[1]-s.clock[0]) * s.dur;
}
function fmtClock(m){ return Math.floor(m/60) + ':' + ('0'+(m%60)).slice(-2); }

/* ==================== 游戏状态 ==================== */
var G = {
  scene:'title',        // title | pick | play | end
  sc:null, world:null, char:null, photos:{},
  t:0, hold:0, det:0, strikes:0, seen:false, seenBy:null,
  carry:false, bites:0, chew:0,
  beats:null, phase:'play', caughtT:0, over:false,
  sp:{}, spT:0, spCd:0, planT:0
};

function inZone(p,z){
  return p.x > z.x-6 && p.x < z.x+z.w+6 && p.y > z.y-6 && p.y < z.y+z.h+6;
}

/* ==================== 开局 ==================== */
function startRun(sceneId, charId){
  var sc = null;
  for (var i=0;i<SCENES.length;i++) if (SCENES[i].id===sceneId) sc = SCENES[i];
  var ch = null;
  for (var j=0;j<CHARS.length;j++) if (CHARS[j].id===charId) ch = CHARS[j];
  var w = sc.build();
  G.sc = sc; G.world = w; G.char = ch;
  G.p = { x:w.start.x, y:w.start.y, r:13, faceAng:-Math.PI/2, moving:false };
  G.t=0; G.hold=0; G.det=0; G.strikes=0; G.carry=false; G.bites=0; G.chew=0;
  G.teacherSees=false; G.seen=false; G.seenBy=null;
  G.phase='play'; G.caughtT=0; G.over=false; G.sawAnyone=false;
  G.spCd=0; G.spT=0; G.planT=0; G.cpIdx=0;
  G.beats = sc.beats.map(function(b){ return { at:b.at, go:b.go, done:false }; });
  resize();
  show(null);
  document.getElementById('hud').classList.add('on');
  var useStick = !sc.noMove;
  stickEl.classList.toggle('on', false);
  actEl.classList.toggle('on', true);
  actEl.classList.remove('cool','hot');
  G.scene = 'play';
  if (useStick) stickEl.classList.add('on');
  updateHud(true);
}

/* ==================== 动作键 ==================== */
function pressAct(){
  if (G.scene !== 'play' || G.phase !== 'play') return;
  if (G.sc.noMove){ return; }             // 偷吃那关靠长按，不靠点
  useSpecial();
}
function useSpecial(){
  var p = G.p, sp = SPECIAL[G.char.special];
  if (G.spCd > 0) return;
  G.spCd = sp.cd;
  if (G.char.special === 'nap'){
    G.spT = sp.dur; toast('水哥：把头埋下去了');
  } else if (G.char.special === 'plan'){
    G.planT = sp.dur; toast('logic：全记下来了');
  } else if (G.char.special === 'toilet'){
    G.spT = sp.dur; toast('牢李：我去趟厕所');
  }
}

/* ==================== 更新 ==================== */
function update(dt){
  if (G.scene !== 'play' || G.over) return;
  var p = G.p, sc = G.sc;

  if (G.phase === 'caught'){
    G.caughtT -= dt;
    if (G.caughtT <= 0){
      G.phase = 'play';
      var cp = G.world.checkpoints[G.cpIdx] || G.world.start;
      p.x = cp.x; p.y = cp.y; G.det = 0;
      if (G.strikes >= G.char.hits) lose();
    }
    return;
  }

  G.t += dt;
  if (G.spCd > 0) G.spCd = Math.max(0, G.spCd - dt);
  if (G.spT  > 0) G.spT  = Math.max(0, G.spT  - dt);
  if (G.planT> 0) G.planT = Math.max(0, G.planT- dt);

  /* ---- 移动 ---- */
  var mvx=0, mvy=0;
  if (!sc.noMove){
    if (keys['a']||keys['arrowleft'])  mvx -= 1;
    if (keys['d']||keys['arrowright']) mvx += 1;
    if (keys['w']||keys['arrowup'])    mvy -= 1;
    if (keys['s']||keys['arrowdown'])  mvy += 1;
    mvx += stick.dx; mvy += stick.dy;
  }
  var mag = Math.hypot(mvx,mvy);
  p.moving = mag > 0.12;
  if (p.moving){
    var spd = 152 * G.char.spd;
    if (G.carry) spd *= 0.62;
    if (G.spT > 0 && G.char.special==='toilet') spd *= 2.2;
    mvx /= mag; mvy /= mag;
    var nx = p.x + mvx*spd*dt, ny = p.y + mvy*spd*dt;
    if (!hitsWall(nx, p.y, p.r)) p.x = nx;
    if (!hitsWall(p.x, ny, p.r)) p.y = ny;
    if (Math.abs(mvx) > Math.abs(mvy)) p.faceAng = mvx > 0 ? 0 : Math.PI;
    else p.faceAng = mvy > 0 ? Math.PI/2 : -Math.PI/2;
  }
  p.x = Math.max(20, Math.min(G.world.w-20, p.x));
  p.y = Math.max(20, Math.min(G.world.h-20, p.y));

  /* ---- 检查点 ---- */
  var cps = G.world.checkpoints;
  for (var c=G.cpIdx+1; c<cps.length; c++){
    if (Math.hypot(p.x-cps[c].x, p.y-cps[c].y) < 190){ G.cpIdx = c; break; }
  }

  /* ---- 巡逻的人 ---- */
  updateActors(dt);

  /* ---- 偷吃那关：老师在不在看你 ---- */
  if (sc.noMove) updateSnack(dt);

  /* ---- 检测 ---- */
  updateDetection(dt);

  /* ---- 情景自己的逻辑 ---- */
  sc.tick(dt);

  /* ---- 节拍 ---- */
  for (var i=0;i<G.beats.length;i++){
    var b = G.beats[i];
    if (!b.done && G.t >= beatSec(b.at)){ b.done = true; b.go(); }
  }

  /* ---- 时间到 ---- */
  if (G.t >= G.sc.dur && !G.over) lose('time');
}

function hitsWall(x,y,r){
  var ws = G.world.walls;
  for (var i=0;i<ws.length;i++){
    var w = ws[i];
    var cx2 = Math.max(w.x, Math.min(x, w.x+w.w));
    var cy2 = Math.max(w.y, Math.min(y, w.y+w.h));
    if ((x-cx2)*(x-cx2) + (y-cy2)*(y-cy2) < r*r) return true;
  }
  return false;
}

function updateActors(dt){
  var as = G.world.actors;
  for (var i=0;i<as.length;i++){
    var a = as[i];
    a.t += dt;
    if (a.gone) continue;

    if (a.mode === 'teacher'){ updateTeacher(a, dt); continue; }

    if (a.wait > 0){
      a.wait -= dt;
      if (a.sweep) a.ang = a.base + Math.sin(a.t*1.5) * a.sweep;
      continue;
    }
    var tgt = a.path[a.i];
    var dx = tgt.x-a.x, dy = tgt.y-a.y, d = Math.hypot(dx,dy);
    if (d < 6){
      a.i = (a.i+1) % a.path.length;
      a.wait = tgt.wait || 0;
      a.base = a.ang;
      continue;
    }
    if (a.spd > 0){
      a.x += dx/d*a.spd*dt; a.y += dy/d*a.spd*dt;
      a.ang = Math.atan2(dy,dx);
    }
  }
}

/* 老师的行为：板书写一会儿 → 直腰（预兆） → 转过来看全班 → 再写
   每个分支都要把 watching 显式写清楚。之前那句 watching = true 落在了
   「转身结束」那一支里，等于给接下来的板书开了监视 —— 整个正反颠倒了：
   她盯着全班的时候你看得见一切随便吃，她背过身写板书的时候反而动不了。 */
function updateTeacher(a, dt){
  a.timer = (a.timer||0) - dt;
  if (a.timer > 0) return;

  /* 下来巡查：一路走一路扫各人的卷子 */
  if (a.phase === 'patrol'){
    var tgt = a.path[a.i];
    var dx=tgt.x-a.x, dy=tgt.y-a.y, d=Math.hypot(dx,dy);
    if (d < 6){
      a.i++;
      if (a.i >= a.path.length){
        a.phase='board'; a.watching=false; a.ang=-Math.PI/2; a.timer=0.6;
      } else a.timer = 0;
      return;
    }
    a.x += dx/d*a.spd*dt; a.y += dy/d*a.spd*dt;
    a.ang = Math.atan2(dy,dx);
    a.watching = true;
    return;
  }

  var speedUp = 1 + G.bites*0.16;          // 你越接近吃完，她翻得越勤
  if (a.phase === 'board'){                // 板书写完 → 直腰（预兆）
    a.phase = 'warn'; a.watching = false; a.ang = -Math.PI/2;
    a.timer = (0.62 + Math.random()*0.12) / speedUp;
  } else if (a.phase === 'warn'){          // 直腰 → 转身盯着全班
    a.phase = 'turn'; a.watching = true; a.ang = Math.PI/2;
    a.timer = (1.0 + Math.random()*0.9) / speedUp;
  } else {                                 // 转回去了 → 接着写，或者下来巡
    if (Math.random() < 0.18){
      a.phase = 'patrol'; a.watching = true;
      a.path = [pt(340,300,0,0), pt(340,780,0,0), pt(340,300,0,0)];
      a.i = 0; a.timer = 0;
    } else {
      a.phase = 'board'; a.watching = false; a.ang = -Math.PI/2;
      /* 一次板书要够嚼完一口还有余量，不然每次都卡在一半很难受 */
      a.timer = (1.6 + Math.random()*1.1) / speedUp;
    }
  }
}

/* 偷吃那关：按住键 = 嚼。老师在看的时候还在嚼，眼睛条就飞涨。 */
function updateSnack(dt){
  var a = G.world.actors[0];
  /* 用同一个 seeing() 判断，别让「她看没看讲台」和「她看没看你」变成两套说法 */
  var se = seeing(a, G.p) > 0;
  G.teacherSees = se;
  var chewing = actHeld || keys[' '];
  if (chewing){
    if (se){
      G.det += dt * 1.7;
    } else {
      G.chew += dt;
      G.det -= dt * 0.9;                 // 安全地嚼着的时候，上次的残留也该慢慢消
      if (G.chew >= SNACK_BITE){
        G.chew -= SNACK_BITE;
        G.bites++;
        toast('嚼掉一片  ' + G.bites + ' / ' + SNACK_NEED);
      }
    }
  } else {
    G.chew = Math.max(0, G.chew - dt*0.25);   // 掉一点意思一下，别一口气全清零
    G.det -= dt * 0.9;
  }
  G.det = Math.max(0, Math.min(1, G.det));
  G.p.chewing = chewing;
  if (G.det >= 1) caught(a);
}

/* ---- 视线与检测 ---- */
function updateDetection(dt){
  var p = G.p, as = G.world.actors, best = 0, byActor = null;
  for (var i=0;i<as.length;i++){
    var a = as[i];
    if (a.gone) continue;
    var s = seeing(a, p);
    if (s > best){ best = s; byActor = a; }
  }
  G.seen = best > 0; G.seenBy = byActor;

  /* 角色技：装睡 / 跑厕所 —— 这段里谁也照不到你 */
  var immune = G.spT > 0 && (G.char.special==='nap' || G.char.special==='toilet');
  if (immune) G.seen = false;

  /* 偷吃那关的检测在 updateSnack 里算，这里不重复加 */
  if (!G.sc.noMove){
    if (G.seen){
      var rate = 0.92 * best * G.char.detMod;
      if (G.carry) rate *= 1.35;              // 端着水杯，走得慢也显眼
      if (!p.moving) rate *= 0.62;            // 站住不动，没那么容易被注意到
      G.det += dt * rate;
    } else {
      G.det -= dt * 0.62;
    }
  }
  G.det = Math.max(0, Math.min(1, G.det));
  if (G.det >= 1 && G.phase === 'play') caught(byActor);
}

function seeing(a, p){
  if (a.gone) return 0;
  if (a.mode === 'teacher'){
    /* 老师只有正面朝全班的时候才看得见你 */
    if (!a.watching) return 0;
    /* 下来巡查的时候，走到教室那头就只是在看别人的卷子 —— 那段能偷吃 */
    if (a.phase === 'patrol' && Math.hypot(p.x-a.x, p.y-a.y) > 300) return 0;
    return 0.55;
  }
  var dx = p.x-a.x, dy = p.y-a.y, d = Math.hypot(dx,dy);
  if (d > a.range) return 0;
  var diff = Math.abs(angDiff(Math.atan2(dy,dx), a.ang));
  if (diff > a.half) return 0;
  if (blocked(a.x, a.y, p.x, p.y)) return 0;
  var near = 1 - d/a.range, center = 1 - diff/a.half;
  return 0.34 + near*0.46 + center*0.20;
}
function angDiff(a,b){
  var d = (a-b) % (Math.PI*2);
  if (d > Math.PI) d -= Math.PI*2;
  if (d < -Math.PI) d += Math.PI*2;
  return d;
}
/* 两点之间有没有被墙挡住 */
function blocked(x1,y1,x2,y2){
  var ws = G.world.walls;
  for (var i=0;i<ws.length;i++) if (segRect(x1,y1,x2,y2,ws[i]) !== null) return true;
  return false;
}
/* 射线和矩形在哪一段相交。d === 0 要单独处理 —— 正上正下、正左正右
   那几束光如果不特殊对待，会直接从墙里穿过去。 */
function slabHit(o, d, lo, hi){
  if (d === 0) return (o < lo || o > hi) ? null : [-Infinity, Infinity];
  var t1 = (lo-o)/d, t2 = (hi-o)/d;
  return t1 < t2 ? [t1,t2] : [t2,t1];
}
function segRect(x1,y1,x2,y2,r){
  var a = slabHit(x1, x2-x1, r.x, r.x+r.w); if (!a) return null;
  var b = slabHit(y1, y2-y1, r.y, r.y+r.h); if (!b) return null;
  var tmin = Math.max(a[0], b[0]), tmax = Math.min(a[1], b[1]);
  if (tmax < 0 || tmin > tmax || tmin > 1) return null;
  return Math.max(0, tmin);
}
/* 射线撞到墙的距离，画视线锥的阴影用 */
function rayRect(ox,oy,dx,dy,r){
  var a = slabHit(ox, dx, r.x, r.x+r.w); if (!a) return null;
  var b = slabHit(oy, dy, r.y, r.y+r.h); if (!b) return null;
  var tmin = Math.max(a[0], b[0]), tmax = Math.min(a[1], b[1]);
  if (tmax < 0 || tmin > tmax) return null;
  return tmin < 0 ? 0 : tmin;
}

/* ---- 被抓 ---- */
function caught(a){
  if (G.over) return;
  G.strikes++;
  G.det = 0; G.chew = 0;
  G.phase = 'caught'; G.caughtT = 1.15;
  var flash = document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(function(){ flash.classList.remove('on'); }, 260);
  stickEnd();

  if (G.sc.noMove){
    G.bites = Math.max(0, G.bites-1);
    toast('被看见了！饼干没收一片', true);
    say('老师', '手在底下干什么呢？');
  } else {
    if (G.carry){ G.carry = false; toast('水洒了一地，得重新打', true); }
    else toast('被看见了！', true);
    if (a && a.name) say(a.name, a.id==='lg7' ? '站住，哪个班的？' : '诶，你干嘛去？');
  }
  updateHud(true);
  if (G.strikes >= G.char.hits){
    G.phase = 'caught'; G.caughtT = 1.15;   // 让红闪走完再结算
    setTimeout(lose, 1200);
  }
}

/* ==================== 渲染 ==================== */
var camX=0, camY=0;

function render(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle = '#0e0c0b'; cx.fillRect(0,0,W,H);
  if (!G.world) return;

  var w = G.world;
  camX = clamp(p_cx() - W/2, 0, Math.max(0, w.w - W));
  camY = clamp(p_cy() - H/2, 0, Math.max(0, w.h - H));
  cx.save();
  cx.translate(-camX, -camY);

  drawFloor(w);
  drawZones(w);
  drawCones(w);
  drawProps(w);
  drawActors(w);
  drawPlayer();
  cx.restore();

  drawOverlay();
}
function p_cx(){ return G.p ? G.p.x : 0; }
function p_cy(){ return G.p ? G.p.y : 0; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function drawFloor(w){
  cx.fillStyle = C.floor;
  cx.fillRect(0,0,w.w,w.h);
  /* 地砖，纯装饰，顺便让你看得出自己在动 */
  cx.strokeStyle = 'rgba(255,255,255,.026)'; cx.lineWidth = 1;
  for (var x=0;x<w.w;x+=80){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,w.h); cx.stroke(); }
  for (var y=0;y<w.h;y+=80){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(w.w,y); cx.stroke(); }
}

function drawZones(w){
  for (var i=0;i<w.zones.length;i++){
    var z = w.zones[i];
    var hot = (z.kind==='water' && !G.carry) || (z.kind==='goal' && G.carry) ||
              (z.kind==='goal' && G.sc.id==='late');
    var col = z.kind==='water' ? C.blue : C.green;
    cx.fillStyle = hexA(col, hot ? 0.13 : 0.05);
    cx.fillRect(z.x, z.y, z.w, z.h);
    cx.strokeStyle = hexA(col, hot ? 0.55 : 0.2); cx.lineWidth = 2;
    cx.setLineDash([7,6]);
    cx.strokeRect(z.x, z.y, z.w, z.h);
    cx.setLineDash([]);
    if (hot){
      cx.fillStyle = hexA(col, 0.75);
      cx.font = '600 13px system-ui,sans-serif'; cx.textAlign = 'center';
      cx.fillText(z.label, z.x+z.w/2, z.y-9);
    }
    /* 待够时间的进度环 */
    if (hot && G.hold > 0.05){
      var need = (z.kind==='water') ? 2.0 : 1.5;
      cx.strokeStyle = col; cx.lineWidth = 4;
      cx.beginPath();
      cx.arc(z.x+z.w/2, z.y+z.h/2, 22, -Math.PI/2, -Math.PI/2 + Math.PI*2*Math.min(1,G.hold/need));
      cx.stroke();
    }
  }
}

function drawCones(w){
  for (var i=0;i<w.actors.length;i++){
    var a = w.actors[i];
    if (a.gone) continue;
    var seeingMe = G.seenBy === a && G.seen;
    var col = seeingMe ? C.red : (a.watching===false ? '#3d4a56' : a.color);
    cx.save();
    cx.globalAlpha = a.watching===false ? 0.10 : (seeingMe ? 0.30 : 0.16);
    cx.fillStyle = col;
    cx.beginPath();
    cx.moveTo(a.x, a.y);
    var N = 34;
    for (var k=0;k<=N;k++){
      var ang = a.ang - a.half + (2*a.half)*k/N;
      var dx = Math.cos(ang), dy = Math.sin(ang), t = a.range;
      for (var j=0;j<w.walls.length;j++){
        var h = rayRect(a.x, a.y, dx, dy, w.walls[j]);
        if (h !== null && h < t) t = h;
      }
      cx.lineTo(a.x + dx*t, a.y + dy*t);
    }
    cx.closePath();
    cx.fill();
    cx.restore();

    /* 预判：把巡逻路线画出来 */
    if (G.planT > 0 && a.mode !== 'teacher'){
      cx.save();
      cx.strokeStyle = hexA(C.blue, 0.55); cx.lineWidth = 2;
      cx.setLineDash([6,6]);
      cx.beginPath();
      for (var q=0;q<a.path.length;q++){
        if (q===0) cx.moveTo(a.path[q].x, a.path[q].y);
        else cx.lineTo(a.path[q].x, a.path[q].y);
      }
      cx.stroke(); cx.setLineDash([]);
      for (var q2=0;q2<a.path.length;q2++){
        cx.fillStyle = hexA(C.blue, 0.6);
        cx.beginPath(); cx.arc(a.path[q2].x, a.path[q2].y, 6, 0, 7); cx.fill();
      }
      cx.restore();
    }
  }
}

function drawProps(w){
  /* 先把墙全铺出来。挡视线的东西必须先看得见 —— 上一版只画贴着地图边的墙，
     走廊里那几堵就变成了「隐形但撞得到」，纯坑人。 */
  for (var i=0;i<w.walls.length;i++) drawWallBlock(w.walls[i]);
  /* 家具盖在墙上面 */
  for (var j=0;j<w.props.length;j++){
    var p = w.props[j];
    if (p.kind === 'desk')  drawDesk(p);
    else if (p.kind === 'planter') drawPlanter(p);
    else if (p.kind === 'pillar')  drawPillar(p);
    else if (p.kind === 'cooler')  drawCooler(p);
    else if (p.kind === 'podium')  drawPodium(p);
    else if (p.kind === 'locker')  drawLocker(p);
    else drawWallBlock(p);
  }
}

function drawWallBlock(p){
  cx.fillStyle = C.wall;
  cx.fillRect(p.x, p.y, p.w, p.h);
  cx.fillStyle = C.wallTop;
  cx.fillRect(p.x, p.y, p.w, 5);
}
function drawDesk(p){
  cx.fillStyle = '#2a241f';
  cx.fillRect(p.x+3, p.y+4, p.w, p.h);
  cx.fillStyle = '#4a3d31';
  cx.fillRect(p.x, p.y, p.w, p.h);
  cx.fillStyle = '#5b4b3b';
  cx.fillRect(p.x, p.y, p.w, 6);
  cx.fillStyle = 'rgba(0,0,0,.25)';
  cx.fillRect(p.x+8, p.y+p.h-14, p.w-16, 8);
}
function drawPlanter(p){
  cx.fillStyle = '#3a3128';
  cx.fillRect(p.x, p.y, p.w, p.h);
  cx.fillStyle = '#4d5a3e';
  cx.fillRect(p.x+6, p.y+6, p.w-12, p.h-12);
  cx.fillStyle = '#5e6f4a';
  for (var i=0;i<7;i++){
    var sx = p.x + 14 + (i*37)%(p.w-28), sy = p.y + 14 + (i*53)%(p.h-28);
    cx.beginPath(); cx.arc(sx, sy, 9, 0, 7); cx.fill();
  }
}
function drawPillar(p){
  cx.fillStyle = '#332e29'; cx.fillRect(p.x, p.y, p.w, p.h);
  cx.fillStyle = '#403a33'; cx.fillRect(p.x, p.y, p.w, 8);
}
function drawCooler(p){
  cx.fillStyle = '#c9d5dd';
  cx.fillRect(p.x+8, p.y+44, p.w-16, p.h-44);
  cx.fillStyle = '#6fa8cc';
  cx.beginPath();
  cx.ellipse(p.x+p.w/2, p.y+30, p.w*0.34, 30, 0, 0, Math.PI*2);
  cx.fill();
  cx.fillStyle = '#8fc0dd';
  cx.beginPath();
  cx.ellipse(p.x+p.w/2-7, p.y+24, p.w*0.11, 13, 0, 0, Math.PI*2);
  cx.fill();
  cx.fillStyle = '#e05252';
  cx.fillRect(p.x+p.w/2-4, p.y+58, 8, 14);
}
function drawPodium(p){
  cx.fillStyle = '#3d3128';
  cx.fillRect(p.x, p.y, p.w, p.h);
  cx.fillStyle = '#4f4034';
  cx.fillRect(p.x, p.y, p.w, 7);
  cx.fillStyle = 'rgba(255,255,255,.05)';
  cx.fillRect(p.x+10, p.y+14, p.w-20, 3);
}
/* 走廊里那种铁皮柜 —— 主要是给走廊一点能躲的东西 */
function drawLocker(p){
  cx.fillStyle = '#39424b';
  cx.fillRect(p.x, p.y, p.w, p.h);
  cx.fillStyle = '#485460';
  cx.fillRect(p.x, p.y, p.w, 6);
  cx.strokeStyle = 'rgba(0,0,0,.35)'; cx.lineWidth = 2;
  cx.beginPath();
  cx.moveTo(p.x + p.w/2, p.y+6); cx.lineTo(p.x + p.w/2, p.y+p.h-6);
  cx.stroke();
  cx.fillStyle = '#8a949c';
  cx.fillRect(p.x + p.w/2 - 9, p.y + p.h/2 - 5, 5, 10);
  cx.fillRect(p.x + p.w/2 + 4, p.y + p.h/2 - 5, 5, 10);
}

function drawActors(w){
  for (var i=0;i<w.actors.length;i++){
    var a = w.actors[i];
    if (a.gone) continue;
    /* 正看着你的时候头顶弹一个惊叹号 */
    if (G.seenBy === a && G.seen){
      cx.fillStyle = C.red;
      cx.font = '700 22px system-ui,sans-serif'; cx.textAlign = 'center';
      cx.fillText('!', a.x, a.y - 26);
    } else if (a.mode === 'teacher' && a.phase === 'warn'){
      cx.fillStyle = C.amber;
      cx.font = '700 20px system-ui,sans-serif'; cx.textAlign = 'center';
      cx.fillText('?', a.x, a.y - 26);
    }
    drawFace(a.face, a.x, a.y, 17, a.ang);
    cx.fillStyle = hexA(a.color, 0.9);
    cx.font = '500 11px system-ui,sans-serif'; cx.textAlign = 'center';
    cx.fillText(a.name, a.x, a.y + 32);
  }
}

function drawPlayer(){
  var p = G.p;
  /* 检测环：围着你自己转的那一圈 */
  if (G.det > 0.02){
    cx.save();
    cx.strokeStyle = G.det > 0.66 ? C.red : (G.det > 0.33 ? C.amber : C.green);
    cx.lineWidth = 3.5; cx.globalAlpha = 0.35 + G.det*0.65;
    cx.beginPath();
    cx.arc(p.x, p.y, 24, -Math.PI/2, -Math.PI/2 + Math.PI*2*G.det);
    cx.stroke();
    cx.restore();
  }
  if (G.spT > 0) {                          // 角色技生效中
    cx.save();
    cx.strokeStyle = hexA(C.green, 0.7); cx.lineWidth = 2;
    cx.setLineDash([5,5]);
    cx.beginPath(); cx.arc(p.x, p.y, 28, 0, 7); cx.stroke();
    cx.restore();
  }
  if (G.carry){                              // 手里端着水杯
    cx.fillStyle = '#9cc4e4';
    cx.fillRect(p.x + 12, p.y - 20, 12, 16);
    cx.fillStyle = '#cfe2f2';
    cx.fillRect(p.x + 12, p.y - 20, 12, 5);
  }
  drawFace(G.char.id, p.x, p.y, 15, p.faceAng);

  /* 偷吃那关：嘴边的进度 + 咀嚼的动静 */
  if (G.sc && G.sc.noMove){
    if (G.chew > 0.05){
      cx.strokeStyle = C.green; cx.lineWidth = 3;
      cx.beginPath();
      cx.arc(p.x, p.y, 24, -Math.PI/2, -Math.PI/2 + Math.PI*2*(G.chew/SNACK_BITE));
      cx.stroke();
    }
    if (p.chewing){
      cx.fillStyle = hexA(C.amber, 0.5);
      cx.font = '600 15px system-ui,sans-serif'; cx.textAlign = 'center';
      cx.fillText('嚼', p.x, p.y - 26);
    }
  }
}

/* 画像统一走这里：有图用图，没图退回 emoji */
function drawFace(id, x, y, r, ang){
  var im = faceOf(id);
  cx.save();
  cx.translate(x,y);
  /* 影子 */
  cx.fillStyle = 'rgba(0,0,0,.35)';
  cx.beginPath(); cx.ellipse(0, r*0.75, r*0.95, r*0.42, 0, 0, 7); cx.fill();
  /* 朝向的小尖角 */
  cx.rotate(ang + Math.PI/2);
  cx.fillStyle = 'rgba(245,245,244,.5)';
  cx.beginPath();
  cx.moveTo(0, -r-9); cx.lineTo(-5.5, -r+1); cx.lineTo(5.5, -r+1);
  cx.closePath(); cx.fill();
  cx.rotate(-(ang + Math.PI/2));
  if (im){
    cx.save();
    cx.beginPath(); cx.arc(0,0,r,0,7); cx.clip();
    cx.drawImage(im, -r, -r, r*2, r*2);
    cx.restore();
    cx.strokeStyle = 'rgba(0,0,0,.5)'; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(0,0,r,0,7); cx.stroke();
  } else {
    cx.fillStyle = '#292524';
    cx.beginPath(); cx.arc(0,0,r,0,7); cx.fill();
    var em = '🙂';
    for (var i=0;i<CHARS.length;i++) if (CHARS[i].id===id) em = CHARS[i].emoji;
    if (id==='lg7') em='😠'; else if (id==='duty') em='💪';
    else if (id==='dean') em='🧐'; else if (id==='teacher') em='👩🏫';
    else if (id==='deskmate') em='😶';
    cx.font = Math.round(r*1.5)+'px system-ui,sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(em, 0, 1);
    cx.textBaseline='alphabetic';
  }
  cx.restore();
}

/* 屏幕上那层固定不动的东西 */
function drawOverlay(){
  if (G.spT > 0){
    cx.fillStyle = hexA(C.green, 0.12);
    cx.fillRect(0,0,W,H);
  }
  if (G.phase === 'caught'){
    cx.fillStyle = 'rgba(192,57,43,' + (0.10 + 0.06*Math.sin(G.t*22)) + ')';
    cx.fillRect(0,0,W,H);
  }
}

function hexA(hex, a){
  var n = parseInt(hex.slice(1),16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}

/* ==================== 主循环 ==================== */
var lastT = 0;
function loop(ts){
  var dt = lastT ? Math.min((ts-lastT)/1000, 0.05) : 0;
  lastT = ts;
  update(dt);
  render();
  updateHud(false);
  requestAnimationFrame(loop);
}

/* ==================== HUD ==================== */
var clockEl = document.getElementById('clock'),
    detWrap = document.getElementById('detwrap'),
    detBar  = document.getElementById('detbar'),
    heartsEl= document.getElementById('hearts'),
    goalEl  = document.getElementById('goal'),
    carryEl = document.getElementById('carry'),
    toastEl = document.getElementById('toast'),
    sayEl   = document.getElementById('say'),
    sayTxtEl= document.getElementById('sayTxt'),
    sayWho  = sayEl.querySelector('b'),
    sayTimer= null;

var lastHud = '';
function updateHud(force){
  if (G.scene !== 'play' || !G.sc) return;
  var sig = Math.round(G.t*10) + '|' + Math.round(G.det*40) + '|' + G.strikes + '|' +
            (G.carry?1:0) + '|' + G.bites + '|' + Math.round(G.hold*10) + '|' + (G.seen?1:0) +
            '|' + (G.teacherSees?1:0);
  if (!force && sig === lastHud) return;
  lastHud = sig;

  clockEl.textContent = clockText(G.t);
  var left = G.sc.dur - G.t;
  clockEl.className = left < G.sc.dur*0.15 ? 'final' : (left < G.sc.dur*0.35 ? 'warn' : '');

  detBar.style.width = (G.det*100).toFixed(0) + '%';
  detWrap.classList.toggle('seen', G.seen);

  var h = '';
  for (var i=0;i<G.char.hits;i++) h += '<span class="' + (i<G.strikes?'gone':'') + '">●</span>';
  heartsEl.innerHTML = h;

  var g = G.sc.goalText();
  if (G.phase === 'caught') g = '被抓住了 —— 等着挨说';
  goalEl.innerHTML = '<span class="do">▸</span> ' + g;
  carryEl.textContent = G.carry ? '手里端着水杯，走不快' : '';

  var sp = SPECIAL[G.char.special];
  if (G.sc.noMove){
    actEl.textContent = '嚼';
    actEl.classList.toggle('hot', !!G.teacherSees);
  } else {
    actEl.innerHTML = sp.n + '<br>' + (G.spCd>0 ? Math.ceil(G.spCd)+'s' : '就绪');
    actEl.classList.toggle('cool', G.spCd > 0);
  }
}

function toast(msg, bad){
  toastEl.textContent = msg;
  toastEl.classList.toggle('bad', !!bad);
  toastEl.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 1500);
}
function say(who, msg, kind){
  sayWho.textContent = who;
  sayTxtEl.textContent = msg;
  sayEl.classList.toggle('calm', kind === 'calm');
  sayEl.classList.add('on');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(function(){ sayEl.classList.remove('on'); }, 3200);
}

/* ==================== 结束 ==================== */
function win(){ endRun(true, 'done'); }
function lose(reason){ endRun(false, reason || 'caught'); }

var endTitle = document.getElementById('endTitle'),
    endStat  = document.getElementById('endStat'),
    scEnd    = document.getElementById('scEnd');

function endRun(ok, reason){
  if (G.over) return;
  G.over = true;
  stickEnd();
  actEl.classList.remove('on');
  document.getElementById('hud').classList.remove('on');

  var beat = loadBest()[G.sc.id];
  var secs = G.t;
  var good = ok && (!beat || !beat.win || secs < beat.t);
  if (good) saveBest(G.sc.id, { win:ok, t:secs, strikes:G.strikes });

  if (ok){
    endTitle.textContent = '赶上了';
    endStat.innerHTML =
      '用时 <b>' + secs.toFixed(1) + ' 秒</b>　·　被抓 <b>' + G.strikes + '</b> 次' +
      (good ? '<br><b>新纪录。</b>' : (beat && beat.win ? '<br>上次只用了 ' + beat.t.toFixed(1) + ' 秒。' : ''));
  } else {
    endTitle.textContent = reason === 'time' ? '来不及了' : '被拎走了';
    endStat.innerHTML = reason === 'time'
      ? '铃响的时候你还没弄完。<br>被抓 <b>' + G.strikes + '</b> 次。'
      : '第 <b>' + G.strikes + '</b> 次被看见，这回真跑不掉了。';
  }
  G.scene = 'end';
  show(scEnd);
}

/* ==================== 存档 ==================== */
var SAVE_KEY = 'bbkj.save.v1';
function loadBest(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch(e){ return {}; }
}
function saveBest(id, v){
  var all = loadBest(); all[id] = v;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(all)); } catch(e){}
}
function fmt(s){ return s.toFixed(1) + 's'; }

/* ==================== 界面流程 ==================== */
function show(el){
  var all = document.querySelectorAll('.screen');
  for (var i=0;i<all.length;i++) all[i].classList.remove('on');
  if (el) el.classList.add('on');
}

var scPick = document.getElementById('scPick'),
    pickList = document.getElementById('pickList'),
    pickTitle = document.getElementById('pickTitle');

function buildSceneList(){
  pickTitle.textContent = '挑一个情景';
  pickList.innerHTML = '';
  var best = loadBest();
  SCENES.forEach(function(s){
    var b = best[s.id];
    var d = document.createElement('div');
    d.className = 'pick';
    d.innerHTML =
      '<div class="top"><div class="av">' + sceneIcon(s.id) + '</div>' +
      '<div><div class="nm">' + s.name + '</div>' +
      '<div class="tm">' + fmtClock(s.clock[0]) + ' → ' + fmtClock(s.clock[1]) + '</div></div></div>' +
      '<div class="ds">' + s.intro + '</div>' +
      '<div class="fin">' + (b && b.win ? '✅ 最快 ' + fmt(b.t) : '没过过') + '</div>';
    d.addEventListener('click', function(){ buildCharList(s.id); });
    pickList.appendChild(d);
  });
}
function sceneIcon(id){
  if (id==='late')  return '🚪';
  if (id==='water') return '💧';
  if (id==='snack') return '🍪';
  return '❓';
}

function buildCharList(sceneId){
  pickTitle.textContent = '谁去？';
  pickList.innerHTML = '';
  CHARS.forEach(function(c){
    var d = document.createElement('div');
    d.className = 'pick';
    var ph = PHOTO[c.id] ? PHOTO[c.id].src : (IMGS[c.id] ? IMGS[c.id].src : '');
    d.innerHTML =
      '<div class="top"><div class="av">' +
      (ph ? '<img src="' + ph + '" alt="">' : c.emoji) + '</div>' +
      '<div><div class="nm">' + c.name + '</div>' +
      '<div class="tm">' + c.tag + '　' + c.hits + ' 条命</div></div></div>' +
      '<div class="ds">' + c.note + '</div>';
    d.addEventListener('click', function(){ startRun(sceneId, c.id); });
    pickList.appendChild(d);
  });
  show(scPick);
}

document.getElementById('btnStart').addEventListener('click', function(){
  buildSceneList(); show(scPick);
});
document.getElementById('btnBack').addEventListener('click', function(){
  if (pickTitle.textContent === '谁去？'){ buildSceneList(); }
  else { show(document.getElementById('scTitle')); }
});
document.getElementById('btnAgain').addEventListener('click', function(){
  startRun(G.sc.id, G.char.id);
});
document.getElementById('btnSwap').addEventListener('click', function(){
  buildSceneList(); show(scPick);
});

/* ==================== 起飞 ==================== */
resize();
requestAnimationFrame(loop);
</script>

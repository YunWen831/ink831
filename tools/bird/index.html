<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123e46">
  <meta name="description" content="一只鸟，一片像素山谷。点击想去的地方，让鸟飞过去。">
  <title>鸟 · YunWen</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./bird.js" defer></script>
</head>
<body>
  <main class="bird-app">
    <header class="topbar">
      <a class="back" href="../index.html" aria-label="返回工具目录">← <span>工具</span></a>
      <h1>鸟<span aria-hidden="true"> / </span><span class="english" aria-hidden="true">BIRD</span></h1>
      <button id="motion" class="motion" type="button" aria-pressed="false" title="切换轻微像素抖动">轻动 <span class="motion-light" aria-hidden="true"></span></button>
    </header>

    <section id="world" class="world" aria-label="像素山谷">
      <div class="scene-wrap">
        <div id="scene" class="scene" role="application" tabindex="0" aria-label="鸟的山谷。点击一个地点让鸟飞过去；也可以用方向键移动落点，回车起飞，空格返回枝头。" aria-describedby="instructions">
          <div class="landscape" aria-hidden="true"></div>
          <div class="water-shimmer" aria-hidden="true"></div>
          <div class="leaf-shimmer leaf-one" aria-hidden="true"></div>
          <div class="leaf-shimmer leaf-two" aria-hidden="true"></div>
          <div id="destination" class="destination" aria-hidden="true"></div>
          <svg id="bird" class="bird" viewBox="0 0 38 28" role="img" aria-label="停在枝头的小鸟">
            <g class="bird-art" shape-rendering="crispEdges">
              <path class="bird-shadow" d="M7 8h3V5h3V3h6v2h3v2h2v9h4l7-6 2 2-5 5 5 1v3l-8-1-4 4H10v-3H7v-3H5v-6h2Z"/>
              <path class="bird-body" d="M7 9h2V6h3V4h7v2h3v3h1v9h4l6-5 1 1-5 6 6 1v1l-8-1-5 4H11v-2H8v-3H6V10h1Z"/>
              <path class="bird-beak" d="M7 11H3v2h4v2h3v-4Z"/>
              <path class="bird-eye" d="M15 8h2v3h-2Z"/>
              <g class="wing folded"><path class="bird-shadow" d="M19 13h4v3h4v5h-5v2h-3v-2h-3v-3h3Z"/><path class="bird-body" d="M20 14h3v3h3v4h-4v1h-3v-2h-2v-2h3Z"/></g>
              <g class="wing flying"><path class="bird-shadow" d="M17 14h3V8h3V2h3v8h4v6h-3v4h-5v-2h-3v-4Z"/><path class="bird-body" d="M19 14h2V8h3V3h1v8h4v4h-3v4h-3v-2h-3v-3Z"/></g>
              <g class="feet"><path d="M13 23v4m7-4v4m-10 0h6m1 0h6"/></g>
            </g>
          </svg>
          <span class="place place-house" aria-hidden="true">小屋</span>
          <span class="place place-castle" aria-hidden="true">城堡</span>
          <span class="place place-falls" aria-hidden="true">瀑布</span>
        </div>
      </div>
      <p class="loading" id="loading">正在走进山谷…</p>
    </section>

    <footer class="bottom-bar">
      <p id="instructions"><span class="click-icon" aria-hidden="true">＋</span> 点一个地方，鸟会飞过去。</p>
      <p id="status" class="status" role="status" aria-live="polite">在枝头，等风来。</p>
      <button id="home" class="home" type="button" title="让鸟返回最初的枝头">回到枝头 <span aria-hidden="true">↙</span></button>
    </footer>
    <noscript><p class="no-script">请开启 JavaScript，让小鸟飞起来。</p></noscript>
  </main>
</body>
</html>

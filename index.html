<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YunWen</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 2rem 1.25rem; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #fafaf9; color: #1c1917;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: min(28rem, 100%);
    /* border-box 不能少：宽度算的是「内容区」，不带上 padding 的话
       在窄屏上整张卡会往右溢出（一直有这毛病，描述写长了才看出来） */
    box-sizing: border-box;
    padding: 2.5rem clamp(1.25rem, 5vw, 2.5rem) 1.75rem;
    border: 1px solid #e7e5e4;
    border-radius: 16px;
  }
  h1 { margin: 0 0 1.5rem; font-size: 2rem; letter-spacing: .04em; font-weight: 600; }

  .works { margin: 0; padding: 0; list-style: none; border-top: 1px solid #e7e5e4; }
  .works li { border-bottom: 1px solid #e7e5e4; }
  .works a {
    display: block; padding: 1rem .25rem;
    color: inherit; text-decoration: none;
  }
  .works a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 6px; }
  .works .nm { display: block; font-size: 1.05rem; font-weight: 600; }
  .works .nm::after {
    content: "→"; display: inline-block; margin-left: .5rem;
    color: #a8a29e; opacity: .45;
    transition: opacity .15s, transform .15s;
  }
  .works a:hover .nm, .works a:focus-visible .nm { text-decoration: underline; text-underline-offset: .25em; }
  .works a:hover .nm::after, .works a:focus-visible .nm::after { opacity: 1; transform: translateX(3px); }
  .works .desc { display: block; margin-top: .35rem; color: #78716c; font-size: .875rem; line-height: 1.6; }

  .foot { margin: 1.5rem 0 0; color: #a8a29e; font-size: .8rem; }

  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #fafaf9; }
    .card, .works, .works li { border-color: #44403c; }
    .works .desc { color: #a8a29e; }
    .works .nm::after { color: #78716c; }
    .foot { color: #57534e; }
  }
  @media (prefers-reduced-motion: reduce) {
    .works .nm::after { transition: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>YunWen</h1>

    <ul class="works">
      <!-- 加新作品：照抄一个 li，改 nm / desc / href 就行 -->
      <li>
        <a href="./campus/">
          <span class="nm">在校园里乱逛</span>
          <span class="desc">校园探索 —— 照宜春中学的布局搭的：进大门是中心广场，路自己组成一个"田"字，正中间立着韩愈像；中轴一路往北通到压在最里头的科技楼，背后是一片后山。三栋教学楼加实验楼都是"两翼 + 竖天井"，教室走廊都能走进去，一楼天井的楼梯口能上二楼。按住 Shift 快跑，走到东西跟前按 Z 或空格——黑板、讲台上的点名册、走廊的广播喇叭、墙根那六块苔，都得自己过去动手。Tab 翻本子，路上捡到的线索、见过的人都在里头。进度自动存，关了页再回来能接着走。</span>
        </a>
      </li>
    </ul>

    <p class="foot">最近更新 2026.10.09</p>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YunWen</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #fafaf9; color: #1c1917;
  }
  .card {
    padding: 3rem 3.5rem;
    border: 1px solid #e7e5e4;
    border-radius: 16px;
    text-align: center;
  }
  h1 { margin: 0 0 .75rem; font-size: 2rem; letter-spacing: .04em; font-weight: 600; }
  p  { margin: 0; color: #78716c; font-size: .95rem; line-height: 1.7; }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #fafaf9; }
    .card { border-color: #44403c; }
    p { color: #a8a29e; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>YunWen</h1>
    <p>我改了这一行 —— 2026.10.07</p>
  </main>
</body>
</html>

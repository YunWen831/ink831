<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ds词塔 —— 用拼写打怪的背单词肉鸽。给中文，拼英文。">
<title>ds词塔</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
:root{
  color-scheme: dark;
  --bg:#0e1210; --panel:#161d18; --panel2:#1c2620; --line:#28332b;
  --text:#e6ebe5; --muted:#8b978d; --accent:#8ec99b; --accent-dim:#4e7b5b;
  --warn:#e0b072; --bad:#d9776f; --good:#8ec99b;
  --font:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Consolas","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
  display:flex; flex-direction:column; align-items:center;
  padding:34px 18px 18px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--accent)}

.wrap{width:min(100%,620px);margin:0 auto;flex:0 0 auto}
.screen{display:none}
.screen.on{display:block}

/* ---------- 通用 ---------- */
.bar{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.bar.bad>i{background:var(--bad)}
.bar.warn>i{background:var(--warn)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
h1{font-size:34px;letter-spacing:-.03em;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
.btn{
  display:block;width:100%;padding:13px 16px;margin:9px 0;
  background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:9px;text-align:left;
  transition:border-color .15s,transform .15s,background .15s;
}
.btn:hover{border-color:var(--accent-dim);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn .t{display:block;font-weight:600}
.btn .d{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.btn.center{text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin:12px 0}

/* ---------- 标题页 ---------- */
#title{padding-top:5vh}
#title h1{margin-bottom:6px}
#title .sub{color:var(--muted);margin-bottom:26px}
#title .sub b{color:var(--accent);font-weight:600}

/* ---------- 塔 ---------- */
.floor-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.hp{font-family:var(--mono);font-size:13px}

/* ---------- 战斗 ---------- */
#foe{margin-bottom:12px}
#foe .row{margin-bottom:8px}
#foe .name{font-weight:650;font-size:16px}
#foe .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin-left:7px}
#foe .tag:empty{display:none}
.prompt{
  font-family:var(--mono);font-size:26px;line-height:1.45;text-align:center;
  margin:22px 0 6px;letter-spacing:.01em;word-break:break-word;
}
.prompt .pos{font-size:13px;color:var(--muted);font-family:var(--font);display:block;margin-bottom:8px}
.prompt .senses{color:var(--warn)}
.ph{
  text-align:center;font-family:var(--mono);font-size:15px;letter-spacing:.02em;
  color:var(--accent);opacity:.85;margin-bottom:4px;
}
.hint{
  text-align:center;font-family:var(--mono);font-size:19px;letter-spacing:.34em;
  color:var(--muted);margin-bottom:18px;
}
#answer{
  width:100%;padding:14px 16px;font-family:var(--mono);font-size:23px;letter-spacing:.03em;
  background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;
  outline:none;text-align:center;
}
#answer:focus{border-color:var(--accent-dim)}
#answer.ok{border-color:var(--good);color:var(--good)}
#answer.no{border-color:var(--bad);color:var(--bad)}
.flash{text-align:center;height:22px;margin-top:12px;font-weight:600}
.flash.ok{color:var(--good)} .flash.no{color:var(--bad)} .flash.near{color:var(--warn)}
.mini{
  background:none;border:1px solid var(--line);color:var(--accent);border-radius:14px;
  font-size:12px;padding:1px 9px;margin-left:8px;vertical-align:2px;
}
.mini:hover{border-color:var(--accent-dim)}
.compare{display:none;margin-top:10px;font-size:13px;line-height:1.7;color:var(--muted);
  border-left:2px solid var(--warn);padding-left:11px}
.compare.on{display:block}
.rootbox{margin-top:10px}
.rootbox .ftitle{font-size:13px;color:var(--accent);margin-bottom:4px}
.rootbox .btn{padding:9px 13px;margin:6px 0;font-size:14px}
.rootbox .btn .t{font-weight:500}
.timer{margin-top:16px}
.meline{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px}
.synnote{font-size:12.5px;line-height:1.75;color:var(--warn);text-align:center;
  margin:-10px auto 14px;max-width:520px}
.synnote:empty{display:none}
.egline{font-family:var(--mono);font-size:14.5px;line-height:1.8;color:var(--text);
  text-align:center;margin:-10px auto 14px;max-width:560px}
.egline:empty{display:none}
#panelBody{margin:14px 0}
#panelBody .pl{font-family:var(--mono);font-size:13px;padding:3px 0}
.btnrow{display:flex;gap:10px;align-items:stretch}
.btnrow .btn{width:auto;flex:1}
.btnrow #submitBtn{flex:1.4}
.btnrow .giveup{background:transparent;border-style:dashed}
.btnrow .giveup:hover{border-color:var(--warn)}
.btnrow .giveup .t{color:var(--warn)}

/* ---------- 结算 ---------- */
.big{font-size:22px;font-weight:650;text-align:center;margin:8px 0 4px}
.wordlist{margin:10px 0 0;padding:0;list-style:none;font-family:var(--mono);font-size:13.5px}
.wordlist li{padding:4px 0;border-bottom:1px solid var(--line)}
.wordlist li:last-child{border-bottom:0}
.wordlist .cn{color:var(--muted);margin-left:8px}
textarea{width:100%;height:110px;background:var(--panel);color:var(--muted);border:1px solid var(--line);
  border-radius:8px;padding:10px;font-family:var(--mono);font-size:11.5px;resize:vertical}
footer{width:min(100%,620px);color:var(--muted);font-size:11px;text-align:center;padding:18px 0 6px;flex:0 0 auto}
#probe{display:none}
</style>
</head>
<body>

<div class="wrap">

  <!-- ========== 标题 ========== -->
  <section class="screen on" id="title">
    <h1>ds词塔</h1>
    <p class="sub">给中文，拼英文。<b>你越不熟的词，攻击力越高。</b></p>
    <div id="titleBtns"></div>
    <p class="small muted" id="progressLine"></p>
  </section>

  <!-- ========== 塔（选房间） ========== -->
  <section class="screen" id="tower">
    <div class="floor-head">
      <h2 id="floorName">第 1 层</h2>
      <div class="hp" id="hpLine"></div>
    </div>
    <div class="bar" id="hpBar"><i></i></div>
    <p class="small muted" id="relicLine"></p>
    <p class="small" id="setLine" style="color:var(--accent)"></p>
    <div id="choices"></div>
  </section>

  <!-- ========== 战斗 ========== -->
  <section class="screen" id="battle">
    <div id="foe">
      <div class="row">
        <div><span class="name" id="foeName"></span><span class="tag" id="foeTag"></span></div>
        <div class="hp small" id="foeHp"></div>
      </div>
      <div class="bar bad" id="foeBar"><i></i></div>
    </div>

    <div class="prompt" id="prompt"></div>
    <div class="ph"><span id="ph"></span>
      <button class="mini" id="sayBtn" title="听发音">🔊 听</button>
      <button class="mini" id="rootBtn" hidden title="先答对词根的含义，这题伤害翻倍">拆词根</button></div>
    <div class="hint" id="hint"></div>
    <div class="synnote" id="synNote"></div>
    <div class="egline" id="egLine"></div>
    <input id="answer" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="拼写英文单词">
    <div class="flash" id="flash"></div>
    <div class="compare" id="compare"></div>
    <div class="rootbox" id="rootBox"></div>
    <div class="meline" id="meLine"></div>
    <div class="timer"><div class="bar" id="timeBar"><i></i></div></div>
    <div class="btnrow">
      <button class="btn center" id="submitBtn"><span class="t">提交（回车）</span></button>
      <button class="btn center giveup" id="giveUpBtn"><span class="t">不认识</span><span class="d">直接看答案 · 不吃伤害</span></button>
    </div>
  </section>

  <!-- ========== 一局结束 ========== -->
  <section class="screen" id="over">
    <div class="big" id="overTitle"></div>
    <p class="muted small" id="overSub" style="text-align:center"></p>
    <div class="card" id="overStats"></div>
    <div id="overBtns"></div>
  </section>

  <!-- ========== 通用面板：战斗结算 / 层结算 / 商店 / 三选一 ========== -->
  <section class="screen" id="panel">
    <h2 id="panelTitle"></h2>
    <p class="small muted" id="panelSub"></p>
    <div class="card" id="panelBody"></div>
    <div id="panelActions"></div>
  </section>

  <!-- ========== 存档 ========== -->
  <section class="screen" id="save">
    <h2>存档</h2>
    <p class="small muted">你的记忆进度存在这台浏览器里。换设备或清了缓存就没了——把下面的文本复制走，就永远丢不了。</p>
    <textarea id="saveBox" spellcheck="false"></textarea>
    <div id="saveBtns"></div>
  </section>

</div>

<footer>词库 <a href="https://github.com/skywind3000/ECDICT" target="_blank" rel="noopener noreferrer">ECDICT</a>（MIT）· 5,788 词 · ds词塔
  <button class="mini" id="sndBtn" title="音效开关（快捷键 M）">🔊</button></footer>
<pre id="probe"></pre>

<script src="./words.js"></script>
<script>
'use strict';
/* =============================================================
   ds词塔 —— 背单词肉鸽
   核心：给中文拼英文。一个词的攻击力 = 你的生疏度（越不熟越强）。
   答对了它就"降级"，你的王牌一张张变成废牌 —— 那就是你进步的样子。
   ============================================================= */
(function () {

  var D = window.DS_WORDS;
  var boot = document.getElementById('probe');
  if (!D || !D.words) { boot.textContent = 'FATAL: words.js 没加载上'; document.body.innerHTML =
    '<p style="padding:40px;text-align:center">词库没加载上，刷新试试。</p>'; return; }

  var WORDS = D.words, ROOTS = D.meta.roots || {};
  var BY = {}; for (var i = 0; i < WORDS.length; i++) BY[WORDS[i].w] = WORDS[i];

  /* ---------- 难度分层 ---------- */
  // 血量按【层】涨，不按【词力】涨。两者都涨会互相抵消，还会让商店的「磨词」变成陷阱。
  // 数值配的是"每场约 2.6 个词"，这样一局约 45 个词 ≈ 15 分钟。
  // 怪血涨得比词力【快】——这样越往上，一场战斗反而越长、碰到的词越多。
  // 反过来（伤害涨得比血快）会让后期一场只打一个词，等于越玩学得越少。
  var TIERS = [
    { name: '入门',   hp: 70,  time: 28, hit: 10 },
    { name: '四级',   hp: 100, time: 26, hit: 13 },
    { name: '六级',   hp: 135, time: 24, hit: 16 },
    { name: '深水区', hp: 175, time: 22, hit: 19 }
  ];
  // 词池按【词频排序切块】，不拍脑袋定阈值。
  // 第 1 层只放四级最高频的 800 个词 —— 第一次见这些词的人，得先打得赢才愿意玩下去。
  var TIER_WORDS = (function () {
    function byFreq(a, b) { return (a.f || 1e9) - (b.f || 1e9); }
    var c4 = WORDS.filter(function (w) { return w.lv === 4; }).sort(byFreq);
    var c6 = WORDS.filter(function (w) { return w.lv === 6; }).sort(byFreq);
    return [c4.slice(0, 800), c4.slice(800), c6.slice(0, 950), c6.slice(950)];
  })();

  var FLOORS = 4, STEPS = 5;          // 4 层 × 每层 5 个房间 + 塔主
  // ECDICT exchange 字段的代号 → 中文
  var FORM_NAMES = { d: '过去分词', p: '过去式', i: '现在分词', '3': '第三人称单数',
                     s: '复数', r: '比较级', t: '最高级' };

  // 近义词辨析组（来自 ECDICT 的 resemble.txt：1,071 组，组内至少 2 个四六级词）
  var SYN = (D.meta && D.meta.syn) || [];
  var SYN_BY_WORD = {};
  SYN.forEach(function (g) {
    Object.keys(g.e || {}).forEach(function (k) {
      (SYN_BY_WORD[k] = SYN_BY_WORD[k] || []).push(g);
    });
  });

  // 每层塔主有自己的规矩，不是"血厚一点的怪"
  var BOSSES = [
    { name: '高频之主', tag: '这一层的守关者' },
    { name: '四级之主', tag: '限时更短' },
    { name: '六级之主', tag: '它打你，双倍疼' },
    { name: '僻义之主', tag: '整场只考熟词僻义' }
  ];
  var PLAYER_HP = 100;
  var PEEK_COST = 4;                  // 看答案的代价。不设代价的话，「不认识」就是无敌按钮

  // 遗物。tag 只影响显示（让玩家看得出流派），不影响逻辑。
  var RELICS = [
    { id: 'hour',     tag: '通用', name: '时间沙漏', d: '每场限时 +6 秒' },
    { id: 'shield',   tag: '通用', name: '误答护盾', d: '每场战斗第一次答错不掉血' },
    { id: 'iron',     tag: '通用', name: '铁皮',     d: '最大 HP +25（立刻生效）' },
    { id: 'inkbag',   tag: '通用', name: '墨水袋',   d: '立刻 +30 墨' },
    { id: 'force',    tag: '通用', name: '强记',     d: '拼对伤害 +4' },

    { id: 'root',     tag: '勇者', name: '词根之眼', d: '含词根的词，伤害 ×1.5' },
    { id: 'fresh',    tag: '勇者', name: '新手运',   d: '熟练度 0 的词，伤害 ×1.5' },
    { id: 'smell',    tag: '勇者', name: '形近嗅觉', d: '开战就告诉你这题有没有双胞胎' },
    { id: 'combo',    tag: '勇者', name: '连击',     d: '连续拼对，每次伤害 +15%（最多 +60%）' },
    { id: 'keen',     tag: '勇者', name: '锐利',     d: '10 秒内拼对，额外 ×1.5' },
    { id: 'oneshot',  tag: '学者', name: '过目不忘', d: '拼对一个词时，它的熟练度额外 +1（记更牢）' },

    { id: 'cheat',    tag: '学者', name: '小抄',     d: '本局多 5 次免费看答案' },
    { id: 'patience', tag: '学者', name: '耐心',     d: '看答案只扣 2 血' },
    { id: 'review',   tag: '学者', name: '温故',     d: '熟练度 ≥3 的词按全额伤害算' },
    { id: 'notebook', tag: '学者', name: '笔记',     d: '看答案的词，这一局再遇到时伤害 ×2' },

    { id: 'gamble',   tag: '赌徒', name: '赌徒之刃', d: '看答案扣双倍血，但拼对伤害 ×1.6' },
    { id: 'curse',    tag: '赌徒', name: '遗忘诅咒', d: '拼对伤害 ×1.5，但每拼对一个词就随机让另一个词退一级' },
    { id: 'lastword', tag: '赌徒', name: '遗言',     d: 'HP 低于 25 时，拼对伤害 ×2' },

    // 异端流：走偏门的三种活法，单看都亏
    { id: 'shape',    tag: '异端', name: '形近癖', d: '打形近怪伤害 +50%，但打普通词 -20%' },
    { id: 'haunt',    tag: '异端', name: '养鬼',   d: '每有一只幽灵在场，伤害 +10%（最多 +50%）' },
    { id: 'memo',     tag: '异端', name: '烂笔头', d: '每次抄写之后，下一场战斗伤害 ×2' },
    { id: 'seeshape', tag: '异端', name: '辨形',   d: '形近怪限时 +6 秒' },
    { id: 'requiem',  tag: '异端', name: '安魂',   d: '答对幽灵的时候，回 8 血' },

    // 补几件，让每个流派都够凑三件
    { id: 'compass',  tag: '通用', name: '罗盘',   d: '每进新的一层，回 12 血' },
    { id: 'flow',     tag: '勇者', name: '默写如流', d: '连续答对 3 次后，下一个词伤害 ×2' },
    { id: 'swift',    tag: '学者', name: '速记',   d: '看答案的时候，这个词熟练度 +1（边看边记）' },
    { id: 'allin',    tag: '赌徒', name: '梭哈',   d: '看答案扣双倍血，但看答案后当场伤害 ×2' }
  ];

  // 套装：同一个流派凑够 3 件就激活。这才是"构筑成型"的那一刻。
  var SETS = {
    '通用': { name: '底盘', d: '最大 HP +25（立刻回满这部分）' },
    '勇者': { name: '剑意', d: '拼对伤害 +30%' },
    '学者': { name: '博览', d: '每场战斗第一次看答案免费' },
    '赌徒': { name: '孤注', d: 'HP 低于 40% 时，伤害 ×1.6' },
    '异端': { name: '旁门', d: '每答对一个词 +1 墨，且伤害 +10%' }
  };
  var SET_NEED = 3;

  // 商店货架
  var SHOP_ITEMS = [
    { id: 'heal',  name: '绷带',      cost: 25, d: '回 30 血' },
    { id: 'cheat', name: '小抄 ×3',   cost: 30, d: '本局多 3 次免费看答案' },
    { id: 'power', name: '磨词',      cost: 40, d: '词力 +0.3（本局拼对伤害 +30%）' },
    { id: 'maxhp', name: '护心镜',    cost: 35, d: '最大 HP +15，并回满这部分' }
  ];

  /* ---------- 存档 ---------- */
  var KEY = 'ds-citat:save';
  var Prog = { prof: {}, seen: {}, stats: { answered: 0, correct: 0, runs: 0 } };
  var R = null;   // 局内状态

  function load() {
    try {
      var raw = localStorage.getItem(KEY); if (!raw) return;
      var o = JSON.parse(raw);
      if (o && o.prog) { Prog = o.prog; }
      // 旧版本存的一局缺新字段（墨 / 词力 / 统计），直接丢掉——
      // 让一局存档把整个游戏带崩不值得。记忆进度（Prog）照常保留。
      if (o && o.run && o.run.stats && typeof o.run.power === 'number') R = o.run;
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, prog: Prog, run: R })); } catch (e) {}
  }
  // 收单词对象或字符串都行——之前只收字符串，settle() 传了对象，熟练度一直涨不上去
  function profOf(w) { return Prog.prof[typeof w === 'string' ? w : w.w] || 0; }
  // 只数「真的拿下过」的词。答错会把熟练度写成 0，那不该算进"已收录"。
  function knownCount() { var n = 0; for (var k in Prog.prof) if (Prog.prof[k] >= 1) n++; return n; }

  /* ---------- 伤害 ---------- */
  function has(id) { return !!R && R.relics.indexOf(id) >= 0; }

  function relicById(id) {
    for (var i = 0; i < RELICS.length; i++) if (RELICS[i].id === id) return RELICS[i];
    return null;
  }
  function setCount(tag) {
    if (!R) return 0;
    var n = 0;
    for (var i = 0; i < R.relics.length; i++) {
      var r = relicById(R.relics[i]);
      if (r && r.tag === tag) n++;
    }
    return n;
  }
  function hasSet(tag) { return setCount(tag) >= SET_NEED; }

  function damageOf(w) {
    var real = profOf(w.w);
    var p = (has('review') && real >= 3) ? 0 : real;   // 温故：老词也按全额算
    var d = 8 * (1 + (5 - p) * 0.45);                  // 生疏度：prof0 → 26, prof4 → 12

    // 词力：本局成长。没有它，这套机制就是【负成长】——你越学会，打得越慢。
    d *= (R ? R.power : 1);

    if (has('force')) d += 4;
    if (has('root') && w.rt && w.rt.length) d *= 1.5;
    if (has('fresh') && real === 0) d *= 1.5;
    if (has('gamble')) d *= 1.6;
    if (has('curse')) d *= 1.5;
    if (has('lastword') && R && R.hp < 25) d *= 2;
    if (has('combo')) d *= (1 + Math.min(4, R.combo) * 0.15);
    if (has('notebook') && R && R.noted && R.noted[w.w]) d *= 2;
    // 流派联动
    if (has('shape')) d *= (B && B.kind === 'confuse') ? 1.5 : 0.8;
    if (has('haunt')) d *= (1 + Math.min(5, R.ghosts.length) * 0.1);
    if (B && B.memo) d *= 2;
    if (B && B.rootBonus) d *= B.rootBonus;
    // 套装
    if (hasSet('勇者')) d *= 1.3;
    if (hasSet('异端')) d *= 1.1;
    if (hasSet('赌徒') && R && R.hp < R.maxHp * 0.4) d *= 1.6;
    // 遗物
    if (has('flow') && R && R.combo >= 3) d *= 2;
    if (B && B.allin) d *= 2;
    return Math.round(d);
  }

  // 看答案的代价。小抄可以抵掉。
  function peekCost() {
    var c = PEEK_COST;
    if (has('patience')) c = 2;
    if (has('gamble') || has('allin')) c *= 2;
    return c;
  }
  function cheatsLeft() { return Math.max(0, (R ? R.cheatTotal - R.cheatUsed : 0)); }

  /* ---------- 编辑距离（判定"差一个字母"） ---------- */
  function dist(a, b) {
    var m = a.length, n = b.length, prev = [], cur = [], i, j;
    if (Math.abs(m - n) > 2) return 9;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++)
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur.slice();
    }
    return prev[n];
  }

  /* ---------- 选词 ---------- */
  var runUsed = {};   // 本局已用过的词，避免同一局反复出现（集中练习记不牢）
  function pickCandidate(tier, kind) {
    var pool = TIER_WORDS[tier] || WORDS;
    if (!pool.length) pool = WORDS;
    var tries = 0, w;
    do {
      w = pool[(Math.random() * pool.length) | 0];
      tries++;
      if (kind === 'confuse' && !(w.cf && w.cf.length)) w = null;
      if (kind === 'rare' && !(w.x && w.x.length)) w = null;
      if (kind === 'form' && !w.fm) w = null;
      if (kind === 'syn' && !SYN_BY_WORD[w.w]) w = null;
      if (kind === 'cloze' && !w.eg) w = null;
    } while ((!w || runUsed[w.w]) && tries < 200);
    if (!w) { w = pool[(Math.random() * pool.length) | 0]; }
    // 复习优先：见过但没掌握的词，命中概率翻倍
    if (kind === 'normal' && Prog.seen[w.w] && profOf(w.w) < 3 && Math.random() < 0.5) return w;
    return w;
  }

  /* ---------- 界面工具 ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function show(id) {
    var all = document.querySelectorAll('.screen');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('on', all[i].id === id);
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function btn(title, desc, fn, disabled) {
    var b = el('button', 'btn');
    b.appendChild(el('span', 't', title));
    if (desc) b.appendChild(el('span', 'd', desc));
    b.disabled = !!disabled;
    if (!disabled) b.addEventListener('click', fn);
    return b;
  }
  function senses(w, useRare) {
    var s = (useRare && w.x && w.x.length) ? w.x : w.s;
    return s.slice(0, useRare ? 2 : 3).join('；');
  }

  /* ---------- 发音：用浏览器自带的语音合成，零文件、零版权 ---------- */
  var VOICE = null;
  function pickVoice() {
    if (!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices() || [];
    for (var i = 0; i < vs.length; i++) {
      if (/^en([-_]|$)/i.test(vs[i].lang)) { VOICE = vs[i]; return; }
    }
  }
  if (window.speechSynthesis) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;   // 语音列表是异步加载的
  }
  function say(text) {
    if (!window.speechSynthesis || !text) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.85;
      if (VOICE) u.voice = VOICE;
      speechSynthesis.speak(u);
    } catch (e) { /* 无头/无语音环境，静默跳过 */ }
  }

  /* ---------- 音效：WebAudio 现场合成，零文件、零版权 ---------- */
  var AC = null;
  var SND = true;
  try { SND = localStorage.getItem('ds-citat:snd') !== '0'; } catch (e) {}
  function ac() {
    if (!SND) return null;
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { SND = false; return null; } }
    if (AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function tone(freq, dur, type, vol) {
    var c = ac(); if (!c) return;
    try {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(vol || 0.10, c.currentTime + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur + 0.03);
    } catch (e) {}
  }
  function seq(list, gap) {
    list.forEach(function (n, i) {
      setTimeout(function () { tone(n[0], n[1], n[2], n[3]); }, i * (gap || 85));
    });
  }
  function sfxOk()   { seq([[660, .08, 'triangle', .09], [990, .13, 'triangle', .08]], 75); }
  function sfxNear() { tone(520, .12, 'triangle', .08); }
  function sfxBad()  { seq([[200, .10, 'sawtooth', .06], [150, .18, 'sawtooth', .05]], 65); }
  function sfxPeek() { seq([[440, .07, 'sine', .07], [330, .11, 'sine', .06]], 75); }
  function sfxWin()  { seq([[523, .09], [659, .09], [784, .18]], 90); }
  function sfxLose() { seq([[330, .13], [262, .13], [196, .26]], 115); }
  function sfxPick() { seq([[784, .06], [1046, .11]], 65); }
  function toggleSnd() {
    SND = !SND;
    try { localStorage.setItem('ds-citat:snd', SND ? '1' : '0'); } catch (e) {}
    if (SND) sfxPick();
    var b = document.getElementById('sndBtn');
    if (b) b.textContent = SND ? '🔊' : '🔇';
  }

  // 陷阱教学：答错时，把「你以为的那个词」和「正确答案」并排摊开。
  // 形近怪唯一真正有教学价值的时刻就是这里——不摊开，玩家不知道自己踩了哪个坑。
  function showCompare(w, typed, twin) {
    var box = $('compare');
    box.textContent = '';
    box.classList.remove('on');
    if (twin) {
      var tw = BY[typed];
      box.appendChild(el('div', '', '你拼的 ' + typed + '：' + (tw ? senses(tw, false) : '')));
      box.appendChild(el('div', '', '题目要的 ' + w.w + '：' + senses(w, false)));
    } else if (B.kind === 'rare' && w.x && w.x.length) {
      box.appendChild(el('div', '', w.w + ' 的常见义是「' + w.s.slice(0, 2).join('；') +
        '」，这题考的是「' + w.x.slice(0, 2).join('；') + '」'));
    }
    if (box.textContent) box.classList.add('on');
  }

  // 「拆词根」：含词根的词，可以主动拆一次。答对词根含义 → 这题伤害 ×2。
  // 让词根从"被动数值"变成"主动学习工具"，也给玩家一个战术选择。
  function showRootQuiz() {
    var w = B.w;
    if (!w.rt || !w.rt.length || B.rootBonus) return;
    var rid = w.rt[0], r = ROOTS[rid];
    if (!r || !r.m) return;

    var ids = Object.keys(ROOTS).filter(function (k) { return ROOTS[k] && ROOTS[k].m; });
    var picks = [r], guard = 0;
    while (picks.length < 3 && ids.length && guard++ < 80) {
      var cand = ROOTS[ids[(Math.random() * ids.length) | 0]];
      if (cand && cand.m && picks.indexOf(cand) < 0) picks.push(cand);
    }
    for (var i = picks.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = picks[i]; picks[i] = picks[j]; picks[j] = t;
    }

    var box = $('rootBox');
    box.innerHTML = '';
    box.appendChild(el('div', 'ftitle', '拆解　' + rid + '　这个词根是什么意思？'));
    picks.forEach(function (opt) {
      box.appendChild(btn(opt.m, '', function () {
        box.innerHTML = '';
        $('rootBtn').hidden = true;
        if (opt === r) {
          B.rootBonus = 2;
          $('flash').textContent = '拆对了！' + rid + ' = ' + r.m + '　这题伤害 ×2';
          $('flash').className = 'flash ok';
          sfxOk();
        } else {
          $('flash').textContent = '拆错了。' + rid + ' 其实是「' + r.m + '」';
          $('flash').className = 'flash near';
          sfxBad();
        }
        $('answer').focus();
      }));
    });
  }

  /* ---------- 通用面板：战斗结算 / 层结算 / 商店 / 三选一 都用它 ---------- */
  function panel(title, sub, lines, actions) {
    $('panelTitle').textContent = title;
    $('panelSub').textContent = sub || '';
    var box = $('panelBody'); box.innerHTML = '';
    (lines || []).forEach(function (t) { box.appendChild(el('div', 'pl', t)); });
    var acts = $('panelActions'); acts.innerHTML = '';
    (actions || []).forEach(function (a) { acts.appendChild(btn(a.t, a.d, a.fn)); });
    show('panel');
    if (SYNC && actions && actions.length) actions[0].fn();   // 探针：自动选第一项
  }

  function advanceStep() { R.step++; if (R.step > STEPS) { R.step = 0; R.floor++; } }

  function relicChoices(n) {
    var left = RELICS.filter(function (r) { return R.relics.indexOf(r.id) < 0; });
    for (var i = left.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = left[i]; left[i] = left[j]; left[j] = t;
    }
    return left.slice(0, n);
  }

  // 返回"刚刚凑齐的那个套装"（没有则 null），调用方负责弹出提示
  function takeRelic(r) {
    sfxPick();
    R.relics.push(r.id);
    if (r.id === 'iron') { R.maxHp += 25; R.hp += 25; }      // 立刻生效类
    if (r.id === 'inkbag') R.ink += 30;
    if (r.id === 'cheat') R.cheatTotal += 5;
    var fired = null;
    for (var tag in SETS) if (setCount(tag) === SET_NEED) fired = tag;
    if (fired) applySet(fired);
    return fired;
  }

  function applySet(tag) {
    if (tag === '通用') { R.maxHp += 25; R.hp += 25; }       // 其余套装是持续的，在 damageOf / giveUp 里判
  }

  function announceSet(tag) {
    var s = SETS[tag];
    sfxWin();
    panel('套装成型 · ' + s.name, '「' + tag + '」凑齐了 ' + SET_NEED + ' 件',
      [s.d, '本局持续有效'],
      [{ t: '好', d: '继续往上', fn: function () { save(); offerRooms(); } }]);
  }

  // 塔界面上的流派进度，让你看得见自己离成型还有多远
  function setProgressLine() {
    var seen = {};
    var out = [];
    for (var i = 0; i < R.relics.length; i++) {
      var r = relicById(R.relics[i]);
      if (r) seen[r.tag] = (seen[r.tag] || 0) + 1;
    }
    for (var tag in SETS) {
      var n = setCount(tag);
      if (!n) continue;
      out.push(tag + ' ' + n + '/' + SET_NEED + (n >= SET_NEED ? ' ✔' : ''));
    }
    return out.join('　·　');
  }

  function healBack(n) { R.hp = Math.min(R.maxHp, R.hp + n); }

  function showRelicPick(title, sub) {
    var choices = relicChoices(3);
    var acts = choices.map(function (r) {
      return {
        t: r.tag + ' · ' + r.name, d: r.d,
        fn: function () {
          var fired = takeRelic(r);
          save();
          if (fired) return announceSet(fired);
          offerRooms();
        }
      };
    });
    var spare = RELICS.length - R.relics.length;
    acts.push(choices.length
      ? { t: '全不要', d: '回 20 血', fn: function () { healBack(20); save(); offerRooms(); } }
      : { t: '遗物已拿满', d: '回 25 血', fn: function () { healBack(25); save(); offerRooms(); } });
    panel(title, (sub || '') + '　（遗物只在这一局有效，不带出去）', [], acts);
  }

  function applyShop(id) {
    if (id === 'heal') healBack(30);
    if (id === 'cheat') R.cheatTotal += 3;
    if (id === 'power') R.power += 0.3;
    if (id === 'maxhp') { R.maxHp += 15; R.hp += 15; }
  }

  var RELIC_PRICE = 50;

  // 货架一次定好，别再洗 —— 否则每买一件就换一批，凑不出套装
  function pickShelf() {
    var owned = {};
    R.relics.forEach(function (id) { owned[id] = 1; });
    var pool = RELICS.filter(function (r) { return !owned[r.id]; });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    return pool.slice(0, 3);
  }

  function showShop() {
    if (!R.shelf || !R.shelf.length) R.shelf = pickShelf();
    var acts = [];

    // 遗物货架 —— 有了它才能"定向凑套装"，不然构筑全靠运气
    R.shelf.forEach(function (r) {
      var poor = R.ink < RELIC_PRICE;
      acts.push({
        t: r.tag + ' · ' + r.name + '　' + RELIC_PRICE + ' 墨',
        d: r.d + (poor ? '　— 墨不够' : ''),
        fn: function () {
          if (poor) return;
          R.ink -= RELIC_PRICE;
          R.shelf = R.shelf.filter(function (x) { return x !== r; });
          var fired = takeRelic(r);
          save();
          if (fired) return announceSet(fired);
          showShop();
        }
      });
    });

    SHOP_ITEMS.forEach(function (it) {
      var poor = R.ink < it.cost;
      acts.push({
        t: it.name + '　' + it.cost + ' 墨',
        d: it.d + (poor ? '　— 墨不够' : ''),
        fn: function () {
          if (poor) return;
          R.ink -= it.cost; applyShop(it.id); save(); showShop();
        }
      });
    });

    acts.push({ t: '走了', d: R.ink ? '还剩 ' + R.ink + ' 墨' : '一分没花',
                fn: function () { R.shelf = null; save(); offerRooms(); } });

    var prog = setProgressLine();
    panel('商店', '你有 ' + R.ink + ' 墨',
      ['HP ' + R.hp + ' / ' + R.maxHp + '　·　词力 ' + R.power.toFixed(2) + '×　·　小抄 ' + cheatsLeft() + ' 张',
       prog ? ('流派：' + prog) : '买遗物能凑流派——凑满 3 件触发套装'], acts);
  }

  /* ---------- 篝火：三选一，都是立刻生效 ---------- */
  function reviewSome(n) {
    var pool = [];
    for (var k in runUsed) if (profOf(k) < 4) pool.push(k);
    for (var i = pool.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    pool.slice(0, n).forEach(function (w) { Prog.prof[w] = profOf(w) + 1; });
    return pool.slice(0, n);
  }

  function showCampfire() {
    panel('篝火', '歇一会儿，只做一件事',
      ['HP ' + R.hp + ' / ' + R.maxHp + '　·　词力 ' + R.power.toFixed(2) + '×'], [
        { t: '烤火', d: '回 35 血', fn: function () { healBack(35); save(); offerRooms(); } },
        { t: '默背', d: '词力 +0.25（本局拼对伤害 +25%）', fn: function () { R.power += 0.25; save(); offerRooms(); } },
        { t: '复习这一局碰过的词', d: '随机 4 个没掌握的，熟练度 +1', fn: function () { reviewSome(4); save(); offerRooms(); } }
      ]);
  }

  /* ---------- 事件：随机抽一个，每个选项都有取舍（可以扣死你） ---------- */
  var EVENTS = [
    { t: '旧词典', s: '地上躺着一本没人要的词典。',
      opts: [
        { t: '翻两页', d: '词力 +0.3，但熬得头疼（-8 血）', fn: function () { R.power += 0.3; R.hp -= 8; } },
        { t: '卖给收废品的', d: '+30 墨', fn: function () { R.ink += 30; } }
      ] },
    { t: '深夜自习室', s: '灯还亮着，里面一个人也没有。',
      opts: [
        { t: '再背一会儿', d: '随机 5 个词熟练度 +1，但 -12 血', fn: function () { reviewSome(5); R.hp -= 12; } },
        { t: '回去睡', d: '回 20 血', fn: function () { healBack(20); } }
      ] },
    { t: '同桌的笔记', s: '同桌把笔记推了过来。',
      opts: [
        { t: '抄一遍', d: '+3 张小抄', fn: function () { R.cheatTotal += 3; } },
        { t: '只看一眼', d: '词力 +0.2', fn: function () { R.power += 0.2; } }
      ] },
    { t: '遗忘的走廊', s: '走廊尽头有回音，像有人在念你拼错的那些词。',
      opts: [
        { t: '走进去', d: '清掉全部幽灵，但每只 -5 血', fn: function () { R.hp -= R.ghosts.length * 5; R.ghosts = []; } },
        { t: '绕开', d: '什么也不发生', fn: function () {} }
      ] },
    { t: '操场', s: '操场空着，天还没黑。',
      opts: [
        { t: '跑两圈', d: '最大 HP +15，并回满这部分', fn: function () { R.maxHp += 15; R.hp += 15; } },
        { t: '坐着发呆', d: '+20 墨', fn: function () { R.ink += 20; } }
      ] }
  ];

  function showEvent() {
    var e = EVENTS[(Math.random() * EVENTS.length) | 0];
    var acts = e.opts.map(function (o) {
      return { t: o.t, d: o.d, fn: function () {
        o.fn();
        if (R.hp <= 0) return endRun(false);   // 事件也能把人扣死
        save(); offerRooms();
      } };
    });
    panel(e.t, e.s, [], acts);
  }

  /* =========================================================
     塔
     ========================================================= */
  function newRun() {
    R = {
      floor: 0, step: 0, hp: PLAYER_HP, maxHp: PLAYER_HP,
      relics: [], ghosts: [], missed: [], offer: null,
      ink: 0,                 // 墨：战斗掉落，商店消费
      power: 1,               // 词力：本局成长轴，补偿"越学会越弱"
      combo: 0,               // 连击
      cheatTotal: 0, cheatUsed: 0,   // 免费看答案的次数
      noted: {},              // 「笔记」看过的词
      shelf: null,            // 商店当前的遗物货架
      stats: { fought: 0, answered: 0, correct: 0, peeked: 0 }
    };
    runUsed = {};
    Prog.stats.runs++;
    offerRooms();
    save();
  }

  function relicLine() {
    if (!R.relics.length) return '还没拿到遗物';
    return R.relics.map(function (id) {
      for (var i = 0; i < RELICS.length; i++) if (RELICS[i].id === id) return RELICS[i].name;
      return id;
    }).join(' · ');
  }

  function offerRooms() {
    var tier = Math.min(R.floor, TIERS.length - 1);
    if (R.step >= STEPS) {
      R.offer = [{ kind: 'boss', tier: tier }];
      renderTower(); show('tower');
      return;
    }
    // 每步【保证 2 个战斗选项 + 1 个功能选项】。
    // 之前是把所有房间混在一个袋子里洗牌取 3 个，结果功能房间（事件/宝箱/篝火/商店）
    // 概率一叠加，一步常常全是非战斗房间——房间数上去了，学到的词反而少了。
    function shuf(a) {
      for (var i = a.length - 1; i > 0; i--) {
        var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    var fightPool = [
      { kind: 'normal',  tier: tier },
      { kind: 'confuse', tier: tier, p: 0.75 },
      { kind: 'rare',    tier: tier, p: 0.75 },
      { kind: 'listen',  tier: tier, p: 0.5 },
      { kind: 'form',    tier: tier, p: 0.45 },
      { kind: 'syn',     tier: tier, p: 0.4 },
      { kind: 'cloze',   tier: tier, p: 0.45 },
      { kind: 'elite',   tier: tier, p: 0.28 }
    ].filter(function (o) { return !o.p || Math.random() < o.p; });
    var utilPool = [
      { kind: 'chest',    tier: tier, p: 0.5 },
      { kind: 'campfire', tier: tier, p: 0.5 },
      { kind: 'event',    tier: tier, p: 0.6 },
      { kind: 'shop',     tier: tier, p: 0.45 }
    ].filter(function (o) { return Math.random() < o.p; });

    var bag = shuf(fightPool).slice(0, 2);
    var u = shuf(utilPool)[0];
    if (u) bag.push(u);
    shuf(bag);
    // 幽灵：之前答错的词会追上来
    if (R.ghosts.length && Math.random() < 0.5) bag.push({ kind: 'ghost', tier: tier });
    R.offer = bag;
    renderTower();
    show('tower');
  }

  function renderTower() {
    $('floorName').textContent = R.step >= STEPS ? ('第 ' + (R.floor + 1) + ' 层 · 塔主') : ('第 ' + (R.floor + 1) + ' 层 · ' + (R.step + 1) + '/' + STEPS);
    $('hpLine').textContent = 'HP ' + R.hp + ' / ' + R.maxHp;
    var hpBar = $('hpBar').firstElementChild;
    hpBar.style.width = Math.max(0, R.hp / R.maxHp * 100) + '%';
    $('hpBar').classList.toggle('bad', R.hp / R.maxHp < 0.35);
    $('relicLine').textContent = relicLine() +
      '　·　墨 ' + R.ink + '　·　词力 ' + R.power.toFixed(2) + '×' +
      (cheatsLeft() ? '　·　小抄 ' + cheatsLeft() : '');
    $('setLine').textContent = setProgressLine();

    var box = $('choices'); box.innerHTML = '';
    R.offer.forEach(function (o) {
      box.appendChild(roomButton(o));
    });
  }

  // 只有这几种不是战斗。反过来判断，以后再加怪物类型就不用回来改探测代码了。
  var NON_FIGHT = { chest: 1, shop: 1, campfire: 1, event: 1 };
  function isFight(kind) { return !NON_FIGHT[kind]; }

  // 进入房间的唯一入口。探针也走这里，才不会漏掉"不是战斗"的房间。
  function enterRoom(o) {
    if (o.kind === 'chest')    { advanceStep(); showRelicPick('宝箱', '挑一个带上'); return; }
    if (o.kind === 'shop')     { advanceStep(); R.shelf = null; showShop(); return; }
    if (o.kind === 'campfire') { advanceStep(); showCampfire(); return; }
    if (o.kind === 'event')    { advanceStep(); showEvent(); return; }
    startBattle(o);
  }

  function roomButton(o) {
    var go = function () { enterRoom(o); };
    if (o.kind === 'boss')     return btn('塔主', '这一层的守关者。限时更短，血量更厚。', go);
    if (o.kind === 'elite')    return btn('精英', '血厚、限时短，但赢了给一大笔墨。', go);
    if (o.kind === 'chest')    return btn('宝箱', '三选一遗物，或者换 20 血。', go);
    if (o.kind === 'shop')     return btn('商店', '花墨买回复、词力、小抄。现有 ' + R.ink + ' 墨。', go);
    if (o.kind === 'campfire') return btn('篝火', '歇一会儿：回血 / 词力 / 复习。', go);
    if (o.kind === 'event')    return btn('事件', '路上遇到的随机状况，要选。', go);
    if (o.kind === 'listen')   return btn('听音怪', '只给发音和词性，不给中文。听着拼。', go);
    if (o.kind === 'syn')      return btn('近义怪', '给一组近义词，要靠辨析把它认出来。', go);
    if (o.kind === 'cloze')    return btn('填句怪', '一句真实的英文，挖掉一个词。靠语境把它补回来。', go);
    if (o.kind === 'form')     return btn('词形怪', '要拼的不是原词，是它的某个变形。', go);
    if (o.kind === 'confuse')  return btn('形近怪', '只给长度，不给首字母。拼成它的双胞胎要吃亏。', go);
    if (o.kind === 'rare')     return btn('熟词僻义怪', '它考的是你【以为你认识】的那个词的第二层意思。', go);
    if (o.kind === 'ghost')    return btn('幽灵（' + R.ghosts.length + '）', '你之前拼错的词追上来了。答对它才算甩掉。', go);
    return btn('词战', '给中文拼英文。', go);
  }

  /* =========================================================
     战斗
     ========================================================= */
  var B = null;
  var SYNC = false;   // 探针用：同步推进结算，不依赖 setTimeout

  function startBattle(o) {
    var t = TIERS[o.tier] || TIERS[0];
    var kind = o.kind;
    var w;
    if (kind === 'ghost') {
      var gw = R.ghosts.shift(); runUsed[gw] = 1;
      w = BY[gw] || pickCandidate(o.tier, 'normal');
      kind = 'normal';
    } else {
      w = pickCandidate(o.tier, kind === 'confuse' ? 'confuse'
                               : kind === 'rare' ? 'rare'
                               : kind === 'form' ? 'form'
                               : kind === 'syn' ? 'syn'
                               : kind === 'cloze' ? 'cloze' : 'normal');
    }
    runUsed[w.w] = 1;

    // 词形怪：要拼的不是原词，而是它的某个变形。
    // 学的是原词（熟练度/幽灵都记在原词上），但答案是变形。
    var target = w.w, formKey = null;
    if (kind === 'form' && w.fm) {
      var keys = Object.keys(w.fm).filter(function (k) { return FORM_NAMES[k]; });
      if (!keys.length) { kind = 'normal'; }
      else {
        formKey = keys[(Math.random() * keys.length) | 0];
        target = w.fm[formKey][0];
      }
    }

    // 近义怪：给一组近义词 + 目标词自己的辨析，要拼出目标词
    var synGroup = null;
    if (kind === 'syn') {
      // 必须：这个词自己有辨析，且辨析里没直接写出答案本身
      var gs = (SYN_BY_WORD[w.w] || []).filter(function (x) {
        var e = x.e[w.w];
        return e && e.toLowerCase().indexOf(w.w) < 0;
      });
      if (!gs.length) kind = 'normal';
      else synGroup = gs[(Math.random() * gs.length) | 0];
    }

    // 填句怪：拿一句真实语料挖空，考的是语境
    var egLine = null;
    if (kind === 'cloze') {
      if (w.eg) egLine = blankOut(w.eg, w.w);
      else kind = 'normal';
    }

    // 塔主：每层有自己的规矩
    var bossIdx = (kind === 'boss') ? Math.min(R.floor, BOSSES.length - 1) : -1;

    var maxHp = Math.round(t.hp * (kind === 'boss' ? 1.15 : kind === 'elite' ? 1.6 : 1));
    var limit = kind === 'boss' ? (bossIdx === 1 ? 12 : 16)
              : kind === 'elite' ? t.time - 3
              : kind === 'listen' ? t.time - 5
              : kind === 'syn' ? t.time - 3
              : kind === 'confuse' ? t.time - 4 : t.time;
    if (has('hour')) limit += 6;
    if (has('seeshape') && kind === 'confuse') limit += 6;   // 辨形：形近怪多给 6 秒

    B = {
      kind: kind, w: w, target: target, formKey: formKey, syn: synGroup, eg: egLine, tier: o.tier,
      hp: maxHp, maxHp: maxHp,
      limit: limit, left: limit, shield: has('shield'),
      got: 0, total: 0, wordT0: Date.now(),
      memo: !!R.memoNext, rootBonus: 0,
      setFree: hasSet('学者'), allin: false, wasGhost: (o.kind === 'ghost'),
      bossIdx: bossIdx, onlyRare: bossIdx === 3,
      bossHitMul: bossIdx === 2 ? 2 : 1,
      rage: false, rageHit: 0,
      done: false, timer: null, t0: Date.now()
    };
    R.memoNext = false;      // 「烂笔头」只buff下一场
    R.stats.fought++;
    renderBattle();
    show('battle');
    startTimer();
    $('answer').focus();
  }

  function renderBattle() {
    var w = B.w;
    var names = { normal: '词兽', confuse: '形近怪', rare: '熟词僻义怪', boss: '塔主',
                  elite: '精英', listen: '听音怪', form: '词形怪', syn: '近义怪',
                  cloze: '填句怪' };
    var tags = { normal: '', confuse: '只给长度', rare: '考僻义',
                 elite: '血厚 · 限时短', listen: '只给发音', form: '考词形', syn: '考辨析',
                 cloze: '考语境' };
    var foeName = names[B.kind] || '词兽';
    var foeTag = tags[B.kind] || '';
    if (B.kind === 'boss' && B.bossIdx >= 0) {
      foeName = BOSSES[B.bossIdx].name;
      foeTag = BOSSES[B.bossIdx].tag + '　·　限时 ' + B.limit + 's';
      if (B.rage) { foeName = '狂暴·' + foeName; foeTag += '　·　它更狠了'; }
    }
    $('foeName').textContent = foeName;
    $('foeTag').textContent = foeTag;
    $('foeHp').textContent = B.hp + ' / ' + B.maxHp;
    $('foeBar').firstElementChild.style.width = (B.hp / B.maxHp * 100) + '%';

    // 题干
    var p = $('prompt'); p.innerHTML = '';
    var label = w.pos || '';
    if (B.kind === 'rare') label += '（这个词还有别的意思）';
    if (B.kind === 'form' && B.formKey) label += '　→ 拼它的【' + FORM_NAMES[B.formKey] + '】';
    if (B.kind === 'syn' && B.syn) {
      label = '近义词辨析' + (B.syn.h ? '　·　这一组都有「' + B.syn.h + '」的意思' : '');
    }
    if (label) p.appendChild(el('span', 'pos', label));

    if (B.kind === 'syn' && B.syn) {
      p.appendChild(el('span', 'senses', B.syn.w.map(function (x) {
        return x === w.w ? '？？？' : x;
      }).join('　/　')));
    } else {
      p.appendChild(el('span', 'senses', B.kind === 'listen' ? '（听着拼）' : senses(w, B.kind === 'rare')));
    }
    $('synNote').textContent = (B.kind === 'syn' && B.syn && B.syn.e[w.w]) ? B.syn.e[w.w] : '';
    $('egLine').textContent = (B.kind === 'cloze' && B.eg) ? B.eg : '';

    // 音标：听音怪给了音标等于报答案；词形怪的原词音标对不上变形。
    // 首字母：形近怪、塔主、精英、听音怪都不给——那些正是靠首字母就泄底的情况。
    // 近义怪也藏音标 —— 音标等于把答案读出来了（['skil] 就是 skill）
    var showPh = B.kind !== 'form' && B.kind !== 'syn' && B.kind !== 'cloze' &&
                 !(B.kind === 'listen' && SND);
    $('ph').textContent = (showPh && w.ph) ? '[' + w.ph + ']' : '';
    var bare = (B.kind === 'confuse' || B.kind === 'boss' || B.kind === 'elite' || B.kind === 'listen');
    $('hint').textContent = hintOf(B.target, bare);
    $('flash').textContent = '';
    $('flash').className = 'flash';
    $('compare').textContent = '';
    $('compare').className = 'compare';
    $('rootBox').innerHTML = '';
    $('rootBtn').hidden = !(w.rt && w.rt.length);
    B.rootBonus = 0;
    if (B.kind === 'listen') setTimeout(function () { if (B && !B.done) say(B.target); }, 300);
    var a = $('answer'); a.value = ''; a.className = ''; a.disabled = false;
    $('submitBtn').disabled = false;
    $('giveUpBtn').disabled = false;
    $('submitBtn').querySelector('.t').textContent = '提交（回车）';
    B.wordT0 = Date.now();
    B.copyMode = false;
    $('meLine').textContent = 'HP ' + R.hp + ' / ' + R.maxHp + '　·　词力 ' + R.power.toFixed(2) + '×' +
      (cheatsLeft() ? '　·　小抄 ' + cheatsLeft() : '');
    $('giveUpBtn').querySelector('.d').textContent =
      cheatsLeft() ? ('免费（还剩 ' + cheatsLeft() + ' 张）') : ('直接看答案 · 扣 ' + peekCost() + ' 血');
  }

  // 把例句里的目标词挖成空。填句怪的题面就是这个。
  function blankOut(sent, word) {
    var re = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
    return sent.replace(re, '＿＿＿＿＿');
  }

  function hintOf(word, bare) {
    var out = [];
    for (var i = 0; i < word.length; i++) out.push(i === 0 && !bare ? word[0] : '_');
    return out.join(' ') + '   (' + word.length + ')';
  }

  function startTimer() {
    clearInterval(B.timer);
    B.timer = setInterval(function () {
      if (B.done) return;
      B.left -= 0.1;
      $('timeBar').firstElementChild.style.width = Math.max(0, B.left / B.limit * 100) + '%';
      $('timeBar').classList.toggle('warn', B.left / B.limit < 0.4);
      if (B.left <= 0) { clearInterval(B.timer); settle('timeout', ''); }
    }, 100);
  }

  function submit() {
    if (!B) return;
    var v = $('answer').value.trim();
    if (!v) return;
    if (B.copyMode) return finishCopy(v);   // 抄写阶段，不走正常判定
    if (B.done) return;
    settle('submit', v);
  }

  // 「不认识」：不猜、直接看答案。这回合白过（怪不掉血），但这个词被明确标成生疏
  // 并变成幽灵。**它有代价**——不设代价的话，见势不妙就按它，游戏就没有输的可能了。
  function giveUp() {
    if (!B || B.done) return;
    B.done = true;
    clearInterval(B.timer);
    var w = B.w, extra = '';
    if (w.rt && w.rt.length && ROOTS[w.rt[0]]) {
      extra = '　词根 ' + w.rt[0] + '：' + ROOTS[w.rt[0]].m;
    }
    var free = cheatsLeft() > 0;
    if (!free && B.setFree) { B.setFree = false; free = true; }   // 学者套装：每场第一次免费
    if (free) { if (cheatsLeft() > 0) R.cheatUsed++; } else R.hp -= peekCost();
    if (has('allin')) B.allin = true;                             // 梭哈：看完当场伤害 ×2
    R.stats.peeked++;
    R.combo = 0;
    B.total++;
    if (has('notebook')) R.noted[w.w] = 1;    // 笔记：这个词这一局再遇到时伤害 ×2

    var f = $('flash');
    f.textContent = '答案：' + B.target + '  [' + (w.ph || '') + ']　' + senses(w, false) + extra +
      (free ? '　（用掉 1 张小抄）' : '　（-' + peekCost() + ' 血）');
    f.className = 'flash near';
    Prog.prof[w.w] = has('swift') ? 1 : 0;   // 速记：边看边记
    Prog.seen[w.w] = 1;
    Prog.stats.answered++;
    R.stats.answered++;
    addGhost(w.w);
    showCompare(w, '', false);   // 熟的词也顺带给一次「常见义 vs 僻义」的对照
    say(w.w); sfxPeek();
    save();

    // 强制抄一遍。只看一眼是【再认】，打一遍才是【提取】——留存率差好几倍。
    // 不抄的话，这个按钮就只是"翻答案"，翻完就忘。抄错不惩罚，再抄一次。
    B.copyMode = true;
    var a = $('answer');
    a.value = ''; a.className = ''; a.disabled = false; a.focus();
    $('submitBtn').disabled = false;
    $('submitBtn').querySelector('.t').textContent = '照着打一遍';
    $('giveUpBtn').disabled = true;
    if (SYNC) finishCopy(w.w);
  }

  function finishCopy(input) {
    var want = B.target, typed = String(input || '').toLowerCase();
    if (typed === want || (typed.length > 2 && dist(typed, want) <= 1)) {
      B.copyMode = false;
      if (has('memo')) R.memoNext = true;      // 烂笔头：下一场伤害 ×2
      var f = $('flash');
      f.textContent = '抄好了：' + want + '　（手打一遍，比看十遍管用）';
      f.className = 'flash ok';
      $('answer').disabled = true;
      $('submitBtn').disabled = true;
      $('giveUpBtn').disabled = true;
      sfxOk();
      if (SYNC) cont(); else setTimeout(cont, 900);
    } else {
      $('flash').textContent = '答案是这个：' + want + '　照着重打一遍';
      $('flash').className = 'flash near';
      var a = $('answer'); a.value = ''; a.className = 'no'; a.focus();
      sfxBad();
    }
  }

  function settle(reason, input) {
    if (B.done) return;
    B.done = true;
    clearInterval(B.timer);
    var w = B.w, want = B.target;   // 词形怪的答案是变形，不是原词
    var typed = (input || '').toLowerCase();
    var verdict, dmg = 0;

    if (reason === 'timeout') verdict = 'timeout';
    else if (typed === want) verdict = 'exact';
    else if (typed.length > 2 && dist(typed, want) <= 1) verdict = 'near';
    else verdict = 'wrong';

    // 是不是被"双胞胎"骗了（形近怪的专属惩罚）
    var twin = (w.cf || []).indexOf(typed) >= 0 && verdict === 'wrong';

    B.total++;
    Prog.stats.answered++;
    R.stats.answered++;
    Prog.seen[w.w] = 1;

    var f = $('flash');
    if (verdict === 'exact') {
      B.got++;
      R.stats.correct++;
      R.combo++;
      dmg = damageOf(w);
      if (has('keen') && B.wordT0 && (Date.now() - B.wordT0) < 10000) dmg = Math.round(dmg * 1.5);
      B.hp -= dmg;
      // 塔主血量过半 → 狂暴：时间更短、下手更狠
      var raged = false;
      if (B.kind === 'boss' && !B.rage && B.hp > 0 && B.hp <= B.maxHp * 0.5) {
        B.rage = true;
        B.limit = Math.max(9, B.limit - 6);
        B.left = Math.min(B.left, B.limit);
        B.rageHit = 5;
        raged = true;
      }
      // 答对 → 这个词"降级"（王牌变弱）；「过目不忘」记更牢
      Prog.prof[w.w] = Math.min(4, profOf(w) + (has('oneshot') ? 2 : 1));
      Prog.stats.correct++;
      if (hasSet('异端')) R.ink += 1;                       // 旁门：答对一个 +1 墨
      if (has('requiem') && B.wasGhost) healBack(8);         // 安魂：击退幽灵回血
      // 遗忘诅咒的代价：每拼对一个词，随机让另一个已掌握的词退一级
      if (has('curse')) {
        var pool = [];
        for (var kk in Prog.prof) if (Prog.prof[kk] > 0 && kk !== w.w) pool.push(kk);
        if (pool.length) Prog.prof[pool[(Math.random() * pool.length) | 0]]--;
      }
      f.textContent = '正确！造成 ' + dmg + ' 伤害' +
        (has('combo') && R.combo > 1 ? '　（连击 ×' + R.combo + '）' : '') +
        (raged ? '　—— 它狂暴了，限时缩短！' : '');
      f.className = 'flash ok';
      $('answer').className = 'ok';
      // 学会了就不再是幽灵；这一局里先错后对的，也要从"没拿下"里划掉
      var mi = R.missed.indexOf(w.w);
      if (mi >= 0) R.missed.splice(mi, 1);
      say(want); sfxOk();
    } else if (verdict === 'near') {
      R.combo = 0;
      dmg = Math.round(damageOf(w) * 0.4);
      B.hp -= dmg;
      Prog.stats.correct++;
      f.textContent = '差一个字母：' + typed + ' → ' + want + '　（擦边 ' + dmg + ' 伤害）';
      f.className = 'flash near';
      $('answer').className = 'ok';
      addGhost(w.w);
      say(want); sfxNear();
    } else {
      R.combo = 0;
      if (B.shield) { B.shield = false; f.textContent = '答错了，但护盾挡住了这一下。正确：' + want; }
      else {
        var hit = verdict === 'timeout' ? 10 : (TIERS[B.tier] || TIERS[0]).hit;
        hit = Math.round(hit * (B.bossHitMul || 1)) + (B.rageHit || 0);
        if (twin) hit += 6;
        R.hp -= hit;
        f.textContent = (twin ? '被双胞胎骗了！' : (verdict === 'timeout' ? '超时了。' : '答错了。'))
          + '正确：' + want + '　受 ' + hit + ' 伤害';
      }
      f.className = 'flash no';
      $('answer').className = 'no';
      Prog.prof[w.w] = Math.max(0, profOf(w) - 1);
      addGhost(w.w);
      showCompare(w, typed, twin);
      say(want); sfxBad();
    }
    $('answer').disabled = true;
    $('submitBtn').disabled = true;
    $('foeBar').firstElementChild.style.width = Math.max(0, B.hp / B.maxHp * 100) + '%';
    $('foeHp').textContent = Math.max(0, B.hp) + ' / ' + B.maxHp;
    save();

    if (SYNC) cont(); else setTimeout(cont, 1250);
  }

  // 一个词结算完之后：先看玩家死没死，再看怪死没死，都没死就换下一个词继续
  function cont() {
    if (R.hp <= 0) return endRun(false);   // ← 之前漏了这条，玩家血光了也死不了
    if (B.hp <= 0) return winFight();
    B.done = false;
    // 换下一个词时保持怪的"主题"：形近怪继续出形近词，词形怪继续考变形
    var want = B.kind === 'confuse' ? 'confuse' : B.kind === 'rare' ? 'rare'
             : B.kind === 'form' ? 'form' : B.kind === 'syn' ? 'syn'
             : B.kind === 'cloze' ? 'cloze' : 'normal';
    if (B.onlyRare) want = 'rare';          // 僻义之主：整场只考僻义
    var nw = pickCandidate(B.tier, want);
    runUsed[nw.w] = 1;
    B.w = nw;
    B.target = nw.w;
    B.formKey = null;
    B.syn = null;
    B.eg = null;
    if (B.kind === 'cloze') {
      if (nw.eg) B.eg = blankOut(nw.eg, nw.w);
      else B.kind = 'normal';
    }
    if (B.kind === 'syn') {
      var gs2 = (SYN_BY_WORD[nw.w] || []).filter(function (x) {
        var e2 = x.e[nw.w]; return e2 && e2.toLowerCase().indexOf(nw.w) < 0;
      });
      if (gs2.length) B.syn = gs2[(Math.random() * gs2.length) | 0];
      else B.kind = 'normal';
    }
    if (B.kind === 'form' && nw.fm) {
      var ks = Object.keys(nw.fm).filter(function (k) { return FORM_NAMES[k]; });
      if (ks.length) {
        B.formKey = ks[(Math.random() * ks.length) | 0];
        B.target = nw.fm[B.formKey][0];
      }
    }
    B.left = B.limit;
    renderBattle();
    startTimer();
    $('answer').focus();
  }

  function addGhost(word) {
    if (R.ghosts.indexOf(word) < 0 && R.ghosts.length < 12) R.ghosts.push(word);
    if (R.missed.indexOf(word) < 0) R.missed.push(word);
  }

  function winFight() {
    var boss = B.kind === 'boss';
    sfxWin();

    // 掉落。层越高给得越多，塔主另算。
    var ink = 3 + R.floor * 2 + (boss ? 12 : B.kind === 'elite' ? 9 : 0);
    R.ink += ink;
    // 词力：本局成长轴。每场 +0.06，塔主 +0.15 —— 它抵消"越学会、伤害越低"的负成长
    R.power = Math.round((R.power + (boss ? 0.08 : 0.035)) * 1000) / 1000;

    if (boss) { R.floor++; R.step = 0; } else advanceStep();

    var lines = [
      '这场拼对 ' + B.got + ' / ' + B.total + ' 个词　·　+' + ink + ' 墨（共 ' + R.ink + '）',
      '词力 → ' + R.power.toFixed(2) + '×　·　HP ' + R.hp + ' / ' + R.maxHp
    ];
    if (R.combo > 1) lines.push('连击 ' + R.combo + ' 次');

    if (R.floor >= FLOORS) return endRun(true);

    if (boss) {
      var heal = 25;
      healBack(heal);
      lines.push('爬完第 ' + R.floor + ' 层，回了 ' + heal + ' 血');
      if (has('compass')) { healBack(12); lines.push('罗盘：又回了 12 血'); }
      var choices = relicChoices(3);
      var acts = choices.map(function (r) {
        return {
          t: r.tag + ' · ' + r.name, d: r.d,
          fn: function () {
            var fired = takeRelic(r);
            save();
            if (fired) return announceSet(fired);
            offerRooms();
          }
        };
      });
      acts.push({ t: '不拿遗物', d: '换 25 血', fn: function () { healBack(25); save(); offerRooms(); } });
      panel('第 ' + R.floor + ' 层 · 通过', '三选一带走一个', lines, acts);
      return;
    }

    save();
    panel('打赢了', '', lines, [{ t: '继续', d: '往上走', fn: function () { offerRooms(); } }]);
  }

  function endRun(bossCleared) {
    if (!bossCleared) sfxLose();
    if (R) {
      R.over = true;
      // 塔只有 FLOORS 层，打赢最后那个塔主时 R.floor 已经自增到 FLOORS 了，别报出"第 5 层"
      Prog.stats.best = Math.max(Prog.stats.best || 0, Math.min(R.floor + 1, FLOORS));
    }
    save();
    renderOver(bossCleared);
    show('over');
  }

  /* =========================================================
     结束 / 统计
     ========================================================= */
  function renderOver(bossCleared) {
    var touched = Object.keys(runUsed).length;         // 这一局碰到过的词
    var got = Math.max(0, touched - R.missed.length);  // 其中拿下的

    // 第一次见这些词的人，一局碰 40 个、错 8 个是常态。
    // 所以标题先说「拿下了多少」，错的放进折叠区——别让结算页只报坏消息。
    $('overTitle').textContent = '这一局拿下了 ' + got + ' 个词';
    $('overSub').textContent = bossCleared
      ? '爬到塔顶了。这 ' + got + ' 个词从此是你的。'
      : (got ? '塔没爬完，但这 ' + got + ' 个词已经是你的了 —— 下一局它们会变弱。'
             : '这局没拿下几个词，不过每个碰过的都记在账上了。');

    var box = $('overStats');
    box.innerHTML = '';

    if (R.missed.length) {
      box.appendChild(el('div', 'small muted', '还没拿下的 ' + R.missed.length + ' 个（下一局它们会追你）：'));
      var ul = el('ul', 'wordlist');
      R.missed.slice(0, 12).forEach(function (w) {
        var li = el('li');
        li.appendChild(el('span', '', w));
        li.appendChild(el('span', 'cn', senses(BY[w] || { s: [] }, false)));
        ul.appendChild(li);
      });
      box.appendChild(ul);
    } else {
      box.appendChild(el('div', 'small muted', '这一局一个词都没漏。'));
    }

    var rs = R.stats || { fought: 0, answered: 0, correct: 0, peeked: 0 };
    var racc = rs.answered ? Math.round(rs.correct / rs.answered * 100) : 0;
    var acc = Prog.stats.answered ? Math.round(Prog.stats.correct / Prog.stats.answered * 100) : 0;
    box.appendChild(el('div', 'small muted',
      '打了 ' + rs.fought + ' 场　·　本局答对率 ' + racc + '%　·　看答案 ' + rs.peeked + ' 次' +
      '　·　剩 ' + R.ink + ' 墨　·　词力 ' + R.power.toFixed(2) + '×'));
    box.appendChild(el('div', 'small muted',
      '打到第 ' + Math.min(R.floor + 1, FLOORS) + ' 层　·　累计答对率 ' + acc + '%　·　记忆账本共 ' +
      knownCount() + ' 个词'));
    var btns = $('overBtns'); btns.innerHTML = '';
    btns.appendChild(btn('再来一局', '换一批词。', function () { newRun(); }));
    btns.appendChild(btn('回到标题', '', function () { R = null; save(); renderTitle(); show('title'); }));
  }

  function renderTitle() {
    var btns = $('titleBtns'); btns.innerHTML = '';
    btns.appendChild(btn('开始新的一局', '约 15 分钟，爬 4 层塔。', function () { newRun(); }));
    if (R && !R.over) btns.appendChild(btn('继续这一局', '上次停在第 ' + (R.floor + 1) + ' 层。', function () { renderTower(); show('tower'); }));
    btns.appendChild(btn('存档 / 换设备', '导出或导入你的记忆进度。', function () { openSave(); }));

    var known = knownCount(), total = WORDS.length;
    $('progressLine').textContent = '记忆账本：' + known + ' / ' + total + ' 词　·　累计答题 ' + Prog.stats.answered +
      ' 次，答对率 ' + (Prog.stats.answered ? Math.round(Prog.stats.correct / Prog.stats.answered * 100) : 0) + '%';
  }

  function openSave() {
    $('saveBox').value = JSON.stringify({ prog: Prog }, null, 0);
    var b = $('saveBtns'); b.innerHTML = '';
    b.appendChild(btn('把上面的文本复制走', '这就是你的全部进度。', function () {
      $('saveBox').select(); document.execCommand && document.execCommand('copy');
    }));
    b.appendChild(btn('导入：粘贴文本后点这里', '会覆盖当前进度。', function () {
      try {
        var o = JSON.parse($('saveBox').value);
        if (o && o.prog) { Prog = o.prog; save(); openSave(); alert('导入成功：' + Object.keys(Prog.prof).length + ' 个词'); }
        else alert('这段文本不对');
      } catch (e) { alert('解析失败：' + e.message); }
    }));
    b.appendChild(btn('回标题', '', function () { renderTitle(); show('title'); }));
    show('save');
  }

  /* =========================================================
     启动
     ========================================================= */
  load();
  renderTitle();
  $('submitBtn').addEventListener('click', submit);
  $('giveUpBtn').addEventListener('click', giveUp);
  $('sayBtn').addEventListener('click', function () { if (B) say(B.target); });
  $('rootBtn').addEventListener('click', showRootQuiz);
  $('sndBtn').addEventListener('click', toggleSnd);
  $('sndBtn').textContent = SND ? '🔊' : '🔇';
  $('sndBtn').title = '音效开关（快捷键 M）';
  document.addEventListener('keydown', function (e) {
    if (e.key === 'm' || e.key === 'M') { if (!/input|textarea/i.test(e.target.tagName)) toggleSnd(); }
  });
  $('answer').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });

  /* ---------- 探针 + 截图钩子 ---------- */
  var q = new URLSearchParams(location.search);

  // ?demo=tower|battle|confuse|over —— 直接跳到某个界面，供截图和人工核对
  if (q.get('demo')) {
    var d = q.get('demo');
    if (d === 'tower') { newRun(); renderTower(); show('tower'); }
    else if (d === 'battle') { newRun(); startBattle({ kind: 'normal', tier: 0 }); }
    else if (d === 'confuse') { newRun(); startBattle({ kind: 'confuse', tier: 2 }); }
    else if (d === 'rare') { newRun(); startBattle({ kind: 'rare', tier: 1 }); }
    else if (d === 'shop') { newRun(); R.ink = 88; showShop(); }
    else if (d === 'listen') { newRun(); startBattle({ kind: 'listen', tier: 0 }); }
    else if (d === 'syn') { newRun(); startBattle({ kind: 'syn', tier: 0 }); }
    else if (d === 'cloze') { newRun(); startBattle({ kind: 'cloze', tier: 0 }); }
    else if (d === 'set') {   // 摆出"套装成型"那一刻
      newRun();
      R.relics = ['root', 'fresh'];
      var f2 = takeRelic(relicById('keen'));
      if (f2) announceSet(f2); else { renderTower(); show('tower'); }
    }
    else if (d === 'boss') { newRun(); R.floor = 2; startBattle({ kind: 'boss', tier: 2 }); }
    else if (d === 'form') { newRun(); startBattle({ kind: 'form', tier: 0 }); }
    else if (d === 'root') {
      newRun();
      var rw = WORDS.filter(function (x) {
        return x.rt && x.rt.length && ROOTS[x.rt[0]] && ROOTS[x.rt[0]].m;
      })[0];
      startBattle({ kind: 'normal', tier: 0 });
      if (rw) { B.w = rw; B.target = rw.w; renderBattle(); showRootQuiz(); }
    }
    else if (d === 'reward') {
      newRun(); R.ink = 42; R.power = 1.42; R.stats.fought = 5; R.hp = 78;
      B = { kind: 'normal', got: 3, total: 3 };
      winFight();
    }
    else if (d === 'trap') {   // 摆出「被双胞胎骗了」的那一刻，供截图核对
      newRun(); startBattle({ kind: 'confuse', tier: 1 });
      var twinW = (B.w.cf && B.w.cf[0]) || 'adopt';
      B.done = true; clearInterval(B.timer);
      var ai = $('answer'); ai.value = twinW; ai.className = 'no'; ai.disabled = true;
      $('flash').textContent = '被双胞胎骗了！　正确：' + B.w.w;
      $('flash').className = 'flash no';
      showCompare(B.w, twinW, true);
    }
    else if (d === 'over') {
      newRun();
      ['abandon', 'theorem', 'address', 'perspective', 'ignite', 'adapt', 'contract',
       'tide', 'bond', 'margin', 'verse', 'hollow'].forEach(function (x) { runUsed[x] = 1; });
      R.floor = 2; R.missed = ['abandon', 'theorem', 'address', 'perspective'];
      endRun(false);
    }
  }

  // ?probe=run —— 整局跑通：一路答对，看能不能爬到塔顶
  if (q.get('probe') === 'run') {
    SYNC = true;
    newRun();
    var log = [], guard = 0;
    while (R && !R.over && guard++ < 60) {
      var o = null;
      for (var oi = 0; oi < R.offer.length; oi++) {
        if (R.offer[oi].kind !== 'shop') { o = R.offer[oi]; break; }
      }
      if (!o) {   // 这一步只有宝箱可选，照宝箱的逻辑推进一步
        var left = RELICS.filter(function (r) { return R.relics.indexOf(r.id) < 0; });
        if (left.length) R.relics.push(left[0].id); else R.hp = Math.min(PLAYER_HP, R.hp + 18);
        R.step++; if (R.step > STEPS) { R.step = 0; R.floor++; }
        offerRooms(); continue;
      }
      var at = (R.floor + 1) + '.' + (R.step + 1);
      var fight = isFight(o.kind);
      enterRoom(o);
      var g2 = 0;
      while (fight && B.hp > 0 && !R.over && g2++ < 40) settle('submit', B.target);
      log.push('层' + at + ' ' + o.kind + ' → 词 ' + (fight ? B.got + '/' + B.total : '-') +
        '  HP' + R.hp + ' 词力' + R.power.toFixed(2) + (B && fight ? ' 怪血' + B.maxHp : ''));
    }
    boot.textContent = log.join('\n') +
      '\n结局: 层=' + (R ? Math.min(R.floor + 1, FLOORS) : '?') + ' over=' + (R ? !!R.over : '?') +
      ' 幽灵=' + (R ? R.ghosts.length : '?') + ' 已收录词=' + Object.keys(Prog.prof).length;
    SYNC = false;

  // ?probe=sim&acc=0.6&n=100&honest=1
  // 仿真：一个"知道 acc 比例的词"的新手，平均能爬到第几层、多少局会死。
  // honest=1 表示不认识时按「不认识」（不吃伤害）；honest=0 表示硬猜（吃伤害）。
  } else if (q.get('probe') === 'sim') {
    SYNC = true;
    var acc = parseFloat(q.get('acc') || '0.6');
    var N = parseInt(q.get('n') || '100', 10);
    var honest = q.get('honest') === '1';
    var reached = [], died = 0;
    for (var t = 0; t < N; t++) {
      Prog = { prof: {}, seen: {}, stats: { answered: 0, correct: 0, runs: 0 } };
      newRun();
      var guard = 0;
      while (R && !R.over && guard++ < 80) {
        var o = null;
        for (var oi = 0; oi < R.offer.length; oi++) {
          if (R.offer[oi].kind !== 'shop') { o = R.offer[oi]; break; }
        }
        if (!o) {
          var leftR = RELICS.filter(function (r) { return R.relics.indexOf(r.id) < 0; });
          if (leftR.length) R.relics.push(leftR[0].id); else R.hp = Math.min(PLAYER_HP, R.hp + 18);
          R.step++; if (R.step > STEPS) { R.step = 0; R.floor++; }
          offerRooms(); continue;
        }
        var fight = isFight(o.kind);
        enterRoom(o);
        var g2 = 0;
        while (fight && B.hp > 0 && !R.over && g2++ < 40) {
          if (Math.random() < acc) settle('submit', B.target);
          else if (honest) giveUp();
          else settle('submit', 'zzzz');
        }
      }
      if (R.over && R.floor < FLOORS) died++;
      reached.push(R.floor);
    }
    var avg = reached.reduce(function (a, b) { return a + b; }, 0) / reached.length;
    var dist = reached.reduce(function (m, f) { m[f] = (m[f] || 0) + 1; return m; }, {});
    boot.textContent = '知道比例=' + acc + '  不认识时=' + (honest ? '看答案' : '硬猜') + '  局数=' + N +
      '\n平均爬到第 ' + (avg + 1).toFixed(2) + ' 层（塔顶是 ' + FLOORS + '）' +
      '\n死亡率 ' + Math.round(died / N * 100) + '%' +
      '\n死在哪层分布 ' + JSON.stringify(dist);
    SYNC = false;

  // ?probe=dmg —— 直接量伤害公式，看词力和遗物各贡献多少
  } else if (q.get('probe') === 'dmg') {
    newRun();
    var fresh = WORDS.filter(function (w) { return w.lv === 4; })[0];
    var out2 = [];
    [1, 1.5, 2, 2.5].forEach(function (pw) {
      R.power = pw;
      out2.push('词力 ' + pw.toFixed(2) + ' → prof0 伤害 ' + damageOf(fresh) +
        ' （基础 8×(1+5×0.45)=' + (8 * 3.25) + '）');
    });
    R.power = 1;
    ['force', 'fresh', 'gamble', 'curse', 'lastword', 'combo', 'review', 'root'].forEach(function (rid) {
      R.relics = [rid]; R.combo = 0;
      out2.push('遗物 ' + rid + '（词力1.0，prof0）→ ' + damageOf(fresh));
    });
    R.relics = [];
    boot.textContent = out2.join('\n');
  // ?probe=sets —— 验套装：凑到第 3 件才触发，且只触发一次
  } else if (q.get('probe') === 'sets') {
    SYNC = true;
    newRun();
    var o4 = [], w0 = WORDS.filter(function (x) { return x.lv === 4; })[0];
    function grab(id) {
      var r = relicById(id);
      return takeRelic(r);      // 返回刚凑齐的套装
    }
    o4.push('开局：' + setProgressLine() + '（空）');
    o4.push('拿 铁皮 → 通用 ' + setCount('通用') + '/3　火 ' + grab('iron'));
    o4.push('拿 时间沙漏 → 通用 ' + setCount('通用') + '/3　火 ' + grab('hour'));
    o4.push('拿 误答护盾 → 通用 ' + setCount('通用') + '/3　火=' + grab('shield') +
            '　maxHp=' + R.maxHp + '（套装立刻生效）');
    o4.push('再拿 强记 → 通用 ' + setCount('通用') + '/3　火=' + grab('force') + '（不该再触发）');
    o4.push('勇者 0/3　火=' + grab('root') + '　勇者 1/3　火=' + grab('fresh'));
    o4.push('勇者 2/3　火=' + grab('keen') + ' ← 应该在这里触发');
    o4.push('套装进度行：' + setProgressLine());
    boot.textContent = o4.join('\n');
    SYNC = false;
  // ?probe=copy —— 验「看答案 → 强制抄一遍」这条路
  } else if (q.get('probe') === 'copy') {
    newRun();
    startBattle({ kind: 'normal', tier: 0 });
    var cw = B.w.w, o3 = [];
    SYNC = false;                       // 手动控制，不自动放行
    giveUp();
    o3.push('按下不认识 → 进入抄写=' + !!B.copyMode + '　输入框可用=' + !$('answer').disabled +
            '　按钮文字="' + $('submitBtn').querySelector('.t').textContent + '"');
    var hpBefore = R.hp;
    finishCopy('zzzzzz');               // 抄错
    o3.push('抄错 → 还停在抄写=' + !!B.copyMode + '　输入框=' + !$('answer').disabled +
            '　没额外扣血=' + (R.hp === hpBefore));
    finishCopy(cw);                     // 抄对
    o3.push('抄对 → 离开抄写=' + !B.copyMode + '　输入框已锁=' + $('answer').disabled);
    finishCopy(cw);                     // 再抄一次不应该有任何反应
    o3.push('重复提交无副作用=' + !B.copyMode);
    boot.textContent = o3.join('\n');
  } else if (q.get('probe') === 'battle') {
    var out = [];
    [['normal', '@right'], ['normal', '@near'], ['normal', 'zzzz'],
     ['normal', '@giveup'], ['confuse', '@right'], ['rare', '@right']].forEach(function (t) {
      newRun();
      startBattle({ kind: t[0], tier: 0 });
      var w = B.w, typed = t[1];
      if (typed === '@right') typed = w.w;
      else if (typed === '@near') typed = w.w.replace(/.$/, 'q');
      var hp0 = R.hp, prof0 = profOf(w), foe0 = B.hp;
      if (typed === '@giveup') { giveUp(); typed = '（看答案）'; }
      else settle('submit', typed);
      out.push(t[0] + ' [' + typed + ' vs ' + w.w + '] 我-' + (hp0 - R.hp) +
        ' 怪-' + (foe0 - B.hp) + ' prof ' + prof0 + '>' + profOf(w) + ' 幽灵' + R.ghosts.length);
    });
    boot.textContent = out.join('\n');
  } else if (q.get('probe')) {
    var lines = [];
    lines.push('words=' + WORDS.length + ' roots=' + Object.keys(ROOTS).length);
    lines.push('tiers=' + TIER_WORDS.map(function (a) { return a.length; }).join(','));
    // 抽 5 个词，验证伤害/提示/判定
    for (var k = 0; k < 5; k++) {
      var w = pickCandidate(k % TIERS.length, 'normal');
      lines.push(w.w + ' | prof=' + profOf(w) + ' dmg=' + damageOf(w) + ' hint=' + hintOf(w.w, false) +
        ' | ' + senses(w, false) + (w.cf ? ' | cf=' + w.cf.join('/') : ''));
    }
    lines.push('judge exact=' + dist('abandon', 'abandon') + ' near=' + dist('abandonn', 'abandon') +
      ' wrong=' + (dist('adopt', 'abandon') > 1));
    boot.textContent = lines.join('\n');
  }

})();
</script>
</body>
</html>

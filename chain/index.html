<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101914">
  <meta name="description" content="codex连：连英文单词，构筑你的地牢冒险。">
  <title>codex连</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./words.js"></script>
  <script defer src="./engine.js"></script>
  <script defer src="./game.js"></script>
</head>
<body>
  <main id="app" class="wrap">
    <header class="topbar"><a id="home-link" href="../index.html">← 小游戏</a><span class="brand">codex连</span><button id="book-button" class="quiet">词册</button></header>
    <section id="home" class="screen">
      <div class="eyebrow">CET-4 / CET-6</div>
      <div class="hero-art" aria-hidden="true"><div class="orb"><span class="eyes">● ●</span><span class="mouth">⌣</span></div><span class="float-word one">recover</span><span class="float-word two">retain</span><span class="float-word three">transfer</span></div>
      <h1>codex<span>连</span></h1>
      <p class="intro">把记住的单词，连成你的力量。</p>
      <div class="how"><span>看中文</span><i>→</i><span>连英文</span><i>→</i><span>选升级</span></div>
      <div class="scope" aria-label="学习范围"><button data-scope="all" class="active">四六级</button><button data-scope="4">四级</button><button data-scope="6">六级</button></div>
      <button id="start-button" class="primary">进入地牢 <span>↗</span></button>
      <p id="progress" class="small"></p>
      <p class="footnote">试玩词库 <span id="word-count"></span> 词 · 回合制 · 新词有引导</p>
    </section>
    <section id="lesson" class="screen" hidden>
      <div class="eyebrow">发现新词</div><h2>先认识，再出发。</h2><p class="small">第一次连到这些词时，格子上会保留中文。</p>
      <div id="lesson-cards" class="lesson-grid"></div>
      <button id="lesson-button" class="primary">看过了，进入地牢 ↗</button>
    </section>
    <section id="battle" class="screen" hidden>
      <div class="status"><span id="floor-label"></span><span id="hero-hp"></span></div>
      <div class="hp-track"><i id="hero-bar"></i></div>
      <div class="enemy-panel">
        <div id="enemy-art" class="enemy-art" aria-hidden="true"><div class="little-orb"><span>● ●</span><i>⌣</i></div><b id="damage-float"></b></div>
        <div class="enemy-info"><div class="enemy-title"><h2 id="enemy-name"></h2><span id="enemy-hp"></span></div><div class="enemy-track"><i id="enemy-bar"></i></div><p id="enemy-intent"></p></div>
      </div>
      <div class="task-head"><span>按顺序连出三个词</span><button id="hint-button" class="text-button">看看提示</button></div>
      <div id="prompts" class="prompts"></div>
      <div class="board-shell"><div id="board" class="board" aria-label="连词棋盘"></div><svg id="path-svg" aria-hidden="true"><polyline id="path-line" points=""/></svg></div>
      <form id="spell-form" class="spell-box" hidden><label id="spell-label" for="spell-input"></label><div><input id="spell-input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入完整英文"><button class="primary" type="submit">发动</button></div></form>
      <div class="board-bottom"><span class="legend"><b class="sword">✦ 攻击</b><b class="shield">◇ 护盾</b><b class="heart">♥ 恢复</b></span><button id="reset-path" class="text-button">重连</button></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite">横、竖、斜都能连；选攻击路线，或选护盾路线。</p>
      <div id="relic-strip" class="relic-strip"></div>
      <button id="quit-button" class="text-button quit">返回首页</button>
    </section>
    <section id="upgrade" class="screen" hidden><div class="eyebrow">房间已清空</div><h2>带走一种力量。</h2><p class="small">三选一，效果自动生效。相同升级可以叠加。</p><div id="upgrade-cards" class="upgrade-cards"></div><p class="footnote">过关恢复生命，学习记录会保留。</p></section>
    <section id="end" class="screen" hidden><div class="end-symbol" id="end-symbol">✦</div><div class="eyebrow" id="end-label"></div><h2 id="end-title"></h2><div id="end-stats" class="end-stats"></div><div id="end-words" class="end-words"></div><button id="again-button" class="primary">再来一局 ↗</button><button id="back-button" class="quiet wide">回到首页</button></section>
  </main>
  <dialog id="book"><div class="dialog-head"><h2>词册</h2><button id="book-close" class="quiet" aria-label="关闭词册">✕</button></div><p class="small">独立回忆与看过提示分别记录。多义词按这里的义项练习。</p><div id="book-list"></div></dialog>
  <div id="toast" role="status"></div>
</body>
</html>

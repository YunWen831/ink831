<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100e">
<title>在校园里乱逛</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#12100e;
    font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:#f5f5f4; user-select:none; -webkit-user-select:none;
    touch-action:none; overscroll-behavior:none; }
  @supports (height:100dvh) { html,body { height:100dvh; } }
  canvas { display:block; width:100%; height:100%; touch-action:none;
    image-rendering:pixelated; }

  .screen { position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px; z-index:10;
    overflow-y:auto; background:rgba(18,16,14,.95); }
  .screen.on { display:flex; }
  h1 { font-size:clamp(24px,6vw,42px); letter-spacing:.14em; font-weight:700; }
  h1 small { display:block; font-size:.32em; letter-spacing:.3em; opacity:.45; margin-top:10px; font-weight:400; }
  h2 { font-size:clamp(16px,4vw,22px); font-weight:600; letter-spacing:.06em; }
  .tip { font-size:clamp(11px,3vw,14px); opacity:.5; text-align:center; line-height:1.9; max-width:520px; }
  .tip b { color:#e8a33d; }
  .kbd { display:inline-block; padding:1px 7px; border:1px solid #57534e; border-radius:5px;
    font-size:.85em; margin:0 2px; }

  .picks { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:min(94vw,760px); }
  .pick { width:clamp(140px,28vw,200px); background:#1f1c19; border:2px solid #33302c;
    border-radius:14px; padding:14px; cursor:pointer; transition:.15s; text-align:left; }
  .pick:hover, .pick:active { border-color:#c2703a; transform:translateY(-3px); }
  .pick .top { display:flex; align-items:center; gap:10px; }
  .pick img { width:clamp(48px,12vw,64px); height:clamp(48px,12vw,64px);
    border-radius:10px; image-rendering:pixelated; background:#292524; }
  .pick .nm { font-size:clamp(14px,3.4vw,17px); font-weight:600; }
  .pick .tg { font-size:clamp(10px,2.6vw,12px); opacity:.45; margin-top:3px; }
  .pick .ds { font-size:clamp(11px,2.8vw,13px); opacity:.6; line-height:1.6; margin-top:9px; }

  .btn { padding:12px 30px; border:2px solid #57534e; border-radius:11px; background:#1f1c19;
    color:#f5f5f4; font-size:clamp(13px,3.4vw,16px); cursor:pointer; font-family:inherit; }
  .btn:hover { background:#c2703a; border-color:#c2703a; }

  /* 左上角当前在哪 */
  #where { position:absolute; z-index:5; pointer-events:none;
    left:calc(14px + env(safe-area-inset-left,0px));
    top:calc(12px + env(safe-area-inset-top,0px));
    font-size:clamp(12px,3.2vw,15px); letter-spacing:.1em; opacity:.85;
    text-shadow:0 2px 6px rgba(0,0,0,.7); color:#fff; }

  /* 走到人跟前才出现的那行提示 */
  #hint { position:absolute; z-index:5; pointer-events:none; left:50%; transform:translateX(-50%);
    bottom:calc(150px + env(safe-area-inset-bottom,0px));
    font-size:clamp(11px,3vw,14px); padding:6px 14px; border-radius:999px;
    background:rgba(18,16,14,.8); border:1px solid #57534e; white-space:nowrap;
    opacity:0; transition:opacity .15s; }
  #hint.on { opacity:1; }

  /* ---------- 对话框 ---------- */
  /* Undertale 的样子：黑底、白框、字在右边、脸在左边。
     刻意不用页面那套暗色卡片风 —— 这里是"游戏里"，要跟外面区分开 */
  #dlg { position:absolute; z-index:9; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:min(94vw,720px); display:none; }
  #dlg.on { display:block; }
  #dlgBox { position:relative; display:flex; gap:14px; align-items:flex-start;
    background:#000; border:4px solid #fff; border-radius:4px;
    padding:14px 16px; min-height:128px; box-shadow:0 8px 30px rgba(0,0,0,.6); }
  #dlgAv { flex:0 0 auto; width:96px; height:96px; image-rendering:pixelated;
    background:#1a1a1a; border:2px solid #444; border-radius:3px; }
  #dlgBody { flex:1 1 auto; min-width:0; }
  #dlgWho { font-size:13px; letter-spacing:.14em; color:#e8a33d; margin-bottom:7px; }
  #dlgTxt { font-size:clamp(14px,3.5vw,18px); line-height:1.75; white-space:pre-wrap; }
  #dlgOpts { list-style:none; margin-top:11px; }
  #dlgOpts li { font-size:clamp(13px,3.3vw,17px); padding:5px 9px; border-radius:4px;
    cursor:pointer; line-height:1.5; }
  #dlgOpts li .k { display:inline-block; width:1.6em; color:#8a8a8a; }
  #dlgOpts li.sel { background:#3a3a3a; }
  #dlgOpts li.sel .k { color:#e8a33d; }
  #dlgMore { position:absolute; right:14px; bottom:8px; color:#fff; font-size:14px;
    opacity:0; }
  #dlgMore.on { opacity:1; animation:bv .9s infinite; }
  @keyframes bv { 50% { transform:translateY(3px); opacity:.35 } }
  @media (max-width:520px){
    #dlgAv { width:64px; height:64px; }
    #dlgBox { min-height:104px; }
  }

  #stick { position:absolute; z-index:6; display:none; }
  #stick.on { display:block; }
  #act { position:absolute; z-index:7; display:none;
    right:calc(18px + env(safe-area-inset-right,0px));
    bottom:calc(26px + env(safe-area-inset-bottom,0px));
    width:clamp(70px,19vw,92px); height:clamp(70px,19vw,92px); border-radius:50%;
    border:3px solid #e8a33d; background:rgba(18,16,14,.75); color:#f5e6c8;
    font-family:inherit; font-size:clamp(12px,3.1vw,15px); font-weight:600;
    cursor:pointer; touch-action:none; padding:0; }
  #act.on { display:block; }
  #act:active { transform:scale(.93); }

  #probe { position:absolute; left:0; top:0; z-index:99; font-size:1px; opacity:.01;
    pointer-events:none; }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="where"></div>
<div id="hint"></div>

<div id="dlg">
  <div id="dlgBox">
    <img id="dlgAv" alt="">
    <div id="dlgBody">
      <div id="dlgWho"></div>
      <div id="dlgTxt"></div>
      <ul id="dlgOpts"></ul>
    </div>
    <div id="dlgMore">▼</div>
  </div>
</div>

<div id="stick"><div id="knob"></div></div>
<button id="act" type="button">说话</button>

<div class="screen on" id="scTitle">
  <h1>在校园里乱逛<small>CAMPUS</small></h1>
  <div class="tip">
    <span class="kbd">WASD</span><span class="kbd">↑↓←→</span> 走路　·　手机左下拖动<br>
    走到人跟前，按 <b>Z</b> / <b>空格</b> / 右边那个圆键跟他说话。<br>
    没人催你，也没有要躲的东西 —— 就是逛逛。
  </div>
  <button class="btn" id="btnStart">出门</button>
</div>

<div class="screen" id="scPick">
  <h2>你是谁？</h2>
  <div class="picks" id="pickList"></div>
</div>

<pre id="probe"></pre>

<!-- 立绘和走路图都在这儿。必须用经典 script 引：type="module" 在 file:// 下会被 CORS 拦死 -->
<script src="../art/chars.js"></script>
<script>
"use strict";

/* ==================================================================
   在校园里乱逛

   玩法就一件事：走路、走到人跟前、说话。没有战斗、没有计时、
   没有会失败的东西 —— 被"潜行"那套坑过，这回先把骨架站稳。

   地图用矩形拼出来，不手写字符网格。手数 48 列我一定数错
   （上一版 16×16 的立绘就是数错列才歪的），矩形有宽高，不用数。
   ================================================================== */

var TILE = 32, MAPW = 48, MAPH = 32;

/* 地形种类。solid 就是走不过去；颜色都是浅色 ——
   小人是深头发深裤子，配深色地板会看不见腿，看着像飘着的半截身子 */
var TERRAIN = {
  grass:  { c:'#7fa05a', c2:'#759455', solid:false, name:'草地' },
  path:   { c:'#cfc0a0', c2:'#c4b596', solid:false, name:'路' },
  floor:  { c:'#d9d3c6', c2:'#cdc7ba', solid:false, name:'室内' },
  plaza:  { c:'#c8bda9', c2:'#bcb19d', solid:false, name:'广场' },
  track:  { c:'#b9705a', c2:'#ad6952', solid:false, name:'跑道' },
  wall:   { c:'#8c7f6a', c2:'#9d8f78', solid:true,  name:'墙' },
  door:   { c:'#a8763f', c2:'#96682f', solid:false, name:'门' },
  tree:   { c:'#5f8a45', c2:'#4e7439', solid:true,  name:'树' },
  bench:  { c:'#a8763f', c2:'#8f6333', solid:true,  name:'长椅' },
  planter:{ c:'#8f9c6a', c2:'#7c8a58', solid:true,  name:'花坛' }
};

/* 校园 = 一堆矩形盖上去，后面的盖前面的。
   改地图只改这张表，别的地方都不用动 */
var AREAS = [
  { t:'grass',  x:0,  y:0,  w:48, h:32 },              // 底：整片草地

  /* 路先铺，房子后盖 —— 顺序反过来的话路会横穿到墙上去。
     主干道横穿校园，四条支路分别通教学楼、操场、食堂、水房 */
  { t:'path',   x:0,  y:15, w:48, h:3  },
  { t:'path',   x:10, y:14, w:2,  h:1  },              // 通教学楼的门
  { t:'path',   x:36, y:14, w:2,  h:1  },              // 通操场
  { t:'path',   x:7,  y:18, w:2,  h:2  },              // 通食堂的门
  { t:'path',   x:18, y:17, w:2,  h:4  },              // 通水房的门
  { t:'path',   x:22, y:18, w:2,  h:10 },              // 一路向南通广场和校门

  /* 教学楼：外壳 + 内部 + 南边一个门。里面看得见，不是一坨实心方块 */
  { t:'wall',   x:2,  y:2,  w:19, h:12 },
  { t:'floor',  x:3,  y:3,  w:17, h:10 },
  { t:'door',   x:10, y:13, w:2,  h:1  },

  /* 操场：外圈跑道、里圈草地 */
  { t:'track',  x:27, y:2,  w:19, h:12 },
  { t:'grass',  x:29, y:4,  w:15, h:8  },

  /* 食堂 */
  { t:'wall',   x:2,  y:20, w:13, h:8  },
  { t:'floor',  x:3,  y:21, w:11, h:6  },
  { t:'door',   x:7,  y:20, w:2,  h:1  },

  /* 水房：lg7 蹲门口。门开在北边，正对着那条支路 */
  { t:'wall',   x:15, y:21, w:7,  h:5  },
  { t:'floor',  x:16, y:22, w:5,  h:3  },
  { t:'door',   x:18, y:21, w:2,  h:1  },

  /* 广场 */
  { t:'plaza',  x:27, y:19, w:18, h:10 },

  /* 校门口 */
  { t:'plaza',  x:20, y:28, w:10, h:4  }
];

/* 树和长椅单独列 —— 它们是散着摆的，用矩形铺反而绕 */
var PROPS = [
  { t:'tree',  x:6,  y:16 }, { t:'tree',  x:16, y:16 }, { t:'tree',  x:30, y:16 },
  { t:'tree',  x:44, y:16 }, { t:'tree',  x:1,  y:6  }, { t:'tree',  x:1,  y:11 },
  { t:'tree',  x:46, y:6  }, { t:'tree',  x:46, y:11 }, { t:'tree',  x:25, y:21 },
  { t:'tree',  x:25, y:26 }, { t:'planter', x:30, y:21 }, { t:'planter', x:41, y:21 },
  { t:'planter', x:30, y:27 }, { t:'planter', x:41, y:27 },
  { t:'bench', x:33, y:24 }, { t:'bench', x:38, y:24 },
  { t:'bench', x:29, y:6  }, { t:'bench', x:43, y:6  }
];

var MAP = [];
function buildMap(){
  MAP = [];
  for (var y=0; y<MAPH; y++){
    var row = [];
    for (var x=0; x<MAPW; x++) row.push('grass');
    MAP.push(row);
  }
  AREAS.forEach(function(a){
    for (var y=a.y; y<a.y+a.h; y++)
      for (var x=a.x; x<a.x+a.w; x++)
        if (MAP[y] && MAP[y][x] !== undefined) MAP[y][x] = a.t;
  });
  PROPS.forEach(function(p){ if (MAP[p.y]) MAP[p.y][p.x] = p.t; });
}
function tileAt(tx, ty){
  if (ty<0 || ty>=MAPH || tx<0 || tx>=MAPW) return 'wall';   // 地图外当墙
  return MAP[ty][tx];
}
function solidAt(tx, ty){ return !!TERRAIN[tileAt(tx,ty)].solid; }

/* ==================== NPC ====================
   站桩，不巡逻。玩家走近了就转过来看你 —— 几行代码，
   但"被注意到"的感觉全靠它。
   ============================================ */
/* 站位都是挑过的：lg7 在水房门口那条支路上，正好是"蹲门口"那个意思；
   其余人散在教学楼、操场、广场、校门，走一圈能碰全 */
var NPCS = [
  { id:'lg7',       tx:18, ty:20, face:'down',  talk:'lg7' },
  { id:'shui',      tx:31, ty:16, face:'right', talk:'hint_shui' },
  { id:'logic',     tx:36, ty:8,  face:'down',  talk:'hint_logic' },
  { id:'laoli',     tx:11, ty:10, face:'down',  talk:'hint_laoli' },
  { id:'teacher',   tx:6,  ty:6,  face:'down',  talk:'hint_teacher' },
  { id:'dean',      tx:36, ty:26, face:'left',  talk:'hint_dean' },
  { id:'duty',      tx:22, ty:29, face:'up',    talk:'hint_duty' },
  { id:'deskmate',  tx:14, ty:8,  face:'left',  talk:'hint_deskmate' }
];
var TALK_R = 60;                 // 中心距小于这个数才算够得着

/* ==================== 对话 ====================
   一张节点表，节点之间靠 id 引用。
   next = 按空格往下走；opts = 停下来等选；end = 聊完了。
   end 写成字符串的话，顺手把"下次再聊"的入口也改掉 —— 这样聊完再来
   就不是复读同一段，而是换一套话。
   ============================================ */
var TALK = {
  lg7: {
    entry: { laoli:'a_laoli', shui:'a_shui', logic:'a_logic' },
    again: 'g',
    nodes: {
      a_laoli:{ text:'……牢李。你今天怎么有空理我。', next:'b' },
      a_shui: { text:'水哥啊。你那瓶水，又是从水房接的？', next:'b' },
      a_logic:{ text:'稀客。你居然会离开座位。', next:'b' },
      b: { text:'行吧，有事说事。', opts:[
            { t:'打听一下最近的消息', go:'ask' },
            { t:'就想认识认识你',     go:'know' },
            { t:'没事，我走了',       go:'bye' } ]},
      ask:  { text:'消息？这周检查卫生，走廊里别摆东西。', next:'ask2' },
      ask2: { text:'……还有，水房的热水器坏了，别去接。', end:true },
      know: { text:'认识我干嘛，我不好相处。', next:'know2' },
      know2:{ text:'……不过你要真想聊，就站远点聊。', end:true },
      bye:  { text:'嗯。', end:true },
      g: { text:'又是你。', opts:[
            { t:'（再问一遍热水器的事）', go:'g1' },
            { t:'你真一直蹲在水房门口？', go:'g2' },
            { t:'打扰了',               go:'g3' } ]},
      g1: { text:'热水器坏了，别去接。你记性真差。', end:'g' },
      g2: { text:'这儿凉快。你有意见？',            end:'g' },
      g3: { text:'嗯。',                            end:'g' }
    }
  },

  /* 路标：就一句话，指个方向。again 和 start 同一句 —— 重复问就重复答，
     不写两套文案，省得改一处忘一处 */
  hint_shui:     { start:'s', again:'s', nodes:{ s:{ text:'你找 lg7 啊？往南边那条路走，水房门口。', end:true }}},
  hint_logic:    { start:'s', again:'s', nodes:{ s:{ text:'lg7？刚看见他往水房那边去了。', end:true }}},
  hint_laoli:    { start:'s', again:'s', nodes:{ s:{ text:'找 lg7？他这会儿估计又在水房门口蹲着了。', end:true }}},
  hint_teacher:  { start:'s', again:'s', nodes:{ s:{ text:'上课铃还没响，别在楼里跑。', end:true }}},
  hint_dean:     { start:'s', again:'s', nodes:{ s:{ text:'校服拉链拉上。……还有，别在广场上追跑打闹。', end:true }}},
  hint_duty:     { start:'s', again:'s', nodes:{ s:{ text:'同学，你哪个班的？……算了，走吧走吧。', end:true }}},
  hint_deskmate: { start:'s', again:'s', nodes:{ s:{ text:'你看见我橡皮了吗……刚才还在这儿的。', end:true }}}
};
/* 说话的人是谁：名字和立绘都从 CHARS 里查。
   广播/旁白没有 face，就只显示名字 */
function speaker(id){
  for (var i=0;i<CHARS.length;i++) if (CHARS[i].id===id) return CHARS[i];
  return null;
}

/* ==================== 画布 ==================== */
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1, camX = 0, camY = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.imageSmoothingEnabled = false;      // 像素画不许插值
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* ==================== 状态 ==================== */
var M = {
  screen:'title',            // title | pick | play
  me:null,                   // 玩家选的角色
  p:{ x:0, y:0, dir:'down', anim:0, moving:false },
  npcs:[],
  talk:{ open:false, npc:null, nodeId:null, sel:0, script:null, typed:0, cool:0 },
  talked:{}, reentry:{},
  t:0
};
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ==================== 开局 ==================== */
function startWalk(charId){
  buildMap();
  var me = null;
  CHARS.forEach(function(c){ if (c.id===charId) me = c; });
  M.me = me;
  /* 玩家选谁，谁就不作为 NPC 出现 —— 不然会撞见自己 */
  M.npcs = NPCS.filter(function(n){ return n.id !== charId; }).map(function(n){
    return { id:n.id, face:n.face, talk:n.talk, tx:n.tx, ty:n.ty,
             x:n.tx*TILE+TILE/2, y:n.ty*TILE+TILE/2, dir:n.face, anim:0 };
  });
  M.p.x = 25*TILE + TILE/2;  M.p.y = 30*TILE + TILE/2;
  M.p.dir = 'up'; M.p.anim = 0;
  M.talk = { open:false, npc:null, nodeId:null, sel:0, script:null, typed:0, cool:0 };
  M.talked = {}; M.reentry = {}; M.t = 0;
  M.screen = 'play';
  show(null);
  document.getElementById('where').style.display = '';
  hintEl.classList.remove('on');
  actEl.classList.add('on');
  if (hasTouch) stickEl.classList.add('on');
  resize();
}

/* ==================== 输入 ==================== */
var keys = {};
var hasTouch = ('ontouchstart' in window);
window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (e.repeat) return;                       // 按住不放不该连发
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0) e.preventDefault();
  if (M.screen !== 'play') return;
  if (k==='z' || k===' ' || k==='enter'){ pressAct(); return; }
  if (M.talk.open){
    if (k==='arrowup'   || k==='w') moveSel(-1);
    if (k==='arrowdown' || k==='s') moveSel(1);
    if (k>='1' && k<='3') pickOpt(parseInt(k,10)-1);
    return;
  }
  keys[k] = true;
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

var stickEl = document.getElementById('stick'), knobEl = document.getElementById('knob');
var stick = { on:false, id:null, bx:0, by:0, dx:0, dy:0, r:56 };
function stickStart(x,y,id){
  stick.on=true; stick.id=id; stick.bx=x; stick.by=y; stick.dx=0; stick.dy=0;
  stickEl.classList.add('on');
  stickEl.style.cssText += ';left:'+(x-stick.r)+'px;top:'+(y-stick.r)+'px;width:'+(stick.r*2)+
    'px;height:'+(stick.r*2)+'px;border-radius:50%;background:rgba(120,113,108,.3);'+
    'border:2px solid rgba(200,190,170,.45);';
  knobEl.style.cssText = 'width:50px;height:50px;border-radius:50%;background:rgba(232,163,61,.85);'+
    'position:absolute;left:50%;top:50%;';
  moveKnob(0,0);
}
function moveKnob(dx,dy){
  knobEl.style.transform = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
}
function stickMove(x,y){
  var dx=x-stick.bx, dy=y-stick.by, d=Math.hypot(dx,dy);
  if (d>stick.r){ dx=dx/d*stick.r; dy=dy/d*stick.r; }
  stick.dx=dx/stick.r; stick.dy=dy/stick.r; moveKnob(dx,dy);
}
function stickEnd(){
  stick.on=false; stick.id=null; stick.dx=0; stick.dy=0;
  stickEl.classList.remove('on');
}
cv.addEventListener('touchstart', function(e){
  if (M.screen!=='play' || M.talk.open) return;
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (!stick.on && t.clientX < W*0.5) stickStart(t.clientX, t.clientY, t.identifier);
  }
}, {passive:false});
cv.addEventListener('touchmove', function(e){
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (stick.on && t.identifier===stick.id) stickMove(t.clientX, t.clientY);
  }
}, {passive:false});
function touchDone(e){
  for (var i=0;i<e.changedTouches.length;i++)
    if (e.changedTouches[i].identifier===stick.id) stickEnd();
}
cv.addEventListener('touchend', touchDone);
cv.addEventListener('touchcancel', touchDone);

var actEl = document.getElementById('act'), hintEl = document.getElementById('hint');
actEl.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); pressAct(); }, {passive:false});
actEl.addEventListener('mousedown', function(e){ e.preventDefault(); pressAct(); });

/* ==================== 交互 ==================== */
function nearNpc(){
  var best = null, bd = TALK_R;
  M.npcs.forEach(function(n){
    var d = Math.hypot(n.x - M.p.x, n.y - M.p.y);
    if (d < bd){ bd = d; best = n; }        // 同时挨着两个人时取最近的
  });
  return best;
}
function pressAct(){
  if (M.screen !== 'play') return;
  if (M.talk.open){ advanceOrChoose(); return; }   // 开着就先推进，不会再开一次
  if (M.talk.cool > 0) return;
  var n = nearNpc();
  if (n) openTalk(n);                              // 附近没人就什么也不做
}

/* ==================== 对话流程 ==================== */
function entryOf(n){
  var s = TALK[n.talk];
  if (!s) return null;
  if (!M.talked[n.id]) return (s.entry && s.entry[M.me.id]) || s.start;
  return M.reentry[n.id] || s.again || s.start;
}
function openTalk(n){
  var s = TALK[n.talk];
  if (!s) return;
  M.talk.script = s;
  M.talk.npc = n;
  M.talk.open = true;
  stickEnd();
  actEl.classList.remove('on');
  dlgEl.classList.add('on');
  /* 转身面向对方 —— 很便宜，但一下就"对上眼"了 */
  M.p.dir = faceTowards(M.p.x, M.p.y, n.x, n.y);
  gotoNode(entryOf(n));
}
function closeTalk(){
  var n = M.talk.npc;
  if (n){
    M.talked[n.id] = true;
    var node = M.talk.script.nodes[M.talk.nodeId];
    if (node && typeof node.end === 'string') M.reentry[n.id] = node.end;
  }
  M.talk.open = false;
  M.talk.npc = null; M.talk.nodeId = null;
  M.talk.cool = 0.2;                      // 关掉之后 0.2 秒内不许再开，防手抖
  dlgEl.classList.remove('on');
  if (hasTouch) actEl.classList.add('on');
}
function gotoNode(id){
  var node = M.talk.script.nodes[id];
  if (!node){ closeTalk(); return; }      // 指到不存在的节点就当聊完，别卡死
  M.talk.nodeId = id;
  M.talk.typed = 0;                       // 打字机从头开始
  M.talk.sel = 0;
  renderNode();
}
function renderNode(){
  var node = M.talk.script.nodes[M.talk.nodeId];
  var who = M.talk.npc.id;
  var sp = speaker(who);
  dlgWho.textContent = sp ? sp.name : who;
  dlgTxt.textContent = '';
  dlgMore.classList.remove('on');
  var im = PORTRAIT_IMG[who];
  dlgAv.src = im ? im.src : 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(PORTRAIT[who] || '');
  optsEl.innerHTML = '';
  if (node.opts){
    node.opts.forEach(function(o, i){
      var li = document.createElement('li');
      li.innerHTML = '<span class="k">' + (i+1) + '.</span>' + escapeHTML(o.t);
      li.addEventListener('click', function(e){ e.stopPropagation(); choose(i); });
      optsEl.appendChild(li);
    });
    markSel();
  }
  full = node.text;
}
var full = '', optsEl = document.getElementById('dlgOpts');
var dlgEl = document.getElementById('dlg'), dlgBox = document.getElementById('dlgBox'),
    dlgWho = document.getElementById('dlgWho'), dlgTxt = document.getElementById('dlgTxt'),
    dlgAv = document.getElementById('dlgAv'), dlgMore = document.getElementById('dlgMore');
function escapeHTML(s){
  return String(s).replace(/[&<>]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; });
}
function nodeDone(){ return M.talk.typed >= full.length; }
function advanceOrChoose(){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node) { closeTalk(); return; }
  if (!nodeDone()){ M.talk.typed = full.length; drawText(); return; }  // 没出完就先出完
  if (node.opts) { choose(M.talk.sel); return; }                      // 有选项必须先选
  if (node.next) { gotoNode(node.next); return; }
  closeTalk();
}
function choose(i){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node.opts || !node.opts[i]) return;
  gotoNode(node.opts[i].go);
}
function moveSel(d){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node.opts) return;
  var n = node.opts.length;
  M.talk.sel = (M.talk.sel + d + n) % n;
  markSel();
}
function pickOpt(i){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (node.opts && node.opts[i]) choose(i);
}
function markSel(){
  for (var i=0;i<optsEl.children.length;i++)
    optsEl.children[i].classList.toggle('sel', i === M.talk.sel);
}
function drawText(){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node) return;
  var s = full.slice(0, Math.floor(M.talk.typed));
  dlgTxt.textContent = s;
  dlgMore.classList.toggle('on', s.length >= full.length && !node.opts);
}
/* 点对话框本身也推进 —— 手机上没键盘空格，这条是必须的 */
dlgEl.addEventListener('click', function(){ if (M.talk.open) advanceOrChoose(); });

/* ==================== 每帧 ==================== */
function faceTowards(x1,y1,x2,y2){
  var dx = x2-x1, dy = y2-y1;
  if (Math.abs(dx) > Math.abs(dy)) return dx>0 ? 'right' : 'left';
  return dy>0 ? 'down' : 'up';
}
function canWalk(x, y){
  /* 只看脚下一小圈，别用整个身位 —— 小人窄，用大半径会卡在门口进不去 */
  var r = 8;
  var pts = [[x-r,y], [x+r,y], [x,y-r+6], [x,y+r]];
  for (var i=0;i<pts.length;i++){
    if (solidAt(Math.floor(pts[i][0]/TILE), Math.floor(pts[i][1]/TILE))) return false;
  }
  return true;
}
var SPD = 108;
function update(dt){
  M.t += dt;
  if (M.talk.cool > 0) M.talk.cool = Math.max(0, M.talk.cool - dt);

  /* 打字机：按字走，不是按帧 */
  if (M.talk.open && !nodeDone()){
    M.talk.typed = Math.min(full.length, M.talk.typed + dt*40);
    drawText();
  }

  var mvx = 0, mvy = 0;
  if (M.screen === 'play' && !M.talk.open){
    if (keys['a']||keys['arrowleft'])  mvx -= 1;
    if (keys['d']||keys['arrowright']) mvx += 1;
    if (keys['w']||keys['arrowup'])    mvy -= 1;
    if (keys['s']||keys['arrowdown'])  mvy += 1;
    mvx += stick.dx; mvy += stick.dy;
  }
  var mag = Math.hypot(mvx, mvy);
  M.p.moving = mag > 0.15;
  if (M.p.moving){
    mvx /= mag; mvy /= mag;
    var nx = M.p.x + mvx*SPD*dt, ny = M.p.y + mvy*SPD*dt;
    /* 分轴判定：贴着墙走的时候能顺墙滑，不会整个人卡住 */
    if (canWalk(nx, M.p.y)) M.p.x = nx;
    if (canWalk(M.p.x, ny)) M.p.y = ny;
    M.p.dir = (Math.abs(mvx) > Math.abs(mvy)) ? (mvx>0?'right':'left') : (mvy>0?'down':'up');
    M.p.anim += dt;
  } else {
    M.p.anim = 0;
  }

  /* 走近了就转过来看你 */
  var near = nearNpc();
  M.npcs.forEach(function(n){
    if (n === near && !M.talk.open) n.dir = faceTowards(n.x, n.y, M.p.x, M.p.y);
  });
  M.near = near;

  hintEl.classList.toggle('on', !!near && !M.talk.open);
  if (near && !M.talk.open)
    hintEl.textContent = (hasTouch ? '按右下角圆键' : '按 Z 或空格') + ' 跟 ' + speaker(near.id).name + ' 说话';

  var t = tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE));
  whereEl.textContent = TERRAIN[t].name;
}
var whereEl = document.getElementById('where');

/* ==================== 画 ==================== */
/* 走路的帧序列：站-左-站-右 循环。三张图做出四拍，比纯 A/B 顺 */
var CYCLE = [0,1,0,2];
function drawSprite(id, x, y, dir, anim, moving, scale){
  var frames = SPRITE_IMG[id] && SPRITE_IMG[id][dir];
  if (!frames) return;
  var f = moving ? CYCLE[Math.floor(anim*7) % 4] : 0;
  var im = frames[f] || frames[0];
  if (!im) return;
  var w = 16*scale, h = 24*scale;
  /* (x,y) 是脚底。图是 16×24、脚在最后一行的下沿，所以往上顶一整张图 */
  cx.drawImage(im, Math.round(x - w/2), Math.round(y - h), w, h);
}
function drawTile(t, sx, sy){
  var d = TERRAIN[t];
  cx.fillStyle = d.c;
  cx.fillRect(sx, sy, TILE, TILE);
  /* 两格一深做点纹理。纯色地板一片死板，人会显得像贴纸 */
  cx.fillStyle = d.c2;
  if (((sx/TILE) + (sy/TILE)) % 2 === 0) cx.fillRect(sx, sy, TILE, TILE);
  if (t === 'tree'){
    cx.fillStyle = '#3f5f30';
    cx.beginPath(); cx.arc(sx+TILE/2, sy+TILE/2, TILE*0.42, 0, 7); cx.fill();
    cx.fillStyle = '#5f8a45';
    cx.beginPath(); cx.arc(sx+TILE/2-3, sy+TILE/2-3, TILE*0.33, 0, 7); cx.fill();
  } else if (t === 'bench'){
    cx.fillStyle = '#8f6333';
    cx.fillRect(sx+3, sy+10, TILE-6, TILE-16);
    cx.fillStyle = '#a8763f';
    cx.fillRect(sx+3, sy+8, TILE-6, 5);
  } else if (t === 'planter'){
    cx.fillStyle = '#6f7d4e';
    cx.beginPath(); cx.arc(sx+TILE/2, sy+TILE/2, TILE*0.34, 0, 7); cx.fill();
  }
}
function render(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.imageSmoothingEnabled = false;
  cx.fillStyle = '#12100e';
  cx.fillRect(0,0,W,H);
  if (!M.me) return;

  camX = clamp(M.p.x - W/2, 0, Math.max(0, MAPW*TILE - W));
  camY = clamp(M.p.y - H/2, 0, Math.max(0, MAPH*TILE - H));
  cx.save();
  cx.translate(-Math.round(camX), -Math.round(camY));

  var x0 = Math.floor(camX/TILE), x1 = Math.min(MAPW-1, Math.ceil((camX+W)/TILE));
  var y0 = Math.floor(camY/TILE), y1 = Math.min(MAPH-1, Math.ceil((camY+H)/TILE));
  for (var y=y0; y<=y1; y++)
    for (var x=x0; x<=x1; x++) drawTile(MAP[y][x], x*TILE, y*TILE);

  /* 小人按 y 排序再画，下面的挡住上面的 —— 就这一点就分出前后了 */
  var order = M.npcs.slice();
  order.push({ id:'__me', me:true, x:M.p.x, y:M.p.y });
  order.sort(function(a,b){ return a.y - b.y; });
  order.forEach(function(o){
    if (o.me){
      drawSprite(M.me.id, M.p.x, M.p.y, M.p.dir, M.p.anim, M.p.moving, 2);
    } else {
      /* NPC 站着不动。给过它一个周期性小动作，结果看着像抽搐，就去掉了 */
      drawSprite(o.id, o.x, o.y, o.dir, 0, false, 2);
      if (M.near === o && !M.talk.open){
        cx.fillStyle = '#e8a33d';
        cx.font = '700 20px system-ui,sans-serif';
        cx.textAlign = 'center';
        cx.fillText('!', o.x, o.y - 52 + Math.sin(M.t*4)*3);
        cx.strokeStyle = 'rgba(232,163,61,.85)'; cx.lineWidth = 2; cx.setLineDash([4,4]);
        cx.beginPath(); cx.ellipse(o.x, o.y+4, 18, 7, 0, 0, 7); cx.stroke();
        cx.setLineDash([]);
      }
    }
  });
  cx.restore();
}

/* ==================== 主循环 ==================== */
var lastT = 0;
function loop(ts){
  var dt = lastT ? Math.min((ts-lastT)/1000, 0.05) : 0;
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ==================== 屏幕 ==================== */
function show(el){
  var all = document.querySelectorAll('.screen');
  for (var i=0;i<all.length;i++) all[i].classList.remove('on');
  if (el) el.classList.add('on');
}
var pickList = document.getElementById('pickList');
var CAST = ['laoli', 'shui', 'logic'];       // 能选的三个
function buildPick(){
  pickList.innerHTML = '';
  CAST.forEach(function(id){
    var c = speaker(id);
    var d = document.createElement('div');
    d.className = 'pick';
    var im = PORTRAIT_IMG[id];
    d.innerHTML = '<div class="top"><img src="' + (im ? im.src : '') + '" alt="">' +
      '<div><div class="nm">' + c.name + '</div><div class="tg">' + c.tag + '</div></div></div>' +
      '<div class="ds">' + PICK_NOTE[id] + '</div>';
    d.addEventListener('click', function(){ startWalk(id); });
    pickList.appendChild(d);
  });
  show(document.getElementById('scPick'));
}
var PICK_NOTE = {
  laoli: '走路不快不慢，谁都认识。',
  shui:  '老实人，走哪儿都没人拦。',
  logic: '刚跟 lg7 说过话，多少知道点。'
};
document.getElementById('btnStart').addEventListener('click', function(){
  /* 立绘是异步光栅化的，可能还没好 —— 等一下再建卡片，免得空图 */
  setTimeout(buildPick, 120);
});
whereEl.style.display = 'none';

/* ==================== 调试钩子 ====================
   仿 ?emoji 的先例。没有测试框架，无头浏览器里全靠它把状态带出来：
   ?probe=1     直接开局，把 NPC 名单和几个关键状态打到 #probe
   ?probe=lint  把对话图整张走一遍，检查有没有指到不存在的节点（断链）
   ?probe=walk  从开局连按 20 次，看整条链能不能走完不卡死
   @x / @y      ?x=20&y=25 覆盖出生点（截图定位用，省得手动走）
   ============================================ */
(function probe(){
  var q = location.search;
  var m = /[?&]probe=(\w+)/.exec(q);
  if (!m) return;
  var mode = m[1];
  var out = [];
  setTimeout(function(){
    /* 选人页只有在点了「出门」之后才出现，无头截图点不了按钮，
       所以给它一个直接跳过去的开关 */
    if (mode === 'pick'){ buildPick(); return; }
    startWalk('laoli');
    /* ?x=&y= 把出生点挪到指定格 —— 截图要看某个地方时省得手动走过去 */
    var mx = /[?&]x=(\d+)/.exec(q), my = /[?&]y=(\d+)/.exec(q);
    if (mx) M.p.x = (+mx[1])*TILE + TILE/2;
    if (my) M.p.y = (+my[1])*TILE + TILE/2;
    if (mode === 'dlg'){
      /* 直接站到 lg7 面前把对话框开出来，截图核对排版 */
      var n0 = M.npcs[0];
      M.p.x = n0.x; M.p.y = n0.y + 30;
      openTalk(n0);
      M.talk.typed = 6;                    // 出几个字就够看排版了，不用等打完
      drawText();
    }
    if (mode === 'map'){
      /* 从出生点洪泛一遍：走不到的人 = 地图改错了（谁被封在墙里了）。
         手画地图最容易犯的就是这个，肉眼看不出来 */
      /* 这个变量千万不能叫 q —— var 是函数作用域，名字撞上外层那个
         location.search 的话会被提升到回调顶部，把外层遮成 undefined */
      var seen2 = {}, queue = [[Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)]];
      seen2[queue[0][0]+','+queue[0][1]] = 1;
      while (queue.length){
        var c = queue.shift();
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
          var nx = c[0]+d[0], ny = c[1]+d[1], k = nx+','+ny;
          if (nx<0||ny<0||nx>=MAPW||ny>=MAPH||seen2[k]) return;
          if (solidAt(nx,ny)) return;
          seen2[k] = 1; queue.push([nx,ny]);
        });
      }
      var spawn = tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE));
      var dead = M.npcs.filter(function(n){ return !seen2[n.tx+','+n.ty]; })
                      .map(function(n){ return n.id+'@'+n.tx+','+n.ty; });
      out.push('出生点脚下=' + spawn + (TERRAIN[spawn].solid ? ' ← 出生在墙里！' : ''));
      out.push('能走到=' + Object.keys(seen2).length + ' 格');
      out.push(dead.length ? ('走不到 ' + dead.length + ' 个: ' + dead.join(' ')) : '所有人都走得到');
    }
    if (mode === 'lint'){
      var bad = [];
      Object.keys(TALK).forEach(function(k){
        var s = TALK[k], ids = Object.keys(s.nodes);
        ids.forEach(function(nid){
          var nd = s.nodes[nid];
          if (nd.next && !s.nodes[nd.next]) bad.push(k+'.'+nid+' → next '+nd.next+' 不存在');
          if (nd.opts) nd.opts.forEach(function(o){
            if (!s.nodes[o.go]) bad.push(k+'.'+nid+' → 选项 '+o.go+' 不存在');
          });
          if (typeof nd.end === 'string' && !s.nodes[nd.end])
            bad.push(k+'.'+nid+' → end '+nd.end+' 不存在');
          if (!nd.next && !nd.opts && !nd.end) bad.push(k+'.'+nid+' 是死胡同');
        });
        ['start','again'].forEach(function(key){
          if (s[key] && !s.nodes[s[key]]) bad.push(k+'.'+key+' 指向不存在的节点');
        });
        if (s.entry) Object.keys(s.entry).forEach(function(cid){
          if (!s.nodes[s.entry[cid]]) bad.push(k+'.entry.'+cid+' 指向不存在的节点');
        });
      });
      out.push(bad.length ? ('断链 '+bad.length+' 处: '+bad.join(' | ')) : '对话图没问题');
    } else {
      out.push('玩家=' + M.me.id);
      out.push('玩家在格=' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) +
               ' (' + tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)) + ')');
      out.push('q=' + q + ' x=' + (/([?&]x=(\d+))/.exec(q)||['无'])[2] +
               ' y=' + (/([?&]y=(\d+))/.exec(q)||['无','无'])[2]);
      out.push('NPC=' + M.npcs.map(function(n){ return n.id; }).join(','));
      var self = M.npcs.filter(function(n){ return n.id === M.me.id; }).length;
      out.push('自己当NPC次数=' + self + (self ? ' ← 不对！' : ''));
      out.push('可走图例=' + whereEl.textContent);
      if (mode === 'walk'){
        var seen = [], guard = 0;
        M.p.x = M.npcs[0].x; M.p.y = M.npcs[0].y + 20;      // 站到第一个 NPC 跟前
        openTalk(M.npcs[0]);
        while (M.talk.open && guard++ < 40){
          seen.push(M.talk.nodeId);
          M.talk.typed = 1e9;                                // 跳过打字机
          advanceOrChoose();
        }
        out.push('走完的节点: ' + seen.join(' → '));
        out.push('最后 talk.open=' + M.talk.open + (M.talk.open ? ' ← 卡住了' : ''));
        /* 再聊一次，应该进 again 那支 */
        openTalk(M.npcs[0]);
        out.push('再聊进到: ' + M.talk.nodeId);
        M.talk.open = false;
      }
    }
    var pre = document.getElementById('probe');
    pre.textContent = 'PROBE ' + out.join(' || ');
  }, 700);
})();

/* ==================== 起飞 ====================
   地图必须在起飞前就建好。它是空的时侯 tileAt 会读到 undefined，
   而 tileAt 每帧都调 —— 上一版就是在主循环第一帧崩掉，整个画面全黑。 */
buildMap();
resize();
requestAnimationFrame(loop);
</script>

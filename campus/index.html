/* ==================== 线索本 ====================
   内容全从 FLAGS 推出来：旗标一立，本子上就多一条。
   所以加剧情不用碰这段，往 CLUES 里添一行就行。
   ============================================ */
var bookEl = document.getElementById('scBook'), bookList = document.getElementById('bookList');
function buildBook(){
  var h = '';
  /* 先摆"这一趟要做的事"：差哪几件一眼看得见。
     支线用空心圈标出来 —— 主线不做走不下去，支线是真可以不做，
     可玩家得知道它在那儿 */
  var ch = chapterNow(), P = progressNow();
  var rows = TASKS.filter(function(T){ return T.ch === ch && taskVisible(T); });
  h += '<h3>第 ' + ch + ' 段　' + P.d + '/' + P.n + '</h3>';
  h += rows.map(function(T){
    var done = taskDone(T);
    return '<p>' + (done ? '✓' : (T.opt ? '○' : '·')) + '　' +
           '<b>' + escapeHTML(T.t) + '</b>' +
           (done ? '' : (T.opt ? '　<span class="opt">（支线）</span>' : '')) + '</p>';
  }).join('') || '<p class="dim">这一趟没别的了。</p>';

  /* 查过的事：六栋楼各一处，查清几处决定你最后能拿到哪一档
     —— 0～1 只是逃出去，2～4 知道经过，5～6 能进去把事了掉 */
  var mine = sideMine(), got = invCount();
  h += '<h3>查过的事　' + got + '/6　（' +
       ['', '还只是逃出去', '能知道经过', '能了掉这件事'][invTier()] + '）</h3>';
  h += mine.map(function(s){
    var done = flagOn(sideFlag(s));
    return '<p>' + (done ? '✓' : '○') + '　<b>' + escapeHTML(s.b) + '</b>　' +
           escapeHTML(s.t) + (done ? '' : '　<span class="opt">（还没去）</span>') + '</p>';
  }).join('');

  var clues = Object.keys(CLUES).filter(function(k){ return flagOn(k); });
  h += '<h3>线索</h3>';
  h += clues.length
    ? clues.map(function(k){
        return '<p><b>' + escapeHTML(k) + '</b>　' + escapeHTML(CLUES[k]) + '</p>'; }).join('')
    : '<p class="dim">还什么都没捡到。</p>';
  /* 见过的人跨所有图算 —— 在二楼聊过的，回楼下也得算 */
  var met = CHARS.filter(function(c){ return flagOn('见过:' + c.id); });
  h += '<h3>见过的人</h3>';
  h += met.length
    ? met.map(function(c){
        return '<p><b>' + escapeHTML(c.name) + '</b>　' + escapeHTML(c.tag) + '</p>'; }).join('')
    : '<p class="dim">还没跟谁说过话。</p>';
  bookList.innerHTML = h;
}
function openBook(){
  if (M.screen !== 'play' || M.talk.open || M.book) return;
  M.book = true;
  buildBook();
  bookEl.classList.add('on');
  stickEnd();
  actEl.classList.remove('on'); runEl.classList.remove('on');
  bookBtn.classList.remove('on'); fastBtn.classList.remove('on');
}
function closeBook(){
  M.book = false;
  bookEl.classList.remove('on');
  actEl.classList.add('on'); runEl.classList.add('on');
  bookBtn.classList.add('on'); fastBtn.classList.add('on');
}
var bookBtn = document.getElementById('btnBook');
bookBtn.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); openBook(); }, {passive:false});
bookBtn.addEventListener('mousedown', function(e){ e.preventDefault(); openBook(); });
document.getElementById('btnBookClose').addEventListener('click', closeBook);
bookEl.addEventListener('click', function(e){ if (e.target === bookEl) closeBook(); });

/* ==================== 测试加速 ====================
   按「疾」或者 G 循环：普通 → 3× → 8×。
   这是我自己调地图、试剧情用的外挂，不是玩法的一部分 ——
   地图八十格宽，一趟趟走过去太慢了。
   ============================================ */
var TEST_SPEEDS = [1, 3, 8];
var fastBtn = document.getElementById('btnFast');
function cycleFast(){
  M.fast = ((M.fast || 0) + 1) % TEST_SPEEDS.length;
  fastBtn.classList.toggle('x2', M.fast === 1);
  fastBtn.classList.toggle('x3', M.fast === 2);
  fastBtn.textContent = M.fast ? TEST_SPEEDS[M.fast] + '×' : '疾';
}
fastBtn.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); cycleFast(); }, {passive:false});
fastBtn.addEventListener('mousedown', function(e){ e.preventDefault(); cycleFast(); });
var toastEl = document.getElementById('toast');

/* ==================== 交互 ==================== */
function nearNpc(){
  var best = null, bd = TALK_R;
  M.npcs.forEach(function(n){
    var d = Math.hypot(n.x - M.p.x, n.y - M.p.y);
    if (d < bd){ bd = d; best = n; }        // 同时挨着两个人时取最近的
  });
  return best;
}
/* 走近多少像素算"够得着这个实物"。比说话的距离再宽一点 ——
   挂在墙上的东西，人站在前面一格就该够得着 */
var OBJ_R = 52;
function objKey(O){ return '@obj:' + M.map + ':' + (O._i === undefined ? O.x + ',' + O.y : O._i); }
/* 这东西现在能不能动：条件到没到、是不是已经被拿走了。
   注意：动过一次（once）的东西不算"不能动" —— 看过的线索还得能再看。
   原来这里把 once 的直接判死，于是"触发一次就再也看不了"，
   漏看一行就得重开一局，非常难受。 */
/* 条件可以写数组：全都得成立（"是:laoli" 且 "可以走动了" 那种） */
function flagAll(f){
  if (!f) return true;
  if (typeof f === 'object' && f.length){
    for (var i=0;i<f.length;i++) if (!flagOn(f[i])) return false;
    return true;
  }
  return flagOn(f);
}
function objLive(O){
  if (!O) return false;
  if (O.if && !flagAll(O.if)) return false;
  if (O.gone && FLAGS[objKey(O)]) return false;
  /* 顺序谜题：每一块都能按。
     按了先认字（永久记住），顺序对不对是 runBeat 那边管的事 ——
     "挨个擦开看看底下是什么字"本来就是这一关的解法之一，
     不让按的话，玩家连哪块是什么字都摸不到 */

  /* 开过的门就不再是个"能按的东西"了 —— 那一格已经通了 */
  if (O.auto && doorOpen(O.x, O.y)) return false;
  return true;
}
/* 已经动过一次了？那再按就只重念一遍，不再改剧情。
   顺序谜题（六块苔）不算 —— 擦错顺序以后要能重新擦一遍，
   按了只重念不动手的话，那面墙就永远擦不完了。
   那个小便池也不算：憋着这件事会来第二趟。 */
function objSpent(O){ return !!(O.once && FLAGS[objKey(O)]); }
/* 顺序谜题不适用"重看" —— 它每次都得真跑一遍，
   不然按错一次（字认下来了），那块就被当成"看过了"，顺序再也推不动 */
function objReplayable(O){ return objSpent(O) && O.seq === undefined; }
function nearObj(){
  var best = null, bd = 1e9;
  allObjs().forEach(function(O){
    if (!objLive(O)) return;
    /* 量的是这一格，不是画上去的位置 —— ox/oy 只是画的时候抬多高，
       算进来就会让挂墙上的东西够不着（抬 22px 就等于远了 22px） */
    var ox = O.x*TILE + TILE/2, oy = O.y*TILE + TILE/2;
    var d = Math.hypot(ox - M.p.x, oy - M.p.y);
    if (d < (O.near || OBJ_R) && d < bd){ bd = d; best = O; }
  });
  return best;
}
/* 人和东西都挨着的时候，谁近算谁 */
function thingNear(){
  var n = nearNpc(), o = nearObj();
  if (n && o){
    var dn = Math.hypot(n.x - M.p.x, n.y - M.p.y);
    var doo = Math.hypot(o.x*TILE + TILE/2 - M.p.x, o.y*TILE + TILE/2 - M.p.y);
    return dn <= doo ? { npc:n } : { obj:o };
  }
  if (n) return { npc:n };
  if (o) return { obj:o };
  return null;
}
/* 按 E 动一个实物。走的是和触发区同一条效果管线。
   动过的还能再动一次 —— 只是那一次只把话重念一遍 */
function pressObj(O){
  if (M.boss && O && O.talk === 'rs_frog'){ bossHit(); return; }
  if (!objLive(O)) return;
  var k = objKey(O);
  if (objReplayable(O) && O.talk){
    M.replay = true;
    if (!openScript(O.talk)) M.replay = false;
    M.replay = false;
    M.talk.cool = Math.max(M.talk.cool, 0.15);
    return;
  }
  runBeat(O, k, true);
  M.talk.cool = Math.max(M.talk.cool, 0.15);
}
function pressAct(){
  if (M.screen !== 'play') return;
  if (M.talk.open){ advanceOrChoose(); return; }   // 开着就先推进，不会再开一次
  if (M.talk.cool > 0) return;
  var t = thingNear();
  if (!t) return;                                  // 附近没人也没东西，就什么也不做
  if (t.npc) openTalk(t.npc); else pressObj(t.obj);
}

/* ==================== 数字键盘 ====================
   节点上写 ask:{ key:'19', len:2, to:'ok', ask:'照片上一共几个人？' } ——
   念到这一句，屏幕下方冒出一个键盘，你得把数出来的数字打进去。
   打对了走 to，打错了清空重来。
   ============================================ */
var padEl = document.getElementById('pad');
function showPad(node){
  var A = node.ask;
  M.pad = { len: A.len || 3, buf: '', key: String(A.key), to: A.to, ask: A.ask || '' };
  padEl.querySelector('.ask').textContent = A.ask || '';
  drawPad();
  padEl.classList.add('on');
  dlgEl.classList.add('padup');            // 对话框往上让一格
}
function drawPad(){
  var P = M.pad; if (!P) return;
  padEl.querySelector('.buf').textContent = P.buf.split('').join(' ');
  var ks = padEl.querySelector('.keys');
  if (ks.childNodes.length) return;                 // 建一次就够
  ['1','2','3','4','5','6','7','8','9','退','0','定'].forEach(function(k){
    var b2 = document.createElement('button');
    b2.type = 'button'; b2.textContent = k;
    b2.addEventListener('click', function(e){ e.stopPropagation(); padKey(k); });
    ks.appendChild(b2);
  });
}
function padKey(k){
  var P = M.pad; if (!P) return;
  if (k === '退'){ P.buf = P.buf.slice(0, -1); }
  else if (k === '定'){
    if (P.buf === P.key){ hidePad(); sfxPick(); gotoNode(P.to); }
    else { P.buf = ''; toast('（不对。再数一遍。）', 1.6); }
  }
  else if (P.buf.length < P.len){ P.buf += k; sfxBlip(); }
  drawPad();
}
function hidePad(){
  M.pad = null;
  if (padEl) padEl.classList.remove('on');
  if (dlgEl) dlgEl.classList.remove('padup');
}
padEl.addEventListener('click', function(e){ e.stopPropagation(); });

/* ==================== 对话流程 ==================== */
function entryOf(n){
  var s = TALK[n.talk];
  if (!s) return null;
  /* 进度分支：按顺序挑第一个条件成立的 —— 用来做"先去做 X，回来他就换话" */
  if (s.entryBy) for (var i=0;i<s.entryBy.length;i++){
    var e = s.entryBy[i];
    if (!e.if || flagOn(e.if)) return e.go;
  }
  if (!M.talked[n.id]) return (s.entry && s.entry[M.me.id]) || s.start;
  return M.reentry[n.id] || s.again || s.start;
}
function firstNode(s){ return Object.keys(s.nodes)[0]; }
function beginScript(name, who){
  var s = TALK[name];
  if (!s) return false;
  M.talk.script = s;
  M.talk.who = who || null;
  M.talk.open = true;
  stickEnd();
  actEl.classList.remove('on'); runEl.classList.remove('on');
  bookBtn.classList.remove('on'); fastBtn.classList.remove('on');
  dlgEl.classList.add('on');
  return true;
}
function openTalk(n){
  if (!beginScript(n.talk, n.id)) return;
  M.talk.npc = n;
  /* 转身面向对方 —— 很便宜，但一下就"对上眼"了 */
  M.p.dir = faceTowards(M.p.x, M.p.y, n.x, n.y);
  gotoNode(entryOf(n));
}
/* 旁白走这条：没有脸、没有名字，就是一段字。
   触发区、捡到东西、走到某处看见什么，全用它 */
function openScript(name){
  if (!beginScript(name, null)) return;
  M.talk.npc = null;
  gotoNode(M.talk.script.start || firstNode(M.talk.script));
}
function closeTalk(){
  var n = M.talk.npc;
  if (n && M.talk.script){
    M.talked[n.id] = true;
    setFlag('见过:' + n.id);              // 线索本要用：见过谁
    var node = M.talk.script.nodes[M.talk.nodeId];
    if (node && typeof node.end === 'string') M.reentry[n.id] = node.end;
  }
  M.talk.open = false;
  M.talk.npc = null; M.talk.nodeId = null;
  M.talk.cool = 0.2;                      // 关掉之后 0.2 秒内不许再开，防手抖
  dlgEl.classList.remove('on');
  hidePress(); hidePad();
  actEl.classList.add('on'); runEl.classList.add('on');
  bookBtn.classList.add('on'); fastBtn.classList.add('on');
  /* 有些触发区是"读完这段话就死"（守则里那些不能碰的） */
  if (M.resolveAfter){ M.resolveAfter = false; showOver(endingFor()); return; }
  /* 校门口那场戏完了 —— 全查清的人不进结算，转身回楼里 */
  if (M.showOverAfter){
    M.showOverAfter = false;
    if (invTier() >= 3){ enterResolve(); return; }
    showOver(endingFor());
    return;
  }
  if (M.endAfter){ M.endAfter = false; endChase(); return; }
  if (M.killAfter){
    M.killAfter = false;
    var dm = M.deathMsg || '你破了那条守则。'; M.deathMsg = '';
    die(dm);
    return;
  }
  /* 这段话读完了（而且人还活着）—— 现在才踩存档点，
     话里刚立的旗标全在里头了 */
  if (M.cpPending){ var cpTag = M.cpPending; M.cpPending = null; checkpoint(cpTag); }
}
function gotoNode(id){
  if (!M.talk.script){ closeTalk(); return; }   // 对话已经没了，别硬读
  var node = M.talk.script.nodes[id];
  if (!node){ closeTalk(); return; }      // 指到不存在的节点就当聊完，别卡死
  M.talk.nodeId = id;
  hidePress();                            // 换节点就把上一个按钮收掉
  /* 重看模式：这个东西玩家已经动过了，再按一遍只是把那段话念回来，
     不能再立旗标、不能推时间、更不能触发"读完就死" */
  if (!M.replay){
    if (node.set && !FLAGS[node.set]) sfxPick();
    if (node.set) setFlag(node.set);      // 剧情就是在这儿记下来的
    /* 也有要撤掉的：旗标只能说"是"，说不了"不是"，所以得能清 */
    if (node.clear){
      var cs = (typeof node.clear === 'object') ? node.clear : [node.clear];
      cs.forEach(function(k){ delete FLAGS[k]; });
    }
    /* 答错就死的那种节点：话读完就没了 */
    if (node.clock !== undefined) setClock(node.clock);   // 对话也能推时间
    if (node.kill) M.killAfter = true;
    if (node.killMsg) M.deathMsg = node.killMsg;
    if (node.relieve) relieveUrge();                      // 牢李上完了
    if (node.resolve) M.resolveAfter = true;               // 这声"到"答完就收尾
    if (node.boss) startBoss();                           // 这一句念完就开打
  }
  M.talk.typed = 0;                       // 打字机从头开始
  M.talk.blipAt = 0;
  M.talk.sel = 0;
  renderNode();
}
function renderNode(){
  if (!M.talk.script) return;
  var node = M.talk.script.nodes[M.talk.nodeId];
  /* 标了 card 的节点走全屏场景卡 —— 关键那几句不该缩在角落里 */
  if (node.press) showPress(node);        // 这一句会让屏幕下方冒出一个按钮
  if (node.ask) showPad(node);            // 这一句会冒出数字键盘
  if (node.sh) shake(node.sh);            // 这一句该让画面抖一下
  if (node.stare) M.stare = node.stare;   // 这几秒里，所有人都会看着你
  if (node.card){ card(full2(node), 3.4); return; }
  dlgEl.classList.add('on');
  var who = M.talk.who;                   // 旁白是 null
  var sp = who ? speaker(who) : null;
  dlgWho.textContent = sp ? sp.name : '';
  dlgTxt.textContent = '';
  dlgMore.classList.remove('on');
  var im = who && PORTRAIT_IMG[who];
  dlgAv.style.visibility = sp ? '' : 'hidden';   // 旁白不摆脸
  dlgAv.src = im ? im.src
    : 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent((who && PORTRAIT[who]) || '');
  optsEl.innerHTML = '';
  M.talk.shown = [];                      // 这一屏真显示出来的选项，存的是它们在 node.opts 里的下标
  if (node.opts){
    node.opts.forEach(function(o, i){
      if (o.if && !flagAll(o.if)) return;   // 条件没到，这个选项根本不出现
      M.talk.shown.push(i);
      var li = document.createElement('li');
      li.innerHTML = '<span class="k">' + M.talk.shown.length + '.</span>' + escapeHTML(o.t);
      li.addEventListener('click', function(e){ e.stopPropagation(); choose(i); });
      optsEl.appendChild(li);
    });
    /* 标了 esc 的是"凑过去看个东西"的谜题菜单。
       原来答错只给一句提示、又绕回这一屏 —— 线索没找齐的时候
       屏幕上那几个选项全是错的，人就出不来，只能关页面。
       所以永远给一条退路，而且这条退路本身就是提示 */
    if (node.esc){
      var liX = document.createElement('li');
      liX.innerHTML = '<span class="k">' + (M.talk.shown.length + 1) + '.</span>' +
                      '（先不看了 —— 这栋楼里还有别的东西）';
      liX.addEventListener('click', function(e){ e.stopPropagation(); closeTalk(); });
      optsEl.appendChild(liX);
    }
    markSel();
  }
  full = node.text;
}
var full = '', optsEl = document.getElementById('dlgOpts');
var dlgEl = document.getElementById('dlg'), dlgBox = document.getElementById('dlgBox'),
    dlgWho = document.getElementById('dlgWho'), dlgTxt = document.getElementById('dlgTxt'),
    dlgAv = document.getElementById('dlgAv'), dlgMore = document.getElementById('dlgMore');
function escapeHTML(s){
  return String(s).replace(/[&<>]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; });
}
function full2(node){ return node.text; }
function nodeDone(){ return M.talk.typed >= full.length; }
function advanceOrChoose(){
  if (!M.talk.script){ closeTalk(); return; }
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node) { closeTalk(); return; }
  if (!nodeDone()){ M.talk.typed = full.length; drawText(); return; }  // 没出完就先出完
  /* 挂着按钮就等着 —— 这一句不能靠空格往下推，
     不然按一下就把整段对话关掉了（按钮计时也就废了） */
  if (M.press) return;
  var list = M.talk.shown || [];
  if (node.opts && list.length){                                       // 有选项必须先选
    /* 光标挪到"先不看了"那一格上，就是收起来看别处去 */
    if (node.esc && M.talk.sel >= list.length){ closeTalk(); return; }
    choose(list[Math.min(M.talk.sel, list.length-1)]);
    return;
  }
  /* 选项被条件全挡掉了就当没写 opts，照 next 往下走 */
  if (node.next) { gotoNode(node.next); return; }
  closeTalk();
}
function choose(i){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node.opts || !node.opts[i]) return;
  gotoNode(node.opts[i].go);
}
function moveSel(d){
  var list = M.talk.shown || [];
  if (!list.length) return;
  var nd = M.talk.script && M.talk.script.nodes[M.talk.nodeId];
  var cnt = list.length + ((nd && nd.esc) ? 1 : 0);   // "先不看了"也算一格，能挪过去
  M.talk.sel = (M.talk.sel + d + cnt) % cnt;
  markSel();
}
/* 数字键按的是屏幕上第几个，不是 node.opts 里第几个 —— 中间隔着"被条件挡掉"的 */
function pickOpt(i){
  var list = M.talk.shown || [];
  if (list[i] !== undefined){ choose(list[i]); return; }
  var nd = M.talk.script && M.talk.script.nodes[M.talk.nodeId];
  if (nd && nd.esc && i === list.length) closeTalk();  // 最后那个是"先不看了"
}
function markSel(){
  for (var i=0;i<optsEl.children.length;i++)
    optsEl.children[i].classList.toggle('sel', i === M.talk.sel);
}
function drawText(){
  if (!M.talk.script) return;
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node) return;
  var s = full.slice(0, Math.floor(M.talk.typed));
  if (s.length > (M.talk.blipAt || 0)){ M.talk.blipAt = s.length + 3; sfxBlip(); }
  dlgTxt.textContent = s;
  dlgMore.classList.toggle('on', s.length >= full.length && !node.opts);
}
/* 点屏幕任何地方都能往下推 —— 只有那个黑框能点，太别扭了。
   选项和突现按钮自己有 stopPropagation，不会被这条误触 */
document.addEventListener('click', function(e){
  if (!M.talk.open) return;
  var t = e.target;
  if (t && t.closest && t.closest('#dlgOpts,#press,#pad,#act,#run,#btnBook,#btnFast')) return;
  advanceOrChoose();
});

/* ==================== 每帧 ==================== */
function faceTowards(x1,y1,x2,y2){
  var dx = x2-x1, dy = y2-y1;
  if (Math.abs(dx) > Math.abs(dy)) return dx>0 ? 'right' : 'left';
  return dy>0 ? 'down' : 'up';
}
function canWalk(x, y){
  /* 只看脚下一小圈，别用整个身位 —— 小人窄，用大半径会卡在门口进不去 */
  var r = 8;
  var pts = [[x-r,y], [x+r,y], [x,y-r+6], [x,y+r]];
  for (var i=0;i<pts.length;i++){
    if (solidAt(Math.floor(pts[i][0]/TILE), Math.floor(pts[i][1]/TILE))) return false;
  }
  return true;
}
var SPD = 108, RUN_MULT = 2.4;
/* 一段剧情的全部效果。触发区踩上去走它，实物的 E 也走它 ——
   一套管线两处用，省得两边各写一遍，写着写着就不一样了 */
function runBeat(G, key, byPlayer){
  /* 顺序谜题：seq 是第几步，得按守则的顺序来。
     按错不清零 —— 六块苔是一横排，去下一块的路上必然要经过别的几块，
     路过顺手按一下就整面墙重来，那不叫谜题，叫坑。
     按错只是"还不到这块"：字照样认下来，顺序不推进。
     所以这一关考的是"知不知道顺序"，不是"手稳不稳" */
  if (G.seq !== undefined && byPlayer && !flagOn('擦完墙')){
    if (M.seq === G.seq - 1){ M.seq = G.seq; FLAGS['擦墙' + G.seq] = true; }
    else if (M.seq >= G.seq){ /* 这块已经擦过了 */ }
    else toast('……还不到这块。', 1.6);
  }
  FLAGS[key] = true;
  if (G.set) setFlag(G.set);
  if (G.clock !== undefined) setClock(G.clock);      // 时间由剧情推
  /* 推门：这一格就通了。门关着的时候人是走不过去的，
     按这一下才是"开"这个动作 */
  if (G.open){ openDoorway(G.x, G.y); sfxDoor(); }
  /* 走错路就绕回原地 —— 中式恐怖里最好使的不是怪物，是"又回到这儿" */
  if (G.warp){
    M.p.x = G.warp[0]*TILE + TILE/2;
    M.p.y = G.warp[1]*TILE + TILE/2;
    M.portalCool = 0.4;
  }
  /* 追逐里的机关：关铁门能挡掉追兵，拉铃能直接把这一场结束 */
  if (G.hounds && M.chase){
    for (var hi=0; hi<G.hounds && M.chase.hounds.length; hi++) M.chase.hounds.pop();
    toast('后面的门关上了。', 1.8);
  }
  if (G.endchase && M.chase) M.endAfter = true;      // 等这段话说完再结束追逐
  if (G.bell) sfxBell(G.bell);                        // 铃
  if (G.put){                         // 把某个 NPC 直接摆过去（剧情需要他站那儿）
    M.npcs.forEach(function(n){
      if (n.id !== G.put[0]) return;
      n.x = G.put[1]*TILE + TILE/2; n.y = G.put[2]*TILE + TILE/2;
      n.tx = G.put[1]; n.ty = G.put[2];
    });
  }
  if (G.stare) M.stare = G.stare;
  /* 存档点：等这段话说完了再踩。
     这话里立的旗标（"该查名单了"那种）是说话的过程里才写进去的，
     存档点抢在它前面的话，一死就把旗标回滚掉 ——
     广播喇叭、下一步目标全跟着消失，人复活过来不知道该干嘛。
     有话说就先记着，等 closeTalk 里再踩。 */
  if (G.cp){
    if (G.talk || G.card) M.cpPending = G.cp;
    else checkpoint(G.cp);
  }
  if (G.card){ card(G.card, G.cardSecs); return; }    // 大段旁白走全屏，不走黑框
  if (G.chase) startChase();                          // 到这儿，整队开始
  if (G.boss) startBoss();                            // 到这儿，它撑开了
  if (G.kill) M.killAfter = true;
  if (G.killMsg) M.deathMsg = G.killMsg;              // 这段话读完就死
  if (G.say) toast(G.say);                            // 或者只飘一行字
  if (G.talk) openScript(G.talk);
}

function update(dt){
  M.t += dt;
  applyClock();                          // 时间由剧情推，这儿只管把时间段旗标刷一遍
  if (M.screen === 'play' && !M.talk.open && !M.book && !M.chase) urgeTick(dt);
  /* 场景卡：自己淡出 */
  if (M.cardT > 0){ M.cardT -= dt; if (M.cardT <= 0 && cardEl) cardEl.classList.remove('on'); }
  if (M.shakeT > 0) M.shakeT = Math.max(0, M.shakeT - dt);
  /* 二楼的灯：念名字一起来，就从西头一间一间地灭，往你这边推 */
  if (M.map === 'floor2' && flagOn('走廊在念名字')) M.lightT = (M.lightT || 0) + dt;
  else if (M.lightT) M.lightT = 0;
  /* 二楼：灯一直在闪 */
  if (M.map === 'floor2') M.flick = (M.flick || 0) + dt * (2 + Math.random()*5);
  else M.flick = 0;
  /* 某些时刻，全校的人会一起转过头看着你 —— 只给一次 */
  if (M.press){                           // 突现按钮的时限
    M.press.t -= dt;
    if (M.press.t <= 0){ var pp = M.press; hidePress(); gotoNode(pp.miss); }
  }
  if (M.stare > 0) M.stare -= dt;
  if (M.stare > 0 && M.npcs.length){
    M.npcs.forEach(function(n){ n.dir = faceTowards(n.x, n.y, M.p.x, M.p.y); });
  }
  if (M.toastT > 0){
    M.toastT -= dt;
    if (M.toastT <= 0 && toastEl) toastEl.classList.remove('on');
  }
  /* 死了：黑一下，然后回上一个存档点 */
  if (M.dying > 0){
    M.dying -= dt;
    if (M.dying <= 0){ M.dying = 0; respawn(); }
    return;
  }
  /* 自动存档 */
  M.saveT = (M.saveT || 0) + dt;
  if (M.saveT > 4){ M.saveT = 0; saveGame(); }
  if (M.talk.cool > 0) M.talk.cool = Math.max(0, M.talk.cool - dt);
  if (M.fade > 0) M.fade = Math.max(0, M.fade - dt*1.6);
  if (M.portalCool > 0) M.portalCool = Math.max(0, M.portalCool - dt);

  /* 打字机：按字走，不是按帧 */
  if (M.talk.open && !nodeDone()){
    M.talk.typed = Math.min(full.length, M.talk.typed + dt*20);
    drawText();
  }

  /* 快跑：键盘按住 Shift，手机靠右下那个「跑」圆键切换。
     后面再乘测试加速（「疾」，默认 1×） */
  var running = !!(keys['shift'] || M.run) && !flagOn('想上厕所');  // 憋着跑不起来
  var spd = SPD * (running ? RUN_MULT : 1) * TEST_SPEEDS[M.fast || 0];
  if (flagOn('想上厕所')) spd *= 0.62;  // 牢李憋着的时候走不快

  var mvx = 0, mvy = 0;
  if (M.screen === 'play' && !M.talk.open && !M.book){
    if (keys['a']||keys['arrowleft'])  mvx -= 1;
    if (keys['d']||keys['arrowright']) mvx += 1;
    if (keys['w']||keys['arrowup'])    mvy -= 1;
    if (keys['s']||keys['arrowdown'])  mvy += 1;
    mvx += stick.dx; mvy += stick.dy;
  }
  var mag = Math.hypot(mvx, mvy);
  M.p.moving = mag > 0.15;
  if (M.p.moving){
    mvx /= mag; mvy /= mag;
    var nx = M.p.x + mvx*spd*dt, ny = M.p.y + mvy*spd*dt;
    /* 分轴判定：贴着墙走的时候能顺墙滑，不会整个人卡住 */
    var wx0 = M.p.x, wy0 = M.p.y;
    if (canWalk(nx, M.p.y)) M.p.x = nx;
    if (canWalk(M.p.x, ny)) M.p.y = ny;
    /* 走了多远 —— 牢李"想上厕所"是按这个算的，不是掷骰子 */
    M.walked = (M.walked || 0) + Math.hypot(M.p.x - wx0, M.p.y - wy0);
    M.p.dir = (Math.abs(mvx) > Math.abs(mvy)) ? (mvx>0?'right':'left') : (mvy>0?'down':'up');
    sfxStep();                                              // 脚步（内部有节流）
    /* 步子也得跟着快，光提速不换步频，看着像在冰上滑 */
    M.p.anim += dt * (running ? 1.9 : 1);
  } else {
    M.p.anim = 0;
  }

  /* 追逐战。被追上或者过了下课铃都会死 —— 死在哪儿就从哪个存档点重来 */
  if (M.boss && M.screen === 'play' && !M.talk.open && !M.book) bossTick(dt);
  if (M.chase && M.screen === 'play' && !M.talk.open && !M.book){
    chaseTick(dt);
    if (M.dying > 0 || M.screen !== 'play') return;
  }

  /* 记着"上一个不在门口站的格子" —— 从别的图回来要落在那儿 */
  if (M.screen === 'play' && CUR){
    var stx = Math.floor(M.p.x/TILE), sty = Math.floor(M.p.y/TILE);
    var onPor = false;
    (CUR.portals||[]).forEach(function(P2){
      if (stx >= P2.x && stx < P2.x+P2.w && sty >= P2.y && sty < P2.y+P2.h) onPor = true;
    });
    if (!onPor){ M.safeX = stx; M.safeY = sty; }
  }

  /* 踩到出口就换图。刚落地那 0.7 秒不判，免得在门口来回弹 */
  if (M.screen === 'play' && !M.talk.open && !M.book && M.portalCool <= 0 && CUR){
    var ptx = Math.floor(M.p.x/TILE), pty = Math.floor(M.p.y/TILE);
    for (var pi=0; pi<CUR.portals.length; pi++){
      var P = CUR.portals[pi];
      if (P.if && !flagOn(P.if)) continue;
      /* 回来的时候要落回"进门前站的那一格"，不是门口往下一格 ——
         厕所那间屋是封死的：落在屋里就只能再踩一次门，来回传 */
      if (P.to !== 'campus'){
        var bx = (M.safeX === undefined) ? ptx : M.safeX;
        var by = (M.safeY === undefined) ? pty + 1 : M.safeY;
        M.backTo = { map: M.map, tx: bx, ty: by };
      }
      if (ptx >= P.x && ptx < P.x+P.w && pty >= P.y && pty < P.y+P.h){
        /* 这是第几趟进厕所 —— 那间屋按趟数换东西 */
        if (P.to === 'toilet' && M.map !== 'toilet') toiletEnter();
        /* 追着的时候换图：追兵的坐标是上一张图的，得重新摆到身后，
           不然他们会凭空出现在校园的某个角落 */
        var chaseJump = !!(M.chase && (P.to === 'campus' || (P.back && M.backTo && M.backTo.map === 'campus')));
        /* 朝向你走出去的那个方向 —— 从厕所出来就是朝外，不是顶着门 */
        if (P.back && M.backTo) loadMap(M.backTo.map, M.backTo.tx, M.backTo.ty, M.p.dir);
        else loadMap(P.to, P.tx, P.ty, M.p.dir);
        if (chaseJump) houndsBehind();
        break;
      }
    }
  }

  /* 踩到剧情触发区就跑一段。once 的跑过就不再跑 ——
     记号记在 FLAGS 里，所以跟着存档一起走 */
  if (M.screen === 'play' && !M.talk.open && !M.book && M.portalCool <= 0 && CUR && CUR.triggers){
    var gtx = Math.floor(M.p.x/TILE), gty = Math.floor(M.p.y/TILE);
    /* 把这张图的触发区数组抓在手里：跑到一半要是换了图，
       数组就短了，再往下读会读到 undefined 直接炸 */
    var trigs = CUR.triggers;
    for (var gi=0; gi<trigs.length; gi++){
      if (CUR.triggers !== trigs) break;            // 换图了，这一趟作废
      var G = trigs[gi], gk = '@' + M.map + ':' + gi;
      if (!G) continue;            // 数组里有个空洞（多写了个逗号），跳过它
      if (G.once && FLAGS[gk]) continue;
      if (G.if && !flagOn(G.if)) continue;
      var inG = gtx >= G.x && gtx < G.x+G.w && gty >= G.y && gty < G.y+G.h;
      if (!inG){ if (M.stillKey === gk){ M.stillKey = null; M.stillT = 0; } continue; }
      /* 有的是"踩到就触发"，有的是"停在这儿不动才触发" —— 守则里那些
         "不要停下来"的条款，就是靠这个当真的 */
      if (G.still){
        if (M.stillKey !== gk){ M.stillKey = gk; M.stillT = 0; }
        if (M.p.moving){ M.stillT = 0; continue; }      // 一动就重新计时
        M.stillT = (M.stillT || 0) + dt;
        if (M.stillT < G.still) continue;
      }
      /* 顺序谜题：seq 是第几步。得从 1 挨着来，跳着踩就回到第一步 */
      if (G.seq !== undefined){
        if (M.seq === G.seq - 1) M.seq = G.seq;         // 接上了
        else if (G.seq > M.seq + 1){                    // 跳着来了 → 回到第一步
          if (M.seq > 0){ M.seq = 0; toast('……那边停了。从头再来。'); }
          continue;
        } else continue;                                // 擦过的、或者还没轮到，都当没踩
      }
      runBeat(G, gk);
      break;
    }
  }

  /* 走近了就转过来看你 */
  var near = nearNpc();
  M.npcs.forEach(function(n){
    if (n === near && !M.talk.open) n.dir = faceTowards(n.x, n.y, M.p.x, M.p.y);
  });
  M.near = near;
  M.nearObj = nearObj();

  /* 提示行：人也好，东西也好，够得着就报出来它是什么。
     光说"按 E"，玩家还是不知道该按哪儿 */
  var th = thingNear();
  var hintTxt = '';
  if (th && !M.talk.open){
    var km = hasTouch ? '按右下角圆键' : '按 Z 或空格';
    hintTxt = th.npc
      ? (km + ' 跟 ' + speaker(th.npc.id).name + ' 说话')
      : (km + ' ' + (th.obj.verb || '看看') + ' —— ' + (th.obj.who || ''));
  }
  /* 只在字真的变了的时候碰 DOM。每帧都写一遍，浏览器每帧都得重排 */
  if (hintTxt !== M.hintTxt){
    M.hintTxt = hintTxt;
    hintEl.textContent = hintTxt;
    hintEl.classList.toggle('on', !!hintTxt);
  }

  var whereTxt = whereText(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE));
  if (whereTxt !== M.whereTxt){ M.whereTxt = whereTxt; whereEl.textContent = whereTxt; }
  if (vigEl) vigEl.className = M.chase ? 'chase' : (M.map === 'floor2' ? 'dark' : '');
  goalTick();
}
var whereEl = document.getElementById('where'), clockEl = document.getElementById('clock');

/* 左上角那行字：站在哪栋楼里，就报楼名；楼里再报一下是走廊还是教室。
   没进楼就只报地形（草地、路、广场…） */
function whereText(tx, ty){
  var t = tileAt(tx, ty), name = TERRAIN[t].name;
  for (var i=0;i<LABELS.length;i++){
    var L = LABELS[i];
    if (tx >= L.x && tx < L.x+L.w && ty >= L.y && ty < L.y+L.h){
      if (t === 'corridor' || t === 'classroom' || t === 'floor' || t === 'stairs')
        return L.t + ' · ' + name;
      return L.t;
    }
  }
  return name;
}

/* ==================== 画 ==================== */
/* 走路的帧序列：站-左-站-右 循环。三张图做出四拍，比纯 A/B 顺 */
var CYCLE = [0,1,0,2];
function drawSprite(id, x, y, dir, anim, moving, scale){
  var frames = SPRITE_IMG[id] && SPRITE_IMG[id][dir];
  if (!frames) return;
  var f = moving ? CYCLE[Math.floor(anim*7) % 4] : 0;
  var im = frames[f] || frames[0];
  if (!im) return;
  var w = 16*scale, h = 24*scale;
  /* (x,y) 是脚底。图是 16×24、脚在最后一行的下沿，所以往上顶一整张图 */
  cx.drawImage(im, Math.round(x - w/2), Math.round(y - h), w, h);
}
/* ==================== 场景里的实物 ====================
   剧情推进原来靠"踩到一个看不见的框" —— 玩家根本不知道那儿有事。
   现在凡是"这儿有个东西"，就真画一个出来，走近了按 E。
   都是十几行方块的活，可有东西可按和踩空气，体感差得远。
   (x,y) 给的是这一格的下沿中线，画的时候往上长。
   ==================================================== */
function drawObj(art, x, y){
  var px = Math.round(x), py = Math.round(y);
  function box(dx, dy, w, h, c){
    cx.fillStyle = c;
    cx.fillRect(px + dx*2, py + dy*2, Math.max(1, w*2), Math.max(1, h*2));
  }
  switch (art){
    case 'window':                                  // 保安室那扇窗，里头亮着
      box(-7,-15, 14, 13, '#39414b');
      box(-5,-13, 10,  9, '#efd79a');
      box(-5,-13, 10,  3, '#f8e9c0');
      box(-1,-15,  1, 13, '#39414b');
      break;
    case 'door':                                    // 一扇门
      box(-8,-18, 16, 18, '#4d3b28');
      box(-7,-17, 14, 17, '#6b5137');
      box( 1,-10,  2,  2, '#d8c07a');
      box(-7,-17, 14,  1, '#8b6a45');
      break;
    case 'desk':                                    // 课桌
      box(-9,-11, 18,  4, '#a8763f');
      box(-9, -7, 18,  1, '#7d5530');
      box(-8, -6,  2,  7, '#7d5530');
      box( 6, -6,  2,  7, '#7d5530');
      box(-6,-12,  5,  1, '#e6e1d3');
      break;
    case 'bucket':                                  // 楼梯拐角那只水桶
      box(-6,-10, 12, 10, '#7e8894');
      box(-6,-10, 12,  2, '#9aa5b2');
      box(-7,-12, 14,  2, '#5f6873');
      box(-5, -8, 10,  1, '#6a727d');
      break;
    case 'paper':                                   // 贴在墙上那张塑封纸
      box(-6,-20, 12, 17, '#3a332a');
      box(-5,-19, 10, 15, '#e6e1d3');
      box(-4,-17,  8,  1, '#a09a8b');
      box(-4,-14,  8,  1, '#a09a8b');
      box(-4,-11,  6,  1, '#a09a8b');
      break;
    case 'roster':                                  // 讲台上摊着的点名册
      box(-8, -9, 16,  9, '#8d2f2f');
      box(-7, -8, 14,  7, '#efe9dc');
      box(-7, -8, 14,  1, '#b9b2a4');
      box(-7, -5, 14,  1, '#cfc8bb');
      break;
    case 'speaker':                                 // 走廊墙上的广播喇叭
      box(-6,-22, 12, 11, '#4f5863');
      box(-4,-20,  8,  7, '#333b44');
      box(-2,-11,  4,  4, '#4f5863');
      box( 4,-18,  2,  8, '#2c343c');
      break;
    case 'board':                                   // 黑板
      box(-15,-24, 30, 20, '#6b4f2f');

}
function drawTile(t, sx, sy){
  /* 关着的门画成关着的 —— 一扇实心门板。开过之后就剩一道门槛了 */
  if (t === 'door' && doorBlocked(Math.round(sx/TILE), Math.round(sy/TILE))){
    cx.fillStyle = '#4a3a27';
    cx.fillRect(sx, sy, TILE, TILE);
    cx.fillStyle = '#7d6647';
    cx.fillRect(sx+1, sy+1, TILE-2, TILE-2);
    cx.fillStyle = '#5f4c33';
    cx.fillRect(sx+3, sy+4, TILE-6, TILE-9);
    cx.fillStyle = '#d8c07a';
    cx.fillRect(sx + TILE - 9, sy + TILE/2 - 2, 4, 4);
    return;
  }
  var d = TERRAIN[t];
  cx.fillStyle = d.c;
  cx.fillRect(sx, sy, TILE, TILE);
  /* 两格一深做点纹理。纯色地板一片死板，人会显得像贴纸 */
  cx.fillStyle = d.c2;
  if (((sx/TILE) + (sy/TILE)) % 2 === 0) cx.fillRect(sx, sy, TILE, TILE);
  if (t === 'tree'){
    cx.fillStyle = '#3f5f30';
    cx.beginPath(); cx.arc(sx+TILE/2, sy+TILE/2, TILE*0.42, 0, 7); cx.fill();
    cx.fillStyle = '#5f8a45';
    cx.beginPath(); cx.arc(sx+TILE/2-3, sy+TILE/2-3, TILE*0.33, 0, 7); cx.fill();
  } else if (t === 'bench'){
    cx.fillStyle = '#8f6333';
    cx.fillRect(sx+3, sy+10, TILE-6, TILE-16);
    cx.fillStyle = '#a8763f';
    cx.fillRect(sx+3, sy+8, TILE-6, 5);
  } else if (t === 'planter'){
    cx.fillStyle = '#6f7d4e';
    cx.beginPath(); cx.arc(sx+TILE/2, sy+TILE/2, TILE*0.34, 0, 7); cx.fill();
  } else if (t === 'garden'){
    /* 空地：栽几株矮的，别跟草地一个样 */
    cx.fillStyle = '#4e7439';
    cx.beginPath(); cx.arc(sx+TILE*0.3, sy+TILE*0.55, 5, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(sx+TILE*0.72, sy+TILE*0.4, 4, 0, 7); cx.fill();
    cx.fillStyle = '#e8d26a';
    cx.fillRect(sx+TILE*0.5, sy+TILE*0.25, 3, 3);
  } else if (t === 'stairs'){
    /* 楼梯：几道横杠。现在只是个标记，以后要做楼上楼下就接这儿 */
    cx.fillStyle = '#9d9179';
    for (var si=0; si<4; si++) cx.fillRect(sx+4, sy+3+si*7, TILE-8, 3);
  }
}
/* 楼名直接画在地上，淡淡的 —— 这么大的地图没字就是一片草地加方块，
   走进去才知道自己进了哪栋楼太费劲 */
function drawLabels(){
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.font = '700 26px system-ui,"Microsoft YaHei",sans-serif';
  cx.lineWidth = 5;
  cx.strokeStyle = 'rgba(255,255,255,.5)';
  LABELS.forEach(function(L){
    /* ty 是可选的：中心广场要跟"韩愈像"那行字错开，不然两行叠一块 */
    var ty = (L.ty === undefined) ? (L.y + L.h/2) : L.ty;
    var px = (L.x + L.w/2)*TILE, py = ty*TILE;
    /* 先白描边再填深色 —— 楼名有的落在浅色地板上、有的落在绿色空地上，
       一种颜色压不平，加圈白边两边都看得清 */
    cx.strokeText(L.t, px, py);
    cx.fillStyle = 'rgba(24,20,14,.42)';
    cx.fillText(L.t, px, py);
  });
  cx.textBaseline = 'alphabetic';
}

/* 韩愈像：基座 + 一个人，立在"田"字正中间。
   地图上的东西都是方块，突然冒出来一个不方的人，反而显眼 */
function drawStatue(){
  var S = CUR && CUR.statue;
  if (!S) return;                       // 这张图没立像
  var x = S.x*TILE, y = S.y*TILE;
  var w = S.w*TILE, h = S.h*TILE, mx = x + w/2;
  cx.fillStyle = '#6d6558';                        // 基座
  cx.fillRect(x+2, y+h*0.52, w-4, h*0.44);
  cx.fillStyle = '#a69d8e';                        // 台面
  cx.fillRect(x+2, y+h*0.52, w-4, 5);
  cx.fillStyle = '#33302a';                        // 人
  cx.beginPath(); cx.arc(mx, y+h*0.3, 8, 0, 7); cx.fill();
  cx.fillRect(mx-12, y+h*0.4, 24, h*0.34);
  cx.fillStyle = '#4a453d';                        // 袍脚
  cx.fillRect(mx-16, y+h*0.74, 32, 6);
}
function render(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.imageSmoothingEnabled = false;
  cx.fillStyle = '#12100e';
  cx.fillRect(0,0,W,H);
  if (!M.me) return;

  camX = clamp(M.p.x - W/2, 0, Math.max(0, MAPW*TILE - W));
  camY = clamp(M.p.y - H/2, 0, Math.max(0, MAPH*TILE - H));
  cx.save();
  /* 死的时候镜头往玩家身上推一点 —— 就这一点，那一秒完全不一样 */
  if (M.dying > 0){
    var zk = (1 - M.dying / (M.deathDur || 1.1)) * 0.32;
    cx.translate(W/2, H/2); cx.scale(1 + zk, 1 + zk); cx.translate(-W/2, -H/2);
  }
  var sk = M.shakeT > 0 ? M.shakeT * 9 : 0;
  cx.translate(-Math.round(camX) + (sk ? (Math.random()*2-1)*sk : 0),
               -Math.round(camY) + (sk ? (Math.random()*2-1)*sk : 0));

  var x0 = Math.floor(camX/TILE), x1 = Math.min(MAPW-1, Math.ceil((camX+W)/TILE));
  var y0 = Math.floor(camY/TILE), y1 = Math.min(MAPH-1, Math.ceil((camY+H)/TILE));
  for (var y=y0; y<=y1; y++)
    for (var x=x0; x<=x1; x++) drawTile(MAP[y][x], x*TILE, y*TILE);
  drawLabels();
  drawStatue();

  /* ---- 场景装饰：能数出来的东西（相框上的人、奖状、课本……） ----
     画在小人之前 —— 贴在墙上的东西不该盖在从它前面走过去的人身上 */
  (CUR.deco || []).concat(CUR.deco2 || []).forEach(function(D){
    var n = D.n || 1, i2;
    for (i2 = 0; i2 < n; i2++){
      var dx2 = D.x + (D.dx || 0) * i2, dy2 = D.y + (D.dy || 0) * i2;
      var px2 = dx2*TILE + TILE/2, py2 = dy2*TILE + TILE/2;
      if (px2 < camX - 60 || px2 > camX + W + 60 || py2 < camY - 90 || py2 > camY + H + 60) continue;
      if (D.art) drawObj(D.art, px2, py2);
      if (D.who) drawSprite(D.who, px2, py2, 'down', 0, false, D.scale || 1);
    }
  });

  /* 小人按 y 排序再画，下面的挡住上面的 —— 就这一点就分出前后了 */
  var order = M.npcs.slice();
  order.push({ id:'__me', me:true, x:M.p.x, y:M.p.y });
  if (M.chase) M.chase.hounds.forEach(function(h){
    if (h.x < camX - 60 || h.x > camX + W + 60 || h.y < camY - 80 || h.y > camY + H + 80) return;
    order.push({ id:h.id, hound:true, x:h.x, y:h.y, dir:h.dir, anim:h.anim, moving:h.moving });
  });
  /* 下一步要找的那个实物，隔着半张图也得看得见 ——
     不然走进一屋子人里，谁都找不着自己那个位子 */
  var goalPos = (M.screen === 'play') ? goalNow() : null;
  /* 场景里的实物也进来一起排序 —— 人站在它前面就该挡住它。
     每扇还关着的门也算一个（门自己已经画在格子上了，这儿只排位置） */
  allObjs().forEach(function(O){
    if (O.if && !flagAll(O.if)) return;
    if (O.gone && FLAGS[objKey(O)]) return;
    if (O.auto && doorOpen(O.x, O.y)) return;
    order.push({ obj:true, O:O, x:O.x*TILE + TILE/2, y:O.y*TILE + TILE });
  });
  order.sort(function(a,b){ return a.y - b.y; });
  order.forEach(function(o){
    if (o.me){
      drawSprite(M.me.id, M.p.x, M.p.y, M.p.dir, M.p.anim, M.p.moving, 2);
    } else if (o.obj){
      var O = o.O;
      var isGoal = !!(goalPos && Math.abs(goalPos.x - O.x) <= 2 && Math.abs(goalPos.y - O.y) <= 2);
      /* 动过的压暗（当下要找的那个除外）。顺序谜题那六块苔也算 ——
         不压暗的话，擦过的和没擦过的在屏幕上一模一样 */
      var used = !!(FLAGS[objKey(O)] && (O.once || O.seq !== undefined)) && !isGoal;
      /* ox/oy 是画的时候抬多高。挂在墙上的东西（纸、喇叭、黑板）
         抬一截，站在地上看就是对着一面墙 */
      var ogx = o.x + (O.ox || 0), ogy = o.y + (O.oy || 0);
      /* 门自己已经画在格子上了（关着的样子就是那格本身），别再叠一层 */
      if (!O.auto){
        if (used) cx.globalAlpha = 0.5;
        drawObj(O.art, ogx, ogy);
        if (used) cx.globalAlpha = 1;
      }
      var od = Math.hypot(o.x - M.p.x, o.y - TILE/2 - M.p.y);
      /* 名字只在够得着的时候挂。原来"下一步要找的那个"隔着半张图也把
         名字挂着、还画一圈呼吸的光 —— 那等于举着牌子告诉你点哪儿。
         目标行 + 屏幕边缘那个箭头已经够了，剩下的该自己找 */
      /* 一栋楼里十几扇门，全挂上"门"两个字，屏幕就成货架了 ——
         门只在"就站在它跟前"的时候才报名字 */
      if (O.who && (O.auto ? (M.nearObj === O) : (od < 150)) && !used){
        cx.font = '600 12px system-ui,"Microsoft YaHei",sans-serif';
        cx.textAlign = 'center';
        cx.fillStyle = 'rgba(0,0,0,.6)';
        cx.fillText(O.who, ogx + 1, ogy - 62);
        cx.fillStyle = '#e6dcc4';
        cx.fillText(O.who, ogx, ogy - 63);
      }
      if (M.nearObj === O && !M.talk.open){
        cx.fillStyle = '#e8a33d';
        cx.font = '700 20px system-ui,sans-serif';
        cx.textAlign = 'center';
        cx.fillText('!', ogx, ogy - 72 + Math.sin(M.t*4)*3);
        cx.strokeStyle = 'rgba(232,163,61,.85)'; cx.lineWidth = 2; cx.setLineDash([4,4]);
        cx.beginPath(); cx.ellipse(ogx, ogy - 6, 17, 7, 0, 0, 7); cx.stroke();
        cx.setLineDash([]);
      }
    } else if (o.hound){
      /* 整队追过来的那些。不挂名字 —— 你知道那是谁，可你不想认。
         站着的时候画成站着的：你回头，看见的就是一排站着不动的人 */
      drawSprite(o.id, o.x, o.y, o.dir, o.anim, !!o.moving, 2);
    } else {
      /* NPC 站着不动。给过它一个周期性小动作，结果看着像抽搐，就去掉了 */
      drawSprite(o.id, o.x, o.y, o.dir, 0, false, 2);
      /* 名字挂在头顶。小人在图上才 32×48，发型配色认人还是慢，
         挂个名字一下就清楚了；离远了不画，免得满屏都是字 */
      if (Math.hypot(o.x - M.p.x, o.y - M.p.y) < NAME_R){
        var nm = speaker(o.id).name;
        cx.font = '600 13px system-ui,"Microsoft YaHei",sans-serif';
        cx.textAlign = 'center';
        cx.fillStyle = 'rgba(0,0,0,.6)';
        cx.fillText(nm, o.x+1, o.y-50);
        cx.fillStyle = '#fff';
        cx.fillText(nm, o.x, o.y-51);
      }
      if (M.near === o && !M.talk.open){
        cx.fillStyle = '#e8a33d';
        cx.font = '700 20px system-ui,sans-serif';
        cx.textAlign = 'center';
        cx.fillText('!', o.x, o.y - 70 + Math.sin(M.t*4)*3);
        cx.strokeStyle = 'rgba(232,163,61,.85)'; cx.lineWidth = 2; cx.setLineDash([4,4]);
        cx.beginPath(); cx.ellipse(o.x, o.y+4, 18, 7, 0, 0, 7); cx.stroke();
        cx.setLineDash([]);
      }
    }
  });
  /* ---- 奶蛙：一圈一圈往外推的"笑" ---- */
  if (M.boss){
    var B = M.boss;
    B.rings.forEach(function(R, i2){
      var al = Math.max(0, 1 - R.r / 520);
      cx.strokeStyle = 'rgba(232,163,61,' + (0.55 * al).toFixed(2) + ')';
      cx.lineWidth = 5;
      cx.beginPath(); cx.arc(B.cx, B.cy, R.r, 0, 7); cx.stroke();
      cx.strokeStyle = 'rgba(255,240,210,' + (0.25 * al).toFixed(2) + ')';
      cx.lineWidth = 2;
      cx.beginPath(); cx.arc(B.cx, B.cy, R.r, 0, 7); cx.stroke();
    });

    var puff = B.phase === 'wave' ? 1 + 0.25 * Math.sin(B.t * 18) : 1;
    cx.fillStyle = '#e0c247';
    cx.beginPath(); cx.arc(B.cx, B.cy, 16 * puff, 0, 7); cx.fill();
    cx.fillStyle = '#f2dc76';
    cx.beginPath(); cx.arc(B.cx - 4, B.cy - 5, 7 * puff, 0, 7); cx.fill();
    cx.fillStyle = '#16160f';
    cx.beginPath(); cx.arc(B.cx - 5, B.cy - 2, 2.4, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(B.cx + 4, B.cy - 2, 2.4, 0, 7); cx.fill();
    /* 那张咧着的嘴 —— 笑的时候咧得更开 */
    cx.strokeStyle = '#8a7320';
    cx.lineWidth = 3;
    cx.beginPath();
    cx.arc(B.cx, B.cy + 1, (8 + 3 * puff) * 1.0, 0.12 * Math.PI, 0.88 * Math.PI);
    cx.stroke();
    /* 能打的那一下：讲台前面亮一圈 */
    if (B.open > 0){
      cx.strokeStyle = 'rgba(255,255,255,' + (0.35 + 0.35 * Math.sin(B.t * 10)).toFixed(2) + ')';
      cx.lineWidth = 3;
      cx.beginPath(); cx.ellipse(B.cx, B.cy + 30, 26, 12, 0, 0, 7); cx.stroke();
    }
  }

  /* ---- 玻璃那一段：画面本身该有点东西，不能全靠字 ----
     走廊尽头那扇玻璃会反一下光。守则说别在它前面停下 */
  GLASS.forEach(function(g){
    var gx = g.x*TILE, gy = g.y*TILE, gw = g.w*TILE, gh = g.h*TILE;
    cx.save();
    cx.beginPath(); cx.rect(gx, gy, gw, gh); cx.clip();
    var ph = (M.t * 0.22) % 1;
    cx.globalAlpha = 0.10 + 0.07 * Math.abs(Math.sin(M.t * 0.9));
    cx.fillStyle = '#cfe0ea';
    cx.save();
    cx.translate(gx + ph * gw * 2 - gw, gy);
    cx.rotate(-0.45);
    cx.fillRect(0, -gh, 14, gh * 3);
    cx.restore();
    cx.restore();
  });

  /* ---- 坐满的那一屋子人：stare 的时候会一起转过头 ----
     直接画站立的小人，一屋子人齐刷刷站着，看着像罚站。
     现在只画上半身 + 前面补一张桌子 —— 一眼就是"坐在那儿" */
  CROWD.forEach(function(c){
    if (c.map !== M.map) return;
    var cxp = c.x*TILE + TILE/2, cyp = c.y*TILE + TILE/2;
    if (cxp < camX - 60 || cxp > camX + W + 60 || cyp < camY - 90 || cyp > camY + H + 60) return;
    var cdir = 'down';
    /* 被追的时候，全校的人一起转过来看着你 —— 他们在数你 */
    if (M.stare > 0 || M.chase) cdir = faceTowards(cxp, cyp, M.p.x, M.p.y);
    /* 画完整小人，再把桌子压在他腿前面 —— 挡住腿就是"坐着"。
       （先前想裁掉下半身，裁切没生效，人整个不见了） */
    drawSprite(c.id, cxp, cyp, cdir, 0, false, 2);
    if (!c.desk) return;                    // 校园里站着的人，前面没有桌子
    var w = 16*2;
    cx.fillStyle = '#7d5530';
    cx.fillRect(cxp - w/2 + 2, cyp - 13, w - 4, 14);
    cx.fillStyle = '#a8763f';
    cx.fillRect(cxp - w/2 + 2, cyp - 13, w - 4, 5);
  });


  /* ---- 多站的那个人：站在那儿，你走近了就没有了 ---- */
  GHOSTS.forEach(function(g){
    if (g.map !== M.map) return;
    if (g.if && !flagOn(g.if)) return;
    var gx = g.x*TILE + TILE/2, gy = g.y*TILE + TILE/2;
    if (gx < camX - 80 || gx > camX + W + 80 || gy < camY - 100 || gy > camY + H + 80) return;
    var d = Math.hypot(gx - M.p.x, gy - M.p.y);
    if (d < TILE*2.2) return;               // 走近了，没了

  });

  if (M.map === 'floor2' && M.lightT > 0){
    /* 追到你身后五格就收住 —— 不然它会把整层楼盖黑，连人影都埋进去。
       它是在追你，不是要把你眼睛蒙上 */
    var edge = Math.max(0, Math.min(38, Math.min(M.p.x/TILE - 4, M.lightT * 6.5)));
    /* 渐变按半格量化之后缓存 —— 每帧现造一个渐变是白花 */
    var ek = Math.round(edge * 2) / 2;
    if (M.f2GradK !== ek){
      M.f2GradK = ek;
      var lw0 = Math.max(1, ek * TILE);
      var lg = cx.createLinearGradient(0, 0, lw0, 0);
      lg.addColorStop(0, 'rgba(4,4,6,.95)');
      lg.addColorStop(0.82, 'rgba(4,4,6,.95)');
      lg.addColorStop(1, 'rgba(4,4,6,0)');
      M.f2Grad = lg;
    }
    cx.fillStyle = M.f2Grad;
    cx.fillRect(0, 0, edge * TILE, MAPH*TILE);
  }
  /* ---- 二楼的灯还在闪 ---- */
  if (M.map === 'floor2' && Math.sin(M.flick || 0) > 0.80){
    cx.fillStyle = 'rgba(0,0,0,.45)';
    cx.fillRect(0, 0, MAPW*TILE, MAPH*TILE);
  }

  cx.restore();

  /* 死亡：黑幕压下来，中间一行字。
     镜头推进是在外面（cx.save 之前）加的，所以是往玩家身上推 */
  if (M.dying > 0){
    var dp = 1 - M.dying / (M.deathDur || 1.1);
    cx.fillStyle = 'rgba(6,5,5,' + Math.min(1, dp * 1.1) + ')';
    cx.fillRect(0, 0, W, H);
    if (M.deathMsg && dp > 0.3){
      cx.globalAlpha = Math.min(1, (dp - 0.3) * 2.6);
      cx.fillStyle = '#e8a33d';
      cx.font = '600 ' + Math.round(Math.max(15, Math.min(24, W/32))) +
                'px system-ui,"Microsoft YaHei",sans-serif';
      cx.textAlign = 'center';
      var dl = String(M.deathMsg).split('\n');
      for (var di=0; di<dl.length; di++)
        cx.fillText(dl[di], W/2, H/2 - (dl.length-1)*17 + di*34);
      cx.globalAlpha = 1;
      cx.textAlign = 'left';
    }
  }

  /* 换图那一下黑场。不加这个，人是从一个地方"啪"一下跳到另一个地方 */
  if (M.fade > 0){
    cx.fillStyle = 'rgba(18,16,14,' + Math.min(1, M.fade/0.5) + ')';
    cx.fillRect(0, 0, W, H);
  }
}

/* ==================== 主循环 ====================
   手机上压到 30 帧。走路这种画面，30 和 60 看着一样，
   可 GPU 的活少一半 —— 烫的就是那一半。
   不在游戏里（标题、本子、结算）就干脆不画：底下那些整屏的
   fillRect 在白烧电。
   ============================================ */
var lastT = 0, accT = 0;
var MIN_STEP = ('ontouchstart' in window) ? (1/30) : (1/60);
function loop(ts){
  var dt = lastT ? Math.min((ts-lastT)/1000, 0.05) : 0;
  lastT = ts;
  accT += dt;
  if (accT < MIN_STEP){ requestAnimationFrame(loop); return; }
  var use = Math.min(accT, 0.05);
  accT = 0;
  update(use);
  if (M.screen === 'play') render();
  requestAnimationFrame(loop);
}

/* ==================== 屏幕 ==================== */
function show(el){
  var all = document.querySelectorAll('.screen');
  for (var i=0;i<all.length;i++) all[i].classList.remove('on');

}
var pickList = document.getElementById('pickList');

    d.innerHTML = '<div class="top"><img src="' + (im ? im.src : '') + '" alt="">' +
      '<div><div class="nm">' + c.name + '</div><div class="tg">' + c.tag + '</div></div></div>' +
      '<div class="ds">' + PICK_NOTE[id] + '</div>';

/* ==================== 调试钩子 ====================
   仿 ?emoji 的先例。没有测试框架，无头浏览器里全靠它把状态带出来：
   ?probe=1     直接开局，把 NPC 名单和几个关键状态打到 #probe
   ?probe=lint  把对话图整张走一遍，检查有没有指到不存在的节点（断链）
   ?probe=walk  从开局连按 20 次，看整条链能不能走完不卡死
   @x / @y      ?x=20&y=25 覆盖出生点（截图定位用，省得手动走）
   ============================================ */
(function probe(){
  /* 探针里抛异常以前是静默的 —— 输出直接空白，看不出为什么。
     接上 onerror，至少能看见是哪一行 */
  var probeErr = '';
  window.onerror = function(msg, src, line){ probeErr = '!!' + msg + ' @' + line; return true; };
  var q = location.search;
  var m = /[?&]probe=(\w+)/.exec(q);
  if (!m) return;
  var mode = m[1];
  var out = [];
  setTimeout(function(){
    try {
    /* 选人页只有在点了「出门」之后才出现，无头截图点不了按钮，
       所以给它一个直接跳过去的开关 */
    if (mode === 'pick'){ buildPick(); return; }
    startWalk('laoli');
    /* 探针做路网的时候把门当通的 —— 不然"走不到"全是门挡的，
       那不是 bug，是门本来该有的样子。doors / human 两个例外 */
    M.ignoreDoors = (mode !== 'doors' && mode !== 'human');
    /* ?map=floor2 直接去哪张图 —— 截图用，省得一步步走过去 */
    var mm = /[?&]map=(\w+)/.exec(q);
    if (mm && MAPS[mm[1]]) loadMap(mm[1], MAPS[mm[1]].spawn[0], MAPS[mm[1]].spawn[1]);
    M.fade = 0;                          // 无头里 rAF 不跑，黑场淡不掉，截图会全黑
    /* ?x=&y= 把出生点挪到指定格 —— 截图要看某个地方时省得手动走过去 */
    var mx = /[?&]x=(\d+)/.exec(q), my = /[?&]y=(\d+)/.exec(q);
    if (mx) M.p.x = (+mx[1])*TILE + TILE/2;
    if (my) M.p.y = (+my[1])*TILE + TILE/2;
    /* 探针通用：按对话名找一个实物，把玩家挪过去，按下 E。
       剧情改成"走近了按一下"之后，探针不能再按触发区下标找了 */
    function objByTalk(name){
      var hit = null;
      allObjs().forEach(function(O){ if (O.talk === name && !hit) hit = O; });
      return hit;
    }
    /* 实物本身可能挂在墙上（那一格站不住），所以落点找它周围能站的一格 */
    function standBy(O){
      if (!O) return false;
      for (var r0 = 0; r0 <= 2; r0++){
        for (var dy0 = -r0; dy0 <= r0; dy0++) for (var dx0 = -r0; dx0 <= r0; dx0++){
          if (r0 && Math.abs(dx0) !== r0 && Math.abs(dy0) !== r0) continue;
          var x0 = O.x + dx0, y0 = O.y + dy0;
          if (x0 < 0 || y0 < 0 || x0 >= MAPW || y0 >= MAPH) continue;
          if (solidAt(x0, y0)) continue;
          if (Math.hypot(x0*TILE + TILE/2 - (O.x*TILE + TILE/2),
                         y0*TILE + TILE/2 - (O.y*TILE + TILE/2)) > (O.near || 52)) continue;
          M.p.x = x0*TILE + TILE/2; M.p.y = y0*TILE + TILE/2;
          return true;
        }
      }
      return false;
    }
    function pressByName(name){
      var O = objByTalk(name);
      if (!O) return false;
      if (!standBy(O)) return false;
      M.portalCool = 0; M.talk.cool = 0; M.talk.open = false;
      update(1/60);
      pressAct();
      return M.talk.open;
    }

    if (mode === 'dlg'){
      /* 直接站到 lg7 面前把对话框开出来，截图核对排版 */
      var n0 = M.npcs[0];
      M.p.x = n0.x; M.p.y = n0.y + 30;
      openTalk(n0);
      M.talk.typed = 6;                    // 出几个字就够看排版了，不用等打完
      drawText();
    }
    if (mode === 'map'){
      /* 从出生点洪泛一遍：走不到的人 = 地图改错了（谁被封在墙里了）。
         手画地图最容易犯的就是这个，肉眼看不出来 */
      /* 这个变量千万不能叫 q —— var 是函数作用域，名字撞上外层那个
         location.search 的话会被提升到回调顶部，把外层遮成 undefined */
      var seen2 = {}, queue = [[Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)]];
      seen2[queue[0][0]+','+queue[0][1]] = 1;
      while (queue.length){
        var c = queue.shift();
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
          var nx = c[0]+d[0], ny = c[1]+d[1], k = nx+','+ny;
          if (nx<0||ny<0||nx>=MAPW||ny>=MAPH||seen2[k]) return;
          if (solidAt(nx,ny)) return;
          seen2[k] = 1; queue.push([nx,ny]);
        });
      }
      var spawn = tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE));
      var dead = M.npcs.filter(function(n){ return !seen2[n.tx+','+n.ty]; })
                      .map(function(n){ return n.id+'@'+n.tx+','+n.ty; });
      out.push('出生点脚下=' + spawn + (TERRAIN[spawn].solid ? ' ← 出生在墙里！' : ''));
      out.push('能走到=' + Object.keys(seen2).length + ' 格');
      out.push(dead.length ? ('走不到 ' + dead.length + ' 个: ' + dead.join(' ')) : '所有人都走得到');
    }
    if (mode === 'lint'){
      var bad = [];
      Object.keys(TALK).forEach(function(k){
        var s = TALK[k], ids = Object.keys(s.nodes);
        ids.forEach(function(nid){
          var nd = s.nodes[nid];
          if (nd.next && !s.nodes[nd.next]) bad.push(k+'.'+nid+' → next '+nd.next+' 不存在');
          if (nd.opts) nd.opts.forEach(function(o){
            if (!s.nodes[o.go]) bad.push(k+'.'+nid+' → 选项 '+o.go+' 不存在');
          });
          if (typeof nd.end === 'string' && !s.nodes[nd.end])
            bad.push(k+'.'+nid+' → end '+nd.end+' 不存在');
          if (!nd.next && !nd.opts && !nd.end && !nd.press && !nd.ask)
            bad.push(k+'.'+nid+' 是死胡同');
          /* 数字键盘那条：to 指得到吗 */
          if (nd.ask && !s.nodes[nd.ask.to]) bad.push(k+'.'+nid+' → ask.to '+nd.ask.to+' 不存在');
          /* 突现按钮那两个出口也得指得着 */
          if (nd.press){
            if (!s.nodes[nd.press.press]) bad.push(k+'.'+nid+' → 按钮按下去的 '+nd.press.press+' 不存在');
            if (nd.press.miss && !s.nodes[nd.press.miss]) bad.push(k+'.'+nid+' → 按钮超时的 '+nd.press.miss+' 不存在');
          }
        });
        ['start','again'].forEach(function(key){
          if (s[key] && !s.nodes[s[key]]) bad.push(k+'.'+key+' 指向不存在的节点');
        });
        if (s.entry) Object.keys(s.entry).forEach(function(cid){
          if (!s.nodes[s.entry[cid]]) bad.push(k+'.entry.'+cid+' 指向不存在的节点');
        });
        if (s.entryBy) s.entryBy.forEach(function(e){
          if (!s.nodes[e.go]) bad.push(k+'.entryBy → '+e.go+' 不存在');
        });
      });
      out.push(bad.length ? ('断链 '+bad.length+' 处: '+bad.join(' | ')) : '对话图没问题');
    } else {
      out.push('玩家=' + M.me.id);
      out.push('玩家在格=' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) +
               ' (' + tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)) + ')');
      out.push('q=' + q + ' x=' + (/([?&]x=(\d+))/.exec(q)||['无'])[2] +
               ' y=' + (/([?&]y=(\d+))/.exec(q)||['无','无'])[2]);
      out.push('NPC=' + M.npcs.map(function(n){ return n.id; }).join(','));
      var self = M.npcs.filter(function(n){ return n.id === M.me.id; }).length;
      out.push('自己当NPC次数=' + self + (self ? ' ← 不对！' : ''));
      /* 别读 whereEl —— 那是每帧刷的，无头里 rAF 不跑，读到的还是上一帧 */
      out.push('站在=' + whereText(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)));
      if (mode === 'maps'){
        /* 每张图：出口指到的图在不在、落点站不站得住；NPC 有没有站在墙里 */
        Object.keys(MAPS).forEach(function(mid){
          var mp = MAPS[mid], bad = [];
          mp.portals.forEach(function(P){
            if (!MAPS[P.to]){ bad.push('出口指向不存在的图 ' + P.to); return; }
            var tt = MAPS[P.to].map[P.ty] && MAPS[P.to].map[P.ty][P.tx];
            if (!tt) bad.push('落点越界 → ' + P.to + ' ' + P.tx + ',' + P.ty);
            else if (TERRAIN[tt].solid) bad.push('落点踩在' + TERRAIN[tt].name + '上 → ' + P.to);
          });
          mp.npcs.forEach(function(n){
            var tt = mp.map[n.ty] && mp.map[n.ty][n.tx];
            if (!tt) bad.push('NPC 越界 ' + n.id);
            else if (TERRAIN[tt].solid) bad.push('NPC 站在' + TERRAIN[tt].name + '上 ' + n.id);
          });
          out.push(mid + ' ' + mp.w + '×' + mp.h + ' 出口' + mp.portals.length +
                   ' NPC' + mp.npcs.length + (bad.length ? ' ← ' + bad.join(' / ') : ' 没问题'));
        });
      }
      if (mode === 'story'){
        /* 整条链走一遍：踩触发区 → 旁白 → 立旗标 → lg7 那个选项才出现 */
        out.push('起始 纸条=' + flagOn('纸条'));
        pressByName('open_class');       // 走到自己位子前按 E
        out.push('踩过 对话框=' + M.talk.open + ' 说话人=' + (M.talk.who || '旁白'));
        var guard = 0;
        while (M.talk.open && guard++ < 20){ M.talk.typed = 1e9; advanceOrChoose(); }
        out.push('读完 对话框=' + M.talk.open + ' 纸条=' + flagOn('纸条'));
        /* 去找 lg7，走到那个带选项的节点上 */
        var n0 = null;
        M.npcs.forEach(function(n){ if (n.id === 'lg7') n0 = n; });
        M.p.x = n0.x; M.p.y = n0.y + 20;
        M.talk.cool = 0;
        M.talked['lg7'] = true;
        setFlag('见过lg7');                             // 让他进到"那套常规对话"里去
        openTalk(n0);                                   // 直接落在选项节点上，不用再推
        function optsNow(){ return (M.talk.shown || []).map(function(k){
          return M.talk.script.nodes[M.talk.nodeId].opts[k].t; }).join(' / '); }
        out.push('节点=' + M.talk.nodeId + ' 选项=' + optsNow());
        /* 把旗标抹掉再渲染一次 —— 直接证明那个选项是"条件出来的"，不是碰巧 */
        var keep = FLAGS['纸条'];
        delete FLAGS['纸条']; renderNode();
        out.push('没旗标时=' + optsNow());
        FLAGS['纸条'] = keep; renderNode();
        out.push('有旗标时=' + optsNow());
        M.talk.open = false;
      }
      if (mode === 'warp'){
        /* 站到出口上，看是不是真换了图、落点对不对，再踩回来 */
        setFlag('可以上去了');            // 楼梯口现在有门槛，先把拼图凑上
        function step(){
          var P = CUR.portals[0];
          M.p.x = P.x*TILE + TILE/2; M.p.y = P.y*TILE + TILE/2;
          M.portalCool = 0; M.fade = 0;
          update(1/60);
          return M.map + '(' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) + ')';
        }
        out.push('站上去 → ' + step() + ' → 再踩回来 ' + step());
      }
      if (mode === 'clock'){
        var tch = null;
        M.npcs.forEach(function(n){ if (n.id === 'teacher') tch = n; });
        M.clock = 6*60 + 55; update(1/60);
        out.push('06:55 早读=' + flagOn('早读') +
                 ' 老师=' + Math.floor(tch.x/TILE) + ',' + Math.floor(tch.y/TILE));
        /* 推到 08:00 —— 早读散了，老师该回办公室、话也该换 */
        M.clock = 8*60; update(1/60);
        out.push('08:00 早读=' + flagOn('早读') +
                 ' 老师=' + Math.floor(tch.x/TILE) + ',' + Math.floor(tch.y/TILE));
        M.p.x = tch.x; M.p.y = tch.y + 20; M.talk.cool = 0;
        openTalk(tch);
        out.push('老师这句=' + M.talk.script.nodes[M.talk.nodeId].text);
        M.talk.open = false;
        /* lg7 一天里该在四个地方 —— 位置跟时间绑着 */
        var l7 = null;
        M.npcs.forEach(function(n){ if (n.id === 'lg7') l7 = n; });
        /* sched 只在人"看不见"的时候才挪 —— 无头里镜头停在原点，
           这儿得先把镜头挪开，不然他会一直算在画面里、永远不动 */
        camX = camY = 1e6;
        [[6*60+55,'早上'],[7*60+20,'早读'],[8*60,'白天'],[10*60,'后半场']].forEach(function(w){
          M.clock = w[0]; applyClock();
          out.push(w[1] + ' lg7@' + Math.floor(l7.x/TILE) + ',' + Math.floor(l7.y/TILE));
        });
      }
      if (mode === 'save'){
        M.clock = 7*60+20; setFlag('纸条'); setFlag('见过:lg7'); M.talked['lg7'] = true;
        M.p.x = 456; M.p.y = 1234;
        saveGame();
        out.push('存之前 纸条=' + flagOn('纸条') + ' 几点=' + clockText(M.clock));
        FLAGS = {}; M.talked = {}; M.clock = 0; M.p.x = 0; M.p.y = 0;
        out.push('清空后 纸条=' + flagOn('纸条'));
        var ok = loadGame();
        out.push('读档 ok=' + ok + ' 纸条=' + flagOn('纸条') + ' 见过lg7=' + flagOn('见过:lg7') +
                 ' 聊过lg7=' + !!M.talked['lg7'] + ' 几点=' + clockText(M.clock) +
                 ' 在哪=' + M.map + ' 站位=' + Math.round(M.p.x) + ',' + Math.round(M.p.y));
      }
      if (mode === 'book'){
        /* 先把纸条拿到手、再见两个人，然后翻开本子 —— 截图看排版 */
        var GB = CUR.triggers[0];
        M.p.x = GB.x*TILE + TILE/2; M.p.y = GB.y*TILE + TILE/2;
        M.portalCool = 0; M.talk.cool = 0;
        update(1/60);
        var gb = 0; while (M.talk.open && gb++ < 20){ M.talk.typed = 1e9; advanceOrChoose(); }
        setFlag('见过:lg7'); setFlag('见过:teacher');
        openBook();
      }
      if (mode === 'scene'){
        /* 截图用：?probe=scene&o=rule_sheet 站到那个实物跟前。
           加 &e=1 再按一下，看对话排版；不加就只看实物和提示 */
        var on = (/([?&]o=(\w+))/.exec(q) || [,'',''])[2];
        var doPress = /[?&]e=1/.test(q);
        startWalk('laoli'); M.fade = 0;
        /* 实物可能在别的图上 —— 找的时候把四张图都翻一遍，然后换过去 */
        var SO = null, soMap = null;
        Object.keys(MAPS).forEach(function(mid){
          (MAPS[mid].objs || []).forEach(function(O){
            if (O.talk === on && !SO){ SO = O; soMap = mid; }
          });
        });
        if (SO && soMap !== M.map) loadMap(soMap, SO.x, SO.y);
        if (SO){

              M.talk.typed = 1e9; advanceOrChoose();
            }
            if (M.pad){                            // 打字那几关：键盘收得掉吗
              M.talk.typed = 1e9; advanceOrChoose();
              escOk = M.talk.open ? '键盘收不掉!' : '键盘收得掉';
            } else {
              M.talk.sel = (M.talk.shown || []).length;   // 挪到"先不看了"
              M.talk.typed = 1e9; advanceOrChoose();
              escOk = M.talk.open ? '退不出来!' : '退得出来';
            }
          } else escOk = '按不开';
          if (escOk === '退不出来!' || escOk === '键盘收不掉!') escBad++;
          M.talk.open = false; hidePad(); M.killAfter = false;
          FLAGS = {}; setFlag(['是:' + wh2, '可以走动了']);
          loadMap(S2.map, MAPS[S2.map].spawn[0], MAPS[S2.map].spawn[1]);
          M.fade = 0; M.portalCool = 0; M.talk.cool = 0; M.talk.open = false;
          var clOk = '不用线索';
          if (S2.clue){
            clOk = pressByName(S2.clue) ? '开了' : '按不开';
            if (M.talk.open) drain();
          }
          var got = pressByName(S2.talk);
          var seen = got ? ((M.talk.script.nodes[M.talk.nodeId].text || '')
                            .replace(/\s+/g, '').slice(0, 12)) : '按不开';
          drain(S2.how === 'opt' ? S2.pick : undefined,
                S2.how === 'ask' ? S2.ans : '');
          var done = flagOn(sideFlag({ b: S2.b, who: wh2 }));
          if (done) okinv++;
          out.push((done ? '[过] ' : '[死] ') + S2.b + ' 线索=' + clOk +
                   ' 题目=' + seen + ' → ' + (done ? '答对' : '没答出来') +
                   ' ｜没线索时 ' + escOk);
        });
        out.push('支线走得通 ' + okinv + '/' + olist.length +
                 '；退出不了 ' + escBad + ' 处（' + wh2 + '）');
      }
      if (mode === 'grid'){
        /* 把一张图的格子按行原样打出来 —— 手画的地图哪儿画歪了，
           看截图是看不出来的，得看格子 */
        var gm = /[?&]map=(\w+)/.exec(q);
        var gid = (gm && MAPS[gm[1]]) ? gm[1] : 'campus';
        loadMap(gid, MAPS[gid].spawn[0], MAPS[gid].spawn[1]);
        var CH2 = { void:' ', wall:'#', door:'D', corridor:'.', classroom:'c',
                    floor:'f', garden:'g', stairs:'S', stage:'T', path:'p',
                    grass:',', plaza:'+', track:'t', tree:'^', bench:'b', planter:'o' };
        var rows = [];
        for (var gy = 0; gy < MAPH; gy++){
          var ln = '';
          for (var gx = 0; gx < MAPW; gx++){
            var tt2 = tileAt(gx, gy);
            var ch2 = (CH2[tt2] !== undefined) ? CH2[tt2] : '?';
            for (var pi2 = 0; pi2 < (CUR.portals || []).length; pi2++){
              var P2 = CUR.portals[pi2];
              if (gx >= P2.x && gx < P2.x+P2.w && gy >= P2.y && gy < P2.y+P2.h) ch2 = '@';
            }
            ln += ch2;
          }
          rows.push(('  ' + gy).slice(-2) + '|' + ln);
        }
        out.push('图=' + gid + ' ' + MAPW + 'x' + MAPH +
                 '  图例：#墙 D门 .走廊 c教室 f室内 g园子 S楼梯 p路 @换图口 空格=没有' +
                 String.fromCharCode(10) + rows.join(String.fromCharCode(10)));
      }
      if (mode === 'ask'){
        /* 只为一件事：把数字键盘那一屏停住，截图看它有没有压住要答的那句话 */
        startWalk('laoli'); M.fade = 0;
        setFlag(['是:laoli','可以走动了','该上二楼了']);
        loadMap('museum', 3, 13);
        M.portalCool = 0; M.talk.cool = 0;
        pressByName('sd_museum_laoli');
        var ga = 0;
        while (M.talk.open && ga++ < 20){
          var ndA = M.talk.script.nodes[M.talk.nodeId];
          if (ndA && ndA.ask) break;
          M.talk.typed = 1e9; advanceOrChoose();
        }
        out.push('键盘=' + (M.pad ? 'on' : 'off') + ' 正文=' +
                 (M.talk.script ? (M.talk.script.nodes[M.talk.nodeId].text || '') : '—'));
      }
      if (mode === 'snd'){
        /* 声音默认开着没？各条音效会不会抛异常？
           （无头里听不见，只能验到这一层） */
        out.push('SND=' + SND + ' AC=' + (AC ? AC.state : 'null'));
        try {
          sfxBell(1); sfxStep(); sfxBlip(); sfxDoor(); sfxPick(); sfxDie();
          droneOn(); droneOff();
          out.push('音效全部调用过，没抛异常');
        } catch (e){ out.push('!!音效抛异常: ' + e.message); }
        /* 死亡画面：推镜头 + 那行字 */
        die('你被数进去了。\n（回头看它会更快。）', 3.0);
        for (var sk2=0; sk2<110; sk2++) update(1/60);      // 停在半途，好截图
        out.push('死亡中 dying=' + M.dying.toFixed(2) + ' 有字=' + !!M.deathMsg);
        render();
        out.push('死亡画面渲染 ok');
      }
      if (mode === 'px'){
        /* 手动画一帧再取个像素 —— 无头里 rAF 不一定跑，得自己调 */
        try {
          render();
          var px0 = Math.round(W/2), py0 = Math.round(H/2);
          var dd = cx.getImageData(px0, py0, 1, 1).data;
          out.push('画布=' + W + '×' + H + ' DPR=' + DPR +
                   ' 中心像素=' + dd[0] + ',' + dd[1] + ',' + dd[2] + ',' + dd[3]);
        } catch (e){ out.push('!!render W=' + W + ' H=' + H + ' DPR=' + DPR + ' ' + e.message); }
      }
      if (mode === 'run'){
        /* 同样跑 60 帧，量一量走路和快跑各走多远 —— 倍数对不上就是没生效 */
        /* 起点要挑一条空的：不能压着韩愈像（挡路），也不能落在
           开场触发区上（弹出对话人就不动了，量出来会很难看） */
        var sx = 35*TILE + TILE/2, sy = 120*TILE + TILE/2;
        function distOver(fast){
          M.p.x = sx; M.p.y = sy;
          keys['w'] = true; keys['shift'] = fast;
          for (var fi=0; fi<60; fi++) update(1/60);
          keys['w'] = false; keys['shift'] = false;
          return Math.round(sy - M.p.y);
        }
        var w0 = distOver(false), r0 = distOver(true);
        out.push('60帧 走路=' + w0 + 'px 快跑=' + r0 + 'px 倍数=' + (r0/w0).toFixed(2) +
                 ' (想要 ' + RUN_MULT + ')');
      }
      if (mode === 'walk'){
        var seen = [], guard = 0;
        M.p.x = M.npcs[0].x; M.p.y = M.npcs[0].y + 20;      // 站到第一个 NPC 跟前
        openTalk(M.npcs[0]);
        while (M.talk.open && guard++ < 40){
          seen.push(M.talk.nodeId);
          M.talk.typed = 1e9;                                // 跳过打字机
          advanceOrChoose();
        }
        out.push('走完的节点: ' + seen.join(' → '));
        out.push('最后 talk.open=' + M.talk.open + (M.talk.open ? ' ← 卡住了' : ''));
        /* 再聊一次，应该进 again 那支 */
        openTalk(M.npcs[0]);
        out.push('再聊进到: ' + M.talk.nodeId);
        M.talk.open = false;
      }
    }
    var pre = document.getElementById('probe');
    pre.textContent = 'PROBE ' + out.join(' || ') + (probeErr ? ' || ' + probeErr : '');
    } catch (e){
      /* 跑到一半炸了：把已经攒下的输出带出来，顺便报是哪一步 */
      document.getElementById('probe').textContent =
        'PROBE !! 抛异常: ' + (e && e.message) + ' || 已跑到: ' + out.join(' || ');
    }
  }, 700);
})();

/* ==================== 起飞 ====================
   地图必须在起飞前就装上。它是空的时侯 tileAt 会读到 undefined，
   而 tileAt 每帧都调 —— 上一版就是在主循环第一帧崩掉，整个画面全黑。 */
loadMap('campus', MAPS.campus.spawn[0], MAPS.campus.spawn[1]);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>

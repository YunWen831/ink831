<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100e">
<title>在校园里乱逛</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#12100e;
    font-family: system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:#f5f5f4; user-select:none; -webkit-user-select:none;
    touch-action:none; overscroll-behavior:none; }
  @supports (height:100dvh) { html,body { height:100dvh; } }
  canvas { display:block; width:100%; height:100%; touch-action:none;
    image-rendering:pixelated; }

  .screen { position:absolute; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px; z-index:10;
    overflow-y:auto; background:rgba(18,16,14,.95); }
  .screen.on { display:flex; }
  h1 { font-size:clamp(24px,6vw,42px); letter-spacing:.14em; font-weight:700; }
  h1 small { display:block; font-size:.32em; letter-spacing:.3em; opacity:.45; margin-top:10px; font-weight:400; }
  h2 { font-size:clamp(16px,4vw,22px); font-weight:600; letter-spacing:.06em; }
  .tip { font-size:clamp(11px,3vw,14px); opacity:.5; text-align:center; line-height:1.9; max-width:520px; }
  .tip b { color:#e8a33d; }
  .kbd { display:inline-block; padding:1px 7px; border:1px solid #57534e; border-radius:5px;
    font-size:.85em; margin:0 2px; }

  .picks { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:min(94vw,760px); }
  .pick { width:clamp(140px,28vw,200px); background:#1f1c19; border:2px solid #33302c;
    border-radius:14px; padding:14px; cursor:pointer; transition:.15s; text-align:left; }
  .pick:hover, .pick:active { border-color:#c2703a; transform:translateY(-3px); }
  .pick .top { display:flex; align-items:center; gap:10px; }
  .pick img { width:clamp(48px,12vw,64px); height:clamp(48px,12vw,64px);
    border-radius:10px; image-rendering:pixelated; background:#292524; }
  .pick .nm { font-size:clamp(14px,3.4vw,17px); font-weight:600; }
  .pick .tg { font-size:clamp(10px,2.6vw,12px); opacity:.45; margin-top:3px; }
  .pick .ds { font-size:clamp(11px,2.8vw,13px); opacity:.6; line-height:1.6; margin-top:9px; }

  .btn { padding:12px 30px; border:2px solid #57534e; border-radius:11px; background:#1f1c19;
    color:#f5f5f4; font-size:clamp(13px,3.4vw,16px); cursor:pointer; font-family:inherit; }
  .btn:hover { background:#c2703a; border-color:#c2703a; }

  /* 左上角当前在哪 */
  #where { position:absolute; z-index:5; pointer-events:none;
    left:calc(14px + env(safe-area-inset-left,0px));
    top:calc(12px + env(safe-area-inset-top,0px));
    font-size:clamp(12px,3.2vw,15px); letter-spacing:.1em; opacity:.85;
    text-shadow:0 2px 6px rgba(0,0,0,.7); color:#fff; }
  /* 几点钟。压在"在哪"底下 */
  #clock { position:absolute; z-index:5; pointer-events:none;
    left:calc(14px + env(safe-area-inset-left,0px));
    top:calc(34px + env(safe-area-inset-top,0px));
    font-size:clamp(12px,3.2vw,15px); letter-spacing:.1em; opacity:.7;
    text-shadow:0 2px 6px rgba(0,0,0,.7); color:#e8a33d; }

  /* 走到人跟前才出现的那行提示 */
  #hint { position:absolute; z-index:5; pointer-events:none; left:50%; transform:translateX(-50%);
    bottom:calc(150px + env(safe-area-inset-bottom,0px));
    font-size:clamp(11px,3vw,14px); padding:6px 14px; border-radius:999px;
    background:rgba(18,16,14,.8); border:1px solid #57534e; white-space:nowrap;
    opacity:0; transition:opacity .15s; }
  #hint.on { opacity:1; }

  /* ---------- 对话框 ---------- */
  /* Undertale 的样子：黑底、白框、字在右边、脸在左边。
     刻意不用页面那套暗色卡片风 —— 这里是"游戏里"，要跟外面区分开 */
  #dlg { position:absolute; z-index:9; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:min(94vw,720px); display:none; }
  #dlg.on { display:block; }
  #dlgBox { position:relative; display:flex; gap:14px; align-items:flex-start;
    background:#000; border:4px solid #fff; border-radius:4px;
    padding:14px 16px; min-height:128px; box-shadow:0 8px 30px rgba(0,0,0,.6); }
  #dlgAv { flex:0 0 auto; width:96px; height:96px; image-rendering:pixelated;
    background:#1a1a1a; border:2px solid #444; border-radius:3px; }
  #dlgBody { flex:1 1 auto; min-width:0; }
  #dlgWho { font-size:13px; letter-spacing:.14em; color:#e8a33d; margin-bottom:7px; }
  #dlgTxt { font-size:clamp(14px,3.5vw,18px); line-height:1.75; white-space:pre-wrap; }
  #dlgOpts { list-style:none; margin-top:11px; }
  #dlgOpts li { font-size:clamp(13px,3.3vw,17px); padding:5px 9px; border-radius:4px;
    cursor:pointer; line-height:1.5; }
  #dlgOpts li .k { display:inline-block; width:1.6em; color:#8a8a8a; }
  #dlgOpts li.sel { background:#3a3a3a; }
  #dlgOpts li.sel .k { color:#e8a33d; }
  #dlgMore { position:absolute; right:14px; bottom:8px; color:#fff; font-size:14px;
    opacity:0; }
  #dlgMore.on { opacity:1; animation:bv .9s infinite; }
  @keyframes bv { 50% { transform:translateY(3px); opacity:.35 } }
  @media (max-width:520px){
    #dlgAv { width:64px; height:64px; }
    #dlgBox { min-height:104px; }
  }

  #stick { position:absolute; z-index:6; display:none; }
  #stick.on { display:block; }
  #act { position:absolute; z-index:7; display:none;
    right:calc(18px + env(safe-area-inset-right,0px));
    bottom:calc(26px + env(safe-area-inset-bottom,0px));
    width:clamp(70px,19vw,92px); height:clamp(70px,19vw,92px); border-radius:50%;
    border:3px solid #e8a33d; background:rgba(18,16,14,.75); color:#f5e6c8;
    font-family:inherit; font-size:clamp(12px,3.1vw,15px); font-weight:600;
    cursor:pointer; touch-action:none; padding:0; }
  #act.on { display:block; }
  #act:active { transform:scale(.93); }
  /* 快跑：键盘按 Shift，手机上点这个圆键切换。
     比"说话"小一圈、位置也挪上去，别跟它抢手指 */
  #run { position:absolute; z-index:7; display:none;
    right:calc(18px + env(safe-area-inset-right,0px));
    bottom:calc(26px + env(safe-area-inset-bottom,0px) + clamp(70px,19vw,92px) + 14px);
    width:clamp(52px,14vw,66px); height:clamp(52px,14vw,66px); border-radius:50%;
    border:3px solid #57534e; background:rgba(18,16,14,.75); color:#f5e6c8;
    font-family:inherit; font-size:clamp(11px,2.9vw,14px); font-weight:600;
    cursor:pointer; touch-action:none; padding:0; }
  #run.on { display:block; }
  #run:active { transform:scale(.93); }
  #run.fast { border-color:#e8a33d; background:rgba(232,163,61,.3); color:#fff; }
  /* 线索本，跟"跑"并排，都在"说话"上头 */
  #btnBook { position:absolute; z-index:7; display:none;
    right:calc(18px + env(safe-area-inset-right,0px) + clamp(52px,14vw,66px) + 10px);
    bottom:calc(26px + env(safe-area-inset-bottom,0px) + clamp(70px,19vw,92px) + 14px);
    width:clamp(52px,14vw,66px); height:clamp(52px,14vw,66px); border-radius:50%;
    border:3px solid #57534e; background:rgba(18,16,14,.75); color:#f5e6c8;
    font-family:inherit; font-size:clamp(11px,2.9vw,14px); font-weight:600;
    cursor:pointer; touch-action:none; padding:0; }
  #btnBook.on { display:block; }
  #btnBook:active { transform:scale(.93); }
  /* 测试用的加速键。跟"跑"是两回事 —— 这个是给调地图/试剧情用的外挂 */
  #btnFast { position:absolute; z-index:7; display:none;
    right:calc(18px + env(safe-area-inset-right,0px) + (clamp(52px,14vw,66px) + 10px) * 2);
    bottom:calc(26px + env(safe-area-inset-bottom,0px) + clamp(70px,19vw,92px) + 14px);
    width:clamp(52px,14vw,66px); height:clamp(52px,14vw,66px); border-radius:50%;
    border:3px solid #57534e; background:rgba(18,16,14,.75); color:#f5e6c8;
    font-family:inherit; font-size:clamp(11px,2.9vw,14px); font-weight:600;
    cursor:pointer; touch-action:none; padding:0; }
  #btnFast.on { display:block; }
  #btnFast:active { transform:scale(.93); }
  #btnFast.x2 { border-color:#c2703a; background:rgba(194,112,58,.3); color:#fff; }
  #btnFast.x3 { border-color:#c0392b; background:rgba(192,57,43,.34); color:#fff; }

  /* 屏幕中间飘一行字：存档点、死亡、剧情提醒 */
  #toast { position:absolute; z-index:8; left:50%; transform:translateX(-50%);
    top:42%; padding:9px 20px; border-radius:6px; pointer-events:none;
    background:rgba(0,0,0,.8); border:1px solid #57534e; color:#f5e6c8;
    font-size:clamp(12px,3.3vw,16px); letter-spacing:.08em; text-align:center;
    opacity:0; transition:opacity .25s; max-width:86vw; }
  #toast.on { opacity:1; }

  /* 追逐战的时候，右上角挂个计时 */
  #chase { position:absolute; z-index:6; pointer-events:none; display:none;
    right:calc(16px + env(safe-area-inset-right,0px));
    top:calc(12px + env(safe-area-inset-top,0px));
    text-align:right; text-shadow:0 2px 6px rgba(0,0,0,.8); }
  #chase.on { display:block; }
  #chase .big { font-size:clamp(18px,5vw,26px); font-weight:700; color:#e05a4a;
    letter-spacing:.06em; }
  #chase .sm { font-size:clamp(10px,2.8vw,13px); opacity:.75; letter-spacing:.1em; }

  /* ---------- 画面层 ----------
     以前所有东西都塞进底下那个黑框里，那是最偷懒的做法。
     大段的东西该走全屏，地图本身也该有气氛 */

  /* 暗角：一直挂着，一点点就够 */
  #vig { position:absolute; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 42%, rgba(0,0,0,.28) 78%, rgba(0,0,0,.6) 100%); }
  /* 楼里、夜里更暗一档 */
  #vig.dark { background:radial-gradient(ellipse at 50% 50%,
    rgba(0,0,0,.35) 12%, rgba(0,0,0,.72) 70%, rgba(0,0,0,.94) 100%); }
  /* 被追的时候收得更紧 */
  #vig.chase { background:radial-gradient(ellipse at 50% 50%,
    rgba(0,0,0,.15) 8%, rgba(0,0,0,.66) 58%, rgba(0,0,0,.96) 100%); }

  /* 死那一下红闪 */
  #red { position:absolute; inset:0; z-index:9; pointer-events:none;
    background:#6d0f0f; opacity:0; }
  #red.on { opacity:.5; transition:opacity .06s; }

  /* 场景卡：大段旁白走这里，不走聊天框 */
  #card { position:absolute; inset:0; z-index:10; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    background:#0b0a09; opacity:0; transition:opacity .5s; }
  #card.on { opacity:1; }
  #card span { max-width:min(80vw,620px); text-align:center;
    font-size:clamp(15px,4vw,22px); line-height:2.1; letter-spacing:.06em;
    color:#e8e4dc; white-space:pre-wrap; }

  /* 目标那一行。挂在左上角时间和地点的下面 */
  #goal { position:absolute; z-index:5; pointer-events:none;
    left:calc(14px + env(safe-area-inset-left,0px));
    top:calc(56px + env(safe-area-inset-top,0px));
    font-size:clamp(11px,3vw,14px); letter-spacing:.06em; color:#e8d4a8;
    text-shadow:0 2px 6px rgba(0,0,0,.8); opacity:.92; max-width:60vw; }
  #goal b { color:#e8a33d; }
  /* 屏幕边缘那个指方向的箭头 */
  #arrow { position:absolute; z-index:5; pointer-events:none; display:none;
    color:#e8a33d; font-size:22px; line-height:1;
    text-shadow:0 0 8px rgba(0,0,0,.9); opacity:.85; }
  #arrow.on { display:block; }

  /* 结算屏 */
  #scOver { background:rgba(8,7,6,.97); }
  #overTxt { width:min(92vw,600px); text-align:left; }
  #overTxt p { font-size:clamp(13px,3.5vw,16px); line-height:2; margin:0 0 14px; }
  #overTxt h1 { font-size:clamp(20px,5.5vw,30px); letter-spacing:.14em; margin-bottom:22px;
    font-weight:700; color:#e8a33d; }

  /* 本子那一屏 */
  #scBook { justify-content:flex-start; padding-top:calc(64px + env(safe-area-inset-top,0px)); }
  #bookList { width:min(92vw,640px); text-align:left; }
  #bookList h3 { font-size:13px; letter-spacing:.14em; color:#e8a33d;
    margin:20px 0 8px; font-weight:600; }
  #bookList p { font-size:clamp(12px,3.2vw,15px); line-height:1.8; margin:0 0 8px;
    padding-left:12px; border-left:3px solid #44403c; }
  #bookList p.dim { color:#78716c; border-left-color:transparent; padding-left:0; }
  #bookList b { color:#f5e6c8; font-weight:600; }

  #probe { position:absolute; left:0; top:0; z-index:99; font-size:1px; opacity:.01;
    pointer-events:none; }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="vig"></div>
<div id="where"></div>
<div id="clock"></div>
<div id="goal"></div>
<div id="arrow"></div>
<div id="red"></div>
<div id="card"><span></span></div>
<div id="hint"></div>

<div id="dlg">
  <div id="dlgBox">
    <img id="dlgAv" alt="">
    <div id="dlgBody">
      <div id="dlgWho"></div>
      <div id="dlgTxt"></div>
      <ul id="dlgOpts"></ul>
    </div>
    <div id="dlgMore">▼</div>
  </div>
</div>

<div id="stick"><div id="knob"></div></div>
<button id="act" type="button">说话</button>
<button id="run" type="button">跑</button>
<button id="btnBook" type="button">本</button>
<button id="btnFast" type="button">疾</button>
<div id="toast"></div>
<div id="chase"><div class="big"></div><div class="sm">离下课铃</div></div>

<div class="screen" id="scOver">
  <div id="overTxt"></div>
  <button class="btn" id="btnAgain">再来一次</button>
</div>

<div class="screen" id="scBook">
  <h2>本子</h2>
  <div id="bookList"></div>
  <button class="btn" id="btnBookClose">合上</button>
</div>

<div class="screen on" id="scTitle">
  <h1>在校园里乱逛<small>CAMPUS</small></h1>
  <div class="tip">
    <span class="kbd">WASD</span><span class="kbd">↑↓←→</span> 走路　·　按住 <span class="kbd">Shift</span> 快跑　·　<span class="kbd">Tab</span> 翻本子<br>
    走到人跟前，按 <b>Z</b> / <b>空格</b> 跟他说话；手机左下拖动走路，右下三个圆键。<br>
    教学楼里有楼梯口，踩上去能上楼；路上捡到东西会自动记进本子。<br>
    进度的存着的，关了页再回来能接着走。
  </div>
  <button class="btn" id="btnStart">出门</button>
  <button class="btn" id="btnCont">接着上次</button>
</div>

<div class="screen" id="scPick">
  <h2>你是谁？</h2>
  <div class="picks" id="pickList"></div>
</div>

<pre id="probe"></pre>

<!-- 立绘和走路图都在这儿。必须用经典 script 引：type="module" 在 file:// 下会被 CORS 拦死 -->
<script src="../art/chars.js"></script>
<script>
"use strict";

/* ==================================================================
   在校园里乱逛

   玩法就一件事：走路、走到人跟前、说话。没有战斗、没有计时、
   没有会失败的东西 —— 被"潜行"那套坑过，这回先把骨架站稳。

   地图用矩形拼出来，不手写字符网格。手数 48 列我一定数错
   （上一版 16×16 的立绘就是数错列才歪的），矩形有宽高，不用数。
   ================================================================== */

var TILE = 32;

/* 地形种类。solid 就是走不过去；颜色都是浅色 ——
   小人是深头发深裤子，配深色地板会看不见腿，看着像飘着的半截身子 */
var TERRAIN = {
  grass:  { c:'#7fa05a', c2:'#759455', solid:false, name:'草地' },
  garden: { c:'#6f9a52', c2:'#638d47', solid:false, name:'园子' },
  path:   { c:'#cfc0a0', c2:'#c4b596', solid:false, name:'路' },
  plaza:  { c:'#c8bda9', c2:'#bcb19d', solid:false, name:'广场' },
  track:  { c:'#b9705a', c2:'#ad6952', solid:false, name:'跑道' },
  wall:   { c:'#8c7f6a', c2:'#9d8f78', solid:true,  name:'墙' },
  door:   { c:'#a8763f', c2:'#96682f', solid:false, name:'门' },
  floor:  { c:'#d9d3c6', c2:'#cdc7ba', solid:false, name:'室内' },
  corridor:{ c:'#c9c3b5', c2:'#bdb7a9', solid:false, name:'走廊' },
  classroom:{ c:'#ded7c8', c2:'#d2cbbc', solid:false, name:'教室' },
  stairs: { c:'#b9ab8e', c2:'#ada083', solid:false, name:'楼梯' },
  tree:   { c:'#5f8a45', c2:'#4e7439', solid:true,  name:'树' },
  bench:  { c:'#a8763f', c2:'#8f6333', solid:true,  name:'长椅' },
  planter:{ c:'#8f9c6a', c2:'#7c8a58', solid:true,  name:'花坛' },
  statue: { c:'#8d8478', c2:'#7d7568', solid:true,  name:'雕像' },
  /* 楼里的图，楼板外头是"没有东西" —— 画成深色，读起来就是楼外面 */
  void:   { c:'#151310', c2:'#181613', solid:true,  name:'楼外' }
};

/* ==================================================================
   校园 —— 宜春中学，中轴对称

   站在大门口往里看（从南往北）：

               〔后山：树封住的路〕      ← 科技楼再往上被树挡住
                    科技楼              ← 中轴最北，比二教三教都远
    二号教学楼                第三教学楼
    一号教学楼      〔中轴〕      实验楼
    行政楼                    〔艺术楼〕
    校史馆     〔中心广场·田〕   艺术楼
                ▲大门▲

   · 正中一条轴：大门 → 中心广场 → 中轴大道 → 科技楼（压在最里头）
   · 左手边（西）从大门往里依次：校史馆、行政楼、一号教学楼、二号教学楼
   · 右手边（东）从大门往里依次：艺术楼、实验楼、第三教学楼
   · 校史馆和艺术楼夹着大门，是离门最近的两栋
   · 实验楼、艺术楼跟三教一样是 20×20 的大楼；三教上移，跟二号教学楼并排
   · 中心广场整块是草坪，路自己组成一个"田"字，正中间立着韩愈像
   · 科技楼背后原本那几栋（食堂、开水房、球馆、田径场…）全删了，
     改成一条往左上角拐的小路，再往上被树封住

   出生点就在大门口。

   地图照旧是"一堆矩形盖上去，后面的盖前面的"。手写字符网格这事
   上回已经栽过一次（数错列），这里全用矩形，有宽高，不用数。

   改地图只改下面这几段，别的都不用动。

   现在不止一张图了 —— 见下面"地图不是一张，是一个表"那一段。
   一号图 campus = 校园；二号图 floor2 = 一号教学楼二楼
   （从楼里天井北头那个楼梯间踩上去，踩二楼的楼梯口再下来）。
   ================================================================== */

/* ==================================================================
   地图不是一张，是一个表

   每张图自己带着尺寸、地形、楼名、NPC、出口。CUR 指向当前这张，
   MAP / LABELS / MAPW / MAPH 说的都是"当前这张"。换图走 loadMap()；
   出口（踩上去就换图的格子）写在各图的 portals 里。

   加新图：写个 xxxLayout()，再 makeMap('xxx', {...}, xxxLayout)，完事。
   ================================================================== */
var MAPS = {}, CUR = null;               // 所有地图 / 当前这张
var MAP = [], LABELS = [];               // 当前这张的格子和楼名
var MAPW = 0, MAPH = 0;                  // 当前这张的尺寸，loadMap 时改

/* 正在盖的那张。R / NAME 都往它里头塞 */
var B = null;
function R(t, x, y, w, h){ B.areas.push({ t:t, x:x, y:y, w:w, h:h }); }
function NAME(x, y, w, h, t, ty){
  var L = { x:x, y:y, w:w, h:h, t:t };
  if (ty !== undefined) L.ty = ty;
  B.labels.push(L);
}

/* 把一堆矩形压成二维格子表。后盖的盖前头的 */
function grid(areas, w, h){
  var m = [];
  for (var y=0; y<h; y++){
    var row = [];
    for (var x=0; x<w; x++) row.push('grass');
    m.push(row);
  }
  areas.forEach(function(a){
    for (var y=a.y; y<a.y+a.h; y++)
      for (var x=a.x; x<a.x+a.w; x++)
        if (m[y] && m[y][x] !== undefined) m[y][x] = a.t;
  });
  return m;
}

/* 登记一张图。def 里带 w/h/spawn/npcs/portals/base，build 里照旧摆矩形 */
function makeMap(id, def, build){
  B = { areas:[], labels:[] };
  MAPW = def.w; MAPH = def.h;
  R(def.base || 'grass', 0, 0, def.w, def.h);
  build();
  def.id      = id;
  def.labels  = B.labels;
  def.map     = grid(B.areas, def.w, def.h);
  def.npcs    = def.npcs || [];
  def.portals = def.portals || [];
  def.triggers = def.triggers || [];
  MAPS[id] = def;
  B = null;
}

/* 办公楼/展馆那种：一圈外壳，里头一条走廊，走廊一侧隔成几间屋子。
   side 是走廊贴哪边 —— 也决定正门开在哪边，所以传"朝校园中心"那一面。
   rooms 是隔几间。屋子都在走廊对面那半边。 */
function hallBuilding(x, y, w, h, name, side, rooms){
  R('wall', x, y, w, h);
  R('floor', x+1, y+1, w-2, h-2);
  var iw = w-2, ih = h-2, CN = 2;            // 内部尺寸 / 走廊宽两格
  var vert = (side === 'e' || side === 'w');
  var i, j, span;
  if (vert){
    var c0 = (side === 'e') ? x+w-1-CN : x+1;
    var wallX = (side === 'e') ? c0-1 : c0+CN;
    R('corridor', c0, y+1, CN, ih);
    R('wall', wallX, y+1, 1, ih);
    var r0 = (side === 'e') ? x+1 : wallX+1;
    var r1 = (side === 'e') ? wallX-1 : x+w-2;
    span = r1-r0+1;
    if (span > 0){
      for (i=1; i<rooms; i++) R('wall', r0, y + Math.round(i*ih/rooms), span, 1);
      for (j=0; j<rooms; j++)
        R('door', wallX, y + Math.round((j+0.5)*ih/rooms), 1, 2);
      R('door', (side === 'e') ? x+w-1 : x, y + Math.floor(ih/2), 1, 2);
    }
  } else {
    var ry = (side === 's') ? y+h-1-CN : y+1;
    var wallY = (side === 's') ? ry-1 : ry+CN;
    R('corridor', x+1, ry, iw, CN);
    R('wall', x+1, wallY, iw, 1);
    var t0 = (side === 's') ? y+1 : wallY+1;
    var t1 = (side === 's') ? wallY-1 : y+h-2;
    span = t1-t0+1;
    if (span > 0){
      for (i=1; i<rooms; i++) R('wall', x + Math.round(i*iw/rooms), t0, 1, span);
      for (j=0; j<rooms; j++)
        R('door', x + Math.round((j+0.5)*iw/rooms) - 1, wallY, 2, 1);
      R('door', x + Math.floor(iw/2), (side === 's') ? y+h-1 : y, 2, 1);
    }
  }
  NAME(x, y, w, h, name);
}

/* 盖一栋楼：外壳 + 内部地板 + 门。门是 [x,y,w,h]，不写就是没门 */
function house(x, y, w, h, name, doors, inner){
  R('wall', x, y, w, h);
  R(inner || 'floor', x+1, y+1, w-2, h-2);
  (doors || []).forEach(function(d){ R('door', d[0], d[1], d[2]||1, d[3]||1); });
  if (name) NAME(x, y, w, h, name);
}

/* 教学楼/实验楼的一"翼"：9 宽 20 高。
   靠天井那侧一条竖走廊；正中间横穿一条过道，把两间教室隔开。
   side  = 走廊靠哪边（都朝着中间的天井）
   front = 这一翼的外墙面是不是"正面"（朝校园中心），是就在过道口开正门 */
function wing(x, y, side, front){
  var w = 9, h = 20, east = (side === 'east');
  R('wall', x, y, w, h);
  R('classroom', x+1, y+1, w-2, h-2);
  var corrX = east ? x+6 : x+1;          // 竖走廊占两列
  var wallX = east ? x+5 : x+3;          // 走廊和教室之间那一列
  var roomX = east ? x+1 : x+4;          // 教室占四列
  var faceX = Math.min(roomX, wallX);    // 教室那侧"门脸"从哪一列起
  R('corridor', corrX, y+1, 2, h-2);
  R('corridor', x+1, y+9, w-2, 2);       // 横过道：从外墙面一路通到竖走廊
  R('wall', wallX, y+1,  1, 8);          // 竖隔墙断成两截，中间让给过道
  R('wall', wallX, y+11, 1, 8);
  R('wall', faceX, y+8,  5, 1);          // 两间教室各自的门脸墙
  R('wall', faceX, y+11, 5, 1);
  R('door', faceX+1, y+8,  2, 1);
  R('door', faceX+1, y+11, 2, 1);
  /* 正门开在背对走廊那一面 —— 也就是朝校园中心那一面 */
  if (front) R('door', east ? x : x+8, y+9, 1, 2);
}

/* 一栋大楼 = 西翼 + 竖天井 + 东翼，20×20。
   facing 是这栋楼"朝校园中心"的那一面：西边那排楼朝东，东边那排朝西。
   两翼的走廊都朝着天井；正门开在 facing 那一面的外墙上，进门就是过道，
   过道一头通竖走廊、一头通天井 —— 所以门一律冲着中心开。
   三栋教学楼、实验楼都用它，所以它们一样大、一个朝向。 */
function bigBuilding(bx, by, name, facing){
  var east = (facing === 'east');
  wing(bx,    by, 'east', !east);        // 西翼：朝西的那排楼，它才是正面
  wing(bx+11, by, 'west', east);         // 东翼：朝东的那排楼，它才是正面
  R('garden', bx+9, by+1,  2, 18);       // 中间竖着那条天井
  R('stairs', bx+9, by+1,  2, 1);        // 天井两头是楼梯间，先当标记摆着
  R('stairs', bx+9, by+18, 2, 1);
  R('door', bx+8,  by+9, 1, 2);          // 天井两侧各开一个门，两翼的过道都通
  R('door', bx+11, by+9, 1, 2);
  NAME(bx, by, 20, 20, name);
}

/* 艺术楼是"回"字：外圈一圈房间，中间一个方院子 */
function ringBuilding(bx, by, name){
  R('wall', bx, by, 20, 20);
  R('floor', bx+1, by+1, 18, 18);
  R('wall', bx+5, by+5, 10, 10);         // 内圈
  R('garden', bx+6, by+6, 8, 8);         // 中间的院子
  R('door', bx+9,  by+5,  2, 1);         // 院子四边各开一个口
  R('door', bx+9,  by+14, 2, 1);
  R('door', bx+5,  by+9,  1, 2);
  R('door', bx+14, by+9,  1, 2);
  R('door', bx, by+9, 1, 2);             // 正门朝西，冲着校园中心
  NAME(bx, by, 20, 20, name);
}

function tileAt(tx, ty){

   站桩，不巡逻。玩家走近了就转过来看你 —— 几行代码，
   但"被注意到"的感觉全靠它。
   ============================================ */
/* 各图自己的站位，写在那张图的 npcs 里（见下面 makeMap）。
   挑站位的思路：lg7 在后山小路走到头的死角；老师、同桌在一号教学楼教室里；
   牢李在二号教学楼走廊；logic 在第三教学楼；其余人散在主干道、广场、路上 */
var TALK_R = 60;                 // 中心距小于这个数才算够得着
var NAME_R = 260;                // 近到能看清是谁，就往头顶挂名字

/* ==================================================================
   剧情设定 —— 写代码之前先把人立住，免得写到一半忘了谁是谁

   ── 四个人，都是 46 班的 ──

   牢李   好的，但什么都不知道。老实人。
          他不是"紧张才想上" —— 是**随机时刻就来**，毫无规律，
          说走就得走。所以他老是半路离队、老是撞见不该看见的。
          他在 45 班有故事，所以下意识老想往那边绕。
          → 选他：你在完全不知情的前提下往下查，
            而且你比别人更容易掉队。
   水哥   中立的。玩 Limbus Company，上课憋不住笑了一声，
          被 lg7 逮着骂了半节课。
          → 选他：两边都能帮，最后站哪边由你定。
   logic  坏的，知道内幕。学数学竞赛，玩第五人格，跟 46 班的 zzx 有关系。
          他早知道二楼那间教室能进去，而且里头"时间不动"，
          所以一直一个人躲在那儿刷题。他不说 —— 说了就再也进不去了。
          → 选他：你一开始就知道，而且你在瞒。
   lg7    看着最像坏人，其实是红鲱鱼。
          他不是学生，是老师。蹲水房、蹲后山，就是在堵人，
          想抓学生去搞化学竞赛。故弄玄虚，装神弄鬼。

   ── 那件事 ──
   很多年前，二楼走廊尽头那间教室出过一次事。之后它被封了，
   再之后没人提。现在它又回来了 —— 黑板上写着当天的值日表，上面有你的名字。

   ── 三个老梗，都写进去了 ──
   · 翻译笔：有人上课用翻译笔，被 lg7 一把扔进水桶，到毕业也没人捞。
   · 45 班：牢李的。
   · zzx：logic 的。

   ── 恐怖怎么做的 ──
   参考的是规则怪谈那一挂和几款小体量恐怖游戏，不是"突然蹦出来吓你"。

   · 一张《46 班自习课守则》就是全篇引子。头两条很正常，
     从第三条开始不对劲 —— 而它每一条后面都会应验。
     规则怪谈最狠的地方在于：它先告诉你规矩，再让你自己撞上去。
   · 套路是 Hook(哪里不对) → Build(走过去、犹豫) → Diversion(注意力引开)
     → Execution(收) → 缓一口气。全都堆成一次性拍脸上，那叫廉价。
   · 中式恐怖是"无鬼的恐怖"：吓人的是熟日常里的那道缝，
     不是血。血只留在收口那一处。
   · 翻译笔是全篇引擎：它翻译过不该翻译的东西，
     所以 lg7 当着全班把它扔进了水桶 —— 这既是他扔笔的原因，
     也是"二楼不归我管"那句话的来由。
   ================================================================== */

/* ==================== 剧情状态 ====================
   剧情说到底就是"记没记住某件事"。FLAGS 就是那份记忆：
   键是旗标名，值是 true（或者一句话）。

   三个地方往它里头写：
     · 对话节点上的 set:'纸条'   —— 说到这儿就记上
     · 对话选项上的 if:'纸条'    —— 没这条就不出现
     · 地图触发区上的 set / if   —— 踩进去就记上

   线索本直接读它。加一段剧情，多半就是加几个旗标 + 几行字。
   ==================================================== */
var FLAGS = {};
function flagOn(k){ return !!FLAGS[k]; }
function setFlag(k, v){
  if (!k) return;
  /* 也收数组：一个节点上要同时立两个旗标是常有的事 */
  if (typeof k === 'object' && k && k.forEach){
    k.forEach(function(x){ if (x) FLAGS[x] = true; });
    return;
  }
  FLAGS[k] = (v === undefined) ? true : v;
}
/* ==================== 画面表现 ====================
   这一块全是"别老靠聊天框"长出来的。
   大段的旁白走全屏场景卡；地图本身有暗角；被追的时候收得更紧；
   死一下红闪；开追那一下抖屏。
   ============================================ */
var cardEl = document.getElementById('card'), cardTxt = cardEl.firstChild;
var vigEl  = document.getElementById('vig');
var redEl  = document.getElementById('red');
var goalEl = document.getElementById('goal');
var arrowEl= document.getElementById('arrow');

function card(text, secs){
  cardTxt.textContent = text;
  cardEl.classList.add('on');
  M.cardT = (secs || 2.8);
  M.talk.open = false;                    // 场景卡期间不走对话框
  dlgEl.classList.remove('on');
  sfxPick();
}
function flashRed(){ redEl.classList.add('on'); setTimeout(function(){ redEl.classList.remove('on'); }, 130); }
function shake(secs){ M.shakeT = secs || 0.5; }

/* 目标：从上往下第一个成立的。
   玩家永远该知道下一步去哪儿 —— 这是原来的大毛病 */

  { if:'被追了',     map:'campus', t:'冲出去 —— 别停',        x:38, y:124 },
  { if:'拉过铃',     map:'campus', t:'下楼，往校门走',          x:38, y:124 },

  { if:'可以上去了', map:'campus', t:'天井北头那个楼梯口',      x:13, y:73  },
  { if:'该上二楼了', map:'campus', t:'去天井北头',              x:13, y:74  },
  { if:'该去后山了', map:'campus', t:'穿过校园往北 —— 去后山',  x:39, y:26  },
  { if:'该查名单了', map:'campus', t:'去大门口，找那个值周生',  x:37, y:119 },
  { if:'看过守则',   map:'campus', t:'数一遍人 —— 只数两遍',    x:19, y:78  },
  { if:'纸条',       map:'campus', t:'教室后墙贴着一张纸',      x:19, y:73  },
  {                  map:'campus', t:'先去教室 —— 一号教学楼',  x:23, y:82  }
];
function goalNow(){
  for (var i=0;i<GOALS.length;i++){
    var G = GOALS[i];
    if (G.if && !flagOn(G.if)) continue;
    if (G.map && M.map !== G.map) continue;
    return G;
  }
  return null;
}
/* 每帧：目标那一行，加上屏幕边缘那个指方向的箭头 */
function goalTick(){
  if (M.screen !== 'play'){ goalEl.textContent = ''; arrowEl.classList.remove('on'); return; }
  var G = goalNow();
  if (!G){ goalEl.textContent = ''; arrowEl.classList.remove('on'); return; }
  goalEl.innerHTML = '<b>→</b> ' + escapeHTML(G.t);
  var sx = G.x*TILE + TILE/2 - camX, sy = G.y*TILE + TILE/2 - camY;
  /* 目标在画面里就不指了 —— 一直挂着个箭头反而碍事 */
  if (sx > 30 && sx < W-30 && sy > 30 && sy < H-30){ arrowEl.classList.remove('on'); return; }
  var ang = Math.atan2(sy - H/2, sx - W/2);
  arrowEl.textContent = '➤';
  arrowEl.style.left = (W/2 + Math.cos(ang) * (W/2 - 44)) + 'px';
  arrowEl.style.top  = (H/2 + Math.sin(ang) * (H/2 - 44)) + 'px';
  arrowEl.style.transform = 'translate(-50%,-50%) rotate(' + ang + 'rad)';
  arrowEl.classList.add('on');
}

function clearFlag(k){
  if (!k) return;
  if (typeof k === 'object' && k && k.forEach){ k.forEach(function(x){ delete FLAGS[x]; }); return; }
  delete FLAGS[k];
}

/* ==================== 时间 ====================
   时间不自己走 —— 由剧情推着走（setClock）。整条线就一个上午：
   六点五十到校，十点半被追，十点三十六出校门。
   时间段本身也是旗标，对话里 if:'早读' 就能用。
   NPC 按点换地方：sched 写 [起始分钟, 结束分钟, x, y]。
   ============================================ */
var CLOCK_START = 6 * 60 + 50;           // 06:50 到校
var CLOCK_END   = 10 * 60 + 36;          // 10:36 出校门
var BANDS = [
  { from: 6*60+40, to:  7*60+30, flag:'早读' },
  { from: 7*60+30, to: 11*60+40, flag:'上课' }
];
function clockText(min){
  var m = ((Math.floor(min) % 1440) + 1440) % 1440;
  return ('0' + Math.floor(m/60)).slice(-2) + ':' + ('0' + (m%60)).slice(-2);
}
/* 剧情把时间往前推。进制是分钟，写 setClock(7*60+30) 就是七点半 */
function setClock(min){
  M.clock = min;
  applyClock();
  if (clockEl) clockEl.textContent = clockText(M.clock);
}
function applyClock(){
  var m = ((Math.floor(M.clock) % 1440) + 1440) % 1440;
  BANDS.forEach(function(b){
    if (m >= b.from && m < b.to) FLAGS[b.flag] = true;
    else delete FLAGS[b.flag];             // 过了点就撤，不然旗标一直挂着
  });
  /* 三条线各拿各的拼图，拿到哪块都算凑齐了 —— 一条线走到底就够上二楼 */
  if (!FLAGS['可以上去了'] &&
      (flagOn('拿过名单') || flagOn('拿回手机') || flagOn('logic承认了')))
    setFlag('可以上去了');

  M.npcs.forEach(function(n){
    var def = null;
    CUR.npcs.forEach(function(d){ if (d.id === n.id) def = d; });
    if (!def) return;
    var tx = def.tx, ty = def.ty;          // 没写 sched 就一直在原来的站位
    if (def.sched) def.sched.forEach(function(s){
      if (m >= s[0] && m < s[1]){ tx = s[2]; ty = s[3]; }
    });
    var nx = tx*TILE + TILE/2, ny = ty*TILE + TILE/2;
    if (n.x === nx && n.y === ny) return;
    /* 眼皮底下的先别挪 —— 不然人会在你面前"啪"一下换地方 */
    var seen = n.x > camX - 40 && n.x < camX + W + 40 &&
               n.y > camY - 40 && n.y < camY + H + 40;
    if (seen) return;
    n.x = nx; n.y = ny; n.tx = tx; n.ty = ty;
  });
}

/* 说话的人是谁：名字和立绘都从 CHARS 里查。
   广播/旁白没有 face，就只显示名字 */
function speaker(id){
  for (var i=0;i<CHARS.length;i++) if (CHARS[i].id===id) return CHARS[i];
  return null;
}

/* ==================== 画布 ==================== */
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1, camX = 0, camY = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.imageSmoothingEnabled = false;      // 像素画不许插值
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

/* ==================== 声音 ====================
   一个音频文件都没有 —— 全部现场合成。
   这样不用下载素材，也不用管格式；坏处是只能做"电子味"的音效，
   可这是个校园恐怖游戏，铃、脚步、电流声，电子味正好。
   ============================================ */
var AC = null, SND = true;      // 默认开。上一版写成了 false —— 等于整个音效模块没接上
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){ AC = null; }
}
/* 一个音。slideTo 是滑音到哪儿 —— 铃是"叮"，滑音是"咣" */
function tone(freq, dur, opt){
  if (!AC || !SND) return;
  opt = opt || {};
  var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = opt.type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (opt.slideTo) o.frequency.exponentialRampToValueAtTime(opt.slideTo, t + dur);
  g.gain.setValueAtTime(opt.vol || 0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur);
}
/* 一段噪声。脚步、开门、风，都是它 */
function hiss(dur, opt){
  if (!AC || !SND) return;
  opt = opt || {};
  var n = Math.floor(AC.sampleRate * dur);
  var buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (var i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  var s = AC.createBufferSource(); s.buffer = buf;
  var f = AC.createBiquadFilter(); f.type = opt.type || 'lowpass';
  f.frequency.value = opt.freq || 800;
  var g = AC.createGain(); g.gain.value = opt.vol || 0.05;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
var lastStep = 0;
function sfxStep(){                                  // 脚步：别每帧都响
  if (!AC || !SND) return;
  var now = performance.now();
  if (now - lastStep < 260) return;
  lastStep = now;
  hiss(0.06, { vol: 0.035, freq: 420 });
}
function sfxBell(times){                             // 早读铃 / 下课铃
  if (!AC || !SND) return;
  var n = times || 3;
  for (var i=0;i<n;i++){
    (function(k){
      setTimeout(function(){
        tone(1046, 0.5, { type:'triangle', vol:0.06 });
        tone(1568, 0.32, { type:'sine', vol:0.03 });
      }, k * 420);
    })(i);
  }
}
function sfxDie(){
  if (!AC || !SND) return;
  tone(160, 1.4, { type:'sawtooth', vol:0.09, slideTo:42 });
  hiss(0.9, { vol: 0.06, freq: 260 });
}
function sfxBlip(){ if (AC && SND) tone(660, 0.02, { type:'square', vol:0.012 }); }
function sfxDoor(){ if (AC && SND) hiss(0.5, { vol:0.05, freq:1100, type:'bandpass' }); }
function sfxPick(){ if (AC && SND){ tone(880,0.08,{type:'triangle',vol:0.05}); tone(1320,0.12,{type:'triangle',vol:0.035}); } }
/* 追逐时的低频底噪。开一次，停下时关掉 */
var droneOsc = null, droneGain = null;
function droneOn(){
  if (!AC || !SND || droneOsc) return;
  droneOsc = AC.createOscillator(); droneGain = AC.createGain();
  droneOsc.type = 'sawtooth'; droneOsc.frequency.value = 55;
  droneGain.gain.value = 0.028;
  var f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
  droneOsc.connect(f); f.connect(droneGain); droneGain.connect(AC.destination);
  droneOsc.start();
}
function droneOff(){ if (droneOsc){ try { droneOsc.stop(); } catch (e){} droneOsc = null; droneGain = null; } }

/* ==================== 状态 ==================== */
function freshTalk(){
  return { open:false, npc:null, who:null, nodeId:null, sel:0, shown:[],
           script:null, typed:0, cool:0 };
}
var M = {
  screen:'title',            // title | pick | play
  me:null,                   // 玩家选的角色
  p:{ x:0, y:0, dir:'down', anim:0, moving:false },
  npcs:[],
  talk:freshTalk(),
  talked:{}, reentry:{},
  run:false,                 // 手机那个「跑」开关。键盘走 Shift，不占这个
  book:false,                // 线索本开着没
  clock:0,                   // 游戏里的时间，单位分钟
  urge:0, urgeCool:22,       // 
  lightT:0,                  // 二楼灯灭到哪儿了
  map:'',                    // 现在在哪张图
  fade:0,                    // 换图时黑一下，0 就是没有
  portalCool:0,              // 刚落地别马上又被传回去
  t:0
};
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ==================== 换图 ====================
   同一个 CUR 表驱动：格子、楼名、尺寸、NPC 全换成新那张的。
   聊过谁是全局的（M.talked），换图不丢 —— 在楼上聊过的人，下楼还认得。
   ============================================ */
function loadMap(id, tx, ty){
  CUR = MAPS[id];
  MAP = CUR.map; LABELS = CUR.labels;
  MAPW = CUR.w; MAPH = CUR.h;
  M.map = id;
  /* 玩家选谁，谁就不作为 NPC 出现 —— 不然会撞见自己 */
  var meId = M.me && M.me.id;
  M.npcs = CUR.npcs.filter(function(n){ return n.id !== meId; }).map(function(n){
    return { id:n.id, face:n.face, talk:n.talk, tx:n.tx, ty:n.ty,
             x:n.tx*TILE+TILE/2, y:n.ty*TILE+TILE/2, dir:n.face, anim:0 };
  });
  M.p.x = tx*TILE + TILE/2; M.p.y = ty*TILE + TILE/2;
  M.p.dir = 'up'; M.p.anim = 0;
  M.near = null;
  M.fade = 0.5;
  M.portalCool = 0.7;
  sfxDoor();
  M.talk = freshTalk();
  /* 换图时把对话框收掉，别把上一张图的对话带过来 */
  if (typeof dlgEl !== 'undefined') dlgEl.classList.remove('on');
}

/* ==================== 存档 ====================
   存的就那点剧情状态：旗标、聊过谁、在哪张图、站哪儿、几点。
   自动存：每 4 秒一次、切到后台一次、关页面前一次。
   ============================================ */
var SAVE_KEY = 'ink831:save';
function saveGame(){
  if (M.screen !== 'play' || !M.me) return;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      me: M.me.id, map: M.map, x: M.p.x, y: M.p.y, clock: M.clock,
      flags: FLAGS, talked: M.talked, reentry: M.reentry
    }));
  } catch (e){}          // 隐私模式之类存不了就算了，不能因为存档把游戏搞崩
}
function hasSave(){
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e){ return false; }
}
function loadGame(){
  var s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e){}
  if (!s || !MAPS[s.map]) return false;
  startWalk(s.me || 'laoli');            // 先把一切清干净，再拿存档盖上去
  M.clock = s.clock || CLOCK_START;
  FLAGS = s.flags || {};
  M.talked = s.talked || {};
  M.reentry = s.reentry || {};
  loadMap(s.map, 0, 0);
  M.p.x = s.x; M.p.y = s.y;
  M.fade = 0.5; M.portalCool = 0.8;
  saveGame();
  return true;
}
window.addEventListener('visibilitychange', function(){ if (document.hidden) saveGame(); });
window.addEventListener('beforeunload', saveGame);

/* ==================== 牢李：随机想上厕所 ====================
   不是"紧张才想上" —— 是毫无规律，说来就来，说走就得走。
   所以他老是半路离队、老是撞见不该看见的。
   憋着走不快；找到厕所才算完。
   ==================================================== */
/* 走廊尽头那扇玻璃的位置。守则第四条说的就是它 */
var GLASS = [ { x:16, y:86, w:2, h:4 } ];

/* 有些地方会多站一个人。走近了就没有 —— 这条比任何文字都管用 */
var GHOSTS = [
  { x:36, y:12, map:'floor2', if:'上过二楼',  id:'deskmate' },
  { x:13, y:84, map:'campus', if:'看过守则',  id:'logic' }
];

var TOILETS = [
  { x:5, y:84, w:4, h:7 },      // 一号教学楼西翼南排
  { x:5, y:60, w:4, h:7 }       // 二号教学楼西翼南排
];
function inToilet(){
  var tx = Math.floor(M.p.x/TILE), ty = Math.floor(M.p.y/TILE);
  for (var i=0;i<TOILETS.length;i++){
    var T = TOILETS[i];
    if (tx>=T.x && tx<T.x+T.w && ty>=T.y && ty<T.y+T.h) return true;
  }
  return false;
}
function urgeTick(dt){
  if (!(M.me && M.me.id === 'laoli')) return;
  if (M.urge > 0){
    if (inToilet()){
      M.urge = 0; M.urgeCool = 30 + Math.random()*40;
      if (flagOn('憋着')){ clearFlag('憋着'); toast('……好多了。', 1.6); }
      return;
    }
    M.urge -= dt;
    if (M.urge <= 0){ M.urge = 0; M.urgeCool = 18; setFlag('憋着'); toast('憋着。走不快。', 2.2); }
    return;
  }
  M.urgeCool -= dt;
  if (M.urgeCool <= 0){ M.urge = 28 + Math.random()*22; toast('……不行。得去一趟。', 2.4); }
}

/* ==================== 存档点 / 死了重来 ====================
   CP 就是"上一个存档点"：位置、时间、以及那一刻的全部旗标。
   被追上、走错地方走死了，都回这儿 —— 旗标一起回滚，
   不然死一次就白拿一块线索，反复死几次剧情就串了。
   ==================================================== */
var CP = null;
function checkpoint(tag){
  CP = {
    map: M.map, x: M.p.x, y: M.p.y, clock: M.clock,
    flags:   JSON.parse(JSON.stringify(FLAGS)),
    talked:  JSON.parse(JSON.stringify(M.talked)),
    reentry: JSON.parse(JSON.stringify(M.reentry))
  };
  if (tag) toast('存档点 · ' + tag);
}
function respawn(){
  if (!CP){ loadMap('campus', MAPS.campus.spawn[0], MAPS.campus.spawn[1]); return; }
  FLAGS     = JSON.parse(JSON.stringify(CP.flags));
  M.talked  = JSON.parse(JSON.stringify(CP.talked));
  M.reentry = JSON.parse(JSON.stringify(CP.reentry));
  loadMap(CP.map, 0, 0);
  M.p.x = CP.x; M.p.y = CP.y;
  M.clock = CP.clock;
  M.fade = 0.9; M.portalCool = 1.0;
  M.chase = null;                        // 追逐战的东西全清掉
  applyClock();
  if (clockEl) clockEl.textContent = clockText(M.clock);
}
/* 死。默认一秒多之后自动回存档点 */
function die(why, delay){
  if (M.dying > 0) return;
  M.deathDur = delay || 1.1;
  M.dying = M.deathDur;
  M.deathMsg = why || '';
  sfxDie(); droneOff(); flashRed(); shake(0.7);
  /* 不用 toast：那行字直接写在死亡画面上，比角落飘一下重得多 */
}
/* ==================== 追逐战 ====================
   十点半，外面整队。追你的不是怪物，是那个 46 班 ——
   他们一个一个把人数进去，数到你就算完了。
   难度就三条：比你走快、比你跑慢（所以必须一直按着 Shift），六分钟。
   守则照旧管用：玻璃前面不能停。逃跑的时候你还得记着这条。
   ============================================ */
var CHASE_SPD   = 150;                 // 追的人：比走路(108)快，比快跑(259)慢
var CHASE_RATE  = 6 / 90;              // 六分钟游戏时间，压进大约 90 秒
var CHASE_FACES = ['deskmate', 'teacher', 'duty', 'dean', 'logic'];
var chaseEl = document.getElementById('chase');

function startChase(){
  if (M.chase) return;
  setClock(10*60 + 30);
  M.chase = { hounds: [] };
  /* 他们不追你 —— 他们整队。队形横在回校门那条路上，你得从缝里钻过去。
     人数看你前面选帮谁：帮了 logic，他不来；告诉值周生，值周生带人来了 */
  var spots = [[30,96],[37,101],[44,96],[33,109],[46,109],[39,115],[24,103]];
  var cnt = 6;
  if (flagOn('帮logic'))  cnt -= 1;
  if (flagOn('帮值周生')) cnt += 1;
  spots.slice(0, Math.max(3, Math.min(spots.length, cnt))).forEach(function(p, i){
    M.chase.hounds.push({
      x: p[0]*TILE + TILE/2, y: p[1]*TILE + TILE/2,
      dir:'up', anim: 0, id: CHASE_FACES[i % CHASE_FACES.length]
    });
  });
  checkpoint();                        // 死在半路就从这儿重来
  droneOn(); shake(0.9);               // 低频底噪，一开就让人心慌
  sfxBell(2);
  toast('整队了。', 2.4);
  if (chaseEl) chaseEl.classList.add('on');
}
function chaseTick(dt){
  var C = M.chase, k = 0;
  M.clock += dt * CHASE_RATE;
  if (clockEl) clockEl.textContent = clockText(M.clock);
  if (chaseEl){
    chaseEl.querySelector('.big').textContent = clockText(M.clock);
    chaseEl.querySelector('.sm').textContent =
      '离下课铃 ' + Math.max(0, Math.ceil(CLOCK_END - M.clock)) + ' 分';
  }
  for (k = 0; k < C.hounds.length; k++){
    var h = C.hounds[k];
    var dx = M.p.x - h.x, dy = M.p.y - h.y, d = Math.hypot(dx, dy) || 1;
    var vx = dx/d*CHASE_SPD*dt, vy = dy/d*CHASE_SPD*dt;
    if (canWalk(h.x+vx, h.y)) h.x += vx;
    if (canWalk(h.x, h.y+vy)) h.y += vy;
    h.dir = (Math.abs(vx) > Math.abs(vy)) ? (vx>0?'right':'left') : (vy>0?'down':'up');
    h.anim += dt;
    if (Math.hypot(M.p.x-h.x, M.p.y-h.y) < 17) return die('被数进去了。');
  }
  if (M.p.y > 122*TILE) return endChase();                    // 出校门了
  if (M.clock >= CLOCK_END) return die('下课铃响了。\n你没走出去。', 2.0);
}
function endChase(){
  M.chase = null;
  droneOff();
  sfxBell(4);                          // 下课铃
  if (chaseEl) chaseEl.classList.remove('on');
  /* 出门前那一场：墙根那个人。这是他最后一面 */
  M.showOverAfter = true;
  openScript('final_gate');
}
/* ==================== 结局 ====================
   不再只看角色 —— 看你这一趟都干了什么：
   认出那个名字没有、译出笔记没有、最后有没有告诉他。
   三条线 × 两三个条件，能出七八种。
   ============================================ */
function endingFor(){
  var me    = M.me ? M.me.id : 'laoli';
  var notes = flagOn('译出化学笔记');
  var named = flagOn('认出名字') || flagOn('拿过名单');
  var told  = flagOn('告诉lg7');

  /* 墙根那个人：每一种结局都用得上的最后一段 */
  var wall = told
    ? ['（你把饭盒扶正了。）', '（那天他没再蹲回墙根。）', '（第二天也没有。）']
    : ['（墙根那个饭盒，还有人在那儿留。）'];

  if (me === 'logic'){
    var l = ['……你停下了。', '整队的声音从楼下过去，一间一间地数。',
             '数到二楼的时候，跳过去了。', '你不在名单上。',
             '你回到那间教室，坐回最后一排靠窗的位置。'];
    if (named) l.push('（值日表最后一格那个名字，你早就看见了。）');
    l.push('屏幕还亮着。那一局还没打完。', '——永远打不完。');
    return { title: told ? '留在二楼 · 门没关' : '留在二楼', lines: l };
  }

  var head;
  if (me === 'shui' && flagOn('帮logic')){
    head = ['你什么都没说。', '那一层楼还在。',
            '新学期开学，二楼走廊尽头那间挂上了新的班号。', '点名的时候，还是多一个。'];
  } else if (me === 'shui'){
    head = ['你把值周生叫来了。', '当天下午，二楼那间教室被砌死，连窗户一起。',
            '名单上那个名字，第一次没答"到"。'];
  } else {
    head = ['你把名单交了出去。', '当天下午，二楼那间教室被砌死了。',
            '下一周的点名册上，46 班十九个人。', '——本来就是十九个。'];
    if (named) head.push('（那个名字你认得。它是你在值周生本子上对出来的。）');
    else       head.push('（名字你还是没看清。就这样吧。）');
  }
  if (notes && !told) head.push('（那页化学笔记，你谁也没说。）');
  if (!notes) head.push('（那间教室的黑板，你没敢再动。）');

  var title = me === 'shui'
    ? (flagOn('帮logic') ? '换了个班号' : '封了那扇门')
    : (named ? '名字被划掉了' : '名单上没那个名字');

  return { title: title, lines: head.concat(wall) };
}
function showOver(e){
  M.screen = 'over';
  document.getElementById('overTxt').innerHTML =
    '<h1>' + escapeHTML(e.title) + '</h1>' +
    e.lines.map(function(s){ return '<p>' + escapeHTML(s) + '</p>'; }).join('');
  show(document.getElementById('scOver'));
  whereEl.style.display = 'none';
  clockEl.style.display = 'none';
  actEl.classList.remove('on'); runEl.classList.remove('on');
  bookBtn.classList.remove('on'); fastBtn.classList.remove('on');
}
document.getElementById('btnAgain').addEventListener('click', function(){
  location.href = location.pathname;      // 从头来一遍
});

/* 屏幕中间飘一行字，过两秒自己没。存档点、死亡提示、剧情提醒都用它 */
function toast(msg, secs){
  M.toastT = secs || 2.2;
  if (!toastEl) return;
  toastEl.textContent = msg;
  toastEl.classList.add('on');
}

/* ==================== 开局 ==================== */
function startWalk(charId){
  audioInit();                   // 浏览器要用户点一下才肯出声，"出门"就是那一下
  var me = null;
  CHARS.forEach(function(c){ if (c.id===charId) me = c; });
  M.me = me;
  M.talked = {}; M.reentry = {}; M.t = 0;
  M.clock = CLOCK_START;
  M.urge = 0; M.urgeCool = 22; M.lightT = 0;
  FLAGS = {};                    // 新开一局，剧情从头记
  /* 你选了谁，整条线就走谁那条 —— 对话和触发区都拿这个当条件 */
  setFlag('是:' + charId);
  loadMap('campus', MAPS.campus.spawn[0], MAPS.campus.spawn[1]);
  applyClock();                  // 把开局时间段的旗标先刷上（早读之类）
  checkpoint();                  // 开局就有一个存档点，死了不至于从头来
  M.run = false;
  M.screen = 'play';
  show(null);
  document.getElementById('where').style.display = '';
  document.getElementById('clock').style.display = '';
  if (clockEl) clockEl.textContent = clockText(M.clock);   // 先把时间画上，别空着
  hintEl.classList.remove('on');
  actEl.classList.add('on');
  runEl.classList.remove('fast');
  runEl.classList.add('on');
  bookBtn.classList.add('on');
  fastBtn.classList.add('on');
  M.book = false;
  M.fast = 0;
  M.dying = 0;
  M.toastT = 0;
  if (toastEl) toastEl.classList.remove('on');
  fastBtn.textContent = '疾';
  fastBtn.classList.remove('x2', 'x3');
  if (hasTouch) stickEl.classList.add('on');
  resize();
}

/* ==================== 输入 ==================== */
var keys = {};
var hasTouch = ('ontouchstart' in window);
window.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (e.repeat) return;                       // 按住不放不该连发
  if (k === 'tab') e.preventDefault();        // Tab 默认是跳焦点，抢过来当本子用
  if ([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>=0) e.preventDefault();
  if (M.screen !== 'play') return;
  /* 本子：Tab 或 B 开关，Esc 合上 */
  if (k === 'tab' || k === 'b'){ if (M.book) closeBook(); else openBook(); return; }
  if (k === 'escape'){ if (M.book) closeBook(); return; }
  if (k === 'g'){ cycleFast(); return; }      // 测试加速
  if (k === 'm'){                             // 静音
    SND = !SND;
    if (!SND) droneOff(); else if (M.chase) droneOn();
    toast(SND ? '声音：开' : '声音：关');
    return;
  }
  if (M.book) return;                         // 本子开着，别让走路的键漏进去
  if (k==='z' || k===' ' || k==='enter'){ pressAct(); return; }
  if (M.talk.open){
    if (k==='arrowup'   || k==='w') moveSel(-1);
    if (k==='arrowdown' || k==='s') moveSel(1);
    if (k>='1' && k<='9') pickOpt(parseInt(k,10)-1);   // 选项个数不固定了，放宽到 9
    return;
  }
  keys[k] = true;
});
window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

var stickEl = document.getElementById('stick'), knobEl = document.getElementById('knob');
var stick = { on:false, id:null, bx:0, by:0, dx:0, dy:0, r:56 };
function stickStart(x,y,id){
  stick.on=true; stick.id=id; stick.bx=x; stick.by=y; stick.dx=0; stick.dy=0;
  stickEl.classList.add('on');
  stickEl.style.cssText += ';left:'+(x-stick.r)+'px;top:'+(y-stick.r)+'px;width:'+(stick.r*2)+
    'px;height:'+(stick.r*2)+'px;border-radius:50%;background:rgba(120,113,108,.3);'+
    'border:2px solid rgba(200,190,170,.45);';
  knobEl.style.cssText = 'width:50px;height:50px;border-radius:50%;background:rgba(232,163,61,.85);'+
    'position:absolute;left:50%;top:50%;';
  moveKnob(0,0);
}
function moveKnob(dx,dy){
  knobEl.style.transform = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
}
function stickMove(x,y){
  var dx=x-stick.bx, dy=y-stick.by, d=Math.hypot(dx,dy);
  if (d>stick.r){ dx=dx/d*stick.r; dy=dy/d*stick.r; }
  stick.dx=dx/stick.r; stick.dy=dy/stick.r; moveKnob(dx,dy);
}
function stickEnd(){
  stick.on=false; stick.id=null; stick.dx=0; stick.dy=0;
  stickEl.classList.remove('on');
}
cv.addEventListener('touchstart', function(e){
  if (M.screen!=='play' || M.talk.open) return;
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (!stick.on && t.clientX < W*0.5) stickStart(t.clientX, t.clientY, t.identifier);
  }
}, {passive:false});
cv.addEventListener('touchmove', function(e){
  e.preventDefault();
  for (var i=0;i<e.changedTouches.length;i++){
    var t = e.changedTouches[i];
    if (stick.on && t.identifier===stick.id) stickMove(t.clientX, t.clientY);
  }
}, {passive:false});
function touchDone(e){
  for (var i=0;i<e.changedTouches.length;i++)
    if (e.changedTouches[i].identifier===stick.id) stickEnd();
}
cv.addEventListener('touchend', touchDone);
cv.addEventListener('touchcancel', touchDone);

var actEl = document.getElementById('act'), hintEl = document.getElementById('hint');
actEl.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); pressAct(); }, {passive:false});
actEl.addEventListener('mousedown', function(e){ e.preventDefault(); pressAct(); });

/* 手机上的「跑」是切换式的，不是按住 —— 一只手要推摇杆，腾不出第二根指头 */
var runEl = document.getElementById('run');
function toggleRun(){
  M.run = !M.run;
  runEl.classList.toggle('fast', M.run);
}
runEl.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); toggleRun(); }, {passive:false});
runEl.addEventListener('mousedown', function(e){ e.preventDefault(); toggleRun(); });

/* ==================== 线索本 ====================
   内容全从 FLAGS 推出来：旗标一立，本子上就多一条。
   所以加剧情不用碰这段，往 CLUES 里添一行就行。
   ============================================ */
var bookEl = document.getElementById('scBook'), bookList = document.getElementById('bookList');
function buildBook(){
  var h = '';
  var clues = Object.keys(CLUES).filter(function(k){ return flagOn(k); });
  h += '<h3>线索</h3>';
  h += clues.length
    ? clues.map(function(k){
        return '<p><b>' + escapeHTML(k) + '</b>　' + escapeHTML(CLUES[k]) + '</p>'; }).join('')
    : '<p class="dim">还什么都没捡到。</p>';
  /* 见过的人跨所有图算 —— 在二楼聊过的，回楼下也得算 */
  var met = CHARS.filter(function(c){ return flagOn('见过:' + c.id); });
  h += '<h3>见过的人</h3>';
  h += met.length
    ? met.map(function(c){
        return '<p><b>' + escapeHTML(c.name) + '</b>　' + escapeHTML(c.tag) + '</p>'; }).join('')
    : '<p class="dim">还没跟谁说过话。</p>';
  bookList.innerHTML = h;
}
function openBook(){
  if (M.screen !== 'play' || M.talk.open || M.book) return;
  M.book = true;
  buildBook();
  bookEl.classList.add('on');
  stickEnd();
  actEl.classList.remove('on'); runEl.classList.remove('on');
  bookBtn.classList.remove('on'); fastBtn.classList.remove('on');
}
function closeBook(){
  M.book = false;
  bookEl.classList.remove('on');
  actEl.classList.add('on'); runEl.classList.add('on');
  bookBtn.classList.add('on'); fastBtn.classList.add('on');
}
var bookBtn = document.getElementById('btnBook');
bookBtn.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); openBook(); }, {passive:false});
bookBtn.addEventListener('mousedown', function(e){ e.preventDefault(); openBook(); });
document.getElementById('btnBookClose').addEventListener('click', closeBook);
bookEl.addEventListener('click', function(e){ if (e.target === bookEl) closeBook(); });

/* ==================== 测试加速 ====================
   按「疾」或者 G 循环：普通 → 3× → 8×。
   这是我自己调地图、试剧情用的外挂，不是玩法的一部分 ——
   地图八十格宽，一趟趟走过去太慢了。
   ============================================ */
var TEST_SPEEDS = [1, 3, 8];
var fastBtn = document.getElementById('btnFast');
function cycleFast(){
  M.fast = ((M.fast || 0) + 1) % TEST_SPEEDS.length;
  fastBtn.classList.toggle('x2', M.fast === 1);
  fastBtn.classList.toggle('x3', M.fast === 2);
  fastBtn.textContent = M.fast ? TEST_SPEEDS[M.fast] + '×' : '疾';
}
fastBtn.addEventListener('touchstart', function(e){ e.preventDefault(); e.stopPropagation(); cycleFast(); }, {passive:false});
fastBtn.addEventListener('mousedown', function(e){ e.preventDefault(); cycleFast(); });
var toastEl = document.getElementById('toast');

/* ==================== 交互 ==================== */
function nearNpc(){
  var best = null, bd = TALK_R;
  M.npcs.forEach(function(n){
    var d = Math.hypot(n.x - M.p.x, n.y - M.p.y);
    if (d < bd){ bd = d; best = n; }        // 同时挨着两个人时取最近的
  });
  return best;
}
function pressAct(){
  if (M.screen !== 'play') return;
  if (M.talk.open){ advanceOrChoose(); return; }   // 开着就先推进，不会再开一次
  if (M.talk.cool > 0) return;
  var n = nearNpc();
  if (n) openTalk(n);                              // 附近没人就什么也不做
}

/* ==================== 对话流程 ==================== */
function entryOf(n){
  var s = TALK[n.talk];
  if (!s) return null;
  /* 进度分支：按顺序挑第一个条件成立的 —— 用来做"先去做 X，回来他就换话" */
  if (s.entryBy) for (var i=0;i<s.entryBy.length;i++){
    var e = s.entryBy[i];
    if (!e.if || flagOn(e.if)) return e.go;
  }
  if (!M.talked[n.id]) return (s.entry && s.entry[M.me.id]) || s.start;
  return M.reentry[n.id] || s.again || s.start;
}
function firstNode(s){ return Object.keys(s.nodes)[0]; }
function beginScript(name, who){
  var s = TALK[name];
  if (!s) return false;
  M.talk.script = s;
  M.talk.who = who || null;
  M.talk.open = true;
  stickEnd();
  actEl.classList.remove('on'); runEl.classList.remove('on');
  bookBtn.classList.remove('on'); fastBtn.classList.remove('on');
  dlgEl.classList.add('on');
  return true;
}
function openTalk(n){
  if (!beginScript(n.talk, n.id)) return;
  M.talk.npc = n;
  /* 转身面向对方 —— 很便宜，但一下就"对上眼"了 */
  M.p.dir = faceTowards(M.p.x, M.p.y, n.x, n.y);
  gotoNode(entryOf(n));
}
/* 旁白走这条：没有脸、没有名字，就是一段字。
   触发区、捡到东西、走到某处看见什么，全用它 */
function openScript(name){
  if (!beginScript(name, null)) return;
  M.talk.npc = null;
  gotoNode(M.talk.script.start || firstNode(M.talk.script));
}
function closeTalk(){
  var n = M.talk.npc;
  if (n){
    M.talked[n.id] = true;
    setFlag('见过:' + n.id);              // 线索本要用：见过谁
    var node = M.talk.script.nodes[M.talk.nodeId];
    if (node && typeof node.end === 'string') M.reentry[n.id] = node.end;
  }
  M.talk.open = false;
  M.talk.npc = null; M.talk.nodeId = null;
  M.talk.cool = 0.2;                      // 关掉之后 0.2 秒内不许再开，防手抖
  dlgEl.classList.remove('on');
  actEl.classList.add('on'); runEl.classList.add('on');
  bookBtn.classList.add('on'); fastBtn.classList.add('on');
  /* 有些触发区是"读完这段话就死"（守则里那些不能碰的） */
  if (M.showOverAfter){ M.showOverAfter = false; showOver(endingFor()); return; }
  if (M.endAfter){ M.endAfter = false; endChase(); return; }
  if (M.killAfter){ M.killAfter = false; die('你破了那条守则。'); }
}
function gotoNode(id){
  var node = M.talk.script.nodes[id];
  if (!node){ closeTalk(); return; }      // 指到不存在的节点就当聊完，别卡死
  M.talk.nodeId = id;
  if (node.set && !FLAGS[node.set]) sfxPick();
  if (node.set) setFlag(node.set);        // 剧情就是在这儿记下来的
  /* 也有要撤掉的：旗标只能说"是"，说不了"不是"，所以得能清 */
  if (node.clear){
    var cs = (typeof node.clear === 'object') ? node.clear : [node.clear];
    cs.forEach(function(k){ delete FLAGS[k]; });
  }
  /* 答错就死的那种节点：话读完就没了 */
  if (node.kill) M.killAfter = true;
  M.talk.typed = 0;                       // 打字机从头开始
  M.talk.blipAt = 0;
  M.talk.sel = 0;
  renderNode();
}
function renderNode(){
  var node = M.talk.script.nodes[M.talk.nodeId];
  /* 标了 card 的节点走全屏场景卡 —— 关键那几句不该缩在角落里 */
  if (node.sh) shake(node.sh);            // 这一句该让画面抖一下
  if (node.stare) M.stare = node.stare;   // 这几秒里，所有人都会看着你
  if (node.card){ card(full2(node), 3.4); return; }
  dlgEl.classList.add('on');
  var who = M.talk.who;                   // 旁白是 null
  var sp = who ? speaker(who) : null;
  dlgWho.textContent = sp ? sp.name : '';
  dlgTxt.textContent = '';
  dlgMore.classList.remove('on');
  var im = who && PORTRAIT_IMG[who];
  dlgAv.style.visibility = sp ? '' : 'hidden';   // 旁白不摆脸
  dlgAv.src = im ? im.src
    : 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent((who && PORTRAIT[who]) || '');
  optsEl.innerHTML = '';
  M.talk.shown = [];                      // 这一屏真显示出来的选项，存的是它们在 node.opts 里的下标
  if (node.opts){
    node.opts.forEach(function(o, i){
      if (o.if && !flagOn(o.if)) return;  // 条件没到，这个选项根本不出现
      M.talk.shown.push(i);
      var li = document.createElement('li');
      li.innerHTML = '<span class="k">' + M.talk.shown.length + '.</span>' + escapeHTML(o.t);
      li.addEventListener('click', function(e){ e.stopPropagation(); choose(i); });
      optsEl.appendChild(li);
    });
    markSel();
  }
  full = node.text;
}
var full = '', optsEl = document.getElementById('dlgOpts');
var dlgEl = document.getElementById('dlg'), dlgBox = document.getElementById('dlgBox'),
    dlgWho = document.getElementById('dlgWho'), dlgTxt = document.getElementById('dlgTxt'),
    dlgAv = document.getElementById('dlgAv'), dlgMore = document.getElementById('dlgMore');
function escapeHTML(s){
  return String(s).replace(/[&<>]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]; });
}
function full2(node){ return node.text; }
function nodeDone(){ return M.talk.typed >= full.length; }
function advanceOrChoose(){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node) { closeTalk(); return; }
  if (!nodeDone()){ M.talk.typed = full.length; drawText(); return; }  // 没出完就先出完
  var list = M.talk.shown || [];
  if (node.opts && list.length){                                       // 有选项必须先选
    choose(list[Math.min(M.talk.sel, list.length-1)]);
    return;
  }
  /* 选项被条件全挡掉了就当没写 opts，照 next 往下走 */
  if (node.next) { gotoNode(node.next); return; }
  closeTalk();
}
function choose(i){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node.opts || !node.opts[i]) return;
  gotoNode(node.opts[i].go);
}
function moveSel(d){
  var list = M.talk.shown || [];
  if (!list.length) return;
  M.talk.sel = (M.talk.sel + d + list.length) % list.length;
  markSel();
}
/* 数字键按的是屏幕上第几个，不是 node.opts 里第几个 —— 中间隔着"被条件挡掉"的 */
function pickOpt(i){
  var list = M.talk.shown || [];
  if (list[i] !== undefined) choose(list[i]);
}
function markSel(){
  for (var i=0;i<optsEl.children.length;i++)
    optsEl.children[i].classList.toggle('sel', i === M.talk.sel);
}
function drawText(){
  var node = M.talk.script.nodes[M.talk.nodeId];
  if (!node) return;
  var s = full.slice(0, Math.floor(M.talk.typed));
  if (s.length > (M.talk.blipAt || 0)){ M.talk.blipAt = s.length + 3; sfxBlip(); }
  dlgTxt.textContent = s;
  dlgMore.classList.toggle('on', s.length >= full.length && !node.opts);
}
/* 点对话框本身也推进 —— 手机上没键盘空格，这条是必须的 */
dlgEl.addEventListener('click', function(){ if (M.talk.open) advanceOrChoose(); });

/* ==================== 每帧 ==================== */
function faceTowards(x1,y1,x2,y2){
  var dx = x2-x1, dy = y2-y1;
  if (Math.abs(dx) > Math.abs(dy)) return dx>0 ? 'right' : 'left';
  return dy>0 ? 'down' : 'up';
}
function canWalk(x, y){
  /* 只看脚下一小圈，别用整个身位 —— 小人窄，用大半径会卡在门口进不去 */
  var r = 8;
  var pts = [[x-r,y], [x+r,y], [x,y-r+6], [x,y+r]];
  for (var i=0;i<pts.length;i++){
    if (solidAt(Math.floor(pts[i][0]/TILE), Math.floor(pts[i][1]/TILE))) return false;
  }
  return true;
}
var SPD = 108, RUN_MULT = 2.4;
function update(dt){
  M.t += dt;
  applyClock();                          // 时间由剧情推，这儿只管把时间段旗标刷一遍
  if (M.screen === 'play' && !M.talk.open && !M.book && !M.chase) urgeTick(dt);
  /* 场景卡：自己淡出 */
  if (M.cardT > 0){ M.cardT -= dt; if (M.cardT <= 0 && cardEl) cardEl.classList.remove('on'); }
  if (M.shakeT > 0) M.shakeT = Math.max(0, M.shakeT - dt);
  /* 二楼的灯：念名字一起来，就从西头一间一间地灭，往你这边推 */
  if (M.map === 'floor2' && flagOn('走廊在念名字')) M.lightT = (M.lightT || 0) + dt;
  else if (M.lightT) M.lightT = 0;
  /* 二楼：灯一直在闪 */
  if (M.map === 'floor2') M.flick = (M.flick || 0) + dt * (2 + Math.random()*5);
  else M.flick = 0;
  /* 某些时刻，全校的人会一起转过头看着你 —— 只给一次 */
  if (M.stare > 0) M.stare -= dt;
  if (M.stare > 0 && M.npcs.length){
    M.npcs.forEach(function(n){ n.dir = faceTowards(n.x, n.y, M.p.x, M.p.y); });
  }
  if (M.toastT > 0){
    M.toastT -= dt;
    if (M.toastT <= 0 && toastEl) toastEl.classList.remove('on');
  }
  /* 死了：黑一下，然后回上一个存档点 */
  if (M.dying > 0){
    M.dying -= dt;
    if (M.dying <= 0){ M.dying = 0; respawn(); }
    return;
  }
  /* 自动存档 */
  M.saveT = (M.saveT || 0) + dt;
  if (M.saveT > 4){ M.saveT = 0; saveGame(); }
  if (M.talk.cool > 0) M.talk.cool = Math.max(0, M.talk.cool - dt);
  if (M.fade > 0) M.fade = Math.max(0, M.fade - dt*1.6);
  if (M.portalCool > 0) M.portalCool = Math.max(0, M.portalCool - dt);

  /* 打字机：按字走，不是按帧 */
  if (M.talk.open && !nodeDone()){
    M.talk.typed = Math.min(full.length, M.talk.typed + dt*40);
    drawText();
  }

  /* 快跑：键盘按住 Shift，手机靠右下那个「跑」圆键切换。
     后面再乘测试加速（「疾」，默认 1×） */
  var running = !!(keys['shift'] || M.run);
  var spd = SPD * (running ? RUN_MULT : 1) * TEST_SPEEDS[M.fast || 0];
  if (flagOn('憋着')) spd *= 0.62;      // 牢李憋着的时候走不快

  var mvx = 0, mvy = 0;
  if (M.screen === 'play' && !M.talk.open && !M.book){
    if (keys['a']||keys['arrowleft'])  mvx -= 1;
    if (keys['d']||keys['arrowright']) mvx += 1;
    if (keys['w']||keys['arrowup'])    mvy -= 1;
    if (keys['s']||keys['arrowdown'])  mvy += 1;
    mvx += stick.dx; mvy += stick.dy;
  }
  var mag = Math.hypot(mvx, mvy);
  M.p.moving = mag > 0.15;
  if (M.p.moving){
    mvx /= mag; mvy /= mag;
    var nx = M.p.x + mvx*spd*dt, ny = M.p.y + mvy*spd*dt;
    /* 分轴判定：贴着墙走的时候能顺墙滑，不会整个人卡住 */
    if (canWalk(nx, M.p.y)) M.p.x = nx;
    if (canWalk(M.p.x, ny)) M.p.y = ny;
    M.p.dir = (Math.abs(mvx) > Math.abs(mvy)) ? (mvx>0?'right':'left') : (mvy>0?'down':'up');
    sfxStep();                                              // 脚步（内部有节流）
    /* 步子也得跟着快，光提速不换步频，看着像在冰上滑 */
    M.p.anim += dt * (running ? 1.9 : 1);
  } else {
    M.p.anim = 0;
  }

  /* 追逐战。被追上或者过了下课铃都会死 —— 死在哪儿就从哪个存档点重来 */
  if (M.chase && M.screen === 'play' && !M.talk.open && !M.book){
    chaseTick(dt);
    if (M.dying > 0 || M.screen !== 'play') return;
  }

  /* 踩到出口就换图。刚落地那 0.7 秒不判，免得在门口来回弹 */
  if (M.screen === 'play' && !M.talk.open && !M.book && M.portalCool <= 0 && CUR){
    var ptx = Math.floor(M.p.x/TILE), pty = Math.floor(M.p.y/TILE);
    for (var pi=0; pi<CUR.portals.length; pi++){
      var P = CUR.portals[pi];
      if (P.if && !flagOn(P.if)) continue;          // 条件没到，这扇"门"还没开
      if (ptx >= P.x && ptx < P.x+P.w && pty >= P.y && pty < P.y+P.h){
        loadMap(P.to, P.tx, P.ty);
        break;
      }
    }
  }

  /* 踩到剧情触发区就跑一段。once 的跑过就不再跑 ——
     记号记在 FLAGS 里，所以跟着存档一起走 */
  if (M.screen === 'play' && !M.talk.open && !M.book && M.portalCool <= 0 && CUR && CUR.triggers){
    var gtx = Math.floor(M.p.x/TILE), gty = Math.floor(M.p.y/TILE);
    /* 把这张图的触发区数组抓在手里：跑到一半要是换了图，
       数组就短了，再往下读会读到 undefined 直接炸 */
    var trigs = CUR.triggers;
    for (var gi=0; gi<trigs.length; gi++){
      if (CUR.triggers !== trigs) break;            // 换图了，这一趟作废
      var G = trigs[gi], gk = '@' + M.map + ':' + gi;
      if (!G) continue;            // 数组里有个空洞（多写了个逗号），跳过它
      if (G.once && FLAGS[gk]) continue;
      if (G.if && !flagOn(G.if)) continue;
      var inG = gtx >= G.x && gtx < G.x+G.w && gty >= G.y && gty < G.y+G.h;
      if (!inG){ if (M.stillKey === gk){ M.stillKey = null; M.stillT = 0; } continue; }
      /* 有的是"踩到就触发"，有的是"停在这儿不动才触发" —— 守则里那些
         "不要停下来"的条款，就是靠这个当真的 */
      if (G.still){
        if (M.stillKey !== gk){ M.stillKey = gk; M.stillT = 0; }
        if (M.p.moving){ M.stillT = 0; continue; }      // 一动就重新计时
        M.stillT = (M.stillT || 0) + dt;
        if (M.stillT < G.still) continue;
      }
      /* 顺序谜题：seq 是第几步。得从 1 挨着来，跳着踩就回到第一步 */
      if (G.seq !== undefined){
        if (M.seq === G.seq - 1) M.seq = G.seq;         // 接上了
        else if (G.seq > M.seq + 1){                    // 跳着来了 → 回到第一步
          if (M.seq > 0){ M.seq = 0; toast('……那边停了。从头再来。'); }
          continue;
        } else continue;                                // 擦过的、或者还没轮到，都当没踩
      }
      FLAGS[gk] = true;
      if (G.set) setFlag(G.set);
      if (G.clock !== undefined) setClock(G.clock);      // 时间由剧情推
      /* 走错路就绕回原地 —— 中式恐怖里最好使的不是怪物，是"又回到这儿" */
      if (G.warp){
        M.p.x = G.warp[0]*TILE + TILE/2;
        M.p.y = G.warp[1]*TILE + TILE/2;
        M.portalCool = 0.4;
      }
      /* 追逐里的机关：关铁门能挡掉追兵，拉铃能直接把这一场结束 */
      if (G.hounds && M.chase){
        for (var hi=0; hi<G.hounds && M.chase.hounds.length; hi++) M.chase.hounds.pop();
        toast('后面的门关上了。', 1.8);
      }
      if (G.endchase && M.chase) M.endAfter = true;    // 等这段话说完再结束追逐
      if (G.bell) sfxBell(G.bell);                      // 铃
      if (G.stare) M.stare = G.stare;
      if (G.card){ card(G.card, G.cardSecs); break; }    // 大段旁白走全屏，不走黑框
      if (G.chase) startChase();                        // 踩到这儿，整队开始
      if (G.kill) M.killAfter = true;                   // 这段话读完就死
      if (G.say) toast(G.say);                          // 或者只飘一行字
      if (G.talk) openScript(G.talk);
      break;
    }
  }

  /* 走近了就转过来看你 */
  var near = nearNpc();
  M.npcs.forEach(function(n){
    if (n === near && !M.talk.open) n.dir = faceTowards(n.x, n.y, M.p.x, M.p.y);
  });
  M.near = near;

  hintEl.classList.toggle('on', !!near && !M.talk.open);
  if (near && !M.talk.open)
    hintEl.textContent = (hasTouch ? '按右下角圆键' : '按 Z 或空格') + ' 跟 ' + speaker(near.id).name + ' 说话';

  whereEl.textContent = whereText(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE));
  if (vigEl) vigEl.className = M.chase ? 'chase' : (M.map === 'floor2' ? 'dark' : '');
  goalTick();
}
var whereEl = document.getElementById('where'), clockEl = document.getElementById('clock');

/* 左上角那行字：站在哪栋楼里，就报楼名；楼里再报一下是走廊还是教室。
   没进楼就只报地形（草地、路、广场…） */
function whereText(tx, ty){
  var t = tileAt(tx, ty), name = TERRAIN[t].name;
  for (var i=0;i<LABELS.length;i++){
    var L = LABELS[i];
    if (tx >= L.x && tx < L.x+L.w && ty >= L.y && ty < L.y+L.h){
      if (t === 'corridor' || t === 'classroom' || t === 'floor' || t === 'stairs')
        return L.t + ' · ' + name;
      return L.t;
    }
  }
  return name;
}

/* ==================== 画 ==================== */
/* 走路的帧序列：站-左-站-右 循环。三张图做出四拍，比纯 A/B 顺 */
var CYCLE = [0,1,0,2];
function drawSprite(id, x, y, dir, anim, moving, scale){
  var frames = SPRITE_IMG[id] && SPRITE_IMG[id][dir];
  if (!frames) return;
  var f = moving ? CYCLE[Math.floor(anim*7) % 4] : 0;
  var im = frames[f] || frames[0];
  if (!im) return;
  var w = 16*scale, h = 24*scale;
  /* (x,y) 是脚底。图是 16×24、脚在最后一行的下沿，所以往上顶一整张图 */
  cx.drawImage(im, Math.round(x - w/2), Math.round(y - h), w, h);
}
function drawTile(t, sx, sy){
  var d = TERRAIN[t];
  cx.fillStyle = d.c;
  cx.fillRect(sx, sy, TILE, TILE);
  /* 两格一深做点纹理。纯色地板一片死板，人会显得像贴纸 */
  cx.fillStyle = d.c2;
  if (((sx/TILE) + (sy/TILE)) % 2 === 0) cx.fillRect(sx, sy, TILE, TILE);
  if (t === 'tree'){
    cx.fillStyle = '#3f5f30';
    cx.beginPath(); cx.arc(sx+TILE/2, sy+TILE/2, TILE*0.42, 0, 7); cx.fill();
    cx.fillStyle = '#5f8a45';
    cx.beginPath(); cx.arc(sx+TILE/2-3, sy+TILE/2-3, TILE*0.33, 0, 7); cx.fill();
  } else if (t === 'bench'){
    cx.fillStyle = '#8f6333';
    cx.fillRect(sx+3, sy+10, TILE-6, TILE-16);
    cx.fillStyle = '#a8763f';
    cx.fillRect(sx+3, sy+8, TILE-6, 5);
  } else if (t === 'planter'){
    cx.fillStyle = '#6f7d4e';
    cx.beginPath(); cx.arc(sx+TILE/2, sy+TILE/2, TILE*0.34, 0, 7); cx.fill();
  } else if (t === 'garden'){
    /* 天井：栽几株矮的，别跟草地一个样 */
    cx.fillStyle = '#4e7439';
    cx.beginPath(); cx.arc(sx+TILE*0.3, sy+TILE*0.55, 5, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(sx+TILE*0.72, sy+TILE*0.4, 4, 0, 7); cx.fill();
    cx.fillStyle = '#e8d26a';
    cx.fillRect(sx+TILE*0.5, sy+TILE*0.25, 3, 3);
  } else if (t === 'stairs'){
    /* 楼梯：几道横杠。现在只是个标记，以后要做楼上楼下就接这儿 */
    cx.fillStyle = '#9d9179';
    for (var si=0; si<4; si++) cx.fillRect(sx+4, sy+3+si*7, TILE-8, 3);
  }
}
/* 楼名直接画在地上，淡淡的 —— 这么大的地图没字就是一片草地加方块，
   走进去才知道自己进了哪栋楼太费劲 */
function drawLabels(){
  cx.textAlign = 'center';
  cx.textBaseline = 'middle';
  cx.font = '700 26px system-ui,"Microsoft YaHei",sans-serif';
  cx.lineWidth = 5;
  cx.strokeStyle = 'rgba(255,255,255,.5)';
  LABELS.forEach(function(L){
    /* ty 是可选的：中心广场要跟"韩愈像"那行字错开，不然两行叠一块 */
    var ty = (L.ty === undefined) ? (L.y + L.h/2) : L.ty;
    var px = (L.x + L.w/2)*TILE, py = ty*TILE;
    /* 先白描边再填深色 —— 楼名有的落在浅色地板上、有的落在绿色天井上，
       一种颜色压不平，加圈白边两边都看得清 */
    cx.strokeText(L.t, px, py);
    cx.fillStyle = 'rgba(24,20,14,.42)';
    cx.fillText(L.t, px, py);
  });
  cx.textBaseline = 'alphabetic';
}

/* 韩愈像：基座 + 一个人，立在"田"字正中间。
   地图上的东西都是方块，突然冒出来一个不方的人，反而显眼 */
function drawStatue(){
  var S = CUR && CUR.statue;
  if (!S) return;                       // 这张图没立像
  var x = S.x*TILE, y = S.y*TILE;
  var w = S.w*TILE, h = S.h*TILE, mx = x + w/2;
  cx.fillStyle = '#6d6558';                        // 基座
  cx.fillRect(x+2, y+h*0.52, w-4, h*0.44);
  cx.fillStyle = '#a69d8e';                        // 台面
  cx.fillRect(x+2, y+h*0.52, w-4, 5);
  cx.fillStyle = '#33302a';                        // 人
  cx.beginPath(); cx.arc(mx, y+h*0.3, 8, 0, 7); cx.fill();
  cx.fillRect(mx-12, y+h*0.4, 24, h*0.34);
  cx.fillStyle = '#4a453d';                        // 袍脚
  cx.fillRect(mx-16, y+h*0.74, 32, 6);
}
function render(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.imageSmoothingEnabled = false;
  cx.fillStyle = '#12100e';
  cx.fillRect(0,0,W,H);
  if (!M.me) return;

  camX = clamp(M.p.x - W/2, 0, Math.max(0, MAPW*TILE - W));
  camY = clamp(M.p.y - H/2, 0, Math.max(0, MAPH*TILE - H));
  cx.save();
  /* 死的时候镜头往玩家身上推一点 —— 就这一点，那一秒完全不一样 */
  if (M.dying > 0){
    var zk = (1 - M.dying / (M.deathDur || 1.1)) * 0.32;
    cx.translate(W/2, H/2); cx.scale(1 + zk, 1 + zk); cx.translate(-W/2, -H/2);
  }
  var sk = M.shakeT > 0 ? M.shakeT * 9 : 0;
  cx.translate(-Math.round(camX) + (sk ? (Math.random()*2-1)*sk : 0),
               -Math.round(camY) + (sk ? (Math.random()*2-1)*sk : 0));

  var x0 = Math.floor(camX/TILE), x1 = Math.min(MAPW-1, Math.ceil((camX+W)/TILE));
  var y0 = Math.floor(camY/TILE), y1 = Math.min(MAPH-1, Math.ceil((camY+H)/TILE));
  for (var y=y0; y<=y1; y++)
    for (var x=x0; x<=x1; x++) drawTile(MAP[y][x], x*TILE, y*TILE);
  drawLabels();
  drawStatue();

  /* 小人按 y 排序再画，下面的挡住上面的 —— 就这一点就分出前后了 */
  var order = M.npcs.slice();
  order.push({ id:'__me', me:true, x:M.p.x, y:M.p.y });
  if (M.chase) M.chase.hounds.forEach(function(h){
    order.push({ id:h.id, hound:true, x:h.x, y:h.y, dir:h.dir, anim:h.anim });
  });
  order.sort(function(a,b){ return a.y - b.y; });
  order.forEach(function(o){
    if (o.me){
      drawSprite(M.me.id, M.p.x, M.p.y, M.p.dir, M.p.anim, M.p.moving, 2);
    } else if (o.hound){
      /* 整队追过来的那些。不挂名字 —— 你知道那是谁，可你不想认 */
      drawSprite(o.id, o.x, o.y, o.dir, o.anim, true, 2);
    } else {
      /* NPC 站着不动。给过它一个周期性小动作，结果看着像抽搐，就去掉了 */
      drawSprite(o.id, o.x, o.y, o.dir, 0, false, 2);
      /* 名字挂在头顶。小人在图上才 32×48，发型配色认人还是慢，
         挂个名字一下就清楚了；离远了不画，免得满屏都是字 */
      if (Math.hypot(o.x - M.p.x, o.y - M.p.y) < NAME_R){
        var nm = speaker(o.id).name;
        cx.font = '600 13px system-ui,"Microsoft YaHei",sans-serif';
        cx.textAlign = 'center';
        cx.fillStyle = 'rgba(0,0,0,.6)';
        cx.fillText(nm, o.x+1, o.y-50);
        cx.fillStyle = '#fff';
        cx.fillText(nm, o.x, o.y-51);
      }
      if (M.near === o && !M.talk.open){
        cx.fillStyle = '#e8a33d';
        cx.font = '700 20px system-ui,sans-serif';
        cx.textAlign = 'center';
        cx.fillText('!', o.x, o.y - 70 + Math.sin(M.t*4)*3);
        cx.strokeStyle = 'rgba(232,163,61,.85)'; cx.lineWidth = 2; cx.setLineDash([4,4]);
        cx.beginPath(); cx.ellipse(o.x, o.y+4, 18, 7, 0, 0, 7); cx.stroke();
        cx.setLineDash([]);
      }
    }
  });
  /* ---- 玻璃那一段：画面本身该有点东西，不能全靠字 ----
     走廊尽头那扇玻璃会反一下光。守则说别在它前面停下 */
  GLASS.forEach(function(g){
    var gx = g.x*TILE, gy = g.y*TILE, gw = g.w*TILE, gh = g.h*TILE;
    cx.save();
    cx.beginPath(); cx.rect(gx, gy, gw, gh); cx.clip();
    var ph = (M.t * 0.22) % 1;
    cx.globalAlpha = 0.10 + 0.07 * Math.abs(Math.sin(M.t * 0.9));
    cx.fillStyle = '#cfe0ea';
    cx.save();
    cx.translate(gx + ph * gw * 2 - gw, gy);
    cx.rotate(-0.45);
    cx.fillRect(0, -gh, 14, gh * 3);
    cx.restore();
    cx.restore();
  });

  /* ---- 多站的那个人：站在那儿，你走近了就没有了 ---- */
  GHOSTS.forEach(function(g){
    if (g.map !== M.map) return;
    if (g.if && !flagOn(g.if)) return;
    var gx = g.x*TILE + TILE/2, gy = g.y*TILE + TILE/2;
    var d = Math.hypot(gx - M.p.x, gy - M.p.y);
    if (d < TILE*2.2) return;               // 走近了，没了
    cx.globalAlpha = Math.min(1, (d - TILE*2.2) / (TILE*1.5)) * 0.85;
    drawSprite(g.id, gx, gy, 'down', 0, false, 2);
    cx.globalAlpha = 1;
  });

  /* ---- 二楼：灯从西头一间一间地灭，往你这边推 ---- */
  if (M.map === 'floor2' && M.lightT > 0){
    /* 追到你身后五格就收住 —— 不然它会把整层楼盖黑，连人影都埋进去。
       它是在追你，不是要把你眼睛蒙上 */
    var edge = Math.max(0, Math.min(38, Math.min(M.p.x/TILE - 4, M.lightT * 6.5)));
    var lw = edge * TILE;
    var lg = cx.createLinearGradient(0, 0, lw, 0);
    lg.addColorStop(0, 'rgba(4,4,6,.95)');
    lg.addColorStop(0.82, 'rgba(4,4,6,.95)');
    lg.addColorStop(1, 'rgba(4,4,6,0)');
    cx.fillStyle = lg;
    cx.fillRect(0, 0, lw, MAPH*TILE);
  }
  /* ---- 二楼的灯还在闪 ---- */
  if (M.map === 'floor2' && Math.sin(M.flick || 0) > 0.80){
    cx.fillStyle = 'rgba(0,0,0,.45)';
    cx.fillRect(0, 0, MAPW*TILE, MAPH*TILE);
  }

  cx.restore();

  /* 死亡：黑幕压下来，中间一行字。
     镜头推进是在外面（cx.save 之前）加的，所以是往玩家身上推 */
  if (M.dying > 0){
    var dp = 1 - M.dying / (M.deathDur || 1.1);
    cx.fillStyle = 'rgba(6,5,5,' + Math.min(1, dp * 1.1) + ')';
    cx.fillRect(0, 0, W, H);
    if (M.deathMsg && dp > 0.3){
      cx.globalAlpha = Math.min(1, (dp - 0.3) * 2.6);
      cx.fillStyle = '#e8a33d';
      cx.font = '600 ' + Math.round(Math.max(15, Math.min(24, W/32))) +
                'px system-ui,"Microsoft YaHei",sans-serif';
      cx.textAlign = 'center';
      var dl = String(M.deathMsg).split('\n');
      for (var di=0; di<dl.length; di++)
        cx.fillText(dl[di], W/2, H/2 - (dl.length-1)*17 + di*34);
      cx.globalAlpha = 1;
      cx.textAlign = 'left';
    }
  }

  /* 换图那一下黑场。不加这个，人是从一个地方"啪"一下跳到另一个地方 */
  if (M.fade > 0){
    cx.fillStyle = 'rgba(18,16,14,' + Math.min(1, M.fade/0.5) + ')';
    cx.fillRect(0, 0, W, H);
  }
}

/* ==================== 主循环 ==================== */
var lastT = 0;
function loop(ts){
  var dt = lastT ? Math.min((ts-lastT)/1000, 0.05) : 0;
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ==================== 屏幕 ==================== */
function show(el){
  var all = document.querySelectorAll('.screen');
  for (var i=0;i<all.length;i++) all[i].classList.remove('on');
  if (el) el.classList.add('on');
}
var pickList = document.getElementById('pickList');

/* ==================== 调试钩子 ====================
   仿 ?emoji 的先例。没有测试框架，无头浏览器里全靠它把状态带出来：
   ?probe=1     直接开局，把 NPC 名单和几个关键状态打到 #probe
   ?probe=lint  把对话图整张走一遍，检查有没有指到不存在的节点（断链）
   ?probe=walk  从开局连按 20 次，看整条链能不能走完不卡死
   @x / @y      ?x=20&y=25 覆盖出生点（截图定位用，省得手动走）
   ============================================ */
(function probe(){
  /* 探针里抛异常以前是静默的 —— 输出直接空白，看不出为什么。
     接上 onerror，至少能看见是哪一行 */
  var probeErr = '';
  window.onerror = function(msg, src, line){ probeErr = '!!' + msg + ' @' + line; return true; };
  var q = location.search;
  var m = /[?&]probe=(\w+)/.exec(q);
  if (!m) return;
  var mode = m[1];
  var out = [];
  setTimeout(function(){
    try {
    /* 选人页只有在点了「出门」之后才出现，无头截图点不了按钮，
       所以给它一个直接跳过去的开关 */
    if (mode === 'pick'){ buildPick(); return; }
    startWalk('laoli');
    /* ?map=floor2 直接去哪张图 —— 截图用，省得一步步走过去 */
    var mm = /[?&]map=(\w+)/.exec(q);
    if (mm && MAPS[mm[1]]) loadMap(mm[1], MAPS[mm[1]].spawn[0], MAPS[mm[1]].spawn[1]);
    M.fade = 0;                          // 无头里 rAF 不跑，黑场淡不掉，截图会全黑
    /* ?x=&y= 把出生点挪到指定格 —— 截图要看某个地方时省得手动走过去 */
    var mx = /[?&]x=(\d+)/.exec(q), my = /[?&]y=(\d+)/.exec(q);
    if (mx) M.p.x = (+mx[1])*TILE + TILE/2;
    if (my) M.p.y = (+my[1])*TILE + TILE/2;
    if (mode === 'dlg'){
      /* 直接站到 lg7 面前把对话框开出来，截图核对排版 */
      var n0 = M.npcs[0];
      M.p.x = n0.x; M.p.y = n0.y + 30;
      openTalk(n0);
      M.talk.typed = 6;                    // 出几个字就够看排版了，不用等打完
      drawText();
    }
    if (mode === 'map'){
      /* 从出生点洪泛一遍：走不到的人 = 地图改错了（谁被封在墙里了）。
         手画地图最容易犯的就是这个，肉眼看不出来 */
      /* 这个变量千万不能叫 q —— var 是函数作用域，名字撞上外层那个
         location.search 的话会被提升到回调顶部，把外层遮成 undefined */
      var seen2 = {}, queue = [[Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)]];
      seen2[queue[0][0]+','+queue[0][1]] = 1;
      while (queue.length){
        var c = queue.shift();
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
          var nx = c[0]+d[0], ny = c[1]+d[1], k = nx+','+ny;
          if (nx<0||ny<0||nx>=MAPW||ny>=MAPH||seen2[k]) return;
          if (solidAt(nx,ny)) return;
          seen2[k] = 1; queue.push([nx,ny]);
        });
      }
      var spawn = tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE));
      var dead = M.npcs.filter(function(n){ return !seen2[n.tx+','+n.ty]; })
                      .map(function(n){ return n.id+'@'+n.tx+','+n.ty; });
      out.push('出生点脚下=' + spawn + (TERRAIN[spawn].solid ? ' ← 出生在墙里！' : ''));
      out.push('能走到=' + Object.keys(seen2).length + ' 格');
      out.push(dead.length ? ('走不到 ' + dead.length + ' 个: ' + dead.join(' ')) : '所有人都走得到');
    }
    if (mode === 'lint'){
      var bad = [];
      Object.keys(TALK).forEach(function(k){
        var s = TALK[k], ids = Object.keys(s.nodes);
        ids.forEach(function(nid){
          var nd = s.nodes[nid];
          if (nd.next && !s.nodes[nd.next]) bad.push(k+'.'+nid+' → next '+nd.next+' 不存在');
          if (nd.opts) nd.opts.forEach(function(o){
            if (!s.nodes[o.go]) bad.push(k+'.'+nid+' → 选项 '+o.go+' 不存在');
          });
          if (typeof nd.end === 'string' && !s.nodes[nd.end])
            bad.push(k+'.'+nid+' → end '+nd.end+' 不存在');
          if (!nd.next && !nd.opts && !nd.end) bad.push(k+'.'+nid+' 是死胡同');
        });
        ['start','again'].forEach(function(key){
          if (s[key] && !s.nodes[s[key]]) bad.push(k+'.'+key+' 指向不存在的节点');
        });
        if (s.entry) Object.keys(s.entry).forEach(function(cid){
          if (!s.nodes[s.entry[cid]]) bad.push(k+'.entry.'+cid+' 指向不存在的节点');
        });
        if (s.entryBy) s.entryBy.forEach(function(e){
          if (!s.nodes[e.go]) bad.push(k+'.entryBy → '+e.go+' 不存在');
        });
      });
      out.push(bad.length ? ('断链 '+bad.length+' 处: '+bad.join(' | ')) : '对话图没问题');
    } else {
      out.push('玩家=' + M.me.id);
      out.push('玩家在格=' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) +
               ' (' + tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)) + ')');
      out.push('q=' + q + ' x=' + (/([?&]x=(\d+))/.exec(q)||['无'])[2] +
               ' y=' + (/([?&]y=(\d+))/.exec(q)||['无','无'])[2]);
      out.push('NPC=' + M.npcs.map(function(n){ return n.id; }).join(','));
      var self = M.npcs.filter(function(n){ return n.id === M.me.id; }).length;
      out.push('自己当NPC次数=' + self + (self ? ' ← 不对！' : ''));
      /* 别读 whereEl —— 那是每帧刷的，无头里 rAF 不跑，读到的还是上一帧 */
      out.push('站在=' + whereText(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)));
      if (mode === 'maps'){
        /* 每张图：出口指到的图在不在、落点站不站得住；NPC 有没有站在墙里 */
        Object.keys(MAPS).forEach(function(mid){
          var mp = MAPS[mid], bad = [];
          mp.portals.forEach(function(P){
            if (!MAPS[P.to]){ bad.push('出口指向不存在的图 ' + P.to); return; }
            var tt = MAPS[P.to].map[P.ty] && MAPS[P.to].map[P.ty][P.tx];
            if (!tt) bad.push('落点越界 → ' + P.to + ' ' + P.tx + ',' + P.ty);
            else if (TERRAIN[tt].solid) bad.push('落点踩在' + TERRAIN[tt].name + '上 → ' + P.to);
          });
          mp.npcs.forEach(function(n){
            var tt = mp.map[n.ty] && mp.map[n.ty][n.tx];
            if (!tt) bad.push('NPC 越界 ' + n.id);
            else if (TERRAIN[tt].solid) bad.push('NPC 站在' + TERRAIN[tt].name + '上 ' + n.id);
          });
          out.push(mid + ' ' + mp.w + '×' + mp.h + ' 出口' + mp.portals.length +
                   ' NPC' + mp.npcs.length + (bad.length ? ' ← ' + bad.join(' / ') : ' 没问题'));
        });
      }
      if (mode === 'story'){
        /* 整条链走一遍：踩触发区 → 旁白 → 立旗标 → lg7 那个选项才出现 */
        out.push('起始 纸条=' + flagOn('纸条'));
        var G0 = CUR.triggers[2];        // 第 3 个触发区才是"落座看纸条"
        M.p.x = G0.x*TILE + TILE/2; M.p.y = G0.y*TILE + TILE/2;
        M.portalCool = 0; M.talk.cool = 0;
        update(1/60);
        out.push('踩过 对话框=' + M.talk.open + ' 说话人=' + (M.talk.who || '旁白'));
        var guard = 0;
        while (M.talk.open && guard++ < 20){ M.talk.typed = 1e9; advanceOrChoose(); }
        out.push('读完 对话框=' + M.talk.open + ' 纸条=' + flagOn('纸条'));
        /* 去找 lg7，走到那个带选项的节点上 */
        var n0 = null;
        M.npcs.forEach(function(n){ if (n.id === 'lg7') n0 = n; });
        M.p.x = n0.x; M.p.y = n0.y + 20;
        M.talk.cool = 0;
        M.talked['lg7'] = true;
        setFlag('见过lg7');                             // 让他进到"那套常规对话"里去
        openTalk(n0);                                   // 直接落在选项节点上，不用再推
        function optsNow(){ return (M.talk.shown || []).map(function(k){
          return M.talk.script.nodes[M.talk.nodeId].opts[k].t; }).join(' / '); }
        out.push('节点=' + M.talk.nodeId + ' 选项=' + optsNow());
        /* 把旗标抹掉再渲染一次 —— 直接证明那个选项是"条件出来的"，不是碰巧 */
        var keep = FLAGS['纸条'];
        delete FLAGS['纸条']; renderNode();
        out.push('没旗标时=' + optsNow());
        FLAGS['纸条'] = keep; renderNode();
        out.push('有旗标时=' + optsNow());
        M.talk.open = false;
      }
      if (mode === 'warp'){
        /* 站到出口上，看是不是真换了图、落点对不对，再踩回来 */
        setFlag('可以上去了');            // 楼梯口现在有门槛，先把拼图凑上
        function step(){
          var P = CUR.portals[0];
          M.p.x = P.x*TILE + TILE/2; M.p.y = P.y*TILE + TILE/2;
          M.portalCool = 0; M.fade = 0;
          update(1/60);
          return M.map + '(' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) + ')';
        }
        out.push('站上去 → ' + step() + ' → 再踩回来 ' + step());
      }
      if (mode === 'clock'){
        var tch = null;
        M.npcs.forEach(function(n){ if (n.id === 'teacher') tch = n; });
        M.clock = 6*60 + 55; update(1/60);
        out.push('06:55 早读=' + flagOn('早读') +
                 ' 老师=' + Math.floor(tch.x/TILE) + ',' + Math.floor(tch.y/TILE));
        /* 推到 08:00 —— 早读散了，老师该回办公室、话也该换 */
        M.clock = 8*60; update(1/60);
        out.push('08:00 早读=' + flagOn('早读') +
                 ' 老师=' + Math.floor(tch.x/TILE) + ',' + Math.floor(tch.y/TILE));
        M.p.x = tch.x; M.p.y = tch.y + 20; M.talk.cool = 0;
        openTalk(tch);
        out.push('老师这句=' + M.talk.script.nodes[M.talk.nodeId].text);
        M.talk.open = false;
        /* lg7 一天里该在四个地方 —— 位置跟时间绑着 */
        var l7 = null;
        M.npcs.forEach(function(n){ if (n.id === 'lg7') l7 = n; });
        /* sched 只在人"看不见"的时候才挪 —— 无头里镜头停在原点，
           这儿得先把镜头挪开，不然他会一直算在画面里、永远不动 */
        camX = camY = 1e6;
        [[6*60+55,'早上'],[7*60+20,'早读'],[8*60,'白天'],[10*60,'后半场']].forEach(function(w){
          M.clock = w[0]; applyClock();
          out.push(w[1] + ' lg7@' + Math.floor(l7.x/TILE) + ',' + Math.floor(l7.y/TILE));
        });
      }
      if (mode === 'save'){
        M.clock = 7*60+20; setFlag('纸条'); setFlag('见过:lg7'); M.talked['lg7'] = true;
        M.p.x = 456; M.p.y = 1234;
        saveGame();
        out.push('存之前 纸条=' + flagOn('纸条') + ' 几点=' + clockText(M.clock));
        FLAGS = {}; M.talked = {}; M.clock = 0; M.p.x = 0; M.p.y = 0;
        out.push('清空后 纸条=' + flagOn('纸条'));
        var ok = loadGame();
        out.push('读档 ok=' + ok + ' 纸条=' + flagOn('纸条') + ' 见过lg7=' + flagOn('见过:lg7') +
                 ' 聊过lg7=' + !!M.talked['lg7'] + ' 几点=' + clockText(M.clock) +
                 ' 在哪=' + M.map + ' 站位=' + Math.round(M.p.x) + ',' + Math.round(M.p.y));
      }
      if (mode === 'book'){
        /* 先把纸条拿到手、再见两个人，然后翻开本子 —— 截图看排版 */
        var GB = CUR.triggers[0];
        M.p.x = GB.x*TILE + TILE/2; M.p.y = GB.y*TILE + TILE/2;
        M.portalCool = 0; M.talk.cool = 0;
        update(1/60);
        var gb = 0; while (M.talk.open && gb++ < 20){ M.talk.typed = 1e9; advanceOrChoose(); }
        setFlag('见过:lg7'); setFlag('见过:teacher');
        openBook();
      }
      if (mode === 'scene'){
        /* ?probe=scene&i=2 直接把第 i 个触发区的对话摆出来，留给截图 */
        var si = (/([?&]i=(\d+))/.exec(q) || [, , '0'])[2] | 0;
        var SG = CUR.triggers[si];
        if (SG){
          if (SG.if) setFlag(SG.if);                     // 带条件的那种，截图时替它满足
          delete FLAGS['@' + M.map + ':' + si];          // 允许重放
          M.p.x = SG.x*TILE + TILE/2; M.p.y = SG.y*TILE + TILE/2;
          M.portalCool = 0; M.talk.cool = 0;
          /* still 那种要"站够几秒"，那就原地空跑几帧替它站着 */
          var n = SG.still ? Math.ceil(SG.still*60) + 6 : 1;
          for (var kk=0; kk<n; kk++) update(1/60);
          if (M.talk.open){ M.talk.typed = 6; drawText(); }   // 出几个字够看排版
        }
      }
      if (mode === 'chase'){
        setFlag('被追了');
        loadMap('campus', 39, 100);
        M.fade = 0;
        startChase();
        out.push('开追 ' + clockText(M.clock) + ' 人数=' + M.chase.hounds.length);
        /* ① 站着不动：该被追上 */
        var ck = 0; while (ck++ < 240 && M.dying <= 0) update(1/60);
        out.push('站着不动 ' + (ck/60).toFixed(1) + '秒 → dying=' + (M.dying||0).toFixed(2));
        M.dying = 0;
        respawn();
        out.push('复活在 ' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) +
                 ' 还在追=' + !!M.chase);
        /* ② 一路直冲校门：路上有人拦，看能不能硬冲过去 */
        startChase();
        var g2 = 0;
        while (g2++ < 2000 && M.screen === 'play' && M.dying <= 0){
          keys['s'] = true; keys['shift'] = true; update(1/60);
        }
        keys['s'] = false; keys['shift'] = false;
        out.push('直冲校门 → 屏幕=' + M.screen + ' dying=' + (M.dying||0).toFixed(2) +
                 ' 走到=' + Math.floor(M.p.y/TILE) + ' 几点=' + clockText(M.clock));
        /* ②b 换个跑法：不直冲，绕校园西边那条空的，应该能出去。
           得先 respawn 一下 —— 不然上一场那六个还贴在你脸上 */
        M.dying = 0; respawn(); M.screen = 'play';
        /* 挑一条真能走的：x=8 往南是行政楼，会堵死。
           西边那条竖路(x=25..28)从教学楼一直通到校门那头 */
        M.p.x = 26*TILE + TILE/2; M.p.y = 92*TILE + TILE/2;
        startChase();
        var g3 = 0;
        while (g3++ < 3000 && M.screen === 'play' && M.dying <= 0){
          keys['s'] = true; keys['shift'] = true; update(1/60);
        }
        keys['s'] = false; keys['shift'] = false;
        var nearD = 9999;
        if (M.chase) M.chase.hounds.forEach(function(h){
          nearD = Math.min(nearD, Math.hypot(M.p.x-h.x, M.p.y-h.y)/TILE);
        });
        /* 出了校门现在不直接结算了 —— 先在门口演那一场（最后一个选择）。
           所以这儿看的是"门口那场戏有没有开"，不是屏幕状态 */
        out.push('绕西边跑 → 出了校门=' + M.talk.open +
                 ' 走到=' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) +
                 '(' + tileAt(Math.floor(M.p.x/TILE), Math.floor(M.p.y/TILE)) + ')' +
                 ' 最近的人=' + nearD.toFixed(1) + '格');
        /* 把门口那场戏走完，看结算 */
        var q9 = 0, picked = '';
        while (M.talk.open && q9++ < 20){
          var nd9 = M.talk.script.nodes[M.talk.nodeId];
          if (nd9 && nd9.opts && (M.talk.shown||[]).length) picked = nd9.opts[M.talk.shown[0]].t;
          M.talk.typed = 1e9; advanceOrChoose();
        }
        out.push('门口选了「' + picked + '」→ 屏幕=' + M.screen + ' 标题=' +
                 (document.getElementById('overTxt').querySelector('h1') || {}).textContent);
        /* ③ 过了下课铃还没出去，该死。时钟每帧只走 0.067 秒，得多跑一会儿。
           注意先把上一步那场戏关掉，不然追逐根本不会走 */
        M.dying = 0; M.screen = 'play'; M.talk.open = false; M.showOverAfter = false;
        startChase();
        M.chase.hounds.length = 0;                 // 把人清开，单看时限
        M.p.x = 39*TILE + TILE/2; M.p.y = 60*TILE + TILE/2;
        M.clock = CLOCK_END - 0.05;
        var g4 = 0; while (g4++ < 600 && M.dying <= 0) update(1/60);
        out.push('拖到下课铃 → dying=' + (M.dying||0).toFixed(2));
        M.dying = 0;
        /* ④ 出门那一下：该开门口那场戏 */
        M.dying = 0; M.talk.open = false; M.showOverAfter = false;
        M.chase = M.chase || { hounds: [] };
        M.chase.hounds.length = 0;
        M.p.y = 123*TILE + TILE/2; M.clock = 10*60+34;
        update(1/60);
        out.push('踏出校门 → 门口那场戏=' + M.talk.open);

        /* ⑥ 分叉得真改人数，不能只换结局文本 */
        M.screen = 'play'; respawn(); M.dying = 0;
        function houndCountFor(f){
          FLAGS = {}; if (f) setFlag(f);
          M.chase = null; startChase();
          var n = M.chase.hounds.length; M.chase = null; return n;
        }
        out.push('追兵：没选=' + houndCountFor(null) +
                 ' 帮logic=' + houndCountFor('帮logic') +
                 ' 帮值周生=' + houndCountFor('帮值周生'));
        /* ⑦ 选了"告诉值周生"，他该把那一页撕给你 */
        FLAGS = {}; setFlag('帮值周生');
        var du = null; M.npcs.forEach(function(n){ if (n.id === 'duty') du = n; });
        M.p.x = du.x; M.p.y = du.y + 20; M.talk.cool = 0; M.killAfter = false;
        openTalk(du);
        var q5 = 0; while (M.talk.open && q5++ < 20){ M.talk.typed = 1e9; advanceOrChoose(); }
        out.push('告诉值周生 → 拿到名单页=' + flagOn('拿过名单'));
      }
      if (mode === 'floor2'){
        /* 上楼 → 念名字起 → 这声没过去就推门该当死 → 退回楼梯口等 → 再推门 */
        setFlag(['可以上去了','有翻译笔','上过二楼']);   // 不然走廊尽头那个人影不画
        loadMap('floor2', 5, 12);
        M.fade = 0;
        /* pick：选项走第几个。正确的那一项不一定排第一（那是故意的），
           所以探针得能指定 —— 不然一直在选错的那个 */
        function f2go(x, y, pick){
          M.p.x = x*TILE + TILE/2; M.p.y = y*TILE + TILE/2;
          M.talk.open = false; M.portalCool = 0; M.talk.cool = 0;
          M.killAfter = false; M.dying = 0;          // 清掉上一次那条"读完就死"
          update(1/60);
          var t = M.talk.open ? (M.talk.script.nodes[M.talk.nodeId].text||'').replace(/\s+/g,'').slice(0,10) : '（没触发）';
          /* 每进一个新节点 sel 都会归零，所以得等到"站在选项上"那一步再按 */
          var q = 0;
          while (M.talk.open && q++ < 20){
            var nd = M.talk.script.nodes[M.talk.nodeId];
            if (nd && nd.opts && pick !== undefined)
              M.talk.sel = Math.min(pick, (M.talk.shown || []).length - 1);
            M.talk.typed = 1e9; advanceOrChoose();
          }
          M.killAfter = false;
          return t;
        }
        out.push('上来 ' + whereText(5,12));
        out.push('往东 ' + f2go(31,12) + ' → 念名字=' + flagOn('走廊在念名字'));
        /* 这声还没过去就推门 */
        M.p.x = 38*TILE + TILE/2; M.p.y = 12*TILE + TILE/2;
        M.portalCool = 0; M.talk.cool = 0; M.talk.open = false;
        update(1/60);
        out.push('念名字时推门 → 对话=' + M.talk.open + ' killAfter=' + !!M.killAfter);
        M.talk.open = false; M.killAfter = false;
        out.push('退回楼梯口 ' + f2go(5,12) + ' → 过去了=' + flagOn('念名声过去了'));
        /* 再推门，这回安全 */
        M.p.x = 38*TILE + TILE/2; M.p.y = 12*TILE + TILE/2;
        M.portalCool = 0; M.talk.cool = 0; M.talk.open = false;
        update(1/60);
        out.push('再推门 → killAfter=' + !!M.killAfter + ' 走到=' +
                 Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE));
        /* 屋里三样 */
        out.push('值日表 ' + f2go(41,4,1)  + '=' + flagOn('算过值日表'));
        out.push('笔记   ' + f2go(41,8)  + '=' + flagOn('译出化学笔记'));
        out.push('那局   ' + f2go(41,18,1) + '=' + flagOn('看过那局游戏'));
      }
      if (mode === 'puzzle'){
        /* ① 点名：一路往下推，看"替别人答"是不是真会死 */
        FLAGS = {}; setFlag('是:laoli'); setFlag('该查名单了');
        var PZ = null;
        CUR.triggers.forEach(function(G){ if (G.talk === 'pz_rollcall') PZ = G; });
        M.p.x = PZ.x*TILE + TILE/2; M.p.y = PZ.y*TILE + TILE/2;
        M.portalCool = 0; M.talk.cool = 0; M.talk.open = false;
        update(1/60);
        function nx(){ M.talk.typed = 1e9; advanceOrChoose(); }
        nx(); nx(); nx(); nx();                      // s→t→u→v，在 v 上选「到。」
        out.push('走到 ' + M.talk.nodeId);
        nx(); nx(); nx();                            // 到 x 上，选第一个（替答 = 陷阱）
        out.push('答了那个同音的名字 → 节点=' + M.talk.nodeId + ' killAfter=' + !!M.killAfter);
        M.talk.open = false; M.killAfter = false;

        /* ② 顺序擦墙：跳着踩应该不认，按顺序才走。
           六块苔是水哥那条线的东西，得把它的门槛也打开 */
        setFlag('该去后山了');
        M.seq = 0;
        function touch(seq){
          var T = null;
          CUR.triggers.forEach(function(G){ if (G.seq === seq) T = G; });
          M.p.x = T.x*TILE + TILE/2; M.p.y = T.y*TILE + TILE/2;
          M.talk.open = false; M.portalCool = 0; M.talk.cool = 0;
          update(1/60);
          if (M.talk.open){ M.talk.typed = 1e9; while (M.talk.open) advanceOrChoose(); }
          return M.seq;
        }
        out.push('先踩第3块 → seq=' + touch(3));
        out.push('再踩第1块 → seq=' + touch(1));
        out.push('接着第2块 → seq=' + touch(2));
        out.push('跳过第3踩第4 → seq=' + touch(4));

        /* ③ 抽屉：三道线索都在的话，输对密码就该开 */
        FLAGS = {}; setFlag('擦完墙');
        function hitT(name){
          var T = null;
          CUR.triggers.forEach(function(G){ if (G.talk === name) T = G; });
          M.p.x = T.x*TILE + TILE/2; M.p.y = T.y*TILE + TILE/2;
          M.talk.open = false; M.portalCool = 0; M.talk.cool = 0;
          update(1/60);
          var seen = M.talk.open ? (M.talk.script.nodes[M.talk.nodeId].text||'').replace(/\s+/g,'').slice(0,8) : '（没触发）';
          var q = 0; while (M.talk.open && q++ < 20){ M.talk.typed = 1e9; advanceOrChoose(); }
          return seen;
        }
        out.push('黑板 ' + hitT('pw_board') + flagOn('看过黑板式子'));
        out.push('周期表 ' + hitT('pw_table') + flagOn('查过周期表'));
        /* 抽屉先输错一次，再输对 */
        var D = null;
        CUR.triggers.forEach(function(G){ if (G.talk === 'pw_drawer') D = G; });
        M.p.x = D.x*TILE + TILE/2; M.p.y = D.y*TILE + TILE/2;
        M.talk.open = false; M.portalCool = 0; M.talk.cool = 0;
        update(1/60);
        M.talk.typed = 1e9; advanceOrChoose();      // → 密码那一步
        M.talk.typed = 1e9; advanceOrChoose();      // → t
        out.push('密码节点=' + M.talk.nodeId);
        M.talk.sel = 1; M.talk.typed = 1e9; advanceOrChoose();   // 选错那个
        out.push('输错 → ' + M.talk.nodeId + ' 开了没=' + flagOn('拿回手机'));
        /* 重进的时候直接开脚本 —— 别靠触发区下标，加了触发区它就变了 */
        M.talk.open = false; M.killAfter = false; M.dying = 0;
        openScript('pw_drawer');
        M.talk.typed = 1e9; advanceOrChoose(); advanceOrChoose();
        out.push('二次进入节点=' + M.talk.nodeId);
        M.talk.sel = 0; M.talk.typed = 1e9; advanceOrChoose();   // 这回选对
        var w2 = 0; while (M.talk.open && w2++ < 10){ M.talk.typed = 1e9; advanceOrChoose(); }
        out.push('输对 → 开了没=' + flagOn('拿回手机'));
      }
      if (mode === 'route'){
        /* 出了教室那一格上摞着三条分岔。换个身份再走一遍，
           看是不是每次都只认自己那条 —— 串味了三条线就废了 */
        function tryAt(ch){
          FLAGS = {}; setFlag('是:' + ch);
          var hit = '（没触发）';
          for (var t2=8; t2<=10; t2++){
            M.p.x = CUR.triggers[t2].x*TILE + TILE/2;
            M.p.y = CUR.triggers[t2].y*TILE + TILE/2;
            M.talk.open = false; M.portalCool = 0; M.talk.cool = 0;
            update(1/60);
            if (M.talk.open){
              /* 三条线的开头是共用的，得走完看立了哪个旗标才分得出来 */
              var g3 = 0;
              while (M.talk.open && g3++ < 10){ M.talk.typed = 1e9; advanceOrChoose(); }
              M.talk.open = false;
              hit = ['该查名单了','该去后山了','该上二楼了'].filter(flagOn).join(' + ') || '（没立旗标）';
              break;
            }
          }
          return ch + ' → ' + hit;
        }
        out.push(tryAt('laoli'));
        out.push(tryAt('shui'));
        out.push(tryAt('logic'));

        /* 三段专属吓点：拿对家的旗标去踩，该不触发 */
        function hitAt(x, y, flags){
          FLAGS = {}; flags.forEach(function(f){ setFlag(f); });
          M.p.x = x*TILE + TILE/2; M.p.y = y*TILE + TILE/2;
          M.talk.open = false; M.portalCool = 0; M.talk.cool = 0; M.killAfter = false;
          update(1/60);
          var t = M.talk.open
            ? (M.talk.script.nodes[M.talk.nodeId].text||'').replace(/\s+/g,'').slice(0,7)
            : '（没触发 screen=' + M.screen + ' cool=' + M.portalCool.toFixed(2) +
              ' 格=' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) + '）';
          M.talk.open = false;
          return t;
        }
        out.push('厕所·拿牢李旗标 → ' + hitAt(7, 88, ['镜子上三个字']));
        out.push('厕所·拿水哥旗标 → ' + hitAt(7, 88, ['擦完墙']));
        out.push('走廊·拿水哥旗标 → ' + hitAt(16, 74, ['擦完墙']));
        out.push('走廊·拿牢李旗标 → ' + hitAt(16, 74, ['镜子上三个字']));
      }
      if (mode === 'rule'){
        /* 守则第四条：在玻璃前面站住不动，应该死 */
        setFlag('看过守则');
        var RG = null;
        CUR.triggers.forEach(function(G){ if (G.kill) RG = G; });
        if (!RG) out.push('找不到"会死"的触发区');
        else {
          M.p.x = RG.x*TILE + TILE/2; M.p.y = RG.y*TILE + TILE/2;
          M.portalCool = 0; M.talk.cool = 0;
          var rk; for (rk=0; rk<220 && !M.talk.open; rk++) update(1/60);
          out.push('站住 ' + (rk/60).toFixed(1) + ' 秒后 对话=' + M.talk.open +
                   ' 说话人=' + (M.talk.who || '旁白'));
          var rj = 0; while (M.talk.open && rj++ < 20){ M.talk.typed = 1e9; advanceOrChoose(); }
          out.push('读完 killAfter=' + !!M.killAfter + ' dying=' + (M.dying||0).toFixed(2));
          for (rk=0; rk<160; rk++) update(1/60);
          out.push('复活 在哪=' + M.map + ' 站位=' +
                   Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE));
        }
      }
      if (mode === 'opening'){
        out.push('开局 ' + clockText(M.clock) + ' 早读=' + flagOn('早读'));
        function hit(gi){
          var G = CUR.triggers[gi];
          M.p.x = G.x*TILE + TILE/2; M.p.y = G.y*TILE + TILE/2;
          M.portalCool = 0; M.talk.cool = 0;
          update(1/60);
          var seen = M.talk.open
            ? (M.talk.script.nodes[M.talk.nodeId].text || '').replace(/\s+/g,'').slice(0,12)
            : '（没触发）';
          var g = 0; while (M.talk.open && g++ < 30){ M.talk.typed = 1e9; advanceOrChoose(); }
          return seen;
        }
        out.push('① ' + hit(0));
        out.push('② ' + hit(1));
        out.push('③ ' + hit(2) + ' → 纸条=' + flagOn('纸条'));
      }
      if (mode === 'death'){
        checkpoint('测试点');
        setFlag('死后该没了');
        out.push('存档时 纸条=' + flagOn('纸条') + ' 临时旗标=' + flagOn('死后该没了'));
        die('测试');
        for (var dk=0; dk<130; dk++) update(1/60);        // 把死亡那 1.1 秒走完
        out.push('复活后 临时旗标=' + flagOn('死后该没了') +
                 ' 在哪=' + M.map + ' 站位=' + Math.floor(M.p.x/TILE) + ',' + Math.floor(M.p.y/TILE) +
                 ' 几点=' + clockText(M.clock));
      }
      if (mode === 'snd'){
        /* 声音默认开着没？各条音效会不会抛异常？
           （无头里听不见，只能验到这一层） */
        out.push('SND=' + SND + ' AC=' + (AC ? AC.state : 'null'));
        try {
          sfxBell(1); sfxStep(); sfxBlip(); sfxDoor(); sfxPick(); sfxDie();
          droneOn(); droneOff();
          out.push('音效全部调用过，没抛异常');
        } catch (e){ out.push('!!音效抛异常: ' + e.message); }
        /* 死亡画面：推镜头 + 那行字 */
        die('你被数进去了。\n（回头看它会更快。）', 3.0);
        for (var sk2=0; sk2<110; sk2++) update(1/60);      // 停在半途，好截图
        out.push('死亡中 dying=' + M.dying.toFixed(2) + ' 有字=' + !!M.deathMsg);
        render();
        out.push('死亡画面渲染 ok');
      }
      if (mode === 'px'){
        /* 手动画一帧再取个像素 —— 无头里 rAF 不一定跑，得自己调 */
        try {
          render();
          var dd = cx.getImageData(Math.floor(W/2), Math.floor(H/2), 1, 1).data;
          out.push('画布=' + W + '×' + H + ' 中心像素=' + dd[0] + ',' + dd[1] + ',' + dd[2] + ',' + dd[3]);
        } catch (e){ out.push('!!render ' + e.message); }
      }
      if (mode === 'run'){
        /* 同样跑 60 帧，量一量走路和快跑各走多远 —— 倍数对不上就是没生效 */
        /* 起点要挑一条空的：不能压着韩愈像（挡路），也不能落在
           开场触发区上（弹出对话人就不动了，量出来会很难看） */
        var sx = 35*TILE + TILE/2, sy = 120*TILE + TILE/2;
        function distOver(fast){
          M.p.x = sx; M.p.y = sy;
          keys['w'] = true; keys['shift'] = fast;
          for (var fi=0; fi<60; fi++) update(1/60);
          keys['w'] = false; keys['shift'] = false;
          return Math.round(sy - M.p.y);
        }
        var w0 = distOver(false), r0 = distOver(true);
        out.push('60帧 走路=' + w0 + 'px 快跑=' + r0 + 'px 倍数=' + (r0/w0).toFixed(2) +
                 ' (想要 ' + RUN_MULT + ')');
      }
      if (mode === 'walk'){
        var seen = [], guard = 0;
        M.p.x = M.npcs[0].x; M.p.y = M.npcs[0].y + 20;      // 站到第一个 NPC 跟前
        openTalk(M.npcs[0]);
        while (M.talk.open && guard++ < 40){
          seen.push(M.talk.nodeId);
          M.talk.typed = 1e9;                                // 跳过打字机
          advanceOrChoose();
        }
        out.push('走完的节点: ' + seen.join(' → '));
        out.push('最后 talk.open=' + M.talk.open + (M.talk.open ? ' ← 卡住了' : ''));
        /* 再聊一次，应该进 again 那支 */
        openTalk(M.npcs[0]);
        out.push('再聊进到: ' + M.talk.nodeId);
        M.talk.open = false;
      }
    }
    var pre = document.getElementById('probe');
    pre.textContent = 'PROBE ' + out.join(' || ') + (probeErr ? ' || ' + probeErr : '');
    } catch (e){
      /* 跑到一半炸了：把已经攒下的输出带出来，顺便报是哪一步 */
      document.getElementById('probe').textContent =
        'PROBE !! 抛异常: ' + (e && e.message) + ' || 已跑到: ' + out.join(' || ');
    }
  }, 700);
})();

/* ==================== 起飞 ====================
   地图必须在起飞前就装上。它是空的时侯 tileAt 会读到 undefined，
   而 tileAt 每帧都调 —— 上一版就是在主循环第一帧崩掉，整个画面全黑。 */
loadMap('campus', MAPS.campus.spawn[0], MAPS.campus.spawn[1]);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
